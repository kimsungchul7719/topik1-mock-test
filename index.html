<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141A33">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>TOPIK I 실전 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EEF0F3; --paper:#FFFFFF; --ink:#15171C; --ink-2:#4A4F5A; --ink-3:#80868F;
  --rule:#D9DCE2; --rule-2:#E8EAEE;
  --omr:#C8283F; --omr-tint:#FCEBEE; --omr-line:#EFB7C0;
  --navy:#1D2B4F; --navy-ink:#FFFFFF;
  --good:#16794A; --good-tint:#E3F4EA; --bad:#B42318; --bad-tint:#FDECEA; --warn:#B25E09;
  --shadow:0 1px 2px rgba(20,24,34,.06),0 6px 20px rgba(20,24,34,.06);
  --serif:"Nanum Myeongjo","Noto Serif KR",Batang,serif;
  --sans:"Be Vietnam Pro","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101217; --paper:#191C22; --ink:#ECEEF2; --ink-2:#B4B9C3; --ink-3:#7F8591;
    --rule:#2E323B; --rule-2:#252830;
    --omr:#FF6B80; --omr-tint:#3A1D24; --omr-line:#6B2F3A;
    --navy:#2C3E6E; --navy-ink:#FFFFFF;
    --good:#4CC38A; --good-tint:#15301F; --bad:#FF7A6E; --bad-tint:#3A1B18; --warn:#F0A04B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#101217; --paper:#191C22; --ink:#ECEEF2; --ink-2:#B4B9C3; --ink-3:#7F8591;
  --rule:#2E323B; --rule-2:#252830;
  --omr:#FF6B80; --omr-tint:#3A1D24; --omr-line:#6B2F3A;
  --navy:#2C3E6E; --navy-ink:#FFFFFF;
  --good:#4CC38A; --good-tint:#15301F; --bad:#FF7A6E; --bad-tint:#3A1B18; --warn:#F0A04B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.ko{font-family:"Noto Sans KR",var(--sans)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Landing (colorful) ---------- */
:root{--c1:#FF4D5E;--c2:#2F7BFF;--c3:#FFB020;--c4:#12B886;--c5:#8B5CF6;--c1t:#FFE8EA;--c2t:#E6EFFF;--c3t:#FFF3D9;--c4t:#DDF7EE;--c5t:#EFE8FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1t:#3B1C21;--c2t:#17264A;--c3t:#3A2C10;--c4t:#123328;--c5t:#261C45}}
:root[data-theme="dark"]{--c1t:#3B1C21;--c2t:#17264A;--c3t:#3A2C10;--c4t:#123328;--c5t:#261C45}
.hero{position:relative;overflow:hidden;background:#141A33;color:#fff;border-radius:0 0 28px 28px}
.hero .wrap{position:relative;z-index:1;padding-block:44px 40px;display:grid;gap:16px}
.hero .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.95}
.hero .b1{width:260px;height:260px;background:var(--c1);right:-60px;top:-80px}
.hero .b2{width:200px;height:200px;background:var(--c2);right:140px;top:60px;mix-blend-mode:screen}
.hero .b3{width:130px;height:130px;background:var(--c3);right:40px;bottom:-40px}
.hero .b4{width:90px;height:90px;background:var(--c4);left:52%;top:-30px;opacity:.7}
@media (max-width:640px){.hero .b1{width:180px;height:180px;right:-70px}.hero .b2{width:120px;height:120px;right:40px;top:90px}.hero .b3{display:none}.hero .b4{display:none}}
.hero .tag{display:inline-flex;gap:8px;align-items:center;width:max-content;max-width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}
.hero .tag i{width:8px;height:8px;border-radius:50%;background:var(--c3);display:inline-block}
.hero h1{margin:0;font-weight:700;font-size:clamp(34px,6.5vw,60px);line-height:1.05;letter-spacing:-.02em;max-width:14ch;text-wrap:balance}
.hero h1 .k{font-family:"Noto Sans KR",var(--sans);font-weight:700;display:block;font-size:.5em;letter-spacing:0;margin-top:10px;color:#FFD57A}
.hero p{margin:0;max-width:52ch;color:rgba(255,255,255,.82);font-size:15.5px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero .cta .btn{border-radius:999px;padding:10px 20px;border:0}
.hero .cta .b-a{background:var(--c3);color:#1B1400}
.hero .cta .b-b{background:rgba(255,255,255,.14);color:#fff}
.hsec{padding-block:30px 6px;display:grid;gap:14px}
.hsec-h{display:flex;align-items:center;gap:12px}
.hsec-h .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;flex:none}
.hsec-h h2{margin:0;font-size:21px;line-height:1.2}
.hsec-h h2 small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3);margin-top:2px;font-family:"Noto Sans KR",var(--sans)}
.fmt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.fmt{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fcard{border-radius:16px;padding:16px;display:grid;gap:4px}
.fcard b{font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.fcard .fk{font-family:"Noto Sans KR",var(--sans);font-weight:700;font-size:14px}
.fcard span{font-size:12.5px;color:var(--ink-2)}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (max-width:520px){.tests{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tcard{min-height:130px;padding:14px}.tcard .tb{font-size:26px}}
.tcard{position:relative;text-align:left;border:0;border-radius:18px;padding:16px 16px 14px;display:grid;gap:6px;min-height:150px;color:#fff;overflow:hidden;transition:transform .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,24,40,.18)}
.tcard::after{content:"";position:absolute;right:-26px;bottom:-26px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.16)}
.tcard .tn{font-size:12px;font-weight:600;opacity:.9;letter-spacing:.06em}
.tcard .tb{font-family:"Noto Sans KR",var(--sans);font-weight:700;font-size:30px;line-height:1}
.tcard .tv{font-size:12.5px;opacity:.92}
.tcard .ts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.tcard .chip{background:rgba(255,255,255,.22);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
.tcard .chip.w{background:#fff;color:#141A33}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:16px;display:grid;gap:6px;grid-template-columns:auto 1fr;align-items:start}
.step .sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.step b{font-size:15px}.step p{margin:0;grid-column:2;font-size:13.5px;color:var(--ink-2)}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.levels{grid-template-columns:minmax(0,1fr)}}
.lv{border-radius:16px;padding:16px;display:grid;gap:2px}
.lv b{font-size:22px;font-variant-numeric:tabular-nums}.lv span{font-size:13px;color:var(--ink-2)}
/* ---------- Gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#141A33;position:relative;overflow:hidden}
.gate .card{position:relative;z-index:1;background:var(--paper);border-radius:22px;padding:28px 24px;max-width:360px;width:100%;display:grid;gap:14px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.gate h1{margin:0;font-size:24px}
.gate h1 span{display:block;font-family:"Noto Sans KR",var(--sans);font-size:14px;color:var(--ink-3);font-weight:500;margin-top:4px}
.pin{display:flex;gap:10px;justify-content:center}
.pin input{width:100%;max-width:220px;letter-spacing:.5em;padding-left:.5em;height:62px;border-radius:14px;border:2px solid var(--rule);background:var(--ground);color:var(--ink);text-align:center;font-size:26px;font-weight:700;font-family:var(--sans)}
.pin input:focus{outline:none;border-color:var(--c2)}
.gate .err{color:var(--bad);font-size:13px;min-height:1.2em;margin:0}
.gate .card.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* ---------- per-question audio ---------- */
.qplay{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--omr);background:var(--paper);color:var(--omr);border-radius:8px;padding:2px 10px 2px 8px;font-family:var(--sans);font-size:12.5px;font-weight:700;margin-left:8px;vertical-align:1px;line-height:1.6}
.qplay svg{width:11px;height:11px;fill:currentColor}
.qplay.on{background:var(--omr);color:#fff}
.qplay .qc{font-weight:500;opacity:.8}

/* ---------- Home ---------- */
.home-head{padding-block:40px 24px;display:grid;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--omr);font-weight:600}
.home-head h1{font-family:var(--serif);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0;text-wrap:balance}
.home-head h1 small{display:block;font-family:var(--sans);font-size:clamp(15px,2vw,18px);font-weight:500;color:var(--ink-2);margin-top:8px}
.spec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);background:var(--paper);border-radius:6px;overflow:hidden}
.spec div{padding:12px 16px;border-right:1px solid var(--rule-2)}
.spec div:last-child{border-right:0}
.spec b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.spec span{font-size:12.5px;color:var(--ink-2)}
@media (max-width:640px){.spec{grid-template-columns:1fr 1fr}.spec div:nth-child(2){border-right:0}.spec div:nth-child(-n+2){border-bottom:1px solid var(--rule-2)}}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding-block:8px 48px}
.booklet{position:relative;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:18px 18px 16px;display:grid;gap:10px;min-height:170px;transition:transform .15s,box-shadow .15s}
.booklet:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.booklet .bk-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-3);letter-spacing:.08em}
.booklet .bk-no{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1}
.booklet .bk-no em{font-style:normal;font-size:15px;font-weight:700;margin-left:2px}
.booklet .bk-sub{font-size:12.5px;color:var(--ink-2)}
.booklet .bk-stat{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--rule);color:var(--ink-2)}
.pill.l1{background:var(--good-tint);color:var(--good);border-color:transparent}
.pill.l2{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.pill.fail{background:var(--bad-tint);color:var(--bad);border-color:transparent}
.pill.prog{background:var(--omr-tint);color:var(--omr);border-color:transparent}
.booklet .bk-strip{position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,var(--omr-line) 0 6px,transparent 6px 12px);border-radius:4px 0 0 4px;opacity:.8}

/* ---------- Dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--paper);border-radius:8px;max-width:440px;width:100%;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.dialog h2{margin:0;font-family:var(--serif);font-size:24px}
.dialog p{margin:0;color:var(--ink-2);font-size:14px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:12px 14px}
.opt:hover{border-color:var(--omr)}
.opt b{font-size:15px}.opt span{font-size:12.5px;color:var(--ink-2);grid-column:1}.opt i{font-style:normal;grid-row:1/3;grid-column:2;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--omr);border-color:var(--omr);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Exam bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
.bar .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:10px}
.bar .t-name{font-size:13px;opacity:.85;line-height:1.3}
.bar .t-name b{display:block;font-size:15px;opacity:1}
.clock{text-align:center;line-height:1.1}
.clock .c-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.clock .c-time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock.low .c-time{color:#FFB4BF;animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.clock.low .c-time{animation:none}.booklet{transition:none}}
.bar .b-act{justify-self:end;display:flex;gap:8px}
.bar .btn{background:transparent;color:var(--navy-ink);border-color:rgba(255,255,255,.35)}
.bar .btn.primary{background:var(--omr);border-color:var(--omr)}
.tprog{height:3px;background:rgba(255,255,255,.15)}
.tprog i{display:block;height:100%;background:#FFB4BF;transition:width 1s linear}
@media (max-width:640px){.bar .wrap{grid-template-columns:1fr auto}.bar .t-name{display:none}.clock{text-align:left}.clock .c-time{font-size:26px}}

.player{background:var(--paper);border-bottom:1px solid var(--rule)}
.player .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--omr);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:currentColor}
.p-info{flex:1;min-width:180px;display:grid;gap:4px}
.p-info .p-top{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.p-info .p-now{font-weight:600}
.p-track{height:6px;background:var(--rule-2);border-radius:3px;overflow:hidden}
.p-track i{display:block;height:100%;background:var(--omr);width:0}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}

/* ---------- Paper ---------- */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;padding-block:20px 80px;align-items:start}
@media (max-width:960px){.exam{grid-template-columns:minmax(0,1fr)}}
.paper{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:28px clamp(16px,4vw,44px) 40px;font-family:var(--serif);font-size:17px;line-height:1.75}
.sec-title{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:8px}
.sec-title h2{margin:0;font-size:22px;font-weight:800}
.sec-title span{font-family:var(--sans);font-size:13px;color:var(--ink-2)}
.instr{margin:28px 0 8px;font-weight:700;font-size:16.5px}
.instr .vi{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--ink-2);margin-top:2px}
.bogi{border:1px solid var(--ink-3);border-radius:2px;padding:12px 16px 10px;margin:10px 0 6px;font-size:15.5px;position:relative;white-space:pre-line}
.bogi::before{content:"<보 기>";position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--paper);padding:0 8px;font-weight:700;font-size:14px}
.q{padding:14px 0 6px;border-radius:4px;scroll-margin-top:170px}
.q.live{background:var(--omr-tint);box-shadow:0 0 0 8px var(--omr-tint)}
.q-stem{display:flex;gap:10px;font-weight:700}
.q-stem .qn{flex:none;min-width:2.1em}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 14px;margin:6px 0 0 2.1em;padding-left:10px}
.choices.long{grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.xl{grid-template-columns:minmax(0,1fr)}
@media (max-width:640px){.choices,.choices.long{grid-template-columns:minmax(0,1fr)}.choices.short{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ch{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 8px;font-family:var(--serif);font-size:16.5px;line-height:1.6}
.ch:hover{border-color:var(--rule)}
.ch .mk{flex:none;display:inline-grid;place-items:center;width:1.35em;height:1.35em;border-radius:50%;border:1.3px solid currentColor;font-family:var(--sans);font-size:12px;font-weight:600;margin-top:.2em}
.ch.sel{background:var(--omr-tint);border-color:var(--omr-line)}
.ch.sel .mk{background:var(--omr);border-color:var(--omr);color:#fff}
.ch.right{background:var(--good-tint);border-color:transparent}
.ch.right .mk{background:var(--good);border-color:var(--good);color:#fff}
.ch.wrong{background:var(--bad-tint);border-color:transparent;text-decoration:line-through;text-decoration-color:var(--bad)}
.ch.wrong .mk{background:var(--bad);border-color:var(--bad);color:#fff}
.pics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 0 2.1em}
@media (max-width:640px){.pics{grid-template-columns:repeat(2,minmax(0,1fr));margin-left:0}}
.pic{display:grid;gap:6px;justify-items:center;text-align:center;border:1px solid var(--rule);border-radius:4px;padding:12px 8px 10px;background:transparent;position:relative}
.pic .mk{position:absolute;top:6px;left:8px}
.pic .emo{font-size:38px;line-height:1.1;letter-spacing:2px}
.pic .cap{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);line-height:1.4}
.pic:hover{border-color:var(--ink-3)}
.pic.sel{border-color:var(--omr);background:var(--omr-tint)}
.pic.sel .mk{background:var(--omr);border-color:var(--omr);color:#fff}
.pic.right{border-color:var(--good);background:var(--good-tint)}
.pic.wrong{border-color:var(--bad);background:var(--bad-tint)}
.psg{border:1px solid var(--ink-3);border-radius:2px;padding:14px 18px;margin:10px 0 4px;font-size:16.5px}
.psg p{margin:0 0 .4em}.psg p:last-child{margin:0}
.psg.notice{max-width:440px;margin-inline:auto;border:2px solid var(--ink);border-radius:10px;text-align:left}
.psg.notice h4{margin:0 0 8px;text-align:center;font-size:19px;font-weight:800;border-bottom:1px dashed var(--ink-3);padding-bottom:8px}
.psg.email{padding:0;overflow:hidden}
.psg.email .eh{background:var(--rule-2);padding:8px 16px;font-family:var(--sans);font-size:13px;display:grid;gap:2px}
.psg.email .eh b{font-size:14.5px}
.psg.email .eb{padding:12px 18px}
.box{border:1px solid var(--ink);padding:8px 14px;margin:6px 0 4px 2.1em;font-size:16px}
.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:1.5px solid var(--ink);margin:0 2px;line-height:1.2;font-weight:700}
.mark{font-weight:800;color:var(--omr)}
.listen-note{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin:6px 0 0 2.1em}
.nav-sec{display:flex;justify-content:flex-end;gap:10px;margin-top:36px;font-family:var(--sans)}

/* ---------- OMR ---------- */
.omr{position:sticky;top:170px;background:var(--paper);border:1px solid var(--omr-line);border-radius:4px;overflow:hidden}
.omr-h{background:var(--omr);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.omr-h b{font-size:14px;letter-spacing:.05em}
.omr-grid{max-height:calc(100vh - 290px);overflow:auto;padding:6px 8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.omr-row{display:grid;grid-template-columns:2.1em repeat(4,1fr);align-items:center;gap:2px;padding:2px 0;border-bottom:1px solid var(--omr-tint)}
.omr-row .on{font-size:12px;font-weight:700;color:var(--omr);text-align:right;padding-right:4px;background:none;border:0}
.bub{width:19px;height:19px;border-radius:50%;border:1.3px solid var(--omr-line);background:transparent;font-size:10px;color:var(--omr);display:grid;place-items:center;padding:0;justify-self:center}
.bub.f{background:var(--ink);border-color:var(--ink);color:transparent}
.omr-f{padding:10px 12px;border-top:1px solid var(--omr-tint);display:grid;gap:8px}
.omr-toggle{display:none}
@media (max-width:960px){
  .omr{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:10px 10px 0 0;z-index:30;transform:translateY(calc(100% - 44px));transition:transform .2s;padding-bottom:env(safe-area-inset-bottom,0px)}
  .omr.open{transform:none}
  .omr-h{cursor:pointer;min-height:44px}
  .omr-grid{max-height:50vh}
  .omr-toggle{display:inline}
}

/* ---------- Results ---------- */
.res-head{padding-block:32px 16px;display:grid;gap:18px}
.scorecard{background:var(--paper);border:1px solid var(--rule);border-radius:6px;display:grid;grid-template-columns:auto 1fr;gap:28px;padding:24px;align-items:center}
@media (max-width:640px){.scorecard{grid-template-columns:1fr}}
.total{font-family:var(--serif);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.total small{font-size:22px;color:var(--ink-3);font-weight:700}
.verdict{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.verdict .pill{font-size:13px;padding:4px 12px}
.bars{display:grid;gap:14px}
.sb{display:grid;gap:4px}
.sb .sb-top{display:flex;justify-content:space-between;font-size:13.5px}
.sb .sb-top b{font-variant-numeric:tabular-nums}
.sb-track{position:relative;height:10px;background:var(--rule-2);border-radius:5px;overflow:hidden}
.sb-track i{display:block;height:100%;background:var(--navy);border-radius:5px}
.scale{position:relative;height:30px;margin-top:4px}
.scale-track{position:absolute;left:0;right:0;top:10px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--bad-tint) 0 40%,var(--good-tint) 40% 70%,var(--omr-tint) 70% 100%)}
.scale .tick{position:absolute;top:0;font-size:11px;color:var(--ink-3);transform:translateX(-50%)}
.scale .tick::after{content:"";position:absolute;left:50%;top:14px;width:1px;height:12px;background:var(--ink-3)}
.scale .me{position:absolute;top:6px;width:16px;height:16px;border-radius:50%;background:var(--omr);border:3px solid var(--paper);transform:translateX(-50%);box-shadow:0 0 0 1px var(--omr)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rv{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:16px clamp(14px,3vw,28px);display:grid;gap:10px}
.rv-list{display:grid;gap:12px;padding-block:8px 60px}
.rv .rv-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.rv .serifblock{font-family:var(--serif);font-size:16px;line-height:1.7}
.exp{background:var(--rule-2);border-radius:4px;padding:10px 14px;font-size:14px;line-height:1.6}
.exp b{color:var(--ink)}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{font-size:12.5px;border:1px solid var(--rule);border-radius:4px;padding:1px 8px}
.vocab span b{font-family:"Noto Sans KR",var(--sans);font-weight:600;margin-right:4px}
.script{font-family:"Noto Sans KR",var(--sans);font-size:14px;border-left:3px solid var(--omr-line);padding:4px 12px;display:grid;gap:2px}
.script .sp{font-weight:700;color:var(--omr);margin-right:6px}
.mini{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.mini svg{width:11px;height:11px;fill:currentColor}
.foot{font-size:12px;color:var(--ink-3);padding-block:0 32px}

여동생","v":"em gái"},{"k":"고등학생","v":"học sinh cấp 3"}]}]},{"sec":"L","nums":[21],"audio":[{"s":"M","t":"한국어 수업이 몇 시에 끝나요?"},{"s":"W","t":"한 시에 끝나요. 왜요?"},{"s":"M","t":"수업 후에 같이 점심 먹을까요?"},{"s":"W","t":"좋아요. 학교 앞 식당에 가요."}],"qs":[{"n":21,"stem":null,"choices":["수업은 열두 시에 끝납니다.","두 사람은 같이 점심을 먹을 겁니다.","여자는 점심을 먹지 않을 겁니다.","두 사람은 집에서 밥을 먹을 겁니다."],"ans":2,"exp":"Người đàn ông rủ \"같이 점심 먹을까요?\" (Cùng ăn trưa nhé?) và người phụ nữ đồng ý \"좋아요\". Lớp học kết thúc lúc 1 giờ, họ sẽ ăn ở nhà hàng trước trường. Vì vậy đáp án đúng là ②.","vocab":[{"k":"끝나다","v":"kết thúc"},{"k":"같이","v":"cùng nhau"}]}]},{"sec":"L","nums":[22],"audio":[{"s":"M","t":"날씨가 좋네요. 주말에 공원에 갈까요?"},{"s":"W","t":"좋아요. 그런데 요즘 공원에 사람이 너무 많아요."},{"s":"M","t":"그럼 아침 일찍 갈까요?"},{"s":"W","t":"네, 아침에 가면 사람이 적어서 산책하기 좋아요."}],"qs":[{"n":22,"stem":null,"choices":["공원에 가지 않는 것이 좋습니다.","주말에는 집에서 쉬고 싶습니다.","봄에는 날씨가 좋지 않습니다.","아침 일찍 공원에 가는 것이 좋습니다."],"ans":4,"exp":"Người phụ nữ nói \"아침에 가면 사람이 적어서 산책하기 좋아요\" (Nếu đi buổi sáng thì ít người nên đi dạo rất thích). Suy nghĩ chính: nên đi công viên vào sáng sớm. Vì vậy đáp án đúng là ④.","vocab":[{"k":"일찍","v":"sớm"},{"k":"적다","v":"ít"}]}]},{"sec":"L","nums":[23],"audio":[{"s":"M","t":"수진 씨는 시험 공부를 어디에서 해요?"},{"s":"W","t":"저는 도서관에서 해요."},{"s":"M","t":"저는 집에서 하는데 공부가 잘 안 돼요."},{"s":"W","t":"도서관은 조용해서 공부하기 좋아요. 같이 가요."}],"qs":[{"n":23,"stem":null,"choices":["집에서 공부하는 것이 편합니다.","시험 공부를 많이 해야 합니다.","도서관에서 공부하는 것이 좋습니다.","친구와 공부하면 재미있습니다."],"ans":3,"exp":"Người phụ nữ nói \"도서관은 조용해서 공부하기 좋아요\" (Thư viện yên tĩnh nên rất tốt để học). Cô ấy nghĩ học ở thư viện là tốt. Vì vậy đáp án đúng là ③.","vocab":[{"k":"시험","v":"kỳ thi"},{"k":"조용하다","v":"yên tĩnh"}]}]},{"sec":"L","nums":[24],"audio":[{"s":"M","t":"수미 씨, 저는 오늘도 아침을 안 먹었어요."},{"s":"W","t":"왜요? 시간이 없었어요?"},{"s":"M","t":"네, 늦게 일어나서 못 먹었어요."},{"s":"W","t":"아침을 먹어야 공부할 때 힘이 나요. 내일은 조금 일찍 일어나세요."}],"qs":[{"n":24,"stem":null,"choices":["아침을 꼭 먹는 것이 좋습니다.","늦게 일어나도 괜찮습니다.","점심을 많이 먹어야 합니다.","공부는 아침에 하는 것이 좋습니다."],"ans":1,"exp":"Người phụ nữ nói \"아침을 먹어야 공부할 때 힘이 나요\" (Phải ăn sáng thì khi học mới có sức). Suy nghĩ chính: nên ăn sáng. Vì vậy đáp án đúng là ①.","vocab":[{"k":"아침","v":"bữa sáng, buổi sáng"},{"k":"힘이 나다","v":"có sức, có năng lượng"}]}]},{"sec":"L","nums":[25,26],"audio":[{"s":"W","t":"학생 여러분, 안녕하세요. 다음 주 금요일에 한국대학교 도서관에서 '책 나누기' 행사가 있습니다. 집에 다 읽은 책이 있으면 도서관 1층으로 가지고 오세요. 책을 한 권 가지고 오면 다른 책을 한 권 가져갈 수 있습니다. 행사는 오전 10시부터 오후 4시까지입니다. 많이 와 주세요."}],"qs":[{"n":25,"stem":"여자가 왜 이 이야기를 하고 있는지 고르십시오.","choices":["도서관 위치를 설명하려고","행사를 안내하려고","책을 빌리려고","도서관 시간을 바꾸려고"],"ans":2,"exp":"Người phụ nữ giới thiệu ngày, địa điểm, thời gian của sự kiện \"'책 나누기' 행사\" (sự kiện chia sẻ sách) và mời mọi người đến — mục đích là thông báo sự kiện. Vì vậy đáp án đúng là ②.","vocab":[{"k":"행사","v":"sự kiện"},{"k":"안내하다","v":"hướng dẫn, thông báo"}]},{"n":26,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["행사는 다음 주 월요일에 합니다.","행사는 도서관 2층에서 합니다.","책을 사면 선물을 줍니다.","책을 가지고 가면 다른 책을 받을 수 있습니다."],"ans":4,"exp":"\"책을 한 권 가지고 오면 다른 책을 한 권 가져갈 수 있습니다\" (Mang một cuốn sách đến thì có thể lấy một cuốn khác). Sự kiện vào thứ Sáu, ở tầng 1. Vì vậy đáp án đúng là ④.","vocab":[{"k":"가져가다","v":"mang đi"},{"k":"나누다","v":"chia sẻ"}]}]},{"sec":"L","nums":[27,28],"audio":[{"s":"M","t":"지나 씨, 다음 주 금요일이 선생님 생신이지요?"},{"s":"W","t":"네, 그래서 반 친구들하고 작은 파티를 하려고 해요."},{"s":"M","t":"좋아요. 파티는 어디에서 해요?"},{"s":"W","t":"우리 교실에서 해요. 수업이 끝난 후에 할 거예요."},{"s":"M","t":"그럼 제가 케이크를 준비할까요?"},{"s":"W","t":"케이크는 제가 벌써 주문했어요. 민수 씨는 꽃을 사 주세요."},{"s":"M","t":"알겠어요. 제가 예쁜 꽃을 사 올게요."}],"qs":[{"n":27,"stem":"두 사람이 무엇에 대해 이야기를 하고 있는지 고르십시오.","choices":["선생님의 수업","꽃 가게의 위치","선생님 생신 파티 준비","주말 여행 계획"],"ans":3,"exp":"Hai người bàn về \"선생님 생신\" (sinh nhật thầy/cô), nơi tổ chức tiệc, bánh kem và hoa — tức là chuẩn bị tiệc sinh nhật cho giáo viên. Vì vậy đáp án đúng là ③.","vocab":[{"k":"생신","v":"sinh nhật (kính ngữ)"},{"k":"준비하다","v":"chuẩn bị"}]},{"n":28,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["여자는 케이크를 주문했습니다.","파티는 식당에서 합니다.","남자는 케이크를 살 겁니다.","파티는 수업 전에 합니다."],"ans":1,"exp":"Người phụ nữ nói \"케이크는 제가 벌써 주문했어요\" (Bánh kem tôi đã đặt rồi). Tiệc tổ chức ở lớp học sau giờ học, người đàn ông sẽ mua hoa. Vì vậy đáp án đúng là ①.","vocab":[{"k":"주문하다","v":"đặt hàng"},{"k":"벌써","v":"đã ... rồi"}]}]},{"sec":"L","nums":[29,30],"audio":[{"s":"W","t":"민준 씨는 대학생인데 편의점에서 아르바이트를 하고 있지요?"},{"s":"M","t":"네, 일 년 전부터 주말마다 일하고 있어요."},{"s":"W","t":"왜 편의점에서 일하게 됐어요?"},{"s":"M","t":"그 편의점에는 외국인 손님이 많이 와요. 그래서 외국어를 연습할 수 있기 때문이에요. 저는 영어를 잘하고 싶었어요."},{"s":"W","t":"일이 힘들지 않아요?"},{"s":"M","t":"밤에 일할 때는 조금 힘들어요. 그래도 손님들과 이야기하는 것이 재미있어요."}],"qs":[{"n":29,"stem":"남자가 왜 편의점에서 일하게 됐는지 고르십시오.","choices":["돈이 많이 필요해서","집에서 가까워서","친구가 소개해 줘서","외국어를 연습하고 싶어서"],"ans":4,"exp":"Người đàn ông nói \"외국어를 연습할 수 있기 때문이에요\" (Vì có thể luyện ngoại ngữ) và \"영어를 잘하고 싶었어요\" (Tôi muốn giỏi tiếng Anh). Vì vậy đáp án đúng là ④.","vocab":[{"k":"아르바이트","v":"việc làm thêm"},{"k":"연습하다","v":"luyện tập"}]},{"n":30,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["남자는 평일마다 일합니다.","남자는 일 년 전에 일을 시작했습니다.","남자는 밤에 일하는 것이 쉽습니다.","남자는 손님과 이야기하지 않습니다."],"ans":2,"exp":"Người đàn ông nói \"일 년 전부터 주말마다 일하고 있어요\" (Tôi làm vào mỗi cuối tuần từ một năm trước). Anh làm cuối tuần, làm đêm thì hơi mệt, và thích nói chuyện với khách. Vì vậy đáp án đúng là ②.","vocab":[{"k":"주말마다","v":"mỗi cuối tuần"},{"k":"손님","v":"khách hàng"}]}]},{"sec":"R","nums":[31],"passage":{"kind":"text","body":["저는 한국어를 공부합니다. 동생은 일본어를 공부합니다."]},"qs":[{"n":31,"stem":null,"choices":["주말","나라","공부","학교"],"ans":3,"exp":"Hai câu nói \"한국어를 공부합니다\" (tôi học tiếng Hàn), \"일본어를 공부합니다\" (em tôi học tiếng Nhật) — chủ đề là việc học. Vì vậy đáp án đúng là ③.","vocab":[{"k":"공부하다","v":"học"},{"k":"동생","v":"em"}]}]},{"sec":"R","nums":[32],"passage":{"kind":"text","body":["오늘은 따뜻합니다. 바람도 불지 않습니다."]},"qs":[{"n":32,"stem":null,"choices":["날씨","계절","시간","기분"],"ans":1,"exp":"\"따뜻합니다\" (ấm áp), \"바람도 불지 않습니다\" (gió cũng không thổi) — nói về thời tiết hôm nay. Vì vậy đáp án đúng là ①.","vocab":[{"k":"따뜻하다","v":"ấm áp"},{"k":"바람이 불다","v":"gió thổi"}]}]},{"sec":"R","nums":[33],"passage":{"kind":"text","body":["김밥은 삼천 원입니다. 라면은 사천 원입니다."]},"qs":[{"n":33,"stem":null,"choices":["맛","장소","요일","값"],"ans":4,"exp":"\"삼천 원\" (3.000 won), \"사천 원\" (4.000 won) là giá tiền. Vì vậy đáp án đúng là ④.","vocab":[{"k":"값","v":"giá"},{"k":"원","v":"won (tiền Hàn)"}]}]},{"sec":"R","nums":[34],"passage":{"kind":"text","body":["저는 지하철(    ) 학교에 갑니다. 버스는 타지 않습니다."]},"qs":[{"n":34,"stem":null,"choices":["을","로","에","와"],"ans":2,"exp":"Trợ từ \"(으)로\" chỉ phương tiện: \"지하철로 학교에 갑니다\" (Tôi đi học bằng tàu điện ngầm). Vì vậy đáp án đúng là ②.","vocab":[{"k":"지하철","v":"tàu điện ngầm"},{"k":"-(으)로","v":"bằng (phương tiện)"}]}]},{"sec":"R","nums":[35],"passage":{"kind":"text","body":["편의점에 갔습니다. 우유(    ) 빵을 샀습니다."]},"qs":[{"n":35,"stem":null,"choices":["와","를","에서","의"],"ans":1,"exp":"Trợ từ \"와/과\" nối hai danh từ: \"우유와 빵을 샀습니다\" (Tôi đã mua sữa và bánh mì). Vì vậy đáp án đúng là ①.","vocab":[{"k":"우유","v":"sữa"},{"k":"빵","v":"bánh mì"}]}]},{"sec":"R","nums":[36],"passage":{"kind":"text","body":["책을 빌리고 싶습니다. (    )에 갑니다."]},"qs":[{"n":36,"stem":null,"choices":["시장","은행","도서관","병원"],"ans":3,"exp":"Muốn \"책을 빌리다\" (mượn sách) thì đến \"도서관\" (thư viện). Vì vậy đáp án đúng là ③.","vocab":[{"k":"빌리다","v":"mượn"},{"k":"도서관","v":"thư viện"}]}]},{"sec":"R","nums":[37],"passage":{"kind":"text","body":["오늘은 친구 생일입니다. 친구에게 (    )을 줍니다."]},"qs":[{"n":37,"stem":null,"choices":["시험","선물","약","창문"],"ans":2,"exp":"Vào ngày sinh nhật bạn, ta tặng \"선물\" (quà): \"친구에게 선물을 줍니다\". Vì vậy đáp án đúng là ②.","vocab":[{"k":"선물","v":"quà"},{"k":"주다","v":"cho, tặng"}]}]},{"sec":"R","nums":[38],"passage":{"kind":"text","body":["비가 옵니다. 우산을 (    )."]},"qs":[{"n":38,"stem":null,"choices":["입습니다","신습니다","찹니다","씁니다"],"ans":4,"exp":"Với ô dùng động từ \"쓰다\": \"우산을 씁니다\" (che ô). \"입다\" dùng cho quần áo, \"신다\" cho giày, \"차다\" cho đồng hồ. Vì vậy đáp án đúng là ④.","vocab":[{"k":"우산","v":"cái ô"},{"k":"쓰다","v":"che (ô), đội (mũ)"}]}]},{"sec":"R","nums":[39],"passage":{"kind":"text","body":["저는 김밥을 좋아합니다. 그래서 김밥을 (    ) 먹습니다."]},"qs":[{"n":39,"stem":null,"choices":["자주","아까","벌써","아직"],"ans":1,"exp":"Vì thích kimbap nên ăn \"자주\" (thường xuyên). \"아까\" (lúc nãy), \"벌써\" (đã rồi), \"아직\" (vẫn chưa) không hợp với ý thói quen ở thì hiện tại. Vì vậy đáp án đúng là ①.","vocab":[{"k":"자주","v":"thường xuyên"},{"k":"좋아하다","v":"thích"}]}]},{"sec":"R","nums":[40],"passage":{"kind":"notice","title":"민지의 생일 파티에 초대합니다","body":["날짜: 4월 12일(토)","시간: 저녁 6시","장소: 우리 집 (한국아파트 101동 502호)","맛있는 음식을 준비했습니다. 선물은 가지고 오지 마세요."]},"qs":[{"n":40,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["파티는 토요일에 합니다.","파티는 저녁에 시작합니다.","파티는 식당에서 합니다.","선물은 필요 없습니다."],"ans":3,"exp":"Địa điểm là \"우리 집\" (nhà tôi), không phải nhà hàng. Các câu khác đều đúng: thứ Bảy, 6 giờ tối, không cần mang quà. Vì vậy đáp án đúng là ③.","vocab":[{"k":"장소","v":"địa điểm"},{"k":"초대하다","v":"mời"}]}]},{"sec":"R","nums":[41],"passage":{"kind":"notice","title":"한국대학교 도서관 이용 안내","body":["이용 시간: 평일 09:00~22:00 / 주말 10:00~17:00","책 대출: 한 사람에 5권, 2주 동안","※ 도서관 안에서 음식을 먹을 수 없습니다."]},"qs":[{"n":41,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["주말에도 도서관에 갈 수 있습니다.","책을 열 권 빌릴 수 있습니다.","책은 2주 동안 빌릴 수 있습니다.","도서관에서 음식을 먹으면 안 됩니다."],"ans":2,"exp":"Theo thông báo \"한 사람에 5권\" (mỗi người 5 cuốn), nên không thể mượn 10 cuốn. Vì vậy đáp án đúng là ②.","vocab":[{"k":"대출","v":"cho mượn (sách)"},{"k":"이용","v":"sử dụng"}]}]},{"sec":"R","nums":[42],"passage":{"kind":"notice","title":"한강공원 봄꽃 축제","body":["기간: 4월 5일 ~ 4월 13일","시간: 오전 10시 ~ 오후 8시","입장료: 무료","※ 주차장이 없습니다. 지하철을 이용하세요."]},"qs":[{"n":42,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["축제는 사월에 합니다.","돈을 안 내도 됩니다.","지하철을 타고 가는 것이 좋습니다.","자동차를 공원에 세울 수 있습니다."],"ans":4,"exp":"\"주차장이 없습니다\" (Không có bãi đỗ xe) nên không thể đỗ ô tô ở công viên. \"입장료: 무료\" nghĩa là vào cửa miễn phí. Vì vậy đáp án đúng là ④.","vocab":[{"k":"주차장","v":"bãi đỗ xe"},{"k":"무료","v":"miễn phí"},{"k":"축제","v":"lễ hội"}]}]},{"sec":"R","nums":[43],"passage":{"kind":"text","body":["저는 매일 아침 공원에서 산책합니다. 오늘은 비가 와서 집에서 운동했습니다. 내일은 다시 공원에 가고 싶습니다."]},"qs":[{"n":43,"stem":null,"choices":["오늘은 공원에 가지 않았습니다.","저는 저녁마다 산책합니다.","오늘은 날씨가 맑았습니다.","내일은 집에서 운동할 겁니다."],"ans":1,"exp":"\"오늘은 비가 와서 집에서 운동했습니다\" (Hôm nay trời mưa nên tôi tập thể dục ở nhà) — tức là hôm nay không đi công viên. Vì vậy đáp án đúng là ①.","vocab":[{"k":"산책하다","v":"đi dạo"},{"k":"운동하다","v":"tập thể dục"}]}]},{"sec":"R","nums":[44],"passage":{"kind":"text","body":["우리 가족은 모두 네 명입니다. 아버지는 회사원이고 어머니는 선생님입니다. 저는 형과 같이 대학교에 다닙니다."]},"qs":[{"n":44,"stem":null,"choices":["어머니는 회사에 다닙니다.","가족은 다섯 명입니다.","형은 대학생입니다.","저는 고등학생입니다."],"ans":3,"exp":"\"저는 형과 같이 대학교에 다닙니다\" (Tôi cùng anh trai học đại học) nên anh trai là sinh viên. Mẹ là giáo viên, gia đình có 4 người. Vì vậy đáp án đúng là ③.","vocab":[{"k":"회사원","v":"nhân viên công ty"},{"k":"다니다","v":"đi học, đi làm (thường xuyên)"}]}]},{"sec":"R","nums":[45],"passage":{"kind":"text","body":["학교 앞에 새 편의점이 생겼습니다. 이 편의점은 이십사 시간 문을 엽니다. 그래서 밤에도 물건을 살 수 있습니다."]},"qs":[{"n":45,"stem":null,"choices":["편의점은 학교에서 멉니다.","편의점은 밤에 문을 닫습니다.","편의점은 오래되었습니다.","편의점에서 밤에도 물건을 살 수 있습니다."],"ans":4,"exp":"\"이십사 시간 문을 엽니다\" (mở cửa 24 giờ) nên \"밤에도 물건을 살 수 있습니다\" (ban đêm cũng mua được đồ). Cửa hàng mới và ở trước trường. Vì vậy đáp án đúng là ④.","vocab":[{"k":"생기다","v":"mới mở, xuất hiện"},{"k":"문을 열다","v":"mở cửa"}]}]},{"sec":"R","nums":[46],"passage":{"kind":"text","body":["저는 수업이 끝나면 그날 배운 단어를 다시 공부합니다. 복습을 하면 단어를 잘 잊어버리지 않습니다. 그래서 저는 매일 복습을 하려고 합니다."]},"qs":[{"n":46,"stem":null,"choices":["단어를 많이 알고 싶습니다.","매일 복습하는 것이 좋습니다.","수업 시간이 너무 짧습니다.","한국어 단어는 어렵습니다."],"ans":2,"exp":"\"복습을 하면 단어를 잘 잊어버리지 않습니다\" (Ôn bài thì không hay quên từ) — ý chính là nên ôn bài mỗi ngày. Vì vậy đáp án đúng là ②.","vocab":[{"k":"복습","v":"ôn bài"},{"k":"잊어버리다","v":"quên mất"}]}]},{"sec":"R","nums":[47],"passage":{"kind":"text","body":["봄이 되었습니다. 날씨가 따뜻하고 꽃도 많이 피었습니다. 이번 주말에 친구와 꽃구경을 가고 싶습니다."]},"qs":[{"n":47,"stem":null,"choices":["주말에 꽃구경을 하고 싶습니다.","봄 날씨는 춥습니다.","친구를 자주 만납니다.","꽃을 사고 싶습니다."],"ans":1,"exp":"\"이번 주말에 친구와 꽃구경을 가고 싶습니다\" (Cuối tuần này tôi muốn đi ngắm hoa với bạn) là suy nghĩ chính. Vì vậy đáp án đúng là ①.","vocab":[{"k":"꽃구경","v":"ngắm hoa"},{"k":"피다","v":"(hoa) nở"}]}]},{"sec":"R","nums":[48],"passage":{"kind":"text","body":["저는 지하철에서 책을 읽습니다. 집에서 회사까지 한 시간쯤 걸립니다. 그 시간에 책을 읽으면 시간이 빨리 가서 좋습니다."]},"qs":[{"n":48,"stem":null,"choices":["회사가 집에서 가까우면 좋겠습니다.","지하철에 사람이 많습니다.","지하철에서 책을 읽는 것이 좋습니다.","책을 많이 사고 싶습니다."],"ans":3,"exp":"\"그 시간에 책을 읽으면 시간이 빨리 가서 좋습니다\" (Đọc sách lúc đó thì thời gian trôi nhanh nên rất thích) — ý chính là đọc sách trên tàu điện ngầm rất tốt. Vì vậy đáp án đúng là ③.","vocab":[{"k":"걸리다","v":"mất (thời gian)"},{"k":"빨리","v":"nhanh"}]}]},{"sec":"R","nums":[49,50],"passage":{"kind":"text","body":["저는 한국대학교에서 한국어를 배우고 있습니다. 우리 반에는 여러 나라 학생들이 있습니다. 처음에는 한국어를 잘 못해서 친구들과 이야기하기가 어려웠습니다. 그래서 수업이 끝나면 친구들과 같이 ( ㉠ ) 한국어로 이야기했습니다. 지금은 한국어로 말하는 것이 재미있습니다."]},"qs":[{"n":49,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["혼자 공부하면서","밥을 먹으면서","잠을 자면서","한국어를 몰라서"],"ans":2,"exp":"Sau giờ học, cùng bạn bè vừa làm việc gì đó vừa nói tiếng Hàn: \"밥을 먹으면서\" (vừa ăn cơm vừa...). \"-(으)면서\" diễn tả hai hành động cùng lúc; \"혼자\" (một mình) mâu thuẫn với \"친구들과 같이\". Vì vậy đáp án đúng là ②.","vocab":[{"k":"-(으)면서","v":"vừa... vừa..."},{"k":"처음","v":"lúc đầu"}]},{"n":50,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["우리 반에는 한국 학생만 있습니다.","저는 처음부터 한국어를 잘했습니다.","저는 친구들과 이야기하지 않습니다.","저는 지금 한국어로 이야기하는 것을 좋아합니다."],"ans":4,"exp":"\"지금은 한국어로 말하는 것이 재미있습니다\" (Bây giờ nói tiếng Hàn rất thú vị) nên bây giờ tôi thích nói tiếng Hàn. Lớp có học sinh nhiều nước, lúc đầu tôi nói chưa giỏi. Vì vậy đáp án đúng là ④.","vocab":[{"k":"여러 나라","v":"nhiều nước"},{"k":"재미있다","v":"thú vị"}]}]},{"sec":"R","nums":[51,52],"passage":{"kind":"text","body":["김밥은 한국 사람들이 자주 먹는 음식입니다. 김 위에 밥을 놓고 여러 가지 채소와 고기를 넣어서 만듭니다. 김밥은 만들기 쉽고 가지고 다니기도 편합니다. 그래서 사람들은 소풍을 갈 때 김밥을 ( ㉠ ). 요즘은 편의점에서도 김밥을 쉽게 살 수 있습니다."]},"qs":[{"n":51,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["많이 준비합니다","만들지 않습니다","팔지 않습니다","먹을 수 없습니다"],"ans":1,"exp":"Vì kimbap dễ làm và tiện mang theo (\"가지고 다니기도 편합니다\"), nên khi đi dã ngoại người ta \"많이 준비합니다\" (chuẩn bị nhiều). Vì vậy đáp án đúng là ①.","vocab":[{"k":"소풍","v":"dã ngoại"},{"k":"편하다","v":"tiện lợi"}]},{"n":52,"stem":"무엇에 대한 이야기인지 맞는 것을 고르십시오.","choices":["편의점에서 파는 음식","소풍을 가는 방법","김밥이 어떤 음식인지","김밥 가게 소개"],"ans":3,"exp":"Bài viết giải thích kimbap là món gì, làm thế nào, có điểm gì tiện lợi — tức là giới thiệu kimbap là món ăn như thế nào. Vì vậy đáp án đúng là ③.","vocab":[{"k":"채소","v":"rau"},{"k":"넣다","v":"cho vào"}]}]},{"sec":"R","nums":[53,54],"passage":{"kind":"text","body":["저는 매일 지하철을 타고 학교에 갑니다. 지하철은 버스보다 빠르고 길이 막히지 않아서 좋습니다. 그런데 아침에는 사람이 너무 많아서 ( ㉠ ). 그래서 요즘은 조금 일찍 집에서 나옵니다. 일찍 나오면 지하철에 사람이 적어서 앉아서 갈 수 있습니다."]},"qs":[{"n":53,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["자리가 많습니다","지하철이 빠릅니다","버스를 타지 않습니다","앉을 수 없습니다"],"ans":4,"exp":"\"사람이 너무 많아서\" (vì quá đông người) nên \"앉을 수 없습니다\" (không thể ngồi). Câu cuối cũng nói đi sớm thì \"앉아서 갈 수 있습니다\". Vì vậy đáp án đúng là ④.","vocab":[{"k":"막히다","v":"(đường) tắc"},{"k":"앉다","v":"ngồi"}]},{"n":54,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 버스를 타고 학교에 갑니다.","지하철은 길이 막히지 않습니다.","요즘은 늦게 집에서 나옵니다.","아침에는 지하철에 사람이 적습니다."],"ans":2,"exp":"\"지하철은 버스보다 빠르고 길이 막히지 않아서 좋습니다\" (Tàu điện ngầm nhanh hơn xe buýt và không bị tắc đường). Vì vậy đáp án đúng là ②.","vocab":[{"k":"빠르다","v":"nhanh"},{"k":"일찍","v":"sớm"}]}]},{"sec":"R","nums":[55,56],"passage":{"kind":"text","body":["한국의 봄은 3월부터 5월까지입니다. 봄에는 날씨가 따뜻하고 꽃이 많이 핍니다. ( ㉠ ) 봄에는 아침과 저녁의 기온 차이가 큽니다. 낮에는 따뜻하지만 아침과 저녁에는 쌀쌀합니다. 그래서 봄에 밖에 나갈 때는 얇은 옷을 하나 더 가지고 가는 것이 좋습니다."]},"qs":[{"n":55,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["그래서","그러면","그런데","그러니까"],"ans":3,"exp":"Câu trước nói mùa xuân ấm áp, câu sau nói chênh lệch nhiệt độ sáng tối lớn — ý chuyển hướng nên dùng \"그런데\" (nhưng, thế nhưng). Vì vậy đáp án đúng là ③.","vocab":[{"k":"그런데","v":"nhưng, thế nhưng"},{"k":"기온 차이","v":"chênh lệch nhiệt độ"}]},{"n":56,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["봄에는 꽃이 많이 핍니다.","한국의 봄은 6월에 끝납니다.","봄에는 아침에도 따뜻합니다.","봄에는 얇은 옷만 입는 것이 좋습니다."],"ans":1,"exp":"\"봄에는 날씨가 따뜻하고 꽃이 많이 핍니다\" (Mùa xuân trời ấm và hoa nở nhiều). Mùa xuân kết thúc vào tháng 5, buổi sáng se lạnh. Vì vậy đáp án đúng là ①.","vocab":[{"k":"쌀쌀하다","v":"se lạnh"},{"k":"얇다","v":"mỏng"}]}]},{"sec":"R","nums":[57],"passage":{"kind":"text","body":["(가) 그래서 오늘 도서관에 가서 책을 빌렸습니다.","(나) 다음 주에 한국어 말하기 대회가 있습니다.","(다) 저는 대회를 준비하려고 한국 문화에 대한 책을 읽고 싶었습니다.","(라) 이 책을 읽고 대회 준비를 열심히 할 겁니다."]},"qs":[{"n":57,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(가)-(다)-(라)","(나)-(다)-(가)-(라)","(다)-(나)-(가)-(라)","(다)-(가)-(나)-(라)"],"ans":2,"exp":"Mở đầu bằng (나) giới thiệu \"말하기 대회\" (cuộc thi nói). Tiếp theo (다) muốn đọc sách để chuẩn bị, (가) \"그래서\" đi thư viện mượn sách, cuối cùng (라) \"이 책\" sẽ đọc để chuẩn bị. Vì vậy đáp án đúng là ②.","vocab":[{"k":"대회","v":"cuộc thi"},{"k":"문화","v":"văn hóa"}]}]},{"sec":"R","nums":[58],"passage":{"kind":"text","body":["(가) 그래서 저는 매일 저녁 강아지와 공원에 갑니다.","(나) 저는 작년부터 강아지를 키우고 있습니다.","(다) 산책을 하면 강아지도 좋아하고 저도 건강해집니다.","(라) 그런데 강아지가 집에만 있으면 심심해합니다."]},"qs":[{"n":58,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(가)-(라)-(다)","(라)-(나)-(가)-(다)","(라)-(가)-(나)-(다)","(나)-(라)-(가)-(다)"],"ans":4,"exp":"(나) giới thiệu việc nuôi chó, (라) \"그런데\" chó ở nhà suốt thì buồn chán, (가) \"그래서\" mỗi tối đi công viên, (다) đi dạo thì cả chó và tôi đều khỏe. Vì vậy đáp án đúng là ④.","vocab":[{"k":"키우다","v":"nuôi"},{"k":"심심하다","v":"buồn chán"}]}]},{"sec":"R","nums":[59,60],"passage":{"kind":"text","body":["저는 지난달에 학교 사진 동아리에 들어갔습니다. ( ㉠ ) 동아리 친구들과 주말마다 여러 곳에 가서 사진을 찍습니다. ( ㉡ ) 처음에는 사진을 잘 못 찍었습니다. ( ㉢ ) 지금은 사진 찍는 것이 아주 재미있어졌습니다. ( ㉣ )"]},"qs":[{"n":59,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.","choices":["㉠","㉡","㉢","㉣"],"box":"그때 선배들이 사진 찍는 방법을 친절하게 가르쳐 주었습니다.","ans":3,"exp":"Câu cần chèn: \"그때 선배들이 ... 가르쳐 주었습니다\" (Lúc đó các anh chị khóa trên đã dạy cách chụp ảnh). Câu này phải đứng sau \"처음에는 사진을 잘 못 찍었습니다\" và trước \"지금은 ... 재미있어졌습니다\", tức vị trí ㉢. Vì vậy đáp án đúng là ③.","vocab":[{"k":"동아리","v":"câu lạc bộ"},{"k":"선배","v":"tiền bối, anh chị khóa trên"}]},{"n":60,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 주말에 사진을 찍으러 갑니다.","저는 작년에 동아리에 들어갔습니다.","저는 처음부터 사진을 잘 찍었습니다.","선배들은 사진을 가르쳐 주지 않았습니다."],"ans":1,"exp":"\"주말마다 여러 곳에 가서 사진을 찍습니다\" (Mỗi cuối tuần đi nhiều nơi chụp ảnh). Tôi vào câu lạc bộ tháng trước, không phải năm ngoái. Vì vậy đáp án đúng là ①.","vocab":[{"k":"찍다","v":"chụp (ảnh)"},{"k":"들어가다","v":"gia nhập, đi vào"}]}]},{"sec":"R","nums":[61,62],"passage":{"kind":"text","body":["지난 주말은 할머니의 일흔 번째 생신이었습니다. 우리 가족은 할머니를 위해 작은 파티를 준비했습니다. 저는 할머니께 노래를 불러 드리려고 한 달 동안 연습했습니다. 파티 날 제가 노래를 ( ㉠ ) 할머니께서 아주 기뻐하셨습니다. 할머니는 제 손을 잡고 고맙다고 말씀하셨습니다. 내년 생신에도 할머니께 노래를 불러 드리고 싶습니다."]},"qs":[{"n":61,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["부르지 않아서","부르려고","부르면","불러 드렸는데"],"ans":4,"exp":"Ngày tiệc tôi đã hát tặng bà và bà rất vui: \"노래를 불러 드렸는데 할머니께서 아주 기뻐하셨습니다\". \"-(으)ㄴ/는데\" dùng để nêu bối cảnh cho vế sau. Vì vậy đáp án đúng là ④.","vocab":[{"k":"부르다","v":"hát, gọi"},{"k":"기뻐하다","v":"vui mừng"}]},{"n":62,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["할머니는 노래를 부르셨습니다.","저는 노래를 한 달 동안 연습했습니다.","파티는 식당에서 했습니다.","할머니는 파티를 좋아하지 않으셨습니다."],"ans":2,"exp":"\"한 달 동안 연습했습니다\" (Tôi đã luyện tập suốt một tháng). Người hát là tôi, không phải bà; bà rất vui. Vì vậy đáp án đúng là ②.","vocab":[{"k":"연습하다","v":"luyện tập"},{"k":"생신","v":"sinh nhật (kính ngữ)"}]}]},{"sec":"R","nums":[63,64],"passage":{"kind":"email","title":"한국어 수업 교실 변경 안내","body":["받는 사람: 한국어 3반 학생들","보내는 사람: 김지영 선생님","여러분, 안녕하세요.","다음 주 월요일부터 한국어 수업 교실이 바뀝니다. 지금 교실은 공사를 해야 해서 한 달 동안 쓸 수 없습니다. 새 교실은 인문관 3층 305호입니다. 수업 시간은 똑같이 오전 9시부터 12시까지입니다. 교실을 찾기 어려우면 1층 사무실에 물어보세요.","김지영 드림"]},"qs":[{"n":63,"stem":"왜 윗글을 썼는지 맞는 것을 고르십시오.","choices":["새 교실을 알려 주려고","수업 시간이 바뀐 것을 알려 주려고","공사 기간을 물어보려고","사무실 전화번호를 알려 주려고"],"ans":1,"exp":"Email nói \"수업 교실이 바뀝니다\" (phòng học sẽ thay đổi) và \"새 교실은 인문관 3층 305호입니다\" — mục đích là thông báo phòng học mới. Giờ học vẫn giữ nguyên (\"똑같이\"). Vì vậy đáp án đúng là ①.","vocab":[{"k":"바뀌다","v":"được thay đổi"},{"k":"공사","v":"thi công, sửa chữa"}]},{"n":64,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["수업은 오후에 합니다.","새 교실은 인문관 1층에 있습니다.","지금 교실은 한 달 동안 쓸 수 없습니다.","다음 주에는 수업이 없습니다."],"ans":3,"exp":"\"지금 교실은 공사를 해야 해서 한 달 동안 쓸 수 없습니다\" (Phòng hiện tại phải sửa chữa nên không dùng được trong một tháng). Lớp học vào buổi sáng, phòng mới ở tầng 3. Vì vậy đáp án đúng là ③.","vocab":[{"k":"쓰다","v":"sử dụng"},{"k":"사무실","v":"văn phòng"}]}]},{"sec":"R","nums":[65,66],"passage":{"kind":"text","body":["한국에는 편의점이 아주 많습니다. 편의점에서는 음식이나 물건을 사는 것 외에도 여러 가지 일을 할 수 있습니다. 예를 들면 택배를 보내거나 교통카드를 충전할 수 있습니다. 또 편의점 안에 테이블이 있어서 라면이나 김밥을 사서 ( ㉠ ). 그리고 대부분의 편의점은 밤에도 문을 열기 때문에 늦은 시간에도 이용할 수 있습니다. 그래서 편의점은 한국 사람들의 생활에 꼭 필요한 곳이 되었습니다."]},"qs":[{"n":65,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["사 갈 수 없습니다","먹고 갈 수 있습니다","만들지 않습니다","팔지 않습니다"],"ans":2,"exp":"\"편의점 안에 테이블이 있어서\" (vì trong cửa hàng có bàn) nên có thể mua mì hay kimbap rồi \"먹고 갈 수 있습니다\" (ăn tại chỗ rồi đi). Vì vậy đáp án đúng là ②.","vocab":[{"k":"테이블","v":"cái bàn"},{"k":"-(으)ㄹ 수 있다","v":"có thể"}]},{"n":66,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["편의점에서는 물건만 살 수 있습니다.","편의점에서 택배를 보낼 수 없습니다.","모든 편의점은 밤에 문을 닫습니다.","편의점에서 교통카드를 충전할 수 있습니다."],"ans":4,"exp":"\"교통카드를 충전할 수 있습니다\" (có thể nạp tiền thẻ giao thông). Ở cửa hàng tiện lợi còn gửi được bưu phẩm, và đa số mở cửa cả ban đêm. Vì vậy đáp án đúng là ④.","vocab":[{"k":"택배","v":"chuyển phát, bưu phẩm"},{"k":"충전하다","v":"nạp (tiền, pin)"}]}]},{"sec":"R","nums":[67,68],"passage":{"kind":"text","body":["한국에는 누구나 이용할 수 있는 공공 도서관이 많습니다. 공공 도서관에서는 책을 읽거나 빌릴 수 있고 공부도 할 수 있습니다. 도서관 회원 카드를 만들면 책을 집에 ( ㉠ ). 회원 카드는 신분증을 가지고 가면 무료로 만들 수 있습니다. 또 많은 도서관에서 어린이를 위한 책 읽기 프로그램이나 외국인을 위한 한국어 수업도 합니다."]},"qs":[{"n":67,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["빌려 갈 수 있습니다","가지고 갈 수 없습니다","사 가야 합니다","보내야 합니다"],"ans":1,"exp":"Làm \"회원 카드\" (thẻ thành viên) thì có thể \"책을 집에 빌려 갈 수 있습니다\" (mượn sách mang về nhà). Vì vậy đáp án đúng là ①.","vocab":[{"k":"회원 카드","v":"thẻ thành viên"},{"k":"공공 도서관","v":"thư viện công cộng"}]},{"n":68,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["공공 도서관은 학생만 이용할 수 있습니다.","회원 카드를 만들려면 돈을 내야 합니다.","도서관에서 외국인을 위한 수업을 하기도 합니다.","도서관에서는 공부를 할 수 없습니다."],"ans":3,"exp":"\"외국인을 위한 한국어 수업도 합니다\" (cũng có lớp tiếng Hàn dành cho người nước ngoài). Thư viện ai cũng dùng được (\"누구나\"), thẻ làm miễn phí (\"무료\"). Vì vậy đáp án đúng là ③.","vocab":[{"k":"누구나","v":"bất cứ ai"},{"k":"신분증","v":"giấy tờ tùy thân"}]}]},{"sec":"R","nums":[69,70],"passage":{"kind":"text","body":["저는 베트남에서 온 유학생입니다. 한국에 처음 왔을 때는 한국 음식이 입에 잘 맞지 않았습니다. 그래서 밥을 잘 먹지 못해서 자주 배가 고팠습니다. 그때 하숙집 아주머니께서 저에게 김밥 만드는 방법을 가르쳐 주셨습니다. 제가 만든 김밥은 모양이 예쁘지 않았지만 정말 맛있었습니다. 그 후로 저는 한국 음식을 ( ㉠ ) 되었습니다. 이제는 주말마다 친구들에게 김밥을 만들어 줍니다."]},"qs":[{"n":69,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["먹지 않게","만들 수 없게","싫어하게","좋아하게"],"ans":4,"exp":"Sau khi tự làm kimbap và thấy rất ngon, bây giờ còn làm kimbap cho bạn mỗi cuối tuần — tức là tôi đã trở nên thích món Hàn: \"좋아하게 되었습니다\". \"-게 되다\" diễn tả sự thay đổi (trở nên). Vì vậy đáp án đúng là ④.","vocab":[{"k":"-게 되다","v":"trở nên, được (thay đổi)"},{"k":"입에 맞다","v":"hợp khẩu vị"}]},{"n":70,"stem":"이 글의 내용으로 알 수 있는 것을 고르십시오.","choices":["저는 처음부터 한국 음식을 잘 먹었습니다.","아주머니께서 김밥 만드는 방법을 알려 주셨습니다.","제가 만든 김밥은 모양이 예뻤습니다.","저는 친구들에게 김밥 만드는 방법을 배웁니다."],"ans":2,"exp":"\"하숙집 아주머니께서 저에게 김밥 만드는 방법을 가르쳐 주셨습니다\" (Cô chủ nhà trọ đã dạy tôi cách làm kimbap). Lúc đầu tôi không hợp món Hàn, kimbap của tôi hình dáng không đẹp. Vì vậy đáp án đúng là ②.","vocab":[{"k":"유학생","v":"du học sinh"},{"k":"하숙집","v":"nhà trọ (có nấu ăn)"},{"k":"모양","v":"hình dáng"}]}]}]},{"test":2,"groups":[{"sec":"L","nums":[1],"audio":[{"s":"W","t":"수영을 좋아해요?"}],"qs":[{"n":1,"stem":null,"choices":["네, 수영이 없어요.","네, 수영을 좋아해요.","아니요, 수영이 많아요.","아니요, 수영을 해요."],"ans":2,"exp":"Câu hỏi \"수영을 좋아해요?\" (Bạn thích bơi không?). Câu trả lời phù hợp là \"네, 수영을 좋아해요\" (Vâng, tôi thích bơi), nên đáp án là ②.","vocab":[{"k":"수영","v":"bơi lội"},{"k":"좋아하다","v":"thích"}]}]},{"sec":"L","nums":[2],"audio":[{"s":"M","t":"감기예요?"}],"qs":[{"n":2,"stem":null,"choices":["네, 감기가 싸요.","네, 감기를 좋아해요.","아니요, 감기가 커요.","아니요, 감기가 아니에요."],"ans":4,"exp":"Câu hỏi \"감기예요?\" (Có phải bị cảm không?). Câu trả lời tự nhiên là \"아니요, 감기가 아니에요\" (Không, không phải cảm), nên đáp án là ④.","vocab":[{"k":"감기","v":"cảm cúm"}]}]},{"sec":"L","nums":[3],"audio":[{"s":"W","t":"어디에서 테니스를 쳐요?"}],"qs":[{"n":3,"stem":null,"choices":["공원에서 쳐요.","친구와 쳐요.","주말에 쳐요.","두 시간 쳐요."],"ans":1,"exp":"Từ để hỏi \"어디에서\" (ở đâu) hỏi về nơi chốn. Chỉ \"공원에서 쳐요\" (chơi ở công viên) trả lời về địa điểm, nên đáp án là ①.","vocab":[{"k":"어디","v":"ở đâu"},{"k":"테니스를 치다","v":"chơi quần vợt"},{"k":"공원","v":"công viên"}]}]},{"sec":"L","nums":[4],"audio":[{"s":"M","t":"소포를 언제 보냈어요?"}],"qs":[{"n":4,"stem":null,"choices":["우체국에서 보냈어요.","동생에게 보냈어요.","어제 보냈어요.","옷을 보냈어요."],"ans":3,"exp":"Từ để hỏi \"언제\" (khi nào) hỏi về thời gian. \"어제 보냈어요\" (đã gửi hôm qua) là câu trả lời về thời gian, nên đáp án là ③.","vocab":[{"k":"소포","v":"bưu kiện"},{"k":"언제","v":"khi nào"},{"k":"보내다","v":"gửi"}]}]},{"sec":"L","nums":[5],"audio":[{"s":"W","t":"생일 축하해요."}],"qs":[{"n":5,"stem":null,"choices":["괜찮아요.","고마워요.","축하해요.","잘 먹겠습니다."],"ans":2,"exp":"Khi được chúc mừng sinh nhật \"생일 축하해요\", ta đáp lại bằng lời cảm ơn \"고마워요\" (Cảm ơn), nên đáp án là ②.","vocab":[{"k":"생일","v":"sinh nhật"},{"k":"축하하다","v":"chúc mừng"}]}]},{"sec":"L","nums":[6],"audio":[{"s":"M","t":"늦어서 미안해요."}],"qs":[{"n":6,"stem":null,"choices":["괜찮아요.","반가워요.","여기 있어요.","잘 지내요."],"ans":1,"exp":"Người đàn ông xin lỗi \"늦어서 미안해요\" (Xin lỗi vì đến muộn). Câu đáp lại phù hợp là \"괜찮아요\" (Không sao đâu), nên đáp án là ①.","vocab":[{"k":"늦다","v":"muộn"},{"k":"미안하다","v":"xin lỗi"}]}]},{"sec":"L","nums":[7],"audio":[{"s":"M","t":"감기약 좀 주세요."},{"s":"W","t":"네, 이 약을 하루에 세 번 드세요."}],"qs":[{"n":7,"stem":null,"choices":["은행","서점","식당","약국"],"ans":4,"exp":"Người đàn ông nói \"감기약 좀 주세요\" (Cho tôi thuốc cảm) và người phụ nữ hướng dẫn uống thuốc \"하루에 세 번\" (ngày ba lần). Đây là hiệu thuốc (약국), nên đáp án là ④.","vocab":[{"k":"감기약","v":"thuốc cảm"},{"k":"약국","v":"hiệu thuốc"},{"k":"하루에 세 번","v":"ngày ba lần"}]}]},{"sec":"L","nums":[8],"audio":[{"s":"M","t":"이 소포를 베트남에 보내고 싶어요."},{"s":"W","t":"그럼 저울 위에 올려 주세요."}],"qs":[{"n":8,"stem":null,"choices":["시장","학교","우체국","극장"],"ans":3,"exp":"\"소포를 베트남에 보내고 싶어요\" (Tôi muốn gửi bưu kiện sang Việt Nam) và \"저울\" (cái cân) cho thấy nơi này là bưu điện (우체국), nên đáp án là ③.","vocab":[{"k":"우체국","v":"bưu điện"},{"k":"저울","v":"cái cân"},{"k":"올리다","v":"đặt lên"}]}]},{"sec":"L","nums":[9],"audio":[{"s":"W","t":"사과 한 개에 얼마예요?"},{"s":"M","t":"천 원이에요. 다섯 개에 사천 원이에요."}],"qs":[{"n":9,"stem":null,"choices":["시장","도서관","미용실","병원"],"ans":1,"exp":"Người phụ nữ hỏi giá táo \"사과 한 개에 얼마예요?\" (Một quả táo bao nhiêu tiền?). Nơi mua bán hoa quả là chợ (시장), nên đáp án là ①.","vocab":[{"k":"사과","v":"táo"},{"k":"얼마예요?","v":"bao nhiêu tiền?"},{"k":"시장","v":"chợ"}]}]},{"sec":"L","nums":[10],"audio":[{"s":"M","t":"어디가 아프세요?"},{"s":"W","t":"어제부터 머리가 아프고 열이 나요."}],"qs":[{"n":10,"stem":null,"choices":["가게","병원","회사","우체국"],"ans":2,"exp":"Người đàn ông hỏi \"어디가 아프세요?\" (Bạn đau ở đâu?) và người phụ nữ trả lời \"머리가 아프고 열이 나요\" (đau đầu và bị sốt). Đây là cuộc nói chuyện ở bệnh viện (병원), nên đáp án là ②.","vocab":[{"k":"아프다","v":"đau, ốm"},{"k":"열이 나다","v":"bị sốt"},{"k":"병원","v":"bệnh viện"}]}]},{"sec":"L","nums":[11],"audio":[{"s":"W","t":"여름 휴가 때 뭐 할 거예요?"},{"s":"M","t":"가족하고 제주도에 갈 거예요."}],"qs":[{"n":11,"stem":null,"choices":["운동","취미","휴가","날씨"],"ans":3,"exp":"Hai người nói về kế hoạch \"여름 휴가\" (kỳ nghỉ hè): đi đảo Jeju cùng gia đình. Chủ đề là kỳ nghỉ (휴가), nên đáp án là ③.","vocab":[{"k":"여름 휴가","v":"kỳ nghỉ hè"},{"k":"가족","v":"gia đình"}]}]},{"sec":"L","nums":[12],"audio":[{"s":"M","t":"무슨 운동을 좋아해요?"},{"s":"W","t":"저는 테니스를 좋아해요."}],"qs":[{"n":12,"stem":null,"choices":["음식","가족","날씨","운동"],"ans":4,"exp":"Người đàn ông hỏi \"무슨 운동을 좋아해요?\" (Bạn thích môn thể thao nào?) và người phụ nữ trả lời \ s":"M","t":"수미 씨, 주말에 뭐 했어요?"},{"s":"W","t":"친구하고 테니스를 쳤어요. 민호 씨는요?"},{"s":"M","t":"저는 집에서 쉬었어요. 감기에 걸렸어요."},{"s":"W","t":"그래요? 빨리 나으세요."}],"qs":[{"n":17,"stem":null,"choices":["여자는 주말에 집에서 쉬었습니다.","남자는 감기에 걸렸습니다.","여자는 혼자 테니스를 쳤습니다.","남자는 친구하고 테니스를 쳤습니다."],"ans":2,"exp":"Người đàn ông nói \"감기에 걸렸어요\" (Tôi bị cảm) nên ở nhà nghỉ. Người phụ nữ chơi quần vợt cùng bạn. Vì vậy đáp án là ②.","vocab":[{"k":"감기에 걸리다","v":"bị cảm"},{"k":"쉬다","v":"nghỉ ngơi"},{"k":"낫다","v":"khỏi bệnh"}]}]},{"sec":"L","nums":[18],"audio":[{"s":"W","t":"이 소포를 부산에 보내려고 해요. 얼마나 걸려요?"},{"s":"M","t":"보통 소포는 이틀 걸리고, 빠른 소포는 내일 도착해요."},{"s":"W","t":"그럼 빠른 소포로 보내 주세요."},{"s":"M","t":"네, 오천 원입니다."}],"qs":[{"n":18,"stem":null,"choices":["여자는 소포를 부산에 보냅니다.","보통 소포는 내일 도착합니다.","여자는 보통 소포로 보냅니다.","빠른 소포는 이틀 걸립니다."],"ans":1,"exp":"Người phụ nữ nói \"이 소포를 부산에 보내려고 해요\" (Tôi định gửi bưu kiện này đi Busan). Cô ấy chọn gửi nhanh; gửi thường mất hai ngày. Đáp án là ①.","vocab":[{"k":"걸리다","v":"mất (thời gian)"},{"k":"이틀","v":"hai ngày"},{"k":"도착하다","v":"đến nơi"}]}]},{"sec":"L","nums":[19],"audio":[{"s":"M","t":"어서 오세요. 몇 분이세요?"},{"s":"W","t":"두 명이요. 비빔밥 두 개 주세요."},{"s":"M","t":"죄송합니다. 비빔밥은 지금 안 돼요. 불고기는 있어요."},{"s":"W","t":"그럼 불고기 두 개 주세요."}],"qs":[{"n":19,"stem":null,"choices":["여자는 혼자 식당에 왔습니다.","여자는 비빔밥을 먹을 겁니다.","식당에 불고기가 없습니다.","여자는 불고기를 주문했습니다."],"ans":4,"exp":"Món bibimbap hiện không có nên người phụ nữ nói \"그럼 불고기 두 개 주세요\" (Vậy cho tôi hai phần bulgogi). Cô ấy đi hai người. Đáp án là ④.","vocab":[{"k":"몇 분","v":"mấy vị (kính ngữ)"},{"k":"주문하다","v":"gọi món"}]}]},{"sec":"L","nums":[20],"audio":[{"s":"W","t":"민수 씨, 이번 토요일에 우리 집에 올 수 있어요? 집들이를 해요."},{"s":"M","t":"좋아요. 몇 시까지 가면 돼요?"},{"s":"W","t":"저녁 여섯 시까지 오세요. 다른 친구들도 와요."},{"s":"M","t":"알겠어요. 제가 과일을 사 갈게요."}],"qs":[{"n":20,"stem":null,"choices":["남자는 토요일에 일을 합니다.","여자는 남자의 집에 갑니다.","남자는 과일을 사 갈 겁니다.","여자는 혼자 집에 있을 겁니다."],"ans":3,"exp":"Người đàn ông nói \"제가 과일을 사 갈게요\" (Tôi sẽ mua hoa quả mang đến). Người phụ nữ mời anh ấy và các bạn khác đến nhà mình. Đáp án là ③.","vocab":[{"k":"집들이","v":"tiệc tân gia"},{"k":"사 가다","v":"mua mang đến"}]}]},{"sec":"L","nums":[21],"audio":[{"s":"M","t":"여름 휴가 때 어디에 갈 거예요?"},{"s":"W","t":"강릉 바다에 가려고 해요. 기차표도 벌써 샀어요."},{"s":"M","t":"좋겠네요. 저는 올해 휴가를 못 가요. 일이 너무 많아요."},{"s":"W","t":"그래요? 그럼 제가 사진을 많이 찍어서 보여 줄게요."}],"qs":[{"n":21,"stem":null,"choices":["여자는 기차표를 샀습니다.","남자는 강릉에 갈 겁니다.","여자는 휴가를 못 갑니다.","남자는 사진을 찍을 겁니다."],"ans":1,"exp":"Người phụ nữ nói \"기차표도 벌써 샀어요\" (Tôi đã mua vé tàu rồi). Người đàn ông không đi nghỉ được vì nhiều việc. Đáp án là ①.","vocab":[{"k":"기차표","v":"vé tàu"},{"k":"벌써","v":"đã ... rồi"},{"k":"사진을 찍다","v":"chụp ảnh"}]}]},{"sec":"L","nums":[22],"audio":[{"s":"M","t":"요즘 감기에 자주 걸려요."},{"s":"W","t":"운동을 좀 해 보세요. 저는 매일 아침에 걸어요."},{"s":"M","t":"시간이 없어서 운동하기가 어려워요."},{"s":"W","t":"하루에 삼십 분만 걸어도 건강에 좋아요."}],"qs":[{"n":22,"stem":null,"choices":["감기에 걸리면 병원에 가야 합니다.","조금씩이라도 운동하는 것이 좋습니다.","아침에 일찍 일어나야 합니다.","바쁘면 운동을 안 해도 됩니다."],"ans":2,"exp":"Người phụ nữ nói \"하루에 삼십 분만 걸어도 건강에 좋아요\" (Chỉ cần đi bộ 30 phút mỗi ngày cũng tốt cho sức khỏe). Ý chính: nên vận động dù chỉ một chút. Đáp án là ②.","vocab":[{"k":"자주","v":"thường xuyên"},{"k":"걷다","v":"đi bộ"},{"k":"건강","v":"sức khỏe"}]}]},{"sec":"L","nums":[23],"audio":[{"s":"W","t":"민수 씨, 시장에 같이 갈래요?"},{"s":"M","t":"마트가 더 가깝고 편하지 않아요?"},{"s":"W","t":"시장은 채소가 싱싱하고 값도 싸요. 사람들도 친절하고요."},{"s":"M","t":"그래요? 그럼 한번 가 봐요."}],"qs":[{"n":23,"stem":null,"choices":["마트가 시장보다 편합니다.","채소를 많이 먹어야 합니다.","가까운 곳에서 장을 보는 것이 좋습니다.","시장에서 장을 보는 것이 좋습니다."],"ans":4,"exp":"Người phụ nữ nói \"시장은 채소가 싱싱하고 값도 싸요\" (Ở chợ rau tươi và giá rẻ). Cô ấy nghĩ nên đi chợ mua đồ. Đáp án là ④.","vocab":[{"k":"싱싱하다","v":"tươi"},{"k":"값","v":"giá"},{"k":"장을 보다","v":"đi chợ, mua sắm thực phẩm"}]}]},{"sec":"L","nums":[24],"audio":[{"s":"M","t":"요즘 회사 일이 너무 많아서 점심을 자주 못 먹어요."},{"s":"W","t":"그래도 점심은 꼭 드세요."},{"s":"M","t":"일을 빨리 끝내고 싶어서요."},{"s":"W","t":"밥을 안 먹으면 힘이 없어서 일도 잘 못 해요."}],"qs":[{"n":24,"stem":null,"choices":["일을 빨리 끝내는 것이 중요합니다.","회사 근처 식당이 좋습니다.","
