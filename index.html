,{"k":"주다","v":"cho, tặng"}]}]},{"sec":"R","nums":[39],"passage":{"kind":"text","body":["김치를 먹었습니다. 김치가 (    )."]},"qs":[{"n":39,"stem":null,"choices":["맵습니다","작습니다","깁니다","넓습니다"],"ans":1,"exp":"Nói về vị của kimchi thì dùng \"맵습니다\" (cay). Đáp án là ①.","vocab":[{"k":"맵다","v":"cay"}]}]},{"sec":"R","nums":[40],"passage":{"kind":"notice","title":"경복궁 야간 관람","body":["기간: 9월 1일 ~ 10월 31일","시간: 저녁 7시 ~ 9시 30분","입장료: 3,000원 (한복을 입으면 무료)","※ 매주 화요일은 쉽니다."]},"qs":[{"n":40,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["10월에도 볼 수 있습니다.","저녁에 관람합니다.","화요일에는 볼 수 없습니다.","한복을 입어도 돈을 내야 합니다."],"ans":4,"exp":"Thông báo ghi \"한복을 입으면 무료\" (mặc hanbok thì miễn phí), nên câu ④ \"mặc hanbok vẫn phải trả tiền\" là sai. Đáp án là ④.","vocab":[{"k":"야간","v":"ban đêm"},{"k":"관람","v":"tham quan"},{"k":"무료","v":"miễn phí"}]}]},{"sec":"R","nums":[41],"passage":{"kind":"notice","title":"새해맞이 할인!","body":["안경테 50% 할인","기간: 1월 2일 ~ 1월 15일","장소: 밝은눈 안경점 (한국역 3번 출구 앞)","※ 눈 검사는 무료입니다."]},"qs":[{"n":41,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["안경테를 싸게 살 수 있습니다.","눈 검사를 하려면 돈을 내야 합니다.","안경점은 한국역 앞에 있습니다.","할인은 1월 15일에 끝납니다."],"ans":2,"exp":"Thông báo ghi \"눈 검사는 무료입니다\" (kiểm tra mắt miễn phí), nên câu ② \"phải trả tiền để kiểm tra mắt\" là sai. Đáp án là ②.","vocab":[{"k":"할인","v":"giảm giá"},{"k":"출구","v":"lối ra"}]}]},{"sec":"R","nums":[42],"passage":{"kind":"notice","title":"메모","body":["민지야, 엄마는 회사에 일이 있어서 늦게 와.","냉장고에 김밥이 있으니까 저녁으로 먹어.","숙제를 다 하고 텔레비전을 봐.","엄마는 9시쯤 올 거야."]},"qs":[{"n":42,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["엄마는 늦게 옵니다.","김밥은 냉장고에 있습니다.","민지는 엄마하고 저녁을 먹습니다.","민지는 숙제를 해야 합니다."],"ans":3,"exp":"Mẹ về muộn (khoảng 9 giờ) và dặn \"김밥이 있으니까 저녁으로 먹어\" (có kimbap, hãy ăn tối), tức là Minji ăn tối một mình. Câu ③ sai. Đáp án là ③.","vocab":[{"k":"냉장고","v":"tủ lạnh"},{"k":"숙제","v":"bài tập về nhà"}]}]},{"sec":"R","nums":[43],"passage":{"kind":"text","body":["저는 지난주에 치과에 갔습니다. 이가 아파서 치료를 받았습니다. 다음 주에 한 번 더 가야 합니다."]},"qs":[{"n":43,"stem":null,"choices":["저는 다음 주에 치과에 갑니다.","저는 오늘 치과에 갔습니다.","저는 이가 아프지 않았습니다.","치료가 모두 끝났습니다."],"ans":1,"exp":"Đoạn văn nói \"다음 주에 한 번 더 가야 합니다\" (tuần sau phải đi thêm một lần nữa). Đáp án là ①.","vocab":[{"k":"치료를 받다","v":"được điều trị"},{"k":"한 번 더","v":"thêm một lần"}]}]},{"sec":"R","nums":[44],"passage":{"kind":"text","body":["제 동생은 여덟 살입니다. 부모님이 일을 하셔서 제가 매일 동생을 돌봅니다. 동생과 같이 공원에서 자전거를 탑니다."]},"qs":[{"n":44,"stem":null,"choices":["저는 동생과 자전거를 탑니다.","동생은 혼자 공원에 갑니다.","부모님이 동생을 돌봅니다.","동생은 열 살입니다."],"ans":1,"exp":"Đoạn văn nói \"동생과 같이 공원에서 자전거를 탑니다\" (tôi cùng em đạp xe ở công viên). Đáp án là ①.","vocab":[{"k":"돌보다","v":"chăm sóc"},{"k":"자전거를 타다","v":"đạp xe"}]}]},{"sec":"R","nums":[45],"passage":{"kind":"text","body":["저는 인터넷으로 옷을 자주 삽니다. 가게에 가지 않아도 돼서 편합니다. 하지만 옷이 작으면 다시 보내야 해서 불편합니다."]},"qs":[{"n":45,"stem":null,"choices":["저는 옷 가게에 자주 갑니다.","저는 인터넷 쇼핑을 자주 합니다.","옷이 작으면 그냥 입습니다.","인터넷 쇼핑은 불편한 점이 없습니다."],"ans":2,"exp":"Đoạn văn nói \"인터넷으로 옷을 자주 삽니다\" (tôi thường mua quần áo trên mạng). Đáp án là ②.","vocab":[{"k":"편하다","v":"tiện lợi"},{"k":"불편하다","v":"bất tiện"}]}]},{"sec":"R","nums":[46],"passage":{"kind":"text","body":["저는 아침마다 운동을 합니다. 운동을 하면 몸이 건강해집니다. 그리고 기분도 좋아집니다."]},"qs":[{"n":46,"stem":null,"choices":["운동을 저녁에 하고 싶습니다.","아침에 늦게 일어나고 싶습니다.","운동을 하는 것이 좋습니다.","친구와 같이 운동하고 싶습니다."],"ans":3,"exp":"Người viết nói tập thể dục thì \"몸이 건강해집니다\" (cơ thể khỏe hơn) và \"기분도 좋아집니다\" (tâm trạng tốt hơn). Ý chính: tập thể dục là tốt. Đáp án là ③.","vocab":[{"k":"건강하다","v":"khỏe mạnh"},{"k":"기분","v":"tâm trạng"}]}]},{"sec":"R","nums":[47],"passage":{"kind":"text","body":["저는 요즘 피아노를 배웁니다. 처음에는 어려웠지만 지금은 재미있습니다. 더 열심히 연습해서 좋아하는 노래를 치고 싶습니다."]},"qs":[{"n":47,"stem":null,"choices":["피아노는 너무 어렵습니다.","피아노 학원을 바꾸고 싶습니다.","노래를 잘 부르고 싶습니다.","피아노를 더 잘 치고 싶습니다."],"ans":4,"exp":"Người viết nói \"더 열심히 연습해서 좋아하는 노래를 치고 싶습니다\" (muốn luyện tập chăm hơn để chơi được bài mình thích). Đáp án là ④.","vocab":[{"k":"연습하다","v":"luyện tập"},{"k":"열심히","v":"chăm chỉ"}]}]},{"sec":"R","nums":[48],"passage":{"kind":"text","body":["우리 동네에 새 안경점이 생겼습니다. 값이 싸고 직원들이 친절합니다. 저는 앞으로 이 안경점에 자주 가려고 합니다."]},"qs":[{"n":48,"stem":null,"choices":["안경을 사고 싶지 않습니다.","새 안경점이 마음에 듭니다.","안경점 직원이 되고 싶습니다.","안경 값이 너무 비쌉니다."],"ans":2,"exp":"Người viết khen \"값이 싸고 직원들이 친절합니다\" (giá rẻ, nhân viên thân thiện) và định thường xuyên đến. Ý chính: thích cửa hàng kính mới. Đáp án là ②.","vocab":[{"k":"동네","v":"khu phố"},{"k":"친절하다","v":"thân thiện"}]}]},{"sec":"R","nums":[49,50],"passage":{"kind":"text","body":["저는 지난 주말에 처음으로 김치를 만들었습니다. 한국 친구의 어머니께서 방법을 가르쳐 주셨습니다. 배추를 소금물에 넣고 ( ㉠ ) 양념을 발랐습니다. 생각보다 힘들었지만 정말 재미있었습니다. 저는 김치 사진을 찍어서 베트남에 계신 부모님께 보내 드렸습니다."]},"qs":[{"n":49,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["먹은 후에","만들기 전에","몇 시간 기다린 후에","사러 가서"],"ans":3,"exp":"Cho cải thảo vào nước muối, \"몇 시간 기다린 후에\" (đợi vài tiếng rồi) mới phết gia vị. Đây là thứ tự hợp lý. Đáp án là ③.","vocab":[{"k":"배추","v":"cải thảo"},{"k":"소금물","v":"nước muối"},{"k":"양념","v":"gia vị"}]},{"n":50,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["친구의 어머니께서 김치 만드는 법을 가르쳐 주셨습니다.","저는 김치를 자주 만듭니다.","김치 만들기는 쉬웠습니다.","저는 부모님께 김치를 보냈습니다."],"ans":1,"exp":"Đoạn văn nói \"한국 친구의 어머니께서 방법을 가르쳐 주셨습니다\" (mẹ của bạn Hàn đã dạy cách làm). Người viết làm lần đầu, thấy vất vả, và gửi ảnh chứ không gửi kimchi. Đáp án là ①.","vocab":[{"k":"방법","v":"cách, phương pháp"},{"k":"처음으로","v":"lần đầu tiên"}]}]},{"sec":"R","nums":[51,52],"passage":{"kind":"text","body":["경복궁은 서울에 있는 조선 시대의 궁입니다. 경복궁에서는 옛날 옷을 입은 사람들이 문을 지키는 행사를 볼 수 있습니다. 또 한복을 입고 가면 ( ㉠ ) 들어갈 수 있습니다. 그래서 한복을 입고 사진을 찍는 외국인 관광객이 많습니다. 경복궁은 매주 화요일에 쉽니다."]},"qs":[{"n":51,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["돈을 더 내고","밤에만","사진을 찍지 않고","돈을 내지 않고"],"ans":4,"exp":"Mặc hanbok thì có thể vào \"돈을 내지 않고\" (không phải trả tiền). Vì vậy nhiều du khách mặc hanbok đến chụp ảnh. Đáp án là ④.","vocab":[{"k":"궁","v":"cung điện"},{"k":"관광객","v":"khách du lịch"}]},{"n":52,"stem":"무엇에 대한 이야기인지 맞는 것을 고르십시오.","choices":["한복을 만드는 방법","경복궁 소개","서울의 교통","외국인 관광객의 쇼핑"],"ans":2,"exp":"Đoạn văn giới thiệu cung Gyeongbok: vị trí, sự kiện, vào cửa miễn phí khi mặc hanbok, ngày nghỉ. Đáp án là ②.","vocab":[{"k":"소개","v":"giới thiệu"},{"k":"지키다","v":"canh giữ"}]}]},{"sec":"R","nums":[53,54],"passage":{"kind":"text","body":["저는 작년 크리스마스를 한국에서 처음 보냈습니다. 베트남에 있는 가족이 보고 싶어서 조금 슬펐습니다. 그런데 한국 친구가 저를 자기 집에 ( ㉠ ). 친구의 가족과 같이 케이크를 먹고 선물도 받았습니다. 그날은 정말 따뜻한 크리스마스였습니다."]},"qs":[{"n":53,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["초대했습니다","청소했습니다","이사했습니다","팔았습니다"],"ans":1,"exp":"\"친구가 저를 자기 집에 초대했습니다\" (bạn đã mời tôi đến nhà), sau đó tôi ăn bánh với gia đình bạn. Đáp án là ①.","vocab":[{"k":"초대하다","v":"mời"},{"k":"슬프다","v":"buồn"}]},{"n":54,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 크리스마스를 베트남에서 보냈습니다.","저는 크리스마스에 혼자 있었습니다.","저는 친구 가족에게서 선물을 받았습니다.","친구가 저희 집에 왔습니다."],"ans":3,"exp":"Đoạn văn nói \"친구의 가족과 같이 케이크를 먹고 선물도 받았습니다\" (ăn bánh cùng gia đình bạn và cũng nhận được quà). Đáp án là ③.","vocab":[{"k":"따뜻하다","v":"ấm áp"},{"k":"받다","v":"nhận"}]}]},{"sec":"R","nums":[55,56],"passage":{"kind":"text","body":["요즘 한국에서는 배달 앱으로 음식을 주문하는 사람이 많습니다. 휴대폰으로 쉽게 주문할 수 있고, 밤늦게도 음식을 받을 수 있습니다. ( ㉠ ) 배달비가 비싸서 걱정하는 사람들도 있습니다. 그래서 가까운 가게에 직접 가서 음식을 가져오는 사람들도 늘고 있습니다. 이렇게 하면 배달비를 내지 않아도 됩니다."]},"qs":[{"n":55,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["그래서","그런데","그리고","그러면"],"ans":2,"exp":"Câu trước nói ưu điểm (tiện lợi), câu sau nói nhược điểm (phí giao hàng đắt), nên cần từ nối chỉ sự đối lập \"그런데\" (nhưng mà). Đáp án là ②.","vocab":[{"k":"배달비","v":"phí giao hàng"},{"k":"주문하다","v":"đặt hàng"}]},{"n":56,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["배달 앱으로는 밤에 주문할 수 없습니다.","배달비는 아주 쌉니다.","가게에 직접 가도 배달비를 내야 합니다.","배달 앱으로 음식을 시키는 사람이 많습니다."],"ans":4,"exp":"Câu đầu nói \"배달 앱으로 음식을 주문하는 사람이 많습니다\" (nhiều người đặt đồ ăn qua ứng dụng giao hàng). Đáp án là ④.","vocab":[{"k":"앱","v":"ứng dụng"},{"k":"늘다","v":"tăng lên"}]}]},{"sec":"R","nums":[57],"passage":{"kind":"text","body":["(가) 그래서 어제 안경점에 가서 눈 검사를 받았습니다.","(나) 요즘 칠판 글씨가 잘 보이지 않았습니다.","(다) 검사를 해 보니 눈이 많이 나빠졌습니다.","(라) 저는 바로 새 안경을 맞췄습니다."]},"qs":[{"n":57,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(가)-(다)-(라)","(나)-(다)-(가)-(라)","(가)-(나)-(라)-(다)","(가)-(다)-(나)-(라)"],"ans":1,"exp":"Trước tiên là lý do (나) không nhìn rõ chữ trên bảng → (가) \"그래서\" đi kiểm tra mắt → (다) kết quả mắt kém đi → (라) làm kính mới. Đáp án là ①.","vocab":[{"k":"칠판","v":"bảng đen"},{"k":"나빠지다","v":"trở nên xấu đi"}]}]},{"sec":"R","nums":[58],"passage":{"kind":"text","body":["(가) 지난주에 인터넷 쇼핑몰에서 가방을 샀습니다.","(나) 그래서 쇼핑몰에 전화해서 환불을 신청했습니다.","(다) 그런데 받은 가방은 사진보다 색이 어두웠습니다.","(라) 오늘 아침에 돈이 다시 들어왔습니다."]},"qs":[{"n":58,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(가)-(나)-(다)-(라)","(라)-(가)-(다)-(나)","(가)-(다)-(나)-(라)","(라)-(나)-(가)-(다)"],"ans":3,"exp":"(가) mua túi → (다) \"그런데\" túi nhận được màu tối hơn ảnh → (나) \"그래서\" gọi điện xin hoàn tiền → (라) sáng nay tiền đã được trả lại. Đáp án là ③.","vocab":[{"k":"어둡다","v":"tối"},{"k":"신청하다","v":"đăng ký, yêu cầu"}]}]},{"sec":"R","nums":[59,60],"passage":{"kind":"text","body":["이를 건강하게 지키려면 하루에 세 번 이를 닦아야 합니다. ( ㉠ ) 밥을 먹은 후에 3분 안에 닦는 것이 좋습니다. ( ㉡ ) 또 단 음식을 많이 먹지 않는 것이 좋습니다. ( ㉢ ) 그리고 이가 아프지 않아도 여섯 달에 한 번은 치과에 가는 것이 좋습니다. ( ㉣ ) 치과에서 검사를 받으면 문제를 빨리 찾을 수 있습니다."]},"qs":[{"n":59,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.","choices":["㉠","㉡","㉢","㉣"],"box":"사탕이나 초콜릿을 먹으면 이가 쉽게 상하기 때문입니다.","ans":3,"exp":"Câu cần chèn nói \"사탕이나 초콜릿을 먹으면 이가 쉽게 상하기 때문입니다\" (vì ăn kẹo, sô-cô-la thì răng dễ bị hỏng). Đây là lý do cho câu \"단 음식을 많이 먹지 않는 것이 좋습니다\" (không nên ăn nhiều đồ ngọt), nên đặt ở ㉢. Đáp án là ③.","vocab":[{"k":"상하다","v":"hỏng, sâu (răng)"},{"k":"사탕","v":"kẹo"}]},{"n":60,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["밥을 먹은 후에 빨리 이를 닦는 것이 좋습니다.","이가 아플 때만 치과에 가면 됩니다.","하루에 한 번 이를 닦으면 됩니다.","단 음식은 이에 좋습니다."],"ans":1,"exp":"Đoạn văn nói \"밥을 먹은 후에 3분 안에 닦는 것이 좋습니다\" (nên đánh răng trong vòng 3 phút sau khi ăn). Đáp án là ①.","vocab":[{"k":"닦다","v":"đánh (răng), lau"},{"k":"여섯 달","v":"sáu tháng"}]}]},{"sec":"R","nums":[61,62],"passage":{"kind":"text","body":["저는 주말마다 편의점에서 아르바이트를 합니다. 처음에는 물건 이름을 몰라서 실수를 많이 했습니다. 그때마다 사장님이 친절하게 ( ㉠ ). 지금은 일이 익숙해져서 혼자서도 잘할 수 있습니다. 아르바이트를 하면서 한국어 실력도 많이 늘었습니다. 다음 달부터는 평일 저녁에도 일하기로 했습니다."]},"qs":[{"n":61,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["화를 냈습니다","가르쳐 주셨습니다","물건을 사셨습니다","집에 가셨습니다"],"ans":2,"exp":"Mỗi khi tôi mắc lỗi, ông chủ \"친절하게 가르쳐 주셨습니다\" (đã tận tình chỉ dạy). \"친절하게\" không hợp với \"화를 냈습니다\" (nổi giận). Đáp án là ②.","vocab":[{"k":"실수","v":"lỗi, sai sót"},{"k":"익숙해지다","v":"trở nên quen"}]},{"n":62,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 평일에만 아르바이트를 합니다.","저는 처음부터 실수를 하지 않았습니다.","지금도 혼자서 일을 할 수 없습니다.","아르바이트를 하면서 한국어를 잘하게 되었습니다."],"ans":4,"exp":"Đoạn văn nói \"아르바이트를 하면서 한국어 실력도 많이 늘었습니다\" (vừa làm thêm vừa tiến bộ tiếng Hàn nhiều). Đáp án là ④.","vocab":[{"k":"실력","v":"năng lực, trình độ"},{"k":"평일","v":"ngày thường"}]}]},{"sec":"R","nums":[63,64],"passage":{"kind":"email","title":"12월 연주회 안내","body":["받는 사람: 학부모님들","보내는 사람: 해피 피아노 학원","안녕하세요. 해피 피아노 학원입니다.","12월 20일(토) 오후 3시에 학원 3층 강당에서 학생들의 크리스마스 연주회를 합니다.","학생들은 그동안 연습한 곡을 한 곡씩 연주할 예정입니다. 부모님과 가족분들도 오실 수 있습니다.","학생들은 준비를 위해 오후 2시까지 학원에 와 주십시오. 그리고 연주회 날에는 수업이 없습니다.","감사합니다."]},"qs":[{"n":63,"stem":"왜 윗글을 썼는지 맞는 것을 고르십시오.","choices":["연주회 날짜와 장소를 알려 주려고","새 수업 시간을 알려 주려고","학원 위치를 알려 주려고","학원비를 알려 주려고"],"ans":1,"exp":"Email có tiêu đề \"12월 연주회 안내\" và cho biết \"12월 20일(토) 오후 3시에 학원 3층 강당\" (ngày giờ và địa điểm buổi biểu diễn). Đáp án là ①.","vocab":[{"k":"학부모","v":"phụ huynh"},{"k":"강당","v":"hội trường"}]},{"n":64,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["연주회는 오후 2시에 시작합니다.","학생들만 연주회에 갈 수 있습니다.","연주회 날에는 수업을 하지 않습니다.","연주회는 학원 1층에서 합니다."],"ans":3,"exp":"Email ghi \"연주회 날에는 수업이 없습니다\" (ngày biểu diễn không có lớp học). Buổi biểu diễn bắt đầu 3 giờ, ở tầng 3, gia đình cũng đến được. Đáp án là ③.","vocab":[{"k":"곡","v":"bản nhạc"},{"k":"예정","v":"dự định"}]}]},{"sec":"R","nums":[65,66],"passage":{"kind":"text","body":["한국 사람들은 겨울이 오기 전에 많은 양의 김치를 한꺼번에 만듭니다. 이것을 '김장'이라고 합니다. 옛날에는 겨울에 채소를 구하기 어려웠기 때문에 겨울 동안 먹을 김치를 미리 ( ㉠ ). 김장은 혼자 하기 힘들어서 가족과 이웃이 모여서 같이 합니다. 김장이 끝나면 같이 음식을 먹으면서 이야기를 나눕니다. 요즘은 김치를 사 먹는 집도 많아졌지만 아직도 김장을 하는 집이 많습니다."]},"qs":[{"n":65,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["버렸습니다","만들어 두었습니다","팔러 갔습니다","먹어 보았습니다"],"ans":2,"exp":"Ngày xưa mùa đông khó kiếm rau nên người ta \"미리 만들어 두었습니다\" (làm sẵn từ trước) kimchi để ăn suốt mùa đông. Đáp án là ②.","vocab":[{"k":"김장","v":"làm kimchi cho mùa đông"},{"k":"미리","v":"trước"},{"k":"-아/어 두다","v":"làm sẵn"}]},{"n":66,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["김장은 여러 사람이 함께 합니다.","김장은 여름에 합니다.","요즘은 김장을 하는 집이 없습니다.","옛날에는 겨울에 채소가 많았습니다."],"ans":1,"exp":"Đoạn văn nói \"가족과 이웃이 모여서 같이 합니다\" (gia đình và hàng xóm tụ lại làm cùng nhau). Đáp án là ①.","vocab":[{"k":"이웃","v":"hàng xóm"},{"k":"한꺼번에","v":"cùng một lúc"}]}]},{"sec":"R","nums":[67,68],"passage":{"kind":"text","body":["안경을 오래 깨끗하게 쓰려면 관리를 잘해야 합니다. 안경을 옷으로 닦으면 렌즈에 흠이 생길 수 있습니다. 그래서 물로 먼저 씻은 후에 부드러운 천으로 닦는 것이 좋습니다. 또 뜨거운 곳에 안경을 두면 렌즈가 상할 수 있습니다. 특히 여름에는 자동차 안에 안경을 ( ㉠ ) 조심해야 합니다. 안경을 쓰지 않을 때는 꼭 안경집에 넣어 두십시오."]},"qs":[{"n":67,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["쓰고 운전하면","사지 않도록","닦지 않도록","두고 내리지 않도록"],"ans":4,"exp":"Để kính ở chỗ nóng thì tròng kính dễ hỏng, nên mùa hè phải cẩn thận \"두고 내리지 않도록\" (đừng để quên kính trong xe ô tô). Đáp án là ④.","vocab":[{"k":"관리","v":"bảo quản"},{"k":"흠","v":"vết xước"}]},{"n":68,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["안경은 옷으로 닦는 것이 좋습니다.","뜨거운 곳에 안경을 두어도 괜찮습니다.","안경을 물로 씻은 후에 닦는 것이 좋습니다.","안경을 쓰지 않을 때는 가방에 그냥 넣으면 됩니다."],"ans":3,"exp":"Đoạn văn nói \"물로 먼저 씻은 후에 부드러운 천으로 닦는 것이 좋습니다\" (nên rửa bằng nước trước rồi lau bằng vải mềm). Đáp án là ③.","vocab":[{"k":"부드럽다","v":"mềm"},{"k":"천","v":"vải"},{"k":"안경집","v":"hộp đựng kính"}]}]},{"sec":"R","nums":[69,70],"passage":{"kind":"text","body":["지난 1월 1일에 친구들과 동해 바닷가에 해돋이를 보러 갔습니다. 해가 뜨는 것을 보려고 새벽 네 시에 일어났습니다. 바닷가에는 벌써 사람들이 많이 와 있었습니다. 날씨가 너무 추워서 손과 발이 얼 것 같았습니다. 그런데 바다 위로 빨간 해가 떠오를 때 사람들이 모두 박수를 쳤습니다. 저도 해를 보면서 새해 소원을 빌었습니다. 추웠지만 ( ㉠ ) 내년에도 꼭 다시 오고 싶습니다."]},"qs":[{"n":69,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["정말 아름다운 모습이어서","너무 피곤해서","사람이 많아서","해를 못 봐서"],"ans":1,"exp":"\"추웠지만\" (tuy lạnh nhưng) cần một lý do tích cực để muốn quay lại: \"정말 아름다운 모습이어서\" (vì cảnh rất đẹp). Đáp án là ①.","vocab":[{"k":"해돋이","v":"bình minh, mặt trời mọc"},{"k":"떠오르다","v":"mọc lên"}]},{"n":70,"stem":"이 글의 내용으로 알 수 있는 것을 고르십시오.","choices":["저는 혼자 바닷가에 갔습니다.","바닷가에 사람이 별로 없었습니다.","저는 새해 소원을 빌었습니다.","그날은 날씨가 따뜻했습니다."],"ans":3,"exp":"Người viết nói \"저도 해를 보면서 새해 소원을 빌었습니다\" (tôi cũng vừa ngắm mặt trời vừa ước nguyện năm mới). Đi cùng bạn bè, bãi biển đông người, trời rất lạnh. Đáp án là ③.","vocab":[{"k":"소원을 빌다","v":"cầu ước"},{"k":"새벽","v":"rạng sáng"}]}]}]},{"test":10,"groups":[{"sec":"L","nums":[1],"audio":[{"s":"M","t":"내일 졸업식이에요?"}],"qs":[{"n":1,"stem":null,"choices":["네, 졸업식이 없어요.","네, 졸업식이에요.","아니요, 졸업식이 좋아요.","아니요, 졸업식에 가요."],"ans":2,"exp":"Câu hỏi \"졸업식이에요?\" (Có phải là lễ tốt nghiệp không?) nên trả lời \"네, 졸업식이에요\" (Vâng, là lễ tốt nghiệp). Đáp án đúng là ②.","vocab":[{"k":"졸업식","v":"lễ tốt nghiệp"},{"k":"내일","v":"ngày mai"}]}]},{"sec":"L","nums":[2],"audio":[{"s":"W","t":"도시락이 있어요?"}],"qs":[{"n":2,"stem":null,"choices":["네, 도시락이 아니에요.","아니요, 도시락이 싸요.","아니요, 도시락이 없어요.","아니요, 도시락을 먹어요."],"ans":3,"exp":"Câu hỏi \"도시락이 있어요?\" (Có cơm hộp không?) dùng 있다, nên câu trả lời phải dùng 있다/없다: \"아니요, 도시락이 없어요\" (Không, không có cơm hộp). Đáp án đúng là ③.","vocab":[{"k":"도시락","v":"cơm hộp"},{"k":"없다","v":"không có"}]}]},{"sec":"L","nums":[3],"audio":[{"s":"M","t":"야구장에 누구하고 갔어요?"}],"qs":[{"n":3,"stem":null,"choices":["친구하고 갔어요.","지난주에 갔어요.","버스로 갔어요.","야구장에 갔어요."],"ans":1,"exp":"Từ để hỏi \"누구하고\" (đi cùng với ai) nên câu trả lời phải nói về người: \"친구하고 갔어요\" (Tôi đi với bạn). Đáp án đúng là ①.","vocab":[{"k":"야구장","v":"sân bóng chày"},{"k":"누구하고","v":"với ai"}]}]},{"sec":"L","nums":[4],"audio":[{"s":"W","t":"잡채를 언제 만들었어요?"}],"qs":[{"n":4,"stem":null,"choices":["엄마가 만들었어요.","집에서 만들었어요.","두 번 만들었어요.","어제 만들었어요."],"ans":4,"exp":"Từ để hỏi \"언제\" (khi nào) nên phải trả lời về thời gian: \"어제 만들었어요\" (Tôi đã làm hôm qua). Đáp án đúng là ④.","vocab":[{"k": 0,"stem":null,"choices":["빵집","주민센터","극장","공원"],"ans":2,"exp":"Người đàn ông nói \"주소를 바꾸고 싶어요\" (Tôi muốn đổi địa chỉ) vì đã chuyển nhà. Việc này làm ở trung tâm hành chính phường. Đáp án đúng là ②.","vocab":[{"k":"이사","v":"chuyển nhà"},{"k":"주소","v":"địa chỉ"}]}]},{"sec":"L","nums":[11],"audio":[{"s":"M","t":"무슨 일을 하세요?"},{"s":"W","t":"저는 회사원이에요."}],"qs":[{"n":11,"stem":null,"choices":["나이","이름","취미","직업"],"ans":4,"exp":"\"무슨 일을 하세요?\" (Bạn làm nghề gì?) và \"회사원이에요\" (Tôi là nhân viên công ty) là nói về nghề nghiệp. Đáp án đúng là ④.","vocab":[{"k":"회사원","v":"nhân viên công ty"},{"k":"직업","v":"nghề nghiệp"}]}]},{"sec":"L","nums":[12],"audio":[{"s":"W","t":"내일 몇 시에 만나요?"},{"s":"M","t":"오후 세 시에 만나요."}],"qs":[{"n":12,"stem":null,"choices":["시간","장소","음식","요일"],"ans":1,"exp":"\"몇 시에 만나요?\" (Mấy giờ gặp nhau?) - \"세 시에 만나요\" (Gặp lúc 3 giờ) là nói về thời gian. Đáp án đúng là ①.","vocab":[{"k":"몇 시","v":"mấy giờ"},{"k":"시간","v":"thời gian"}]}]},{"sec":"L","nums":[13],"audio":[{"s":"M","t":"고향이 어디예요?"},{"s":"W","t":"베트남 하노이예요."}],"qs":[{"n":13,"stem":null,"choices":["가족","주말","고향","운동"],"ans":3,"exp":"\"고향이 어디예요?\" (Quê bạn ở đâu?) - \"하노이예요\" là nói về quê hương. Đáp án đúng là ③.","vocab":[{"k":"고향","v":"quê hương"}]}]},{"sec":"L","nums":[14],"audio":[{"s":"W","t":"잡채를 좋아해요?"},{"s":"M","t":"네, 저는 한국 음식 중에서 잡채가 제일 좋아요."}],"qs":[{"n":14,"stem":null,"choices":["쇼핑","음식","계획","선물"],"ans":2,"exp":"Hai người nói về món \"잡채\" và \"한국 음식 중에서 제일 좋아요\" (thích nhất trong các món Hàn). Chủ đề là món ăn. Đáp án đúng là ②.","vocab":[{"k":"음식","v":"món ăn"},{"k":"제일","v":"nhất"}]}]},{"sec":"L","nums":[15],"audio":[{"s":"M","t":"에어컨이 안 켜져요."},{"s":"W","t":"그래요? 제가 한번 볼게요."}],"qs":[{"n":15,"stem":null,"pics":[{"e":"👨❄️👩😴","c":"남자가 에어컨을 켜고 여자는 자고 있습니다."},{"e":"👩❄️💳🏬","c":"여자가 가게에서 에어컨을 사고 있습니다."},{"e":"👨🪟👩","c":"남자가 창문을 열고 여자는 앉아 있습니다."},{"e":"👨❄️👩‍🔧🔧","c":"여자가 에어컨을 보고 있고 남자가 옆에 서 있습니다."}],"ans":4,"exp":"Người đàn ông nói \"에어컨이 안 켜져요\" (Máy lạnh không bật được), người phụ nữ nói \"제 ,"qs":[{"n":19,"stem":null,"choices":["여자는 시장에서 양말을 샀습니다.","남자는 그 시장에 가 봤습니다.","여자는 혼자 시장에 갔습니다.","시장은 학교에서 걸어서 이십 분 걸립니다."],"ans":1,"exp":"Người phụ nữ nói \"떡볶이도 먹고 양말도 샀어요\" (Tôi ăn tteokbokki và mua cả tất). Cô ấy đi với bạn, đi xe buýt 20 phút. Đáp án đúng là ①.","vocab":[{"k":"전통 시장","v":"chợ truyền thống"},{"k":"양말","v":"tất, vớ"}]}]},{"sec":"L","nums":[20],"audio":[{"s":"W","t":"다음 달에 한강에서 걷기 대회가 있어요. 같이 나갈래요?"},{"s":"M","t":"좋아요. 몇 킬로미터를 걸어요?"},{"s":"W","t":"오 킬로미터예요. 신청은 이번 주까지 인터넷으로 해야 돼요."},{"s":"M","t":"그럼 제가 오늘 두 사람 다 신청할게요."}],"qs":[{"n":20,"stem":null,"choices":["걷기 대회는 이번 주에 합니다.","대회 신청은 전화로 합니다.","두 사람은 십 킬로미터를 걷습니다.","남자가 대회를 신청할 겁니다."],"ans":4,"exp":"Người đàn ông nói \"제가 오늘 두 사람 다 신청할게요\" (Hôm nay tôi sẽ đăng ký cho cả hai người). Cuộc thi vào tháng sau, đăng ký qua mạng, đi 5 km. Đáp án đúng là ④.","vocab":[{"k":"걷기 대회","v":"cuộc thi đi bộ"},{"k":"신청하다","v":"đăng ký"}]}]},{"sec":"L","nums":[21],"audio":[{"s":"M","t":"여보세요, 에어컨 수리 센터지요? 에어컨에서 찬 바람이 안 나와요."},{"s":"W","t":"네, 내일 오후 두 시에 기사님이 가실 수 있는데 괜찮으세요?"},{"s":"M","t":"내일은 제가 회사에 가야 해요. 토요일 오전은 어때요?"},{"s":"W","t":"네, 그럼 토요일 오전 열 시에 가겠습니다."}],"qs":[{"n":21,"stem":null,"choices":["남자는 에어컨을 새로 샀습니다.","남자는 내일 오후에 집에 있습니다.","기사는 토요일 오전에 남자 집에 갑니다.","에어컨에서 찬 바람이 잘 나옵니다."],"ans":3,"exp":"Người phụ nữ nói \"토요일 오전 열 시에 가겠습니다\" (Chúng tôi sẽ đến lúc 10 giờ sáng thứ Bảy). Ngày mai người đàn ông phải đi làm. Đáp án đúng là ③.","vocab":[{"k":"수리","v":"sửa chữa"},{"k":"기사","v":"thợ kỹ thuật"}]}]},{"sec":"L","nums":[22],"audio":[{"s":"M","t":"요즘 점심을 밖에서 사 먹으니까 돈이 많이 들어요."},{"s":"W","t":"저처럼 도시락을 싸 오세요. 돈도 아끼고 건강에도 좋아요."},{"s":"M","t":"아침에 시간이 없어서 힘들 것 같아요."},{"s":"W","t":"전날 저녁에 미리 준비하면 아침에는 오 분이면 돼요."}],"qs":[{"n":22,"stem":null,"choices":["점심은 사 먹는 것이 편합니다.","도시락을 싸 오는 것이 좋습니다.","아침에 일찍 일어나야 합니다.","저녁을 많이 먹으면 안 됩니다."],"ans":2,"exp":"Người phụ nữ khuyên \"도시락을 싸 오세요. 돈도 아끼고 건강에도 좋아요\" (Hãy mang cơm hộp, vừa tiết kiệm vừa tốt cho sức khỏe). Đáp án đúng là ②.","vocab":[{"k":"싸 오다","v":"gói mang theo"},{"k":"아끼다","v":"tiết kiệm"}]}]},{"sec":"L","nums":[23],"audio":[{"s":"M","t":"한국어를 더 배우고 싶은데 학원비가 너무 비싸요."},{"s":"W","t":"주민센터에 한국어 교실이 있어요. 거기는 무료예요."},{"s":"M","t":"그래요? 그런데 선생님이 잘 가르쳐요?"},{"s":"W","t":"네, 저도 거기에서 배웠어요. 비싼 학원에 안 가도 한국어를 잘 배울 수 있어요."}],"qs":[{"n":23,"stem":null,"choices":["학원에서 배우는 것이 제일 좋습니다.","한국어는 혼자 공부해야 합니다.","한국 친구를 많이 사귀어야 합니다.","주민센터에서도 한국어를 잘 배울 수 있습니다."],"ans":4,"exp":"Người phụ nữ nói \"비싼 학원에 안 가도 한국어를 잘 배울 수 있어요\" (Không cần đến trung tâm đắt tiền cũng học tốt tiếng Hàn được) ở lớp của trung tâm phường. Đáp án đúng là ④.","vocab":[{"k":"학원비","v":"học phí trung tâm"},{"k":"무료","v":"miễn phí"}]}]},{"sec":"L","nums":[24],"audio":[{"s":"M","t":"야구는 텔레비전으로 보는 게 더 편하지 않아요?"},{"s":"W","t":"야구장에 가서 직접 보면 훨씬 더 재미있어요."},{"s":"M","t":"그래도 사람이 많아서 복잡하잖아요."},{"s":"W","t":"사람들하고 같이 응원하면 스트레스가 다 풀려요. 꼭 한번 가 보세요."}],"qs":[{"n":24,"stem":null,"choices":["야구는 야구장에 가서 보는 것이 좋습니다.","야구는 텔레비전으로 보는 것이 편합니다.","사람이 많은 곳에 가면 안 됩니다.","스트레스를 받으면 운동을 해야 합니다."],"ans":1,"exp":"Người phụ nữ nói \"야구장에 가서 직접 보면 훨씬 더 재미있어요\" (Đến sân xem trực tiếp thì thú vị hơn nhiều). Đáp án đúng là ①.","vocab":[{"k":"직접","v":"trực tiếp"},{"k":"응원하다","v":"cổ vũ"}]}]},{"sec":"L","nums":[25,26],"audio":[{"s":"W","t":"안내 말씀 드리겠습니다. 이번 주 토요일 오전 아홉 시부터 한강 공원에서 걷기 대회가 열립니다. 참가하시는 분들은 여덟 시 반까지 공원 입구로 와 주십시오. 입구에서 번호표와 물을 드립니다. 대회가 끝나면 모든 참가자에게 작은 선물을 드립니다. 토요일에 비가 오면 대회는 다음 주 토요일로 바뀝니다."}],"qs":[{"n":25,"stem":"여자가 왜 이 이야기를 하고 있는지 고르십시오.","choices":["선물을 사려고","걷기 대회를 안내하려고","날씨를 알려 주려고","공원을 소개하려고"],"ans":2,"exp":"Người phụ nữ nói \"안내 말씀 드리겠습니다... 걷기 대회가 열립니다\" (Xin thông báo... sẽ tổ chức cuộc thi đi bộ) và hướng dẫn giờ tập trung, quà. Mục đích là hướng dẫn về cuộc thi. Đáp án đúng là ②.","vocab":[{"k":"안내","v":"hướng dẫn, thông báo"},{"k":"열리다","v":"được tổ chức"}]},{"n":26,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["대회는 오후 아홉 시에 시작합니다.","일 등을 한 사람만 선물을 받습니다.","비가 와도 대회는 그날 합니다.","참가자는 입구에서 물을 받습니다."],"ans":4,"exp":"Có câu \"입구에서 번호표와 물을 드립니다\" (Ở cổng sẽ phát số báo danh và nước). Cuộc thi nums":[41],"passage":{"kind":"notice","title":"행복동 주민센터 한국어 교실","body":["기간: 9월 1일 ~ 11월 30일","시간: 매주 화요일, 목요일 저녁 7시 ~ 9시","장소: 주민센터 3층","수업료: 무료 (책값 5,000원)","신청: 주민센터 1층 안내 데스크"]},"qs":[{"n":41,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["수업은 저녁에 합니다.","수업은 일주일에 세 번 있습니다.","책을 사려면 돈을 내야 합니다.","신청은 주민센터 1층에서 합니다."],"ans":2,"exp":"Lớp học vào \"매주 화요일, 목요일\" (thứ Ba và thứ Năm hằng tuần), tức 2 buổi một tuần, không phải 3 buổi. Đáp án đúng là ②.","vocab":[{"k":"수업료","v":"học phí"},{"k":"신청","v":"đăng ký"}]}]},{"sec":"R","nums":[42],"passage":{"kind":"notice","title":"야구 입장권","body":["한국 타이거즈 vs 서울 베어스","2026년 10월 3일(토) 오후 6시 30분","장소: 서울 야구장","좌석: 1루 응원석 15구역 7열 12번","가격: 15,000원","※ 경기 시작 1시간 전부터 들어갈 수 있습니다."]},"qs":[{"n":42,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["이 표는 만 오천 원입니다.","토요일 저녁에 경기를 합니다.","좌석 번호는 12번입니다.","오후 6시 30분부터 들어갈 수 있습니다."],"ans":4,"exp":"Trận đấu bắt đầu lúc 6 giờ 30 và \"경기 시작 1시간 전부터 들어갈 수 있습니다\" (được vào từ 1 tiếng trước), tức là từ 5 giờ 30. Đáp án đúng là ④.","vocab":[{"k":"입장권","v":"vé vào cửa"},{"k":"좌석","v":"chỗ ngồi"},{"k":"경기","v":"trận đấu"}]}]},{"sec":"R","nums":[43],"passage":{"kind":"text","body":["저는 어제 친구의 졸업식에 갔습니다. 꽃을 사서 친구에게 줬습니다. 졸업식이 끝나고 친구 가족과 같이 사진을 찍었습니다."]},"qs":[{"n":43,"stem":null,"choices":["저는 친구에게 꽃을 선물했습니다.","저는 어제 졸업했습니다.","친구가 저에게 꽃을 줬습니다.","저는 혼자 사진을 찍었습니다."],"ans":1,"exp":"Có câu \"꽃을 사서 친구에게 줬습니다\" (Tôi mua hoa rồi tặng bạn). Người tốt nghiệp là bạn, và tôi chụp ảnh cùng gia đình bạn. Đáp án đúng là ①.","vocab":[{"k":"졸업식","v":"lễ tốt nghiệp"},{"k":"사진을 찍다","v":"chụp ảnh"}]}]},{"sec":"R","nums":[44],"passage":{"kind":"text","body":["우리 집 근처에 도시락 가게가 새로 생겼습니다. 가게는 작지만 도시락이 싸고 맛있습니다. 그래서 저는 점심마다 거기에서 도시락을 삽니다."]},"qs":[{"n":44,"stem":null,"choices":["도시락 가게는 아주 큽니다.","그 가게 도시락은 비쌉니다.","저는 점심에 그 가게에서 도시락을 삽니다.","저는 도시락을 집에서 만듭니다."],"ans":3,"exp":"Có câu \"점심마다 거기에서 도시락을 삽니다\" (Trưa nào tôi cũng mua cơm hộp ở đó). Cửa hàng nhỏ, cơm hộp rẻ. Đáp án đúng là ③.","vocab":[{"k":"생기다","v":"mới mở, xuất hiện"},{"k":"근처","v":"gần đây"}]}]},{"sec":"R","nums":[45],"passage":{"kind":"text","body":["저는 매주 일요일에 공원에서 걷습니다. 한 시간쯤 걸으면 기분이 좋아집니다. 다음 달에는 동생도 같이 걸을 겁니다."]},"qs":[{"n":45,"stem":null,"choices":["저는 매일 공원에서 걷습니다.","저는 다음 달에 동생과 같이 걸을 겁니다.","저는 지금 동생과 매주 걷습니다.","저는 두 시간쯤 걷습니다."],"ans":2,"exp":"Có câu \"다음 달에는 동생도 같이 걸을 겁니다\" (Tháng sau em tôi cũng sẽ đi bộ cùng). Tôi đi bộ vào mỗi Chủ nhật, khoảng 1 tiếng. Đáp án đúng là ②.","vocab":[{"k":"걷다","v":"đi bộ"},{"k":"기분","v":"tâm trạng"}]}]},{"sec":"R","nums":[46],"passage":{"kind":"text","body":["저는 다음 주에 회사 면접이 있습니다. 그래서 요즘 매일 면접 연습을 합니다. 저는 꼭 이 회사에 들어가고 싶습니다."]},"qs":[{"n":46,"stem":null,"choices":["면접 연습은 재미있습니다.","회사에 다니는 것은 힘듭니다.","다음 주에 쉬고 싶습니다.","이 회사에 꼭 취직하고 싶습니다."],"ans":4,"exp":"Câu cuối \"꼭 이 회사에 들어가고 싶습니다\" (Tôi nhất định muốn vào công ty này) là ý chính. Đáp án đúng là ④.","vocab":[{"k":"들어가다","v":"vào (làm)"},{"k":"꼭","v":"nhất định"}]}]},{"sec":"R","nums":[47],"passage":{"kind":"text","body":["잡채는 만들기가 조금 어렵습니다. 그런데 어머니께서 가르쳐 주셔서 쉽게 만들었습니다. 다음에는 혼자 만들어 보고 싶습니다."]},"qs":[{"n":47,"stem":null,"choices":["잡채는 너무 어려운 음식입니다.","어머니가 잡채를 만들면 좋겠습니다.","잡채를 혼자 만들어 보고 싶습니다.","잡채보다 불고기가 더 좋습니다."],"ans":3,"exp":"Câu cuối \"다음에는 혼자 만들어 보고 싶습니다\" (Lần sau tôi muốn tự mình làm thử) là suy nghĩ chính. Đáp án đúng là ③.","vocab":[{"k":"혼자","v":"một mình"},{"k":"-아/어 보다","v":"thử làm"}]}]},{"sec":"R","nums":[48],"passage":{"kind":"text","body":["우리 동네 전통 시장은 물건값이 쌉니다. 그리고 가게 주인들이 아주 친절합니다. 그래서 저는 앞으로도 그 시장에 자주 가고 싶습니다."]},"qs":[{"n":48,"stem":null,"choices":["앞으로도 전통 시장에 자주 가고 싶습니다.","시장 물건이 더 싸면 좋겠습니다.","마트가 시장보다 편합니다.","가게 주인은 친절해야 합니다."],"ans":1,"exp":"Câu cuối \"앞으로도 그 시장에 자주 가고 싶습니다\" (Sau này tôi vẫn muốn thường xuyên đến chợ đó) là ý chính. Đáp án đúng là ①.","vocab":[{"k":"물건값","v":"giá hàng hóa"},{"k":"주인","v":"chủ (cửa hàng)"}]}]},{"sec":"R","nums":[49,50],"passage":{"kind":"text","body":["지난달에 고향 친구 란 씨가 한국에 놀러 왔습니다. 란 씨는 한국 음식을 좋아해서 우리는 매일 식당에 갔습니다. 마지막 날에는 란 씨에게 잡채를 만들어 주고 싶었습니다. 그런데 저는 잡채를 ( ㉠ ). 그래서 인터넷을 보면서 열심히 만들었습니다. 란 씨는 잡채를 먹고 아주 맛있다고 했습니다."]},"qs":[{"n":49,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["자주 만들었습니다","만들어 본 적이 없었습니다","잘 만들 수 있었습니다","먹고 싶지 않았습니다"],"ans":2,"exp":"Sau \"그런데\" (nhưng) là tình huống khó khăn, và câu sau \"인터넷을 보면서 열심히 만들었습니다\" (vừa xem mạng vừa làm chăm chỉ). Vậy trước đó tôi \"만들어 본 적이 없었습니다\" (chưa từng làm). Đáp án đúng là ②.","vocab":[{"k":"-(으)ㄴ 적이 없다","v":"chưa từng"},{"k":"마지막 날","v":"ngày cuối"}]},{"n":50,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["란 씨는 한국 음식을 싫어합니다.","우리는 매일 집에서 밥을 먹었습니다.","란 씨가 저에게 잡채를 만들어 줬습니다.","저는 인터넷을 보고 잡채를 만들었습니다."],"ans":4,"exp":"Có câu \"인터넷을 보면서 열심히 만들었습니다\" (Tôi vừa xem trên mạng vừa làm). Lan thích món Hàn, hai người ăn ở nhà hàng mỗi ngày, và tôi làm japchae cho Lan. Đáp án đúng là ④.","vocab":[{"k":"-(으)면서","v":"vừa... vừa"},{"k":"열심히","v":"chăm chỉ"}]}]},{"sec":"R","nums":[51,52],"passage":{"kind":"text","body":["주민센터는 동네 사람들을 위한 곳입니다. 이사를 하면 주민센터에 가서 새 주소를 알려야 합니다. 그리고 주민센터에서는 여러 가지 서류도 ( ㉠ ). 또 요리, 운동, 외국어 같은 수업도 있습니다. 수업료가 싸서 많은 사람들이 주민센터를 이용합니다."]},"qs":[{"n":51,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["받을 수 있습니다","보내지 않습니다","만들면 안 됩니다","잃어버렸습니다"],"ans":1,"exp":"Đoạn văn giới thiệu các việc có thể làm ở trung tâm phường, nên \"서류도 받을 수 있습니다\" (cũng có thể nhận các loại giấy tờ) là phù hợp. Đáp án đúng là ①.","vocab":[{"k":"서류","v":"giấy tờ"},{"k":"-(으)ㄹ 수 있다","v":"có thể"}]},{"n":52,"stem":"무엇에 대한 이야기인지 맞는 것을 고르십시오.","choices":["이사하는 방법","외국어를 배우는 이유","주민센터에서 하는 일","수업료를 내는 방법"],"ans":3,"exp":"Cả đoạn nói về những việc ở trung tâm phường: báo địa chỉ mới, nhận giấy tờ, các lớp học. Đáp án đúng là ③.","vocab":[{"k":"동네","v":"khu phố"},{"k":"이용하다","v":"sử dụng"}]}]},{"sec":"R","nums":[53,54],"passage":{"kind":"text","body":["저는 한국에 와서 처음으로 야구장에 갔습니다. 야구 규칙은 잘 몰랐지만 사람들과 같이 노래를 부르면서 응원했습니다. 야구장에서 먹은 치킨도 정말 맛있었습니다. 우리 팀이 경기에서 이겨서 ( ㉠ ). 다음에는 규칙을 공부하고 다시 가려고 합니다."]},"qs":[{"n":53,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["많이 슬펐습니다","기분이 아주 좋았습니다","집에 일찍 갔습니다","노래를 못 불렀습니다"],"ans":2,"exp":"Vì đội mình thắng \"우리 팀이 경기에서 이겨서\" nên \"기분이 아주 좋았습니다\" (tâm trạng rất vui). Đáp án đúng là ②.","vocab":[{"k":"이기다","v":"thắng"},{"k":"규칙","v":"luật, quy tắc"}]},{"n":54,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 야구 규칙을 잘 압니다.","저는 전에 야구장에 자주 갔습니다.","우리 팀이 경기에서 졌습니다.","저는 야구장에서 치킨을 먹었습니다."],"ans":4,"exp":"Có câu \"야구장에서 먹은 치킨도 정말 맛있었습니다\" (Gà rán ăn ở sân bóng chày cũng rất ngon). Tôi không rõ luật và đó là lần đầu đến sân. Đáp án đúng là ④.","vocab":[{"k":"처음으로","v":"lần đầu tiên"},{"k":"응원하다","v":"cổ vũ"}]}]},{"sec":"R","nums":[55,56],"passage":{"kind":"text","body":["요즘 도시락을 싸서 다니는 직장인이 많아졌습니다. 식당 음식값이 많이 올랐기 때문입니다. 도시락을 먹으면 돈을 아낄 수 있습니다. ( ㉠ ) 자기가 먹고 싶은 음식을 건강하게 만들어 먹을 수 있습니다. 그래서 주말에 일주일 동안 먹을 반찬을 미리 만드는 사람도 있습니다."]},"qs":[{"n":55,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["그리고","그런데","그러면","그래서"],"ans":1,"exp":"Câu trước nói ưu điểm tiết kiệm tiền, câu sau nói thêm ưu điểm ăn uống lành mạnh. Hai ý bổ sung cho nhau nên dùng \"그리고\" (và, thêm nữa). Đáp án đúng là ①.","vocab":[{"k":"그리고","v":"và, thêm nữa"},{"k":"직장인","v":"người đi làm"}]},{"n":56,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["직장인들은 도시락을 싫어합니다.","도시락을 먹으면 돈이 많이 듭니다.","음식값이 올라서 도시락을 싸는 사람이 늘었습니다.","반찬은 매일 아침에 만들어야 합니다."],"ans":3,"exp":"Có câu \"도시락을 싸서 다니는 직장인이 많아졌습니다. 식당 음식값이 많이 올랐기 때문입니다\" (Người mang cơm hộp nhiều lên vì giá đồ ăn ở quán tăng). Đáp án đúng là ③.","vocab":[{"k":"오르다","v":"tăng lên"},{"k":"반찬","v":"món ăn kèm"}]}]},{"sec":"R","nums":[57],"passage":{"kind":"text","body":["(가) 그래서 서비스 센터에 전화를 했습니다.","(나) 어제 우리 집 에어컨이 갑자기 고장 났습니다.","(다) 기사님이 금방 고쳐 주셔서 집이 다시 시원해졌습니다.","(라) 한 시간 후에 수리 기사님이 집에 오셨습니다."]},"qs":[{"n":57,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(라)-(가)-(다)","(나)-(가)-(라)-(다)","(가)-(나)-(다)-(라)","(가)-(라)-(나)-(다)"],"ans":2,"exp":"Đầu tiên máy lạnh hỏng (나), \"그래서\" gọi trung tâm bảo hành (가), 1 tiếng sau thợ đến (라), thợ sửa xong nên mát trở lại (다). Đáp án đúng là ②.","vocab":[{"k":"고치다","v":"sửa"},{"k":"갑자기","v":"đột nhiên"}]}]},{"sec":"R","nums":[58],"passage":{"kind":"text","body":["(가) 저는 친구와 같이 걷기 대회에 나가기로 했습니다.","(나) 그래서 대회 전까지 매일 저녁 공원에서 연습했습니다.","(다) 대회 날 우리는 10킬로미터를 끝까지 다 걸었습니다.","(라) 그런데 저는 오래 걸어 본 적이 없었습니다."]},"qs":[{"n":58,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(라)-(가)-(나)-(다)","(라)-(나)-(가)-(다)","(가)-(나)-(라)-(다)","(가)-(라)-(나)-(다)"],"ans":4,"exp":"Quyết định tham gia cuộc thi (가), \"그런데\" chưa từng đi bộ lâu (라), \"그래서\" luyện tập mỗi tối (나), ngày thi đi hết 10 km (다). Đáp án đúng là ④.","vocab":[{"k":"-기로 하다","v":"quyết định làm"},{"k":"끝까지","v":"đến cùng"}]}]},{"sec":"R","nums":[59,60],"passage":{"kind":"text","body":["오늘은 제 대학교 졸업식이었습니다. ( ㉠ ) 부모님께서 졸업식을 보시려고 베트남에서 한국까지 오셨습니다. ( ㉡ ) 졸업식 전에 저는 부모님께 학교 이곳저곳을 보여 드렸습니다. ( ㉢ ) 졸업식이 끝나고 우리는 같이 한국 식당에 갔습니다. ( ㉣ ) 부모님께서 한국 음식이 입에 잘 맞는다고 하셔서 정말 기뻤습니다."]},"qs":[{"n":59,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.","choices":["㉠","㉡","㉢","㉣"],"ans":3,"exp":"Câu cho sẵn nói bố mẹ rất vui khi xem thư viện và lớp học. Câu này phải đứng ngay sau \"학교 이곳저곳을 보여 드렸습니다\" (tôi dẫn bố mẹ đi xem khắp trường), tức là vị trí ㉢. Đáp án đúng là ③.","vocab":[{"k":"이곳저곳","v":"chỗ này chỗ kia"},{"k":"보여 드리다","v":"cho (người trên) xem"}],"box":"부모님께서는 제가 4년 동안 공부한 도서관과 교실을 보시고 아주 좋아하셨습니다."},{"n":60,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["부모님께서 졸업식에 오셨습니다.","저는 부모님과 베트남 식당에 갔습니다.","부모님은 한국에 살고 계십니다.","부모님께서 한국 음식을 싫어하셨습니다."],"ans":1,"exp":"Có câu \"부모님께서 졸업식을 보시려고 베트남에서 한국까지 오셨습니다\" (Bố mẹ từ Việt Nam sang Hàn để xem lễ tốt nghiệp). Đáp án đúng là ①.","vocab":[{"k":"-(으)려고","v":"để, định"},{"k":"입에 맞다","v":"hợp khẩu vị"}]}]},{"sec":"R","nums":[61,62],"passage":{"kind":"text","body":["저는 지난달에 여행사에 면접을 보러 갔습니다. 면접 전날 밤에 너무 긴장해서 잠을 잘 못 잤습니다. 면접에서 면접관이 한국어로 질문을 했는데 저는 대답을 잘하지 못했습니다. 그래서 떨어질 것 같았습니다. 그런데 일주일 후에 회사에서 ( ㉠ ) 전화가 왔습니다. 저는 다음 주부터 그 회사에 다니게 되었습니다."]},"qs":[{"n":61,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["떨어졌다는","면접을 다시 본다는","회사를 그만둔다는","합격했다는"],"ans":4,"exp":"\"그런데\" cho thấy kết quả trái với dự đoán bị trượt, và câu cuối nói \"다음 주부터 그 회사에 다니게 되었습니다\" (từ tuần sau sẽ đi làm ở công ty đó). Vậy đó là cuộc gọi báo \"합격했다는\" (đã đỗ). Đáp án đúng là ④.","vocab":[{"k":"합격하다","v":"đỗ, trúng tuyển"},{"k":"떨어지다","v":"trượt"}]},{"n":62,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 면접에서 대답을 잘했습니다.","저는 면접 전날 잠을 잘 자지 못했습니다.","저는 지난달부터 여행사에 다닙니다.","면접관은 영어로 질문했습니다."],"ans":2,"exp":"Có câu \"면접 전날 밤에 너무 긴장해서 잠을 잘 못 잤습니다\" (Đêm trước buổi phỏng vấn tôi quá hồi hộp nên không ngủ ngon). Đáp án đúng là ②.","vocab":[{"k":"긴장하다","v":"hồi hộp, căng thẳng"},{"k":"면접관","v":"người phỏng vấn"}]}]},{"sec":"R","nums":[63,64],"passage":{"kind":"email","title":"한국어 교실 수업 장소 변경 안내","body":["받는 사람: 한국어 교실 학생들","보내는 사람: 행복동 주민센터","안녕하세요. 행복동 주민센터입니다.","주민센터 3층 교실 공사 때문에 한국어 수업 장소가 바뀝니다.","10월 13일부터 수업은 주민센터 옆 도서관 2층에서 합니다.","수업 시간은 전과 같이 저녁 7시입니다.","공사는 한 달쯤 할 예정입니다. 감사합니다."]},"qs":[{"n":63,"stem":"왜 윗글을 썼는지 맞는 것을 고르십시오.","choices":["수업 장소 변경을 알려 주려고","수업 시간 변경을 알려 주려고","도서관 이용 방법을 알려 주려고","새 선생님을 소개하려고"],"ans":1,"exp":"Tiêu đề và nội dung nói \"한국어 수업 장소가 바뀝니다\" (Địa điểm lớp tiếng Hàn sẽ thay đổi). Giờ học vẫn như cũ. Đáp án đúng là ①.","vocab":[{"k":"변경","v":"thay đổi"},{"k":"장소","v":"địa điểm"}]},{"n":64,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["수업은 오전 7시에 시작합니다.","10월 13일부터 3층 교실에서 수업합니다.","공사는 한 달쯤 할 겁니다.","도서관은 주민센터에서 멉니다."],"ans":3,"exp":"Có câu \"공사는 한 달쯤 할 예정입니다\" (Công trình dự kiến kéo dài khoảng một tháng). Lớp học lúc 7 giờ tối, ở thư viện ngay bên cạnh. Đáp án đúng là ③.","vocab":[{"k":"공사","v":"công trình, thi công"},{"k":"예정","v":"dự định"}]}]},{"sec":"R","nums":[65,66],"passage":{"kind":"text","body":["잡채는 한국 사람들이 생일이나 명절 같은 특별한 날에 자주 먹는 음식입니다. 잡채에는 당면과 여러 가지 채소, 고기가 들어갑니다. 옛날에는 채소만 넣어서 만들었는데 지금처럼 당면을 넣은 것은 약 100년 전부터입니다. 잡채는 만드는 데 시간이 많이 ( ㉠ ) 손님에게 정성을 보여 주는 음식이 되었습니다. 요즘은 마트에서도 잡채를 쉽게 살 수 있습니다."]},"qs":[{"n":65,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["걸리지 않아서","걸리기 때문에","걸리려고","걸리면"],"ans":2,"exp":"Vì làm japchae mất nhiều thời gian nên nó trở thành món thể hiện tấm lòng với khách. Cần biểu hiện nguyên nhân \"-기 때문에\" (vì). Đáp án đúng là ②.","vocab":[{"k":"-기 때문에","v":"vì"},{"k":"정성","v":"tấm lòng, sự chu đáo"}]},{"n":66,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["잡채는 평일에만 먹습니다.","처음부터 잡채에 당면을 넣었습니다.","잡채는 마트에서 살 수 없습니다.","잡채에는 채소와 고기가 들어갑니다."],"ans":4,"exp":"Có câu \"잡채에는 당면과 여러 가지 채소, 고기가 들어갑니다\" (Japchae có miến, nhiều loại rau và thịt). Ngày xưa chỉ có rau, và nay mua được ở siêu thị. Đáp án đúng là ④.","vocab":[{"k":"명절","v":"ngày lễ tết"},{"k":"당면","v":"miến"}]}]},{"sec":"R","nums":[67,68],"passage":{"kind":"text","body":["여름에 에어컨을 오래 사용하면 전기 요금이 많이 나옵니다. 전기 요금을 줄이려면 에어컨 온도를 26도쯤으로 맞추는 것이 좋습니다. 그리고 선풍기를 같이 켜면 방이 더 빨리 시원해집니다. 또 에어컨 필터는 2주에 한 번 청소해야 합니다. 필터가 더러우면 에어컨이 ( ㉠ ) 고장이 나기 쉽습니다. 에어컨을 오래 쓰고 싶으면 이런 것들을 잘 지켜야 합니다."]},"qs":[{"n":67,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["더 시원해지고","소리가 작아지고","잘 작동하지 않고","전기를 덜 쓰고"],"ans":3,"exp":"Bộ lọc bẩn \"필터가 더러우면\" thì máy lạnh hoạt động kém và dễ hỏng. Chỉ có \"잘 작동하지 않고\" (không hoạt động tốt) mang nghĩa xấu phù hợp với \"고장이 나기 쉽습니다\". Đáp án đúng là ③.","vocab":[{"k":"작동하다","v":"hoạt động (máy)"},{"k":"더럽다","v":"bẩn"}]},{"n":68,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["선풍기를 같이 켜면 방이 빨리 시원해집니다.","에어컨 온도는 18도가 좋습니다.","필터는 1년에 한 번 청소하면 됩니다.","에어컨을 오래 사용하면 전기 요금이 적게 나옵니다."],"ans":1,"exp":"Có câu \"선풍기를 같이 켜면 방이 더 빨리 시원해집니다\" (Bật quạt cùng thì phòng mát nhanh hơn). Nhiệt độ nên khoảng 26 độ, lọc 2 tuần vệ sinh một lần. Đáp án đúng là ①.","vocab":[{"k":"전기 요금","v":"tiền điện"},{"k":"선풍기","v":"quạt máy"},{"k":"줄이다","v":"giảm"}]}]},{"sec":"R","nums":[69,70],"passage":{"kind":"text","body":["저는 작년까지 운동을 거의 하지 않았습니다. 회사 일이 바빠서 운동할 시간이 없다고 생각했습니다. 그러다가 올봄에 회사 동료가 걷기 대회에 같이 나가자고 했습니다. 처음에는 걱정이 됐지만 대회를 준비하는 동안 매일 퇴근 후에 30분씩 걸었습니다. 한 달쯤 지나니까 몸이 가벼워지고 잠도 잘 자게 되었습니다. 대회 날에는 10킬로미터를 쉬지 않고 걸을 수 있었습니다. 이제 저는 걷기가 ( ㉠ ) 대회가 끝난 후에도 매일 걷고 있습니다."]},"qs":[{"n":69,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["싫어져서","힘들어서","좋아져서","어려워서"],"ans":3,"exp":"Sau khi đi bộ, cơ thể nhẹ nhõm, ngủ ngon, nên dù cuộc thi kết thúc vẫn đi bộ mỗi ngày. Lý do phải là \"걷기가 좋아져서\" (vì đã thích đi bộ). Đáp án đúng là ③.","vocab":[{"k":"좋 /* ---------- Gate (PIN) ---------- */
const PIN_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4"; // sha256("1234")
async function sha(s){
  if (crypto?.subtle){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  return s === "1234" ? PIN_HASH : "";
}
function renderGate(){
  $("#app").innerHTML = `<div class="gate">
    <span class="hero" style="position:absolute;inset:0;border-radius:0" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></span>
    <form class="card" id="gform">
      <h1>TOPIK I 모의고사<span>Nhập mật khẩu để vào · 비밀번호를 입력하세요</span></h1>
      <div class="pin"><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" aria-label="Mật khẩu 4 số"></div>
      <p class="err" id="gerr"></p>
      <button class="btn primary" style="border-radius:12px;padding:12px">Vào học</button>
    </form>
  </div>`;
  const pin = $("#pin"); pin.focus();
  pin.oninput = () => { pin.value = pin.value.replace(/\D/g,"").slice(0,4); $("#gerr").textContent = ""; if (pin.value.length===4) check(); };
  async function check(){
    if (await sha(pin.value) === PIN_HASH){
      try{ localStorage.setItem(KEY+"-ok","1"); }catch(e){}
      renderHome();
    } else {
      $("#gerr").textContent = "Sai mật khẩu. Vui lòng thử lại.";
      const c = $("#gform"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
      pin.value = ""; pin.focus();
    }
  }
  $("#gform").onsubmit = e => { e.preventDefault(); check(); };
}

function qaReset(){ if (qaBtn){ qaBtn.classList.remove("on"); qaBtn.querySelector(".ql").textContent = "듣기"; } qaBtn = null; }

function playQ(btn, ti){
  const n0 = btn.dataset.q, sg = DATA.segs[ti]?.segs?.[n0]; if (!sg) return;
  if (qaBtn === btn && !qa.paused){ qa.pause(); return; }
  aud.pause(); qa.pause(); qaReset();
  const src = "audio/" + DATA.segs[ti].file;
  if (!qa.src.endsWith(src)){ qa.src = src; qa.preload = "auto"; }
  qaStop = sg.p1e;
  try{ qa.currentTime = sg.p1s; }catch(e){}
  if (qa.readyState < 1) qa.addEventListener("loadedmetadata", () => { if (Math.abs(qa.currentTime - sg.p1s) > 0.5) qa.currentTime = sg.p1s; }, {once:true});
  qa.play().catch(() => qaReset());
  qaBtn = btn; btn.classList.add("on"); btn.querySelector(".ql").textContent = "Đang phát";
  const c = btn.querySelector(".qc"); c.textContent = "×" + (+(c.dataset.n || 0) + 1); c.dataset.n = +(c.dataset.n||0) + 1;
}

  <div class="wrap exam">
    <main class="paper" id="paper">
      <div class="sec-title"><h2>${sec==="L" ? "TOPIK Ⅰ 듣기 (1번 ~ 30번)" : "TOPIK Ⅰ 읽기 (31번 ~ 70번)"}</h2><span>${sec==="L" ? "Mỗi câu được đọc 2 lần" : ""}</span></div>
      ${groups.map(g => renderGroup(g, sec, s.ans)).join("")}
      <div class="nav-sec"><button class="btn primary" id="next2">${sec==="L" && s.mode==="full" ? "Sang phần Đọc →" : "Nộp bài"}</button></div>
    </main>
    <aside class="omr" id="omr" aria-label="Phiếu trả lời">
      <div class="omr-h" id="omrh"><b>답안지 · Phiếu trả lời</b><span><span class="num" id="cnt"></span> <span class="omr-toggle">▴</span></span></div>
      <div class="omr-grid">${nums.map(n => `<div class="omr-row"><button class="on num" data-go="${n}">${n}</button>${[1,2,3,4].map(k=>`<button class="bub${s.ans[n]===k?" f":""}" data-b="${n}-${k}" aria-label="Câu ${n} đáp án ${k}">${k}</button>`).join("")}</div>`).join("")}</div>
      <div class="omr-f"><button class="btn primary" id="next3">${sec==="L" && s.mode==="full" ? "Sang phần Đọc" : "Nộp bài"}</button></div>
    </aside>
  </div>`;
  updCount(nums);
  $("#paper").onclick = e => {
    const pq = e.target.closest("[data-q]"); if (pq) return playQ(pq, s.t);
    const b = e.target.closest("[data-c]"); if (!b) return;
    const [n,k] = b.dataset.c.split("-").map(Number); choose(n,k,nums);
  };
  $("#omr").onclick = e => {
    const b = e.target.closest("[data-b]");
    if (b){ const [n,k] = b.dataset.b.split("-").map(Number); choose(n,k,nums); return; }
    const g = e.target.closest("[data-go]");
    if (g){ document.getElementById("q"+g.dataset.go)?.scrollIntoView({behavior:"smooth",block:"start"}); $("#omr").classList.remove("open"); return; }
    if (e.target.closest("#omrh") && innerWidth<=960) $("#omr").classList.toggle("open");
  };
  const advance = () => {
    const un = nums.filter(n => !s.ans[n]).length;
    const msg = sec==="L" && s.mode==="full"
      ? `Chuyển sang phần Đọc? Bạn sẽ không quay lại phần Nghe được.${un?`\nCòn ${un} câu chưa trả lời.`:""}`
      : `Nộp bài và chấm điểm?${un?`\nCòn ${un} câu chưa trả lời.`:""}`;
    if (confirm(msg)) finishSection();
  };
  $("#next").onclick = $("#next2").onclick = $("#next3").onclick = advance;
  $("#exit").onclick = () => { save(); renderHome(); };
  if (sec==="L") setupPlayer(segs, groups);
  lastTick = Date.now(); stopClock();
  clock = setInterval(tick, 250);
  scrollTo(0,0);
}

function renderGroup(g, sec, ans){
  const n0 = g.nums[0], ins = INSTR[n0];
  let h = "";
  if (ins) h += `<div class="instr">※ [${ins.r}] ${esc(ins.ko)}<span class="vi">${esc(ins.vi)}</span></div>${ins.bogi?`<div class="bogi">${esc(ins.bogi)}</div>`:""}`;
  if (g.passage) h += renderPassage(g.passage);
  if (sec==="L" && g.nums.length>1) h += `<div class="listen-note">🎧 Nghe đoạn hội thoại/bài nói rồi trả lời câu ${g.nums.join(", ")}</div>`;
  for (const q of g.qs) h += renderQ(q, ans?.[q.n], null, n0);
  return `<section class="grp" data-g="${n0}">${h}</section>`;
}
function renderPassage(p){
  if (p.kind==="notice") return `<div class="psg notice">${p.title?`<h4>${esc(p.title)}</h4>`:""}${p.body.map(l=>`<p>${deco(l)}</p>`).join("")}</div>`;
  if (p.kind==="email"){
    const head = p.body.filter(l => /^(받는 사람|보내는 사람|제목)\s*:/.test(l));
    const body = p.body.filter(l => !head.includes(l));
    return `<div class="psg email"><div class="eh">${p.title?`<b>${esc(p.title)}</b>`:""}${head.map(l=>`<span>${esc(l)}</span>`).join("")}</div><div class="eb">${body.map(l=>`<p>${deco(l)}</p>`).join("")}</div></div>`;
  }
  return `<div class="psg">${p.body.map(l=>`<p>${deco(l)}</p>`).join("")}</div>`;
}
function choiceClass(q){
  const L = Math.max(...(q.choices||[]).map(c => c.length));
  return L <= 7 ? "short" : L <= 18 ? "long" : "xl";
}
function renderQ(q, picked, correct, n0){
  const cls = k => correct==null ? (picked===k?" sel":"") : (k===correct?" right":(picked===k?" wrong":""));
  const dis = correct!=null ? " disabled" : "";
  let h = `<div class="q" id="q${q.n}"><div class="q-stem"><span class="qn num">${q.n}.</span><span>${q.n<=30 && n0 ? `<button class="qplay" data-q="${n0}" aria-label="Nghe câu ${q.n}">${ICON.play}<span class="ql">듣기</span> <span class="qc"></span></button> ` : ""}${q.stem?deco(q.stem):""}${q.stem?` <span class="num" style="font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink-3)">(${PTS[q.n]}점)</span>`:`<span class="num" style="font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink-3)">(${PTS[q.n]}점)</span>`}</span></div>`;
  if (q.box) h += `<div class="box">${deco(q.box)}</div>`;
  if (q.pics) h += `<div class="pics">${q.pics.map((p,i)=>`<button class="pic${cls(i+1)}" data-c="${q.n}-${i+1}"${dis}><span class="ch" style="padding:0;border:0;background:none"><span class="mk">${i+1}</span></span><span class="emo" aria-hidden="true">${esc(p.e)}</span><span class="cap">${esc(p.c)}</span></button>`).join("")}</div>`;
  else h += `<div class="choices ${choiceClass(q)}">${q.choices.map((c,i)=>`<button class="ch${cls(i+1)}" data-c="${q.n}-${i+1}"${dis}><span class="mk">${i+1}</span><span>${deco(c)}</span></button>`).join("")}</div>`;
  return h + `</div>`;
}

function choose(n,k,nums){
  const s = store.session; s.ans[n] = s.ans[n]===k ? undefined : k; if (s.ans[n]===undefined) delete s.ans[n];
  document.querySelectorAll(`[data-c^="${n}-"]`).forEach(b => b.classList.toggle("sel", +b.dataset.c.split("-")[1]===s.ans[n]));
  document.querySelectorAll(`[data-b^="${n}-"]`).forEach(b => b.classList.toggle("f", +b.dataset.b.split("-")[1]===s.ans[n]));
  updCount(nums); save();
}
function updCount(nums){ const s = store.session; $("#cnt").textContent = `${nums.filter(n=>s.ans[n]).length}/${nums.length}`; }

function tick(){
  const s = store.session; if (!s) return stopClock();
  const now = Date.now(), dt = (now - lastTick)/1000; lastTick = now;
  s.left[s.sec] = Math.max(0, s.left[s.sec] - dt);
  const left = s.left[s.sec];
  $("#ctime").textContent = fmt(left);
  $("#tbar").style.width = (100*left/TIME[s.sec]) + "%";
  $("#clock").classList.toggle("low", left <= 300);
  if (Math.floor(left) % 5 === 0) save();
  if (left <= 0){ stopClock(); alert(s.sec==="L" && s.mode==="full" ? "Hết giờ phần Nghe. Chuyển sang phần Đọc." : "Hết giờ! Bài làm được nộp tự động."); finishSection(); }
}

function setupPlayer(segs, groups){
  const s = store.session;
  if (!segs){ $("#pnow").textContent = "Không tìm thấy file nghe"; return; }
  aud.src = "audio/" + segs.file; aud.onended = null;
  const starts = groups.map(g => ({n:g.nums[0], nums:g.nums, ...segs.segs[g.nums[0]]}));
  const setIcon = () => $("#play").innerHTML = aud.paused ? ICON.play : ICON.pause;
  aud.addEventListener("loadedmetadata", () => { if (s.audioPos) aud.currentTime = s.audioPos; }, {once:true});
  $("#play").onclick = () => { if (aud.paused){ qa.pause(); aud.play().catch(()=>{}); } else aud.pause(); };
  aud.onplay = aud.onpause = setIcon;
  let cur = null;
  aud.ontimeupdate = () => {
    if (store.session?.sec !== "L") return;
    const t = aud.currentTime; s.audioPos = t;
    $("#ptime").textContent = `${fmt(t)} / ${fmt(segs.duration)}`;
    $("#pbar").style.width = (100*t/segs.duration)+"%";
    const g = [...starts].reverse().find(x => t >= x.start - 0.2);
    const label = !g ? "Hướng dẫn chung" : t > g.end ? `Câu ${g.nums.join("–")} · thời gian trả lời` : `Đang nghe câu ${g.nums.join("–")} · ${t < g.p2s ? "lần 1" : "lần 2"}`;
    $("#pnow").textContent = label;
    const n = g?.n ?? null;
    if (n !== cur){
      document.querySelectorAll(".q.live").forEach(e => e.classList.remove("live"));
      if (n){ g.nums.forEach(x => document.getElementById("q"+x)?.classList.add("live"));
        if ($("#follow")?.checked) document.querySelector(`[data-g="${n}"]`)?.scrollIntoView({behavior:"smooth",block:"start"}); }
      cur = n;
    }
  };
  aud.onended = () => { $("#pnow").textContent = "File nghe đã kết thúc · kiểm tra lại đáp án"; setIcon(); };
}

function finishSection(){
  const s = store.session; stopClock(); aud.pause(); qa.pause();
  if (s.sec==="L" && s.mode==="full"){ s.sec = "R"; save(); return enterSection(); }
  const t = test(s.t), score = {L:0,R:0};
  for (const q of allQs(t)) if (s.ans[q.n]===q.ans) score[secOf(q.n)] += PTS[q.n];
  store.results[s.t] = {mode:s.mode, L:score.L, R:score.R, ans:s.ans, at:Date.now()};
  store.session = null; save();
  renderResults(s.t);
}

/* ---------- Results ---------- */
let rvFilter = "all";
function renderResults(i){
  stopClock(); aud.pause();
  const r = store.results[i], t = test(i), segs = DATA.segs[i];
  const qs = allQs(t).filter(q => r.mode==="full" || secOf(q.n)===r.mode);
  const right = qs.filter(q => r.ans[q.n]===q.ans).length;
  const full = r.mode==="full", total = r.L + r.R, lv = level(total);
  $("#app").innerHTML = `
  <div class="bar"><div class="wrap">
    <div class="t-name"><b>제${i+1}회 · Kết quả</b>TOPIK I 실전 모의고사</div>
    <div class="clock"><div class="c-lbl">Đúng</div><div class="c-time num">${right}/${qs.length}</div></div>
    <div class="b-act"><button class="btn" id="home">Danh sách đề</button><button class="btn primary" id="again">Làm lại</button></div>
  </div></div>
  <div class="wrap">
    <section class="res-head">
      <div class="scorecard">
        <div>
          <div class="eyebrow">${full ? "Tổng điểm" : r.mode==="L" ? "Điểm phần Nghe" : "Điểm phần Đọc"}</div>
          <div class="total num">${full ? total : (r.mode==="L" ? r.L : r.R)}<small>/${full?200:100}</small></div>
          ${full ? `<div class="verdict"><span class="pill ${lv.c}">${lv.t}</span></div>` : `<div class="verdict"><span class="pill">Làm cả 2 phần để xét cấp</span></div>`}
        </div>
        <div class="bars">
          ${["L","R"].filter(k => full || r.mode===k).map(k => `<div class="sb"><div class="sb-top"><span>${k==="L"?"듣기 · Nghe":"읽기 · Đọc"}</span><b>${r[k]} / 100</b></div><div class="sb-track"><i style="width:${r[k]}%"></i></div></div>`).join("")}
          ${full ? `<div><div class="sb-top" style="display:flex;justify-content:space-between;font-size:13.5px"><span>Thang xét cấp (200)</span><span class="num">${total}</span></div>
            <div class="scale"><div class="scale-track"></div><span class="tick" style="left:0%;transform:none">0</span><span class="tick" style="left:40%">80 · 1급</span><span class="tick" style="left:70%">140 · 2급</span><span class="tick" style="left:100%;transform:translateX(-100%)">200</span><span class="me" style="left:${total/2}%"></span></div></div>` : ""}
        </div>
      </div>
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0;font-family:var(--serif);font-size:22px">Xem lại & giải thích</h2>
        <div class="filters" role="group" aria-label="Lọc câu hỏi">
          <button class="btn" data-f="all" aria-pressed="${rvFilter==="all"}">Tất cả</button>
          <button class="btn" data-f="wrong" aria-pressed="${rvFilter==="wrong"}">Câu sai (${qs.length-right})</button>
        </div>
      </div>
    </section>
    <section class="rv-list" id="rv"></section>
  </div>`;
  const draw = () => {
    const shown = new Set();
    $("#rv").innerHTML = t.groups.filter(g => full || g.sec===r.mode).map(g => {
      const gq = g.qs.filter(q => rvFilter==="all" || r.ans[q.n]!==q.ans);
      if (!gq.length) return "";
      const n0 = g.nums[0], sg = segs?.segs?.[n0];
      return `<article class="rv">
        <div class="rv-h"><b>${g.nums.length>1?`Câu ${g.nums.join("–")}`:`Câu ${n0}`} · ${g.sec==="L"?"듣기":"읽기"}</b>
          </div>
        ${g.sec==="L" ? `<div class="script">${g.audio.map(l=>`<div><span class="sp">${l.s==="M"?"남자":"여자"}</span>${esc(l.t)}</div>`).join("")}</div>` : ""}
        <div class="serifblock">${g.passage ? renderPassage(g.passage) : ""}
        ${gq.map(q => renderQ(q, r.ans[q.n], q.ans, n0) + `
          <div class="exp"><b>${r.ans[q.n]===q.ans ? "✓ Đúng" : r.ans[q.n] ? `✗ Bạn chọn ${MK[r.ans[q.n]-1]}` : "— Chưa trả lời"} · Đáp án ${MK[q.ans-1]}</b><br>${esc(q.exp)}</div>
          ${q.vocab?.length ? `<div class="vocab">${q.vocab.map(v=>`<span><b>${esc(v.k)}</b>${esc(v.v)}</span>`).join("")}</div>` : ""}`).join("")}
        </div>
      </article>`;
    }).join("") || `<p style="text-align:center;color:var(--ink-3)">Không có câu sai. Xuất sắc!</p>`;
  };
  draw();
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { rvFilter = b.dataset.f; document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x===b)); draw(); });
  $("#home").onclick = renderHome;
  $("#again").onclick = () => openDialog(i);
  $("#rv").onclick = e => { const pq = e.target.closest("[data-q]"); if (pq) playQ(pq, i); };
  scrollTo(0,0);
}

aud = document.getElementById("aud");
unlocked() ? renderHome() : renderGate();
</script>

</body>
</html>
