은 내용과 같은 것을 고르십시오.","choices":["여자는 회사 근처에 삽니다.","여자는 버스로 출근합니다.","여자는 다음 달에 이사할 겁니다.","회사 사람들이 친절하지 않습니다."],"ans":3,"exp":"Người phụ nữ nói \"다음 달에 회사 근처로 이사하기로 했어요\" (Tôi đã quyết định tháng sau chuyển đến gần công ty). Cô ấy đi làm bằng tàu điện ngầm. Đáp án là ③.","vocab":[{"k":"이사하다","v":"chuyển nhà"},{"k":"-기로 하다","v":"quyết định làm gì"}]}]},{"sec":"L","nums":[29,30],"audio":[{"s":"W","t":"선생님, 테니스는 언제 처음 시작하셨어요?"},{"s":"M","t":"초등학교 때 시작했어요. 그때 저는 몸이 약해서 자주 아팠어요."},{"s":"W","t":"그래서 테니스를 치게 되셨어요?"},{"s":"M","t":"네, 의사 선생님이 운동을 하라고 하셨어요. 아버지가 테니스를 좋아하셔서 아버지와 같이 치기 시작했어요."},{"s":"W","t":"지금은 아이들에게 테니스를 가르치고 계시지요?"},{"s":"M","t":"네, 주말마다 공원에서 무료로 가르치고 있어요. 아이들이 즐겁게 운동하는 모습을 보면 정말 행복해요."}],"qs":[{"n":29,"stem":"남자가 왜 테니스를 시작했는지 고르십시오.","choices":["건강해지고 싶어서","테니스 선수가 되고 싶어서","친구들이 모두 테니스를 쳐서","학교에서 배워야 해서"],"ans":1,"exp":"Người đàn ông nói \"몸이 약해서 자주 아팠어요\" (Tôi yếu nên hay ốm) và bác sĩ khuyên tập thể dục. Anh ấy bắt đầu chơi quần vợt để khỏe hơn. Đáp án là ①.","vocab":[{"k":"약하다","v":"yếu"},{"k":"-게 되다","v":"trở nên, được (làm gì)"}]},{"n":30,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["남자는 대학교 때 테니스를 시작했습니다.","남자는 어머니와 테니스를 쳤습니다.","남자는 평일에 아이들을 가르칩니다.","남자는 아이들에게 돈을 받지 않습니다."],"ans":4,"exp":"Người đàn ông nói \"주말마다 공원에서 무료로 가르치고 있어요\" (Tôi dạy miễn phí ở công viên vào mỗi cuối tuần), tức là không nhận tiền. Anh ấy bắt đầu từ tiểu học và chơi cùng bố. Đáp án là ④.","vocab":[{"k":"무료로","v":"miễn phí"},{"k":"가르치다","v":"dạy"},{"k":"주말마다","v":"mỗi cuối tuần"}]}]},{"sec":"R","nums":[31],"passage":{"kind":"text","body":["저는 수영을 합니다. 형은 테니스를 칩니다."]},"qs":[{"n":31,"stem":null,"choices":["가족","날짜","운동","계절"],"ans":3,"exp":"Đoạn văn nói về \"수영\" (bơi) và \"테니스\" (quần vợt) – đều là môn thể thao. Chủ đề là thể thao (운동), đáp án ③.","vocab":[{"k":"형","v":"anh trai (nam gọi)"},{"k":"운동","v":"thể thao"}]}]},{"sec":"R","nums":[32],"passage":{"kind":"text","body":["여름에는 덥습니다. 겨울에는 춥습니다."]},"qs":[{"n":32,"stem":null,"choices":["계절","요일","나라","가게"],"ans":1,"exp":"\"여름\" (mùa hè) và \"겨울\" (mùa đông) là các mùa. Chủ đề là mùa (계절), đáp án ①.","vocab":[{"k":"계절","v":"mùa"},{"k":"덥다","v":"nóng"},{"k":"춥다","v":"lạnh"}]}]},{"sec":"R","nums":[33],"passage":{"kind":"text","body":["사과는 삼천 원입니다. 딸기는 오천 원입니다."]},"qs":[{"n":33,"stem":null,"choices":["공부","값","장소","맛"],"ans":2,"exp":"\"삼천 원\" (3.000 won), \"오천 원\" (5.000 won) là giá cả. Chủ đề là giá (값), đáp án ②.","vocab":[{"k":"값","v":"giá"},{"k":"원","v":"won (tiền Hàn)"}]}]},{"sec":"R","nums":[34],"passage":{"kind":"text","body":["저는 우체국에 갑니다. 우체국(    ) 소포를 보냅니다."]},"qs":[{"n":34,"stem":null,"choices":["이","을","와","에서"],"ans":4,"exp":"Gửi bưu kiện là hành động diễn ra tại bưu điện, nên dùng trợ từ nơi chốn hành động \"에서\": \"우체국에서 소포를 보냅니다\". Đáp án ④.","vocab":[{"k":"에서","v":"ở, tại (nơi diễn ra hành động)"},{"k":"소포","v":"bưu kiện"}]}]},{"sec":"R","nums":[35],"passage":{"kind":"text","body":["머리가 아픕니다. 그래서 (    )에 갑니다."]},"qs":[{"n":35,"stem":null,"choices":["병원","극장","서점","공원"],"ans":1,"exp":"\"머리가 아픕니다\" (đau đầu) nên phải đi bệnh viện (병원). Đáp án ①.","vocab":[{"k":"머리","v":"đầu"},{"k":"병원","v":"bệnh viện"}]}]},{"sec":"R","nums":[36],"passage":{"kind":"text","body":["친구에게 편지를 보냅니다. 봉투에 (    )를 붙입니다."]},"qs":[{"n":36,"stem":null,"choices":["우산","모자","우표","의자"],"ans":3,"exp":"Khi gửi thư, ta dán tem (우표) lên phong bì: \"봉투에 우표를 붙입니다\". Đáp án ③.","vocab":[{"k":"우표","v":"tem"},{"k":"봉투","v":"phong bì"},{"k":"붙이다","v":"dán"}]}]},{"sec":"R","nums":[37],"passage":{"kind":"text","body":["시장에 갑니다. 채소와 과일을 (    )."]},"qs":[{"n":37,"stem":null,"choices":["읽습니다","삽니다","만듭니다","가르칩니다"],"ans":2,"exp":"Đi chợ để mua rau và hoa quả: \"채소와 과일을 삽니다\" (mua rau và hoa quả). Đáp án ②.","vocab":[{"k":"채소","v":"rau"},{"k":"과일","v":"hoa quả"},{"k":"사다","v":"mua"}]}]},{"sec":"R","nums":[38],"passage":{"kind":"text","body":["동생은 키가 작습니다. 저는 키가 (    )."]},"qs":[{"n":38,"stem":null,"choices":["좁습니다","많습니다","짧습니다","큽니다"],"ans":4,"exp":"Trái nghĩa với \"키가 작다\" (thấp) là \"키가 크다\" (cao). Đáp án ④.","vocab":[{"k":"키","v":"chiều cao"},{"k":"작다","v":"nhỏ, thấp"},{"k":"크다","v":"to, cao"}]}]},{"sec":"R","nums":[39],"passage":{"kind":"text","body":["감기에 걸렸습니다. 약을 먹고 (    ) 잤습니다."]},"qs":[{"n":39,"stem":null,"choices":["일찍","자주","아주","모두"],"ans":1,"exp":"Bị cảm nên uống thuốc rồi đi ngủ sớm: \"일찍 잤습니다\". \"일찍\" nghĩa là sớm. Đáp án ①.","vocab":[{"k":"일찍","v":"sớm"},{"k":"약을 먹다","v":"uống thuốc"}]}]},{"sec":"R","nums":[40],"passage":{"kind":"notice","title":"여름 수영 교실","body":["기간: 7월 1일 ~ 7월 31일","시간: 월·수·금 오전 7시 ~ 8시","장소: 한국구민체육센터 수영장","요금: 한 달 50,000원","※ 수영 모자를 꼭 가져오세요."]},"qs":[{"n":40,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["수영 교실은 한 달 동안 합니다.","일주일에 세 번 수업이 있습니다.","수업은 저녁에 합니다.","수영 모자가 필요합니다."],"ans":3,"exp":"Giờ học là \"오전 7시 ~ 8시\" (7–8 giờ sáng), không phải buổi tối. Vậy câu ③ sai với thông báo, đáp án là ③.","vocab":[{"k":"오전","v":"buổi sáng"},{"k":"요금","v":"phí"},{"k":"기간","v":"thời gian, thời hạn"}]}]},{"sec":"R","nums":[41],"passage":{"kind":"notice","title":"행복약국","body":["이름: 응우옌 티 란","감기약 (3일분)","하루 3번, 식사 30분 후에 드세요.","약값: 4,500원"]},"qs":[{"n":41,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["이 약은 감기약입니다.","약은 밥을 먹기 전에 먹습니다.","약값은 사천오백 원입니다.","하루에 세 번 먹어야 합니다."],"ans":2,"exp":"Túi thuốc ghi \"식사 30분 후에 드세요\" (uống sau bữa ăn 30 phút), không phải trước bữa ăn. Câu ② sai, đáp án là ②.","vocab":[{"k":"식사","v":"bữa ăn"},{"k":"후","v":"sau"},{"k":"약값","v":"tiền thuốc"}]}]},{"sec":"R","nums":[42],"passage":{"kind":"notice","title":"초대합니다","body":["민지의 생일 파티에 오세요!","날짜: 8월 15일(토) 저녁 6시","장소: 민지네 집 (한국아파트 101동 502호)","※ 선물은 가져오지 마세요."]},"qs":[{"n":42,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["토요일에 파티를 합니다.","민지의 집에서 파티를 합니다.","저녁에 파티가 시작됩니다.","선물을 가져가야 합니다."],"ans":4,"exp":"Thiệp mời ghi \"선물은 가져오지 마세요\" (Đừng mang quà). Vì vậy câu ④ \"phải mang quà\" là sai, đáp án là ④.","vocab":[{"k":"초대하다","v":"mời"},{"k":"선물","v":"quà"},{"k":"가져오다","v":"mang đến"}]}]},{"sec":"R","nums":[43],"passage":{"kind":"text","body":["저는 지난 주말에 친구와 바다에 갔습니다. 바다에서 수영을 하고 생선을 먹었습니다. 날씨가 좋아서 기분이 좋았습니다."]},"qs":[{"n":43,"stem":null,"choices":["저는 친구와 바다에 갔습니다.","저는 혼자 여행을 했습니다.","바다에서 고기를 먹었습니다.","날씨가 나빴습니다."],"ans":1,"exp":"Câu đầu viết \"친구와 바다에 갔습니다\" (đã đi biển với bạn). Tôi ăn cá (생선), thời tiết đẹp. Đáp án ①.","vocab":[{"k":"바다","v":"biển"},{"k":"생선","v":"cá (làm thức ăn)"},{"k":"기분","v":"tâm trạng"}]}]},{"sec":"R","nums":[44],"passage":{"kind":"text","body":["저는 매일 아침 여덟 시에 회사에 갑니다. 회사까지 지하철로 삼십 분쯤 걸립니다. 점심은 회사 식당에서 동료들과 먹습니다."]},"qs":[{"n":44,"stem":null,"choices":["저는 버스를 타고 회사에 갑니다.","회사까지 한 시간 걸립니다.","저는 동료들과 점심을 먹습니다.","저는 저녁에 회사에 갑니다."],"ans":3,"exp":"Đoạn văn viết \"점심은 회사 식당에서 동료들과 먹습니다\" (Tôi ăn trưa với đồng nghiệp ở nhà ăn công ty). Tôi đi tàu điện ngầm, mất khoảng 30 phút. Đáp án ③.","vocab":[{"k":"동료","v":"đồng nghiệp"},{"k":"지하철","v":"tàu điện ngầm"},{"k":"-쯤","v":"khoảng"}]}]},{"sec":"R","nums":[45],"passage":{"kind":"text","body":["저는 비빔밥을 좋아합니다. 비빔밥에는 여러 가지 채소가 들어 있습니다. 오늘은 제가 집에서 비빔밥을 만들 겁니다."]},"qs":[{"n":45,"stem":null,"choices":["저는 비빔밥을 싫어합니다.","비빔밥에 채소가 들어 있습니다.","저는 식당에서 비빔밥을 먹을 겁니다.","비빔밥은 만들기 어렵습니다."],"ans":2,"exp":"Đoạn văn viết \"비빔밥에는 여러 가지 채소가 들어 있습니다\" (Trong bibimbap có nhiều loại rau). Hôm nay tôi sẽ tự làm ở nhà. Đáp án ②.","vocab":[{"k":"여러 가지","v":"nhiều loại"},{"k":"들어 있다","v":"có chứa bên trong"}]}]},{"sec":"R","nums":[46],"passage":{"kind":"text","body":["저는 감기에 자주 걸립니다. 그래서 요즘 따뜻한 차를 많이 마십니다. 앞으로 운동도 열심히 하려고 합니다."]},"qs":[{"n":46,"stem":null,"choices":["저는 차를 싫어합니다.","저는 감기에 걸리지 않습니다.","저는 운동을 잘합니다.","저는 건강해지고 싶습니다."],"ans":4,"exp":"Người viết hay bị cảm nên uống trà ấm và định chăm tập thể dục (\"운동도 열심히 하려고 합니다\"). Ý chính là muốn khỏe hơn. Đáp án ④.","vocab":[{"k":"따뜻하다","v":"ấm"},{"k":"차","v":"trà"},{"k":"-(으)려고 하다","v":"định làm gì"}]}]},{"sec":"R","nums":[47],"passage":{"kind":"text","body":["우리 동네에는 큰 시장이 있습니다. 시장의 음식은 싸고 맛있습니다. 그래서 저는 주말마다 시장에 갑니다."]},"qs":[{"n":47,"stem":null,"choices":["시장은 멀어서 불편합니다.","시장 음식은 너무 비쌉니다.","저는 시장을 좋아합니다.","저는 시장에 처음 갔습니다."],"ans":3,"exp":"Người viết khen đồ ăn ở chợ \"싸고 맛있습니다\" (rẻ và ngon) và \"주말마다 시장에 갑니다\" (cuối tuần nào cũng đi chợ). Ý chính: tôi thích chợ. Đáp án ③.","vocab":[{"k":"동네","v":"khu phố"},{"k":"싸다","v":"rẻ"},{"k":"주말마다","v":"mỗi cuối tuần"}]}]},{"sec":"R","nums":[48],"passage":{"kind":"text","body":["저는 요즘 테니스를 배우고 있습니다. 아직 잘 못 치지만 정말 재미있습니다. 더 열심히 연습해서 잘 치고 싶습니다."]},"qs":[{"n":48,"stem":null,"choices":["테니스를 잘 치고 싶습니다.","테니스는 재미없습니다.","테니스를 그만두고 싶습니다.","테니스를 가르치고 싶습니다."],"ans":1,"exp":"Câu cuối \"더 열심히 연습해서 잘 치고 싶습니다\" (Tôi muốn luyện tập chăm hơn để chơi giỏi) là ý chính. Đáp án ①.","vocab":[{"k":"연습하다","v":"luyện tập"},{"k":"아직","v":"vẫn chưa"},{"k":"재미있다","v":"thú vị"}]}]},{"sec":"R","nums":[49,50],"passage":{"kind":"text","body":["저는 지난 토요일에 한국 친구들을 집에 초대했습니다. 친구들에게 베트남 음식을 만들어 주고 싶어서 아침부터 쌀국수를 ( ㉠ ). 친구들은 쌀국수를 처음 먹어 봤는데 아주 맛있다고 했습니다. 다음에는 친구들이 저에게 한국 음식을 만들어 주기로 했습니다. 저는 그날이 정말 기다려집니다."]},"qs":[{"n":49,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["먹었습니다","준비했습니다","팔았습니다","주문했습니다"],"ans":2,"exp":"Người viết muốn tự nấu món Việt cho bạn (\"만들어 주고 싶어서\") nên từ sáng đã chuẩn bị phở: \"쌀국수를 준비했습니다\". Đáp án ②.","vocab":[{"k":"준비하다","v":"chuẩn bị"},{"k":"쌀국수","v":"phở"},{"k":"초대하다","v":"mời"}]},{"n":50,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 친구 집에 초대를 받았습니다.","친구들은 쌀국수를 자주 먹습니다.","저는 친구들에게 한국 음식을 만들어 주었습니다.","친구들이 다음에 한국 음식을 만들어 줄 겁니다."],"ans":4,"exp":"Đoạn văn viết \"다음에는 친구들이 저에게 한국 음식을 만들어 주기로 했습니다\" (Lần sau các bạn sẽ nấu món Hàn cho tôi). Các bạn ăn phở lần đầu. Đáp án ④.","vocab":[{"k":"-기로 하다","v":"quyết định/hẹn làm gì"},{"k":"처음","v":"lần đầu"}]}]},{"sec":"R","nums":[51,52],"passage":{"kind":"text","body":["비빔밥은 한국의 대표적인 음식입니다. 밥 위에 여러 가지 채소와 고기, 달걀을 올립니다. 그리고 고추장을 넣고 숟가락으로 잘 ( ㉠ ) 먹습니다. 고추장이 너무 매우면 간장을 넣어도 됩니다. 채소가 많이 들어 있어서 건강에도 좋습니다."]},"qs":[{"n":51,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["비벼서","씻어서","끓여서","잘라서"],"ans":1,"exp":"Bibimbap là món \"trộn\": cho tương ớt vào rồi dùng thìa trộn đều \"잘 비벼서 먹습니다\". Đáp án ①.","vocab":[{"k":"비비다","v":"trộn"},{"k":"고추장","v":"tương ớt"},{"k":"숟가락","v":"thìa"}]},{"n":52,"stem":"무엇에 대한 이야기인지 맞는 것을 고르십시오.","choices":["비빔밥의 역사","비빔밥을 파는 곳","비빔밥을 먹는 방법","비빔밥의 가격"],"ans":3,"exp":"Đoạn văn giải thích cho gì lên cơm, cho tương ớt, trộn rồi ăn, cay thì cho xì dầu – tức là cách ăn bibimbap (먹는 방법). Đáp án ③.","vocab":[{"k":"방법","v":"cách, phương pháp"},{"k":"대표적","v":"tiêu biểu"}]}]},{"sec":"R","nums":[53,54],"passage":{"kind":"text","body":["저는 올여름 휴가 때 가족과 함께 부산에 갔습니다. 부산 바다는 넓고 아름다웠습니다. 낮에는 바다에서 수영을 하고, 밤에는 시장에서 맛있는 해산물을 먹었습니다. 원래 사흘만 있으려고 했는데 너무 좋아서 하루 더 ( ㉠ ). 내년 여름에도 다시 가고 싶습니다."]},"qs":[{"n":53,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["떠났습니다","돌아왔습니다","일했습니다","있었습니다"],"ans":4,"exp":"\"원래 사흘만 있으려고 했는데 너무 좋아서\" (Định chỉ ở ba ngày nhưng vì quá thích) nên đã ở thêm một ngày: \"하루 더 있었습니다\". Đáp án ④.","vocab":[{"k":"원래","v":"vốn dĩ, ban đầu"},{"k":"사흘","v":"ba ngày"},{"k":"해산물","v":"hải sản"}]},{"n":54,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 혼자 부산에 갔습니다.","저는 부산에서 나흘 동안 있었습니다.","저는 밤에 바다에서 수영했습니다.","저는 내년에는 부산에 안 갈 겁니다."],"ans":2,"exp":"Ba ngày (사흘) cộng thêm một ngày (하루 더) là bốn ngày (나흘). Người viết đi cùng gia đình, bơi vào ban ngày. Đáp án ②.","vocab":[{"k":"나흘","v":"bốn ngày"},{"k":"함께","v":"cùng nhau"}]}]},{"sec":"R","nums":[55,56],"passage":{"kind":"text","body":["우체국에서는 편지와 소포를 보낼 수 있습니다. 소포를 보낼 때는 먼저 상자에 물건을 넣고 받는 사람의 주소를 씁니다. ( ㉠ ) 창구에서 무게를 잰 후에 돈을 냅니다. 요즘은 우체국에 가지 않아도 인터넷으로 소포를 신청할 수 있습니다. 그러면 우체국 직원이 집에 와서 소포를 가져갑니다."]},"qs":[{"n":55,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["그런데","그래서","그리고","하지만"],"ans":3,"exp":"Câu trước và câu sau là các bước nối tiếp nhau khi gửi bưu kiện (viết địa chỉ → cân → trả tiền), nên dùng \"그리고\" (và, rồi). Đáp án ③.","vocab":[{"k":"그리고","v":"và, rồi"},{"k":"창구","v":"quầy giao dịch"},{"k":"무게를 재다","v":"cân (đo trọng lượng)"}]},{"n":56,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["인터넷으로 소포를 신청할 수 있습니다.","소포는 무게를 재지 않습니다.","주소는 창구에서 직원이 씁니다.","우체국에서는 편지만 보낼 수 있습니다."],"ans":1,"exp":"Đoạn văn viết \"인터넷으로 소포를 신청할 수 있습니다\" (Có thể đăng ký gửi bưu kiện qua internet). Đáp án ①.","vocab":[{"k":"신청하다","v":"đăng ký"},{"k":"직원","v":"nhân viên"}]}]},{"sec":"R","nums":[57],"passage":{"kind":"text","body":["(가) 의사 선생님은 감기라고 하면서 약을 주셨습니다.","(나) 어제부터 목이 아프고 기침이 났습니다.","(다) 약을 먹고 푹 쉬니까 많이 좋아졌습니다.","(라) 그래서 오늘 아침에 병원에 갔습니다."]},"qs":[{"n":57,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(가)-(라)-(다)","(라)-(나)-(다)-(가)","(라)-(가)-(나)-(다)","(나)-(라)-(가)-(다)"],"ans":4,"exp":"Trình tự: (나) từ hôm qua đau họng, ho → (라) \"그래서\" sáng nay đi bệnh viện → (가) bác sĩ nói bị cảm và cho thuốc → (다) uống thuốc, nghỉ ngơi nên đỡ nhiều. Đáp án ④.","vocab":[{"k":"기침","v":"ho"},{"k":"목","v":"cổ họng"},{"k":"푹 쉬다","v":"nghỉ ngơi thoải mái"}]}]},{"sec":"R","nums":[58],"passage":{"kind":"text","body":["(가) 하지만 선배들이 친절하게 가르쳐 주었습니다.","(나) 지금은 친구들과 시합도 할 수 있게 되었습니다.","(다) 저는 대학교에 입학해서 테니스 동아리에 들어갔습니다.","(라) 처음에는 공을 잘 치지 못해서 힘들었습니다."]},"qs":[{"n":58,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(라)-(다)-(가)-(나)","(다)-(라)-(가)-(나)","(다)-(가)-(라)-(나)","(라)-(가)-(다)-(나)"],"ans":2,"exp":"Trình tự: (다) vào câu lạc bộ quần vợt → (라) lúc đầu đánh bóng không tốt nên vất vả → (가) \"하지만\" các tiền bối dạy tận tình → (나) giờ đã có thể thi đấu. Đáp án ②.","vocab":[{"k":"동아리","v":"câu lạc bộ"},{"k":"선배","v":"tiền bối, đàn anh/chị"},{"k":"시합","v":"trận đấu"}]}]},{"sec":"R","nums":[59,60],"passage":{"kind":"text","body":["감기는 날씨가 추워지거나 갑자기 바뀔 때 많이 걸립니다. ( ㉠ ) 감기를 예방하는 방법은 여러 가지가 있습니다. ( ㉡ ) 먼저 손을 자주 씻는 것이 좋습니다. ( ㉢ ) 그래서 밖에서 돌아온 후에는 꼭 비누로 손을 씻어야 합니다. 그리고 따뜻한 물을 자주 마시고 잠을 충분히 자는 것도 도움이 됩니다. ( ㉣ )"]},"qs":[{"n":59,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.","choices":["㉠","㉡","㉢","㉣"],"ans":3,"box":"손에 있는 나쁜 균이 입이나 코로 들어가기 때문입니다.","exp":"Câu cần chèn giải thích lý do phải rửa tay (\"-기 때문입니다\": vì vi khuẩn trên tay vào miệng, mũi). Nó phải đứng ngay sau \"손을 자주 씻는 것이 좋습니다\" và trước \"그래서 ... 손을 씻어야 합니다\", tức là vị trí ㉢. Đáp án ③.","vocab":[{"k":"균","v":"vi khuẩn"},{"k":"-기 때문이다","v":"là vì"},{"k":"예방하다","v":"phòng ngừa"}]},{"n":60,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["밖에서 돌아오면 손을 씻어야 합니다.","감기는 여름에 많이 걸립니다.","감기를 예방하는 방법은 하나뿐입니다.","찬물을 마시면 감기 예방에 좋습니다."],"ans":1,"exp":"Đoạn văn viết \"밖에서 돌아온 후에는 꼭 비누로 손을 씻어야 합니다\" (Sau khi từ ngoài về nhất định phải rửa tay bằng xà phòng). Nên uống nước ấm, không phải nước lạnh. Đáp án ①.","vocab":[{"k":"비누","v":"xà phòng"},{"k":"충분히","v":"đầy đủ"}]}]},{"sec":"R","nums":[61,62],"passage":{"kind":"text","body":["저는 한국에 온 지 일 년이 되었습니다. 처음에는 한국어를 잘 못해서 시장에 가는 것이 무서웠습니다. 그래서 늘 마트에서만 장을 봤습니다. 그런데 어느 날 한국 친구가 시장에 같이 가 주었습니다. 친구 덕분에 시장 사람들과 이야기를 ( ㉠ ) 한국어 실력도 많이 늘었습니다. 지금은 혼자서도 시장에 가서 장을 봅니다."]},"qs":[{"n":61,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["하려고","하지만","하거나","하면서"],"ans":4,"exp":"Cần nghĩa \"vừa nói chuyện với người ở chợ, (qua đó) tiếng Hàn tiến bộ\": \"이야기를 하면서 한국어 실력도 늘었습니다\". \"-(으)면서\" = vừa... vừa, trong khi. Đáp án ④.","vocab":[{"k":"-(으)면서","v":"vừa... vừa, trong khi"},{"k":"덕분에","v":"nhờ vào"},{"k":"실력이 늘다","v":"năng lực tiến bộ"}]},{"n":62,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 한국에 온 지 삼 년이 되었습니다.","처음에는 마트에서만 장을 봤습니다.","저는 지금도 혼자 시장에 못 갑니다.","친구는 시장에 같이 가지 않았습니다."],"ans":2,"exp":"Đoạn văn viết \"그래서 늘 마트에서만 장을 봤습니다\" (Vì thế lúc đầu tôi chỉ mua đồ ở siêu thị). Tôi đến Hàn Quốc được một năm, bây giờ tự đi chợ được. Đáp án ②.","vocab":[{"k":"무섭다","v":"sợ"},{"k":"늘","v":"luôn luôn"},{"k":"마트","v":"siêu thị"}]}]},{"sec":"R","nums":[63,64],"passage":{"kind":"email","title":"회식 장소 변경 안내","body":["받는 사람: 영업부 직원 여러분","보내는 사람: 김민수","안녕하세요. 영업부 김민수입니다.","이번 주 금요일 회식 장소가 바뀌었습니다. 원래 회사 앞 '한국식당'에서 하기로 했는데, 그날 식당이 문을 닫는다고 합니다.","그래서 회사 옆 건물 2층에 있는 '바다횟집'에서 하게 되었습니다. 시간은 그대로 저녁 7시입니다.","못 오시는 분은 목요일까지 저에게 말씀해 주세요. 감사합니다."]},"qs":[{"n":63,"stem":"왜 윗글을 썼는지 맞는 것을 고르십시오.","choices":["회식 날짜를 알려 주려고","새 식당의 음식을 소개하려고","바뀐 회식 장소를 알려 주려고","회식 시간을 바꾸려고"],"ans":3,"exp":"Tiêu đề và nội dung: \"회식 장소가 바뀌었습니다\" (Địa điểm liên hoan đã thay đổi). Mục đích là thông báo địa điểm mới. Thời gian vẫn giữ nguyên. Đáp án ③.","vocab":[{"k":"회식","v":"liên hoan công ty"},{"k":"장소","v":"địa điểm"},{"k":"바뀌다","v":"được thay đổi"}]},{"n":64,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["회식은 저녁 일곱 시에 시작합니다.","한국식당은 회사 옆 건물에 있습니다.","회식은 목요일에 합니다.","못 가는 사람은 금요일에 말해야 합니다."],"ans":1,"exp":"Email viết \"시간은 그대로 저녁 7시입니다\" (Thời gian vẫn là 7 giờ tối). Liên hoan vào thứ Sáu; ai không đến báo trước thứ Năm. Đáp án ①.","vocab":[{"k":"그대로","v":"như cũ, giữ nguyên"},{"k":"건물","v":"tòa nhà"}]}]},{"sec":"R","nums":[65,66],"passage":{"kind":"text","body":["수영은 몸 전체를 움직이는 운동입니다. 물속에서 운동을 하면 무릎이나 허리가 덜 아픕니다. 그래서 나이가 많은 사람이나 다리가 아픈 사람도 ( ㉠ ) 운동을 할 수 있습니다. 그리고 수영을 하면 살이 빠지고 잠도 잘 잘 수 있습니다. 하지만 밥을 먹은 후에 바로 수영을 하는 것은 좋지 않습니다. 또 수영을 하기 전에는 꼭 준비 운동을 해야 합니다."]},"qs":[{"n":65,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["어렵게","편하게","늦게","빠르게"],"ans":2,"exp":"Trong nước đầu gối và lưng ít đau hơn (\"덜 아픕니다\"), nên người lớn tuổi hay người đau chân cũng có thể tập \"편하게\" (thoải mái, dễ dàng). Đáp án ②.","vocab":[{"k":"편하다","v":"thoải mái, tiện"},{"k":"무릎","v":"đầu gối"},{"k":"허리","v":"lưng, eo"}]},{"n":66,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["수영은 다리만 움직이는 운동입니다.","밥을 먹고 바로 수영하는 것이 좋습니다.","수영을 하면 잠을 잘 못 잡니다.","수영하기 전에 준비 운동이 필요합니다."],"ans":4,"exp":"Đoạn văn viết \"수영을 하기 전에는 꼭 준비 운동을 해야 합니다\" (Trước khi bơi nhất định phải khởi động). Bơi vận động toàn thân, ngủ ngon hơn. Đáp án ④.","vocab":[{"k":"준비 운동","v":"khởi động"},{"k":"살이 빠지다","v":"giảm cân"},{"k":"전체","v":"toàn bộ"}]}]},{"sec":"R","nums":[67,68],"passage":{"kind":"text","body":["한국에서는 아플 때 보통 먼저 병원에 가서 의사를 만납니다. 의사는 환자를 진찰한 후에 처방전을 줍니다. 환자는 이 처방전을 가지고 약국에 가야 약을 ( ㉠ ). 하지만 간단한 감기약이나 소화제는 처방전이 없어도 약국에서 살 수 있습니다. 또 밤늦게 약국이 문을 닫았을 때는 편의점에서 간단한 약을 살 수도 있습니다."]},"qs":[{"n":67,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["팔 수 있습니다","만들 수 없습니다","받을 수 있습니다","먹지 않습니다"],"ans":3,"exp":"Bệnh nhân phải mang đơn thuốc đến hiệu thuốc mới có thể nhận thuốc: \"처방전을 가지고 약국에 가야 약을 받을 수 있습니다\". Đáp án ③.","vocab":[{"k":"처방전","v":"đơn thuốc"},{"k":"진찰하다","v":"khám bệnh"},{"k":"환자","v":"bệnh nhân"}]},{"n":68,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["편의점에서도 간단한 약을 살 수 있습니다.","처방전은 약국에서 줍니다.","감기약은 꼭 처방전이 있어야 삽니다.","병원에 가기 전에 약국에 가야 합니다."],"ans":1,"exp":"Đoạn văn viết \"편의점에서 간단한 약을 살 수도 있습니다\" (Cũng có thể mua thuốc đơn giản ở cửa hàng tiện lợi). Đơn thuốc do bác sĩ đưa; thuốc cảm đơn giản không cần đơn. Đáp án ①.","vocab":[{"k":"편의점","v":"cửa hàng tiện lợi"},{"k":"소화제","v":"thuốc tiêu hóa"},{"k":"간단하다","v":"đơn giản"}]}]},{"sec":"R","nums":[69,70],"passage":{"kind":"text","body":["저는 어렸을 때 바닷가 마을에서 살았습니다. 여름이 되면 친구들과 매일 바다에 가서 놀았습니다. 그런데 대학교에 입학하면서 서울로 이사를 하게 되었습니다. 서울 생활은 바쁘고 재미있었지만 가끔 고향 바다가 그리웠습니다. 그래서 이번 여름 휴가 때 오랜만에 고향 바다에 ( ㉠ ). 바다는 옛날과 똑같이 아름다웠고 어릴 때 친구들도 만날 수 있었습니다. 앞으로는 시간이 날 때마다 고향에 자주 가려고 합니다."]},"qs":[{"n":69,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["가 본 적이 없습니다","가지 못했습니다","가기 싫었습니다","다녀왔습니다"],"ans":4,"exp":"Người viết nhớ biển quê nên kỳ nghỉ hè này đã về thăm, và câu sau kể biển vẫn đẹp, gặp lại bạn cũ. Vì vậy phải là \"다녀왔습니다\" (đã đi về). Đáp án ④.","vocab":[{"k":"다녀오다","v":"đi rồi về"},{"k":"그립다","v":"nhớ nhung"},{"k":"오랜만에","v":"lâu rồi mới"}]},{"n":70,"stem":"이 글의 내용으로 알 수 있는 것을 고르십시오.","choices":["저는 지금 바닷가 마을에서 삽니다.","저는 대학교 입학 때문에 서울로 왔습니다.","저는 서울 생활이 재미없었습니다.","저는 휴가 때 친구들을 못 만났습니다."],"ans":2,"exp":"Đoạn văn viết \"대학교에 입학하면서 서울로 이사를 하게 되었습니다\" (Khi vào đại học, tôi chuyển lên Seoul). Cuộc sống Seoul vui; kỳ nghỉ gặp lại bạn cũ. Đáp án ②.","vocab":[{"k":"입학하다","v":"nhập học"},{"k":"고향","v":"quê hương"},{"k":"바닷가","v":"bờ biển"}]}]}]},{"test":3,"groups":[{"sec":"L","nums":[1],"audio":[{"s":"W","t":"우산이 있어요?"}],"qs":[{"n":1,"stem":null,"choices":["네, 우산이 싸요.","네, 우산이 있어요.","아니요, 우산이 커요.","아니요, 우산을 사요."],"ans":2,"exp":"Câu hỏi \"우산이 있어요?\" (Bạn có ô không?). Trả lời \"네, 우산이 있어요\" (Vâng, tôi có ô) là phù hợp, nên đáp án là ②.","vocab":[{"k":"우산","v":"cái ô"},{"k":"있다","v":"có"}]}]},{"sec":"L","nums":[2],"audio":[{"s":"M","t":"동생이에요?"}],"qs":[{"n":2,"stem":null,"choices":["네, 동생이 없어요.","네, 동생을 만나요.","아니요, 동생이 많아요.","아니요, 동생이 아니에요."],"ans":4,"exp":"Câu hỏi \"동생이에요?\" (Là em của bạn à?). Câu trả lời phủ định đúng là \"아니요, 동생이 아니에요\" (Không, không phải em tôi), nên đáp án là ④.","vocab":[{"k":"동생","v":"em"},{"k":"아니다","v":"không phải"}]}]},{"sec":"L","nums":[3],"audio":[{"s":"M","t":"언제 이사해요?"}],"qs":[{"n":3,"stem":null,"choices":["다음 주에 해요.","친구하고 해요.","집에서 해요.","혼자 해요."],"ans":1,"exp":"\"언제\" hỏi về thời gian (khi nào chuyển nhà?). \"다음 주에 해요\" (tuần sau) trả lời về thời gian, nên đáp án là ①.","vocab":[{"k":"언제","v":"khi nào"},{"k":"이사하다","v":"chuyển nhà"}]}]},{"sec":"L","nums":[4],"audio":[{"s":"W","t":"택시를 몇 시에 타요?"}],"qs":[{"n":4,"stem":null,"choices":["학교 앞에서 타요.","친구가 타요.","여덟 시에 타요.","버스를 타요."],"ans":3,"exp":"\"몇 시\" hỏi mấy giờ. \"여덟 시에 타요\" (đi lúc 8 giờ) là câu trả lời đúng, nên đáp án là ③.","vocab":[{"k":"몇 시","v":"mấy giờ"},{"k":"택시","v":"taxi"}]}]},{"sec":"L","nums":[5],"audio":[{"s":"W","t":"생일 축하해요."}],"qs":[{"n":5,"stem":null,"choices":["괜찮아요.","미안해요.","고마워요.","잘 먹겠습니다."],"ans":3,"exp":"Khi được chúc \"생일 축하해요\" (Chúc mừng sinh nhật), ta đáp \"고마워요\" (Cảm ơn), nên đáp án là ③.","vocab":[{"k":"생일","v":"sinh nhật"},{"k":"축하하다","v":"chúc mừng"}]}]},{"sec":"L","nums":[6],"audio":[{"s":"M","t":"늦어서 죄송합니다."}],"qs":[{"n":6,"stem":null,"choices":["괜찮습니다.","축하합니다.","처음 뵙겠습니다.","잘 먹었습니다."],"ans":1,"exp":"Người đàn ông xin lỗi \"늦어서 죄송합니다\" (Xin lỗi vì đến muộn). Câu đáp phù hợp là \"괜찮습니다\" (Không sao), nên đáp án là ①.","vocab":[{"k":"늦다","v":"muộn"},{"k":"죄송하다","v":"xin lỗi"}]}]},{"sec":"L","nums":[7],"audio":[{"s":"W","t":"통장을 만들고 싶어요."},{"s":"M","t":"네, 신분증을 주시겠어요?"}],"qs":[{"n":7,"stem":null,"choices":["약국","서점","식당","은행"],"ans":4,"exp":"\"통장을 만들고 싶어요\" (Tôi muốn mở sổ tài khoản) và \"신분증\" (giấy tờ tùy thân) là cuộc hội thoại ở ngân hàng, nên đáp án là ④.","vocab":[{"k":"통장","v":"sổ tài khoản"},{"k":"신분증","v":"giấy tờ tùy thân"}]}]},{"sec":"L","nums":[8],"audio":[{"s":"M","t":"이 영화 표 두 장 주세요."},{"s":"W","t":"네, 자리는 여기 있습니다."}],"qs":[{"n":8,"stem":null,"choices":["공항","영화관","도서관","미술관"],"ans":2,"exp":"Mua \"영화 표\" (vé xem phim) và chọn \"자리\" (chỗ ngồi) là ở rạp chiếu phim, nên đáp án là ②.","vocab":[{"k":"영화","v":"phim"},{"k":"표","v":"vé"}]}]},{"sec":"L","nums":[9],"audio":[{"s":"W","t":"이 치마 좀 입어 봐도 돼요?"},{"s":"M","t":"네, 저쪽에서 입어 보세요."}],"qs":[{"n":9,"stem":null,"choices":["옷 가게","빵집","병원","꽃집"],"ans":1,"exp":"\"치마를 입어 봐도 돼요?\" (Tôi mặc thử váy được không?) là câu nói ở cửa hàng quần áo, nên đáp án là ①.","vocab":[{"k":"치마","v":"váy"},{"k":"입어 보다","v":"mặc thử"}]}]},{"sec":"L","nums":[10],"audio":[{"s":"M","t":"떡볶이 일 인분하고 김밥 하나 주세요."},{"s":"W","t":"네, 여기에서 드실 거예요?"}],"qs":[{"n":10,"stem":null,"choices":["호텔","서점","식당","문구점"],"ans":3,"exp":"Người đàn ông gọi \"떡볶이 일 인분하고 김밥\" (một suất tteokbokki và kimbap), đây là quán ăn, nên đáp án là ③.","vocab":[{"k":"일 인분","v":"một suất"},{"k":"드시다","v":"dùng, ăn (kính ngữ)"}]}]},{"sec":"L","nums":[11],"audio":[{"s":"W","t":"저는 등산을 좋아해요. 민수 씨는요?"},{"s":"M","t":"저는 수영을 좋아해요."}],"qs":[{"n":11,"stem":null,"choices":["날씨","가족","직업","취미"],"ans":4,"exp":"Hai người nói về việc mình thích \"등산\" (leo núi) và \"수영\" (bơi lội), tức là sở thích, nên đáp án là ④.","vocab":[{"k":"등산","v":"leo núi"},{"k":"수영","v":"bơi lội"}]}]},{"sec":"L","nums":[12],"audio":[{"s":"M","t":"가을에는 단풍이 정말 예뻐요."},{"s":"W","t":"네, 저도 가을이 제일 좋아요."}],"qs":[{"n":12,"stem":null,"choices":["여행","계절","음식","주말"],"ans":2,"exp":"Hai người nói về \"가을\" (mùa thu) và \"단풍\" (lá phong đỏ), tức là nói về mùa, nên đáp án là ②.","vocab":[{"k":"가을","v":"mùa thu"},{"k":"단풍","v":"lá phong, lá đổi màu"}]}]},{"sec":"L","nums":[13],"audio":[{"s":"W","t":"버스로 학교에 가요?"},{"s":"M","t":"아니요, 지하철로 가요."}],"qs":[{"n":13,"stem":null,"choices":["시간","교통","쇼핑","약속"],"ans":2,"exp":"Hai người nói về phương tiện đi học: \"버스\" (xe buýt), \"지하철\" (tàu điện ngầm), tức là giao thông, nên đáp án là ②.","vocab":[{"k":"지하철","v":"tàu điện ngầm"},{"k":"교통","v":"giao thông"}]}]},{"sec":"L","nums":[14],"audio":[{"s":"M","t":"이 사과 얼마예요?"},{"s":"W","t":"한 개에 천 원이에요."}],"qs":[{"n":14,"stem":null,"choices":["가격","날짜","선물","고향"],"ans":1,"exp":"\"얼마예요?\" (Bao nhiêu tiền?) và \"천 원\" (1.000 won) là nói về giá cả, nên đáp án là ①.","vocab":[{"k":"얼마","v":"bao nhiêu (tiền)"},{"k":"가격","v":"giá cả"}]}]},{"sec":"L","nums":[15],"audio":[{"s":"M","t":"이 상자를 어디에 놓을까요?"},{"s":"W","t":"책상 위에 놓아 주세요."}],"qs":[{"n":15,"stem":null,"pics":[{"e":"👨📦⬇️🗄️","c":"남자가 상자를 책상 아래에 놓습니다."},{"e":"👩📦⬆️🗄️","c":"여자가 상자를 책상 위에 놓습니다."},{"e":"👨📦⬆️🗄️","c":"남자가 상자를 책상 위에 놓습니다."},{"e":"👨📦🪑","c":"남자가 상자를 의자 위에 놓습니다."}],"ans":3,"exp":"Người đàn ông hỏi đặt hộp ở đâu, người phụ nữ nói \"책상 위에 놓아 주세요\" (Hãy đặt lên trên bàn). Vậy người đàn ông đặt hộp lên bàn, đáp án là ③.","vocab":[{"k":"상자","v":"cái hộp"},{"k":"놓다","v":"đặt, để"}]}]},{"sec":"L","nums":[16],"audio":[{"s":"W","t":"손님, 무엇을 드릴까요?"},{"s":"M","t":"커피 한 잔 주세요."}],"qs":[{"n":16,"stem":null,"pics":[{"e":"👩🥐➡️👨","c":"여자가 남자에게 빵을 줍니다."},{"e":"👨☕👩☕","c":"남자와 여자가 같이 커피를 마십니다."},{"e":"👨☕🔧","c":"남자가 커피를 만듭니다."},{"e":"👨🗣️☕👩","c":"남자가 카페에서 여자에게 커피를 주문합니다."}],"ans":4,"exp":"Nhân viên nữ hỏi \"무엇을 드릴까요?\" (Quý khách dùng gì?), khách nam nói \"커피 한 잔 주세요\" (Cho tôi một cốc cà phê). Đây là cảnh người đàn ông gọi cà phê, đáp án là ④.","vocab":[{"k":"손님","v":"khách hàng"},{"k":"주문하다","v":"gọi món"}]}]},{"sec":"L","nums":[17],"audio":[{"s":"W","t":"민수 씨, 요즘 집을 찾고 있어요?"},{"s":"M","t":"네, 학교 근처에 있는 방을 찾고 있어요."},{"s":"W","t":"우리 집 옆 건물에 빈방이 있어요. 한번 보러 갈래요?"},{"s":"M","t":"좋아요. 내일 같이 가요."}],"qs":[{"n":17,"stem":null,"choices":["남자는 학교 근처로 이사하고 싶어 합니다.","여자는 지금 방을 찾고 있습니다.","남자는 오늘 방을 보러 갑니다.","여자는 옆 건물로 이사했습니다."],"ans":1,"exp":"Người đàn ông nói \"학교 근처에 있는 방을 찾고 있어요\" (đang tìm phòng gần trường), tức là muốn chuyển đến gần trường. Họ sẽ đi xem phòng vào \"내일\" (ngày mai), nên đáp án là ①.","vocab":[{"k":"근처","v":"gần, lân cận"},{"k":"빈방","v":"phòng trống"}]}]},{"sec":"L","nums":[18],"audio":[{"s":"M","t":"어서 오세요. 무엇을 도와드릴까요?"},{"s":"W","t":"통장을 만들고 싶어요. 외국인도 만들 수 있어요?"},{"s":"M","t":"네, 외국인 등록증이 있으면 만들 수 있어요."},{"s":"W","t":"여기 있어요. 카드도 같이 만들어 주세요."}],"qs":[{"n":18,"stem":null,"choices":["여자는 한국 사람입니다.","여자는 외국인 등록증이 없습니다.","여자는 카드도 만들 겁니다.","남자는 통장을 만들려고 합니다."],"ans":3,"exp":"Người phụ nữ nói \"카드도 같이 만들어 주세요\" (Làm luôn cả thẻ cho tôi), nên đáp án là ③. Cô ấy là người nước ngoài và có thẻ đăng ký người nước ngoài.","vocab":[{"k":"외국인 등록증","v":"thẻ đăng ký người nước ngoài"},{"k":"만들다","v":"làm, mở (tài khoản)"}]}]},{"sec":"L","nums":[19],"audio":[{"s":"W","t":"여기에서 시청까지 버스로 얼마나 걸려요?"},{"s":"M","t":"삼십 분쯤 걸려요. 그런데 지금은 길이 많이 막혀요."},{"s":"W","t":"그럼 지하철을 타는 게 좋겠네요."},{"s":"M","t":"네, 지하철역은 저기 은행 옆에 있어요."}],"qs":[{"n":19,"stem":null,"choices":["여자는 버스를 타고 갈 겁니다.","지금 길이 많이 막힙니다.","지하철역은 시청 옆에 있습니다.","시청까지 버스로 한 시간 걸립니다."],"ans":2,"exp":"Người đàn ông nói \"지금은 길이 많이 막혀요\" (Bây giờ đường rất tắc), nên đáp án là ②. Người phụ nữ sẽ đi tàu điện ngầm, ga ở cạnh ngân hàng.","vocab":[{"k":"시청","v":"tòa thị chính"},{"k":"길이 막히다","v":"tắc đường"}]}]},{"sec":"L","nums":[20],"audio":[{"s":"M","t":"수미 씨, 이번 주 토요일에 영화 보러 갈래요?"},{"s":"W","t":"좋아요. 그런데 토요일 오전에는 아르바이트가 있어요."},{"s":"M","t":"그럼 오후 네 시 영화를 볼까요?"},{"s":"W","t":"네, 제가 표를 예매할게요."}],"qs":[{"n":20,"stem":null,"choices":["남자는 표를 예매할 겁니다.","두 사람은 일요일에 만납니다.","여자는 토요일 오후에 아르바이트를 합니다.","여자는 토요일 오전에 일을 합니다."],"ans":4,"exp":"Người phụ nữ nói \"토요일 오전에는 아르바이트가 있어요\" (Sáng thứ Bảy tôi có việc làm thêm), nên đáp án là ④. Người đặt vé là người phụ nữ.","vocab":[{"k":"아르바이트","v":"việc làm thêm"},{"k":"예매하다","v":"đặt vé trước"}]}]},{"sec":"L","nums":[21],"audio":[{"s":"W","t":"이 바지 좀 더 큰 것 있어요?"},{"s":"M","t":"죄송합니다. 그 색은 큰 것이 없어요. 검은색은 있어요."},{"s":"W","t":"그럼 검은색으로 입어 볼게요."},{"s":"M","t":"네, 탈의실은 저쪽에 있습니다."}],"qs":[{"n":21,"stem":null,"choices":["여자는 치마를 사려고 합니다.","가게에 큰 바지가 하나도 없습니다.","여자는 검은색 바지를 입어 볼 겁니다.","남자는 탈의실에 있습니다."],"ans":3,"exp":"Người phụ nữ nói \"그럼 검은색으로 입어 볼게요\" (Vậy tôi sẽ mặc thử màu đen), nên đáp án là ③. Cửa hàng vẫn có quần cỡ lớn màu đen nên ② sai.","vocab":[{"k":"바지","v":"quần"},{"k":"탈의실","v":"phòng thử đồ"}]}]},{"sec":"L","nums":[22],"audio":[{"s":"M","t":"저는 매운 음식을 못 먹어서 떡볶이를 안 먹어요."},{"s":"W","t":"요즘은 안 매운 떡볶이도 있어요. 간장 떡볶이는 하나도 안 매워요."},{"s":"M","t":"그래요? 몰랐어요."},{"s":"W","t":"한번 먹어 보세요. 맛있으면 좋아하게 될 거예요."}],"qs":[{"n":22,"stem":null,"choices":["간장 떡볶이를 먹어 보는 것이 좋습니다.","매운 음식을 먹으면 안 됩니다.","떡볶이는 매워야 맛있습니다.","떡볶이를 집에서 만드는 것이 좋습니다."],"ans":1,"exp":"Người phụ nữ giới thiệu \"간장 떡볶이는 하나도 안 매워요\" (tteokbokki xì dầu không cay chút nào) và khuyên \"한번 먹어 보세요\" (Hãy ăn thử một lần). Đáp án là ①.","vocab":[{"k":"맵다","v":"cay"},{"k":"간장","v":"xì dầu"}]}]},{"sec":"L","nums":[23],"audio":[{"s":"M","t":"이번 주말에 산에 가려고 해요. 같이 갈래요?"},{"s":"W","t":"좋아요. 그런데 요즘 날씨가 추워서 따뜻한 옷을 꼭 가지고 가야 해요."},{"s":"M","t":"낮에는 괜찮지 않아요?"},{"s":"W","t":"산 위는 아래보다 훨씬 추워요. 옷을 준비하는 게 좋아요."}],"qs":[{"n":23,"stem":null,"choices":["주말에는 집에서 쉬는 것이 좋습니다.","산에는 낮에 가야 합니다.","혼자 등산하면 위험합니다.","등산할 때 따뜻한 옷을 가지고 가야 합니다."],"ans":4,"exp":"Người phụ nữ nói \"따뜻한 옷을 꼭 가지고 가야 해요\" (nhất định phải mang áo ấm) vì trên núi lạnh hơn nhiều. Đáp án là ④.","vocab":[{"k":"따뜻하다","v":"ấm áp"},{"k":"준비하다","v":"chuẩn bị"}]}]},{"sec":"L","nums":[24],"audio":[{"s":"M","t":"카페 아르바이트를 시작해서 요즘 너무 바빠요."},{"s":"W","t":"공부하고 일을 같이 하면 힘들지요?"},{"s":"M","t":"네, 그래서 수업 시간에 자꾸 졸려요."},{"s":"W","t":"일하는 시간을 조금 줄이세요. 학생은 공부가 먼저예요."}],"qs":[{"n":24,"stem":null,"choices":["카페 일은 재미있습니다.","아르바이트 시간을 줄이는 것이 좋습니다.","수업 시간에 자면 안 됩니다.","아르바이트를 빨리 시작해야 합니다."],"ans":2,"exp":"Người phụ nữ khuyên \"일하는 시간을 조금 줄이세요\" (Hãy giảm bớt thời gian làm việc) vì \"학생은 공부가 먼저예요\" (sinh viên thì việc học là trước hết). Đáp án là ②.","vocab":[{"k":"줄이다","v":"giảm bớt"},{"k":"졸리다","v":"buồn ngủ"}]}]},{"sec":"L","nums":[25,26],"audio":[{"s":"W","t":"안녕하십니까? 한국공원에서 알려 드립니다. 이번 주 토요일부터 다음 주 일요일까지 공원에서 단풍 축제가 열립니다. 축제 기간에는 공원 입구에서 사진 찍기 행사도 있습니다. 공원 주차장이 좁으니까 버스나 지하철을 이용해 주십시오. 많이 오셔서 아름다운 가을을 즐기시기 바랍니다."}],"qs":[{"n":25,"stem":"여자가 왜 이 이야기를 하고 있는지 고르십시오.","choices":["주차장을 소개하려고","공원 입구를 설명하려고","사진을 부탁하려고","단풍 축제를 안내하려고"],"ans":4,"exp":"Người phụ nữ thông báo \"공원에서 단풍 축제가 열립니다\" (Lễ hội lá phong sẽ được tổ chức ở công viên) và mời mọi người đến. Mục đích là hướng dẫn về lễ hội, đáp án là ④.","vocab":[{"k":"축제","v":"lễ hội"},{"k":"열리다" i, nữa"}]}]},{"sec":"R","nums":[36],"passage":{"kind":"text","body":["배가 아픕니다. (    )에 갑니다."]},"qs":[{"n":36,"stem":null,"choices":["서점","은행","병원","극장"],"ans":3,"exp":"\"배가 아픕니다\" (đau bụng) nên phải đi \"병원\" (bệnh viện). Đáp án là ③.","vocab":[{"k":"배","v":"bụng"},{"k":"병원","v":"bệnh viện"}]}]},{"sec":"R","nums":[37],"passage":{"kind":"text","body":["가을입니다. 산에 (    )이 아름답습니다."]},"qs":[{"n":37,"stem":null,"choices":["눈","단풍","바다","비"],"ans":2,"exp":"Mùa thu (\"가을\") trên núi có \"단풍\" (lá đỏ) rất đẹp. Đáp án là ②.","vocab":[{"k":"단풍","v":"lá phong, lá đổi màu"},{"k":"아름답다","v":"đẹp"}]}]},{"sec":"R","nums":[38],"passage":{"kind":"text","body":["옷 가게에 갔습니다. 바지를 (    )."]},"qs":[{"n":38,"stem":null,"choices":["읽었습니다","배웠습니다","마셨습니다","샀습니다"],"ans":4,"exp":"Đến \"옷 가게\" (cửa hàng quần áo) thì \"바지를 샀습니다\" (đã mua quần). Đáp án là ④.","vocab":[{"k":"옷 가게","v":"cửa hàng quần áo"},{"k":"사다","v":"mua"}]}]},{"sec":"R","nums":[39],"passage":{"kind":"text","body":["이 방은 창문이 커서 (    ). 그래서 낮에 불을 안 켭니다."]},"qs":[{"n":39,"stem":null,"choices":["좁습니다","조용합니다","밝습니다","깨끗합니다"],"ans":3,"exp":"Cửa sổ to nên phòng \"밝습니다\" (sáng), vì vậy ban ngày không bật đèn (\"불을 안 켭니다\"). Đáp án là ③.","vocab":[{"k":"창문","v":"cửa sổ"},{"k":"밝다","v":"sáng"}]}]},{"sec":"R","nums":[40],"passage":{"kind":"notice","title":"한국 영화관","body":["영화: 가을 여행","날짜: 2026년 10월 17일(토)","시간: 오후 3시 30분","자리: 7관 F열 12번","가격: 12,000원"]},"qs":[{"n":40,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["토요일에 영화를 봅니다.","영화는 오후 세 시에 시작합니다.","영화 표는 만이천 원입니다.","영화 제목은 '가을 여행'입니다."],"ans":2,"exp":"Trên vé ghi \"오후 3시 30분\" (3 giờ 30 chiều), không phải 3 giờ. Vì vậy ② không đúng.","vocab":[{"k":"표","v":"vé"},{"k":"자리","v":"chỗ ngồi"}]}]},{"sec":"R","nums":[41],"passage":{"kind":"notice","title":"등산 동아리 '산사랑' 회원 모집","body":["매월 둘째 주 일요일 오전 9시에 함께 산에 가요.","모이는 곳: 학생회관 앞","회비: 한 달에 10,000원","신청: 010-1234-5678 (김민수)"]},"qs":[{"n":41,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["이 동아리는 매주 산에 갑니다.","일요일 아침에 산에 갑니다.","학생회관 앞에서 모입니다.","전화로 신청할 수 있습니다."],"ans":1,"exp":"Thông báo ghi \"매월 둘째 주 일요일\" (Chủ nhật tuần thứ hai mỗi tháng), tức là mỗi tháng một lần, không phải hằng tuần. Vì vậy ① không đúng.","vocab":[{"k":"매월","v":"hằng tháng"},{"k":"회비","v":"hội phí"}]}]},{"sec":"R","nums":[42],"passage":{"kind":"notice","title":"아르바이트생을 찾습니다","body":["하는 일: 커피 만들기, 카페 청소","일하는 날: 월요일~금요일","시간: 오후 2시~6시","시급: 11,000원","연락: 카페 '하늘' (02-345-6789)"]},"qs":[{"n":42,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["주말에는 일하지 않습니다.","하루에 네 시간 일합니다.","카페를 청소해야 합니다.","오전에 일합니다."],"ans":4,"exp":"Thời gian làm việc là \"오후 2시~6시\" (2 giờ đến 6 giờ chiều), không phải buổi sáng. Vì vậy ④ không đúng.","vocab":[{"k":"시급","v":"lương theo giờ"},{"k":"청소","v":"dọn dẹp"}]}]},{"sec":"R","nums":[43],"passage":{"kind":"text","body":["저는 지난주에 학교 근처로 이사했습니다. 새 집은 작지만 학교까지 걸어서 오 분 걸립니다. 그래서 아침에 늦게 일어나도 괜찮습니다."]},"qs":[{"n":43,"stem":null,"choices":["새 집은 아주 큽니다.","새 집은 학교에서 가깝습니다.","저는 다음 주에 이사할 겁니다.","저는 아침에 일찍 일어나야 합니다."],"ans":2,"exp":"\"학교까지 걸어서 오 분 걸립니다\" (đi bộ đến trường mất 5 phút), tức là nhà mới gần trường. Đáp án là ②.","vocab":[{"k":"걸어서","v":"đi bộ"},{"k":"걸리다","v":"mất (thời gian)"}]}]},{"sec":"R","nums":[44],"passage":{"kind":"text","body":["오늘 친구와 떡볶이를 먹었습니다. 떡볶이가 너무 매워서 물을 많이 마셨습니다. 다음에는 덜 매운 떡볶이를 먹고 싶습니다."]},"qs":[{"n":44,"stem":null,"choices":["저는 혼자 떡볶이를 먹었습니다.","떡볶이가 맵지 않았습니다.","저는 물을 많이 마셨습니다.","다음에도 아주 매운 떡볶이를 먹을 겁니다."],"ans":3,"exp":"\"떡볶이가 너무 매워서 물을 많이 마셨습니다\" (Tteokbokki cay quá nên đã uống nhiều nước). Đáp án là ③.","vocab":[{"k":"덜","v":"ít hơn, bớt"},{"k":"마시다","v":"uống"}]}]},{"sec":"R","nums":[45],"passage":{"kind":"text","body":["저는 매일 버스를 타고 회사에 갑니다. 그런데 오늘은 늦게 일어나서 택시를 탔습니다. 택시비가 비싸서 내일부터는 일찍 일어날 겁니다."]},"qs":[{"n":45,"stem":null,"choices":["저는 오늘 택시를 탔습니다.","저는 매일 택시를 탑니다.","택시비가 쌌습니다.","저는 오늘 일찍 일어났습니다."],"ans":1,"exp":"\"오늘은 늦게 일어나서 택시를 탔습니다\" (Hôm nay dậy muộn nên đã đi taxi). Đáp án là ①.","vocab":[{"k":"택시비","v":"tiền taxi"},{"k":"일찍","v":"sớm"}]}]},{"sec":"R","nums":[46],"passage":{"kind":"text","body":["저는 주말마다 등산을 합니다. 산에 올라가면 기분이 좋아지고 스트레스가 없어집니다. 앞으로도 계속 등산을 하고 싶습니다."]},"qs":[{"n":46,"stem":null,"choices":["저는 산 근처에 살고 싶습니다.","저는 주말에 쉬고 싶습니다.","저는 친구와 등산하고 싶습니다.","저는 계속 등산을 하고 싶습니다."],"ans":4,"exp":"Câu cuối \"앞으로도 계속 등산을 하고 싶습니다\" (Sau này tôi cũng muốn tiếp tục leo núi) là ý chính. Đáp án là ④.","vocab":[{"k":"계속","v":"tiếp tục"},{"k":"스트레스","v":"căng thẳng"}]}]},{"sec":"R","nums":[47],"passage":{"kind":"text","body":["우리 동아리에는 여러 나라 학생들이 있습니다. 같이 이야기하면서 다른 나라 문화를 배울 수 있습니다. 저는 동아리 활동이 정말 즐겁습니다."]},"qs":[{"n":47,"stem":null,"choices":["저는 다른 나라에 가고 싶습니다.","저는 새 동아리를 만들고 싶습니다.","저는 동아리 활동이 좋습니다.","저는 외국어를 공부하고 싶습니다."],"ans":3,"exp":"Người viết nói \"동아리 활동이 정말 즐겁습니다\" (Hoạt động câu lạc bộ thật vui). Ý chính là thích hoạt động câu lạc bộ, đáp án là ③.","vocab":[{"k":"문화","v":"văn hóa"},{"k":"활동","v":"hoạt động"}]}]},{"sec":"R","nums":[48],"passage":{"kind":"text","body":["저는 옷을 살 때 인터넷으로 자주 삽니다. 그런데 인터넷으로 산 옷은 사진과 다를 때가 많습니다. 그래서 이제부터는 가게에 가서 직접 입어 보고 사려고 합니다."]},"qs":[{"n":48,"stem":null,"choices":["인터넷 옷이 더 쌉니다.","옷은 직접 입어 보고 사고 싶습니다.","사진을 잘 찍고 싶습니다.","옷 가게에서 일하고 싶습니다."],"ans":2,"exp":"Câu cuối \"가게에 가서 직접 입어 보고 사려고 합니다\" (định đến cửa hàng mặc thử rồi mới mua) là ý chính. Đáp án là ②.","vocab":[{"k":"직접","v":"trực tiếp"},{"k":"다르다","v":"khác"}]}]},{"sec":"R","nums":[49,50],"passage":{"kind":"text","body":["저는 한국에 온 지 일 년이 되었습니다. 처음에는 은행에 가는 것이 어려웠습니다. 한국어를 잘 못해서 통장을 ( ㉠ ). 그때 한국 친구가 같이 가서 도와주었습니다. 지금은 혼자 은행에 가서 일을 볼 수 있습니다."]},"qs":[{"n":49,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["만들 수 없었습니다","만들고 싶었습니다","만들어 보았습니다","만들기로 했습니다"],"ans":1,"exp":"\"한국어를 잘 못해서\" (vì không giỏi tiếng Hàn) nên \"통장을 만들 수 없었습니다\" (đã không thể mở sổ tài khoản), sau đó bạn Hàn giúp đỡ. Đáp án là ①.","vocab":[{"k":"-(으)ㄹ 수 없다","v":"không thể"},{"k":"도와주다","v":"giúp đỡ"}]},{"n":50,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 한국에 온 지 두 달이 되었습니다.","저는 처음부터 은행 일을 혼자 했습니다.","한국 친구가 통장을 빌려주었습니다.","지금은 혼자 은행에 갈 수 있습니다."],"ans":4,"exp":"Câu cuối \"지금은 혼자 은행에 가서 일을 볼 수 있습니다\" (Bây giờ có thể một mình đến ngân hàng làm việc). Đáp án là ④. Người viết đến Hàn Quốc được một năm.","vocab":[{"k":"혼자","v":"một mình"},{"k":"일을 보다","v":"làm việc, giải quyết công việc"}]}]},{"sec":"R","nums":[51,52],"passage":{"kind":"text","body":["한국의 가을은 단풍이 아름답습니다. 10월이 되면 산의 나뭇잎이 빨간색과 노란색으로 바뀝니다. 단풍은 북쪽에서 먼저 시작해서 남쪽으로 ( ㉠ ). 그래서 사람들은 단풍을 보려고 여러 곳으로 여행을 갑니다. 단풍이 예쁜 산에는 주말마다 사람이 많습니다."]},"qs":[{"n":51,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["내려오지 않습니다","내려옵니다","올라갑니다","멈춥니다"],"ans":2,"exp":"Lá đỏ bắt đầu từ phía bắc rồi \"남쪽으로 내려옵니다\" (đi xuống phía nam). Đáp án là ②.","vocab":[{"k":"북쪽","v":"phía bắc"},{"k":"남쪽","v":"phía nam"}]},{"n":52,"stem":"무엇에 대한 이야기인지 맞는 것을 고르십시오.","choices":["한국의 여름 날씨","등산하는 방법","한국의 가을 단풍","주말 여행 계획"],"ans":3,"exp":"Cả đoạn văn nói về \"한국의 가을은 단풍이 아름답습니다\" (lá đỏ mùa thu Hàn Quốc rất đẹp). Đáp án là ③.","vocab":[{"k":"나뭇잎","v":"lá cây"},{"k":"바뀌다","v":"thay đổi"}]}]},{"sec":"R","nums":[53,54],"passage":{"kind":"text","body":["저는 지난달부터 학교 앞 카페에서 아르바이트를 하고 있습니다. 처음에는 커피 이름이 많아서 외우기가 어려웠습니다. 그래서 매일 일이 끝난 후에 메뉴를 ( ㉠ ). 지금은 커피를 빨리 만들 수 있게 되었습니다. 손님들이 맛있다고 말하면 정말 기쁩니다."]},"qs":[{"n":53,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["공부했습니다","잊어버렸습니다","주문했습니다","팔았습니다"],"ans":1,"exp":"Vì tên cà phê nhiều, khó nhớ (\"외우기가 어려웠습니다\"), nên mỗi ngày sau khi làm xong đã \"메뉴를 공부했습니다\" (học thực đơn). Đáp án là ①.","vocab":[{"k":"외우다","v":"học thuộc"},{"k":"메뉴","v":"thực đơn"}]},{"n":54,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 작년부터 카페에서 일했습니다.","커피 이름을 외우기가 쉬웠습니다.","저는 지금도 커피를 천천히 만듭니다.","손님들이 맛있다고 하면 기쁩니다."],"ans":4,"exp":"Câu cuối \"손님들이 맛있다고 말하면 정말 기쁩니다\" (Khi khách nói ngon thì tôi rất vui). Đáp án là ④. Người viết làm từ tháng trước và bây giờ pha nhanh.","vocab":[{"k":"-게 되다","v":"trở nên, được"},{"k":"기쁘다","v":"vui"}]}]},{"sec":"R","nums":[55,56],"passage":{"kind":"text","body":["한국에서는 버스나 지하철을 탈 때 교통 카드를 많이 사용합니다. 교통 카드는 편의점에서 쉽게 살 수 있습니다. 카드에 돈을 넣으면 여러 번 쓸 수 있습니다. ( ㉠ ) 버스에서 내린 후 30분 안에 다른 버스나 지하철을 타면 돈을 조금만 냅니다. 그래서 많은 사람들이 교통 카드를 씁니다."]},"qs":[{"n":55,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["그러면","그리고","그런데","그래서"],"ans":2,"exp":"Câu trước và câu sau đều nói về ưu điểm của thẻ giao thông, nên dùng \"그리고\" (và, ngoài ra) để bổ sung. Đáp án là ②.","vocab":[{"k":"그리고","v":"và, ngoài ra"},{"k":"교통 카드","v":"thẻ giao thông"}]},{"n":56,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["교통 카드는 편의점에서 살 수 있습니다.","교통 카드는 한 번만 쓸 수 있습니다.","버스에서 내린 후 30분 안에 다시 타면 돈을 많이 냅니다.","교통 카드를 쓰는 사람이 적습니다."],"ans":1,"exp":"Đoạn văn có câu \"교통 카드는 편의점에서 쉽게 살 수 있습니다\" (Có thể dễ dàng mua thẻ giao thông ở cửa hàng tiện lợi). Đáp án là ①.","vocab":[{"k":"편의점","v":"cửa hàng tiện lợi"},{"k":"내리다","v":"xuống (xe)"}]}]},{"sec":"R","nums":[57],"passage":{"kind":"text","body":["(가) 그래서 부동산에 가서 방을 몇 개 보았습니다.","(나) 저는 요즘 새 집을 찾고 있습니다.","(다) 그중에서 역 근처에 있는 방이 제일 마음에 들었습니다.","(라) 지금 사는 집이 회사에서 너무 멀기 때문입니다."]},"qs":[{"n":57,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(가)-(라)-(다)","(라)-(나)-(가)-(다)","(나)-(라)-(가)-(다)","(라)-(가)-(나)-(다)"],"ans":3,"exp":"Bắt đầu bằng (나) \"새 집을 찾고 있습니다\" (đang tìm nhà mới), tiếp theo là lý do (라) \"-기 때문입니다\", rồi (가) \"그래서 부동산에 가서...\" (vì vậy đến văn phòng bất động sản), cuối cùng (다) \"그중에서...\" (trong số đó). Đáp án là ③.","vocab":[{"k":"부동산","v":"văn phòng bất động sản"},{"k":"마음에 들다","v":"vừa ý, thích"}]}]},{"sec":"R","nums":[58],"passage":{"kind":"text","body":["(가) 그래서 우리는 다음 영화를 보기로 했습니다.","(나) 어제 친구와 영화를 보러 영화관에 갔습니다.","(다) 그런데 보고 싶은 영화의 표가 다 팔렸습니다.","(라) 기다리는 동안 친구와 카페에서 이야기를 했습니다."]},"qs":[{"n":58,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(다)-(나)-(가)-(라)","(나)-(다)-(가)-(라)","(나)-(가)-(다)-(라)","(다)-(가)-(나)-(라)"],"ans":2,"exp":"(나) đến rạp chiếu phim → (다) \"그런데 ... 표가 다 팔렸습니다\" (nhưng vé đã bán hết) → (가) \"그래서 다음 영화를 보기로 했습니다\" (vì vậy quyết định xem suất sau) → (라) \"기다리는 동안\" (trong lúc chờ). Đáp án là ②.","vocab":[{"k":"팔리다","v":"được bán"},{"k":"-기로 하다","v":"quyết định"}]}]},{"sec":"R","nums":[59,60],"passage":{"kind":"text","body":["저는 매주 토요일에 등산 동아리 사람들과 산에 갑니다. ( ㉠ ) 처음에는 산에 올라가는 것이 너무 힘들어서 중간에 자주 쉬었습니다. ( ㉡ ) 하지만 매주 가니까 점점 덜 힘들어졌습니다. ( ㉢ ) 지난주에는 처음으로 산 위까지 한 번도 쉬지 않고 올라갔습니다. ( ㉣ ) 다음 달에는 동아리 사람들과 더 높은 산에 가 보기로 했습니다."]},"qs":[{"n":59,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.","choices":["㉠","㉡","㉢","㉣"],"ans":4,"exp":"Câu \"그때 산 위에서 본 경치는...\" (Cảnh nhìn từ đỉnh núi lúc đó...) phải đứng sau câu \"지난주에는 처음으로 산 위까지 ... 올라갔습니다\" (tuần trước lần đầu leo lên tới đỉnh). \"그때\" chỉ lúc đó. Đáp án là ④ (㉣).","vocab":[{"k":"경치","v":"phong cảnh"},{"k":"그때","v":"lúc đó"}],"box":"그때 산 위에서 본 경치는 정말 아름다웠습니다."},{"n":60,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 매주 일요일에 산에 갑니다.","저는 처음부터 쉬지 않고 올라갔습니다.","지금은 전보다 산에 올라가는 것이 덜 힘듭니다.","다음 달에는 혼자 높은 산에 갈 겁니다."],"ans":3,"exp":"Đoạn văn có câu \"매주 가니까 점점 덜 힘들어졌습니다\" (Vì đi hằng tuần nên dần dần bớt mệt hơn). Đáp án là ③.","vocab":[{"k":"점점","v":"dần dần"},{"k":"힘들다","v":"vất vả, mệt"}]}]},{"sec":"R","nums":[61,62],"passage":{"kind":"text","body":["지난주에 백화점에서 동생 생일 선물로 티셔츠를 샀습니다. 그런데 동생이 입어 보니까 옷이 너무 작았습니다. 그래서 어제 동생과 같이 백화점에 가서 큰 옷으로 ( ㉠ ). 동생은 새 티셔츠가 마음에 든다고 했습니다. 저는 다음부터 옷을 살 때 사이즈를 먼저 물어보려고 합니다."]},"qs":[{"n":61,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["바꿨습니다","빌렸습니다","버렸습니다","만들었습니다"],"ans":1,"exp":"Áo quá nhỏ nên đến cửa hàng \"큰 옷으로 바꿨습니다\" (đã đổi sang áo lớn hơn). \"N(으)로 바꾸다\" nghĩa là đổi sang N. Đáp án là ①.","vocab":[{"k":"바꾸다","v":"đổi"},{"k":"사이즈","v":"kích cỡ"}]},{"n":62,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 제 옷을 샀습니다.","동생은 혼자 백화점에 갔습니다.","처음 산 티셔츠는 너무 컸습니다.","동생은 새 티셔츠를 좋아합니다."],"ans":4,"exp":"\"동생은 새 티셔츠가 마음에 든다고 했습니다\" (Em nói rất thích áo phông mới). Đáp án là ④. Áo đầu tiên quá nhỏ, và hai người đi cùng nhau.","vocab":[{"k":"백화점","v":"trung tâm thương mại"},{"k":"선물","v":"quà"}]}]},{"sec":"R","nums":[63,64],"passage":{"kind":"email","title":"엘리베이터 점검 안내","body":["받는 사람: 한국아파트 주민","보내는 사람: 한국아파트 관리사무소","안녕하세요. 관리사무소입니다.","이번 주 목요일 오전 10시부터 오후 2시까지 엘리베이터를 점검합니다.","점검하는 동안에는 엘리베이터를 사용할 수 없습니다.","무거운 물건을 옮기거나 이사를 하실 분은 다른 날을 이용해 주십시오.","불편을 드려서 죄송합니다."]},"qs":[{"n":63,"stem":"왜 윗글을 썼는지 맞는 것을 고르십시오.","choices":["이사 날짜를 알려 주려고","엘리베이터 점검 시간을 알려 주려고","관리사무소 위치를 알려 주려고","무거운 물건 옮기는 방법을 알려 주려고"],"ans":2,"exp":"Email thông báo \"목요일 오전 10시부터 오후 2시까지 엘리베이터를 점검합니다\" (kiểm tra thang máy từ 10 giờ sáng đến 2 giờ chiều thứ Năm). Mục đích là báo thời gian kiểm tra, đáp án là ②.","vocab":[{"k":"점검하다","v":"kiểm tra, bảo trì"},{"k":"주민","v":"cư dân"}]},{"n":64,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["점검은 오후 네 시에 끝납니다.","점검하는 동안 엘리베이터를 탈 수 있습니다.","목요일 오전에는 이사를 하지 않는 것이 좋습니다.","엘리베이터는 금요일에 점검합니다."],"ans":3,"exp":"Thang máy được kiểm tra từ 10 giờ sáng thứ Năm, và người chuyển nhà được đề nghị \"다른 날을 이용해 주십시오\" (hãy chọn ngày khác). Vậy sáng thứ Năm không nên chuyển nhà, đáp án là ③.","vocab":[{"k":"옮기다","v":"chuyển, di dời"},{"k":"사용하다","v":"sử dụng"}]}]},{"sec":"R","nums":[65,66],"passage":{"kind":"text","body":["떡볶이는 한국 사람들이 좋아하는 음식입니다. 떡볶이는 떡과 고추장으로 만들어서 보통 맵습니다. 그런데 옛날에는 떡볶이가 맵지 않았습니다. 고추장 대신 간장을 넣어서 ( ㉠ ). 요즘에는 치즈 떡볶이, 크림 떡볶이처럼 여러 가지 떡볶이가 있습니다. 그래서 매운 음식을 못 먹는 사람들도 떡볶이를 즐길 수 있습니다."]},"qs":[{"n":65,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["만들지 않았습니다","맵게 만들었습니다","빨갛게 만들었습니다","만들었기 때문입니다"],"ans":4,"exp":"Câu này giải thích lý do ngày xưa tteokbokki không cay: \"간장을 넣어서 만들었기 때문입니다\" (vì được làm bằng xì dầu thay cho tương ớt). Đáp án là ④.","vocab":[{"k":"-기 때문이다","v":"là vì"},{"k":"대신","v":"thay cho"}]},{"n":66,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["옛날 떡볶이에는 간장을 넣었습니다.","요즘 떡볶이는 한 가지만 있습니다.","매운 음식을 못 먹으면 떡볶이를 먹을 수 없습니다.","떡볶이는 고추장으로 만들어서 맵지 않습니다."],"ans":1,"exp":"Đoạn văn nói ngày xưa \"고추장 대신 간장을 넣어서\" (cho xì dầu thay cho tương ớt), nên đáp án là ①. Ngày nay có nhiều loại tteokbokki.","vocab":[{"k":"고추장","v":"tương ớt"},{"k":"즐기다","v":"thưởng thức"}]}]},{"sec":"R","nums":[67,68],"passage":{"kind":"text","body":["영화관에서는 다른 사람을 위해 지켜야 할 것들이 있습니다. 먼저 영화가 시작되기 전에 휴대 전화를 꺼야 합니다. 영화를 보는 동안 휴대 전화 불빛이 있으면 다른 사람이 영화에 집중할 수 없기 때문입니다. 그리고 옆 사람과 큰 소리로 이야기하면 안 됩니다. 또 앞 의자를 발로 차지 않도록 ( ㉠ ). 이런 것들을 잘 지키면 모두 즐겁게 영화를 볼 수 있습니다."]},"qs":[{"n":67,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["빨리 앉아야 합니다","조심해야 합니다","크게 웃어야 합니다","자리를 바꿔야 합니다"],"ans":2,"exp":"\"-지 않도록 조심해야 합니다\" nghĩa là phải cẩn thận để không làm gì đó: phải cẩn thận để không đá vào ghế phía trước. Đáp án là ②.","vocab":[{"k":"조심하다","v":"cẩn thận"},{"k":"차다","v":"đá"}]},{"n":68,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["영화가 시작된 후에 휴대 전화를 끄면 됩니다.","영화관에서는 옆 사람과 크게 이야기해도 됩니다.","휴대 전화 불빛은 다른 사람에게 방해가 됩니다.","앞 의자에 발을 올려도 괜찮습니다."],"ans":3,"exp":"Đoạn văn nói khi có ánh sáng điện thoại thì \"다른 사람이 영화에 집중할 수 없기 때문입니다\" (người khác không thể tập trung xem phim), tức là gây phiền cho người khác. Đáp án là ③.","vocab":[{"k":"불빛","v":"ánh sáng"},{"k":"집중하다","v":"tập trung"}]}]},{"sec":"R","nums":[69,70],"passage":{"kind":"text","body":["저는 두 달 전에 회사 때문에 서울로 이사했습니다. 처음에는 아는 사람이 없어서 많이 외로웠습니다. 주말에도 집에서 혼자 텔레비전만 봤습니다. 그러다가 동네 도서관에서 한국 요리 수업이 있다는 것을 알게 되었습니다. 저는 요리를 좋아해서 바로 신청했습니다. 그 수업에서 동네 사람들을 많이 ( ㉠ ). 지금은 주말마다 그 사람들과 같이 요리도 하고 산책도 합니다."]},"qs":[{"n":69,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["알게 되었습니다","잊어버렸습니다","기다렸습니다","가르쳤습니다"],"ans":1,"exp":"Nhờ lớp học nấu ăn mà \"동네 사람들을 많이 알게 되었습니다\" (đã quen biết nhiều người trong khu phố), vì bây giờ cuối tuần cùng họ nấu ăn, đi dạo. Đáp án là ①.","vocab":[{"k":"외롭다","v":"cô đơn"},{"k":"알게 되다","v":"biết được, quen biết"}]},{"n":70,"stem":"이 글의 내용으로 알 수 있는 것을 고르십시오.","choices":["저는 서울에서 태어났습니다.","저는 요리 수업을 가르칩니다.","저는 지금도 주말에 혼자 집에 있습니다.","저는 요리 수업에서 이웃을 사귀었습니다."],"ans":4,"exp":"Người viết quen nhiều người trong khu phố ở lớp nấu ăn và bây giờ cuối tuần cùng họ nấu ăn, đi dạo, tức là đã kết bạn với hàng xóm. Đáp án là ④. Người viết chuyển đến Seoul hai tháng trước và là học viên của lớp.","vocab":[{"k":"이웃","v":"hàng xóm"},{"k":"사귀다","v":"kết bạn"}]}]}]},{"test":4,"groups":[{"sec":"L","nums":[1],"audio":[{"s":"W","t":"눈이 와요?"}],"qs":[{"n":1,"stem":null,"choices":["네, 눈이 커요.","네, 눈이 와요.","아니요, 눈이 많아요.","아니요, 눈을 좋아해요."],"ans":2,"exp":"Câu hỏi \"눈이 와요?\" (Tuyết có rơi không?). Trả lời \"네\" thì phải lặp lại \"눈이 와요\" (tuyết đang rơi), nên đáp án là ②.","vocab":[{"k":"눈","v":"tuyết"},{"k":"오다","v":"đến, rơi (mưa/tuyết)"}]}]},{"sec":"L","nums":[2],"audio":[{"s":"M","t":"휴대폰이 있어요?"}],"qs":[{"n":2,"stem":null,"choices":["네, 휴대폰이 싸요.","네, 휴대폰이 아니에요.","아니요, 휴대폰이 없어요.","아니요, 휴대폰이 많아요."],"ans":3,"exp":"Câu hỏi \"휴대폰이 있어요?\" (Bạn có điện thoại không?). Câu trả lời phủ định đúng là \"아니요, 휴대폰이 없어요\" (Không, tôi không có điện thoại), nên đáp án là ③.","vocab":[{"k":"휴대폰","v":"điện thoại di động"},{"k":"있다/없다","v":"có/không có"}]}]},{"sec":"L","nums":[3],"audio":[{"s":"W","t":"언제 스키장에 가요?"}],"qs":[{"n":3,"stem":null,"choices":["친구하고 가요.","버스로 가요.","강원도에 가요.","주말에 가요."],"ans":4,"exp":"\"언제\" hỏi về thời gian (khi nào). Chỉ \"주말에 가요\" (đi vào cuối tuần) trả lời về thời gian, nên đáp án là ④.","vocab":[{"k":"언제","v":"khi nào"},{"k":"스키장","v":"khu trượt tuyết"},{"k":"주말","v":"cuối tuần"}]}]},{"sec":"L","nums":[4],"audio":[{"s":"M","t":"빵을 몇 개 샀어요?"}],"qs":[{"n":4,"stem":null,"choices":["세 개 샀어요.","빵집에서 샀어요.","어제 샀어요.","동생이 샀어요."],"ans":1,"exp":"\"몇 개\" hỏi về số lượng (mấy cái). \"세 개 샀어요\" (đã mua ba cái) là câu trả lời phù hợp, nên đáp án là ①.","vocab":[{"k":"몇 개","v":"mấy cái"},{"k":"빵","v":"bánh mì"}]}]},{"sec":"L","nums":[5],"audio":[{"s":"W","t":"생일 축하해요."}],"qs":[{"n":5,"stem":null,"choices":["괜찮아요.","고마워요.","잘 먹겠습니다.","처음 뵙겠습니다."],"ans":2,"exp":"Khi được chúc \"생일 축하해요\" (Chúc mừng sinh nhật), ta đáp lại \"고마워요\" (Cảm ơn), nên đáp án là ②.","vocab":[{"k":"생일","v":"sinh nhật"},{"k":"축하하다","v":"chúc mừng"}]}]},{"sec":"L","nums":[6],"audio":[{"s":"M","t":"늦어서 죄송합니다."}],"qs":[{"n":6,"stem":null,"choices":["축하합니다.","잘 부탁합니다.","괜찮습니다.","어서 오세요."],"ans":3,"exp":"Khi người khác xin lỗi \"늦어서 죄송합니다\" (Xin lỗi vì đến muộn), ta đáp \"괜찮습니다\" (Không sao đâu), nên đáp án là ③.","vocab":[{"k":"늦다","v":"muộn, trễ"},{"k":"죄송하다","v":"xin lỗi"}]}]},{"sec":"L","nums":[7],"audio":[{"s":"M","t":"머리를 어떻게 해 드릴까요?"},{"s":"W","t":"짧게 잘라 주세요."}],"qs":[{"n":7,"stem":null,"choices":["미용실","빵집","병원","우체국"],"ans":1,"exp":"\"머리를 어떻게 해 드릴까요?\" (Tôi làm tóc t u trượt tuyết với bạn bè) vào cuối tuần. Người phụ nữ không biết trượt (\"못 타요\"), người đàn ông sẽ dạy. Đáp án là ①.","vocab":[{"k":"스키를 타다","v":"trượt tuyết"},{"k":"가르치다","v":"dạy"}]}]},{"sec":"L","nums":[18],"audio":[{"s":"M","t":"여보세요, 하나 미용실이지요? 내일 오후에 머리를 자르고 싶은데요."},{"s":"W","t":"죄송하지만 내일 오후는 예약이 다 찼어요. 오전 열한 시는 괜찮으세요?"},{"s":"M","t":"네, 좋아요. 그럼 열한 시에 갈게요."},{"s":"W","t":"네, 성함을 말씀해 주세요."}],"qs":[{"n":18,"stem":null,"choices":["남자는 내일 오후에 미용실에 갑니다.","여자는 머리를 자르고 싶어 합니다.","남자는 내일 오전에 머리를 자를 겁니다.","미용실은 내일 문을 닫습니다."],"ans":3,"exp":"Buổi chiều đã kín lịch (\"예약이 다 찼어요\"), nên người đàn ông đồng ý đến lúc 11 giờ sáng (\"열한 시에 갈게요\"). Đáp án là ③.","vocab":[{"k":"예약","v":"đặt lịch, đặt trước"},{"k":"차다","v":"đầy, kín"}]}]},{"sec":"L","nums":[19],"audio":[{"s":"W","t":"휴대폰 화면이 깨졌어요. 고칠 수 있어요?"},{"s":"M","t":"네, 고칠 수 있어요. 그런데 한 시간쯤 걸려요."},{"s":"W","t":"그럼 점심을 먹고 다시 올게요."},{"s":"M","t":"네, 두 시까지 오세요."}],"qs":[{"n":19,"stem":null,"choices":["여자는 새 휴대폰을 샀습니다.","남자는 점심을 먹으러 갑니다.","휴대폰을 고치는 데 하루가 걸립니다.","여자는 점심을 먹은 후에 다시 옵니다."],"ans":4,"exp":"Người phụ nữ nói \"점심을 먹고 다시 올게요\" (ăn trưa xong tôi sẽ quay lại). Sửa điện thoại mất khoảng một tiếng, không phải một ngày. Đáp án là ④.","vocab":[{"k":"화면","v":"màn hình"},{"k":"깨지다","v":"bị vỡ"},{"k":"고치다","v":"sửa"}]}]},{"sec":"L","nums":[20],"audio":[{"s":"M","t":"기숙사 생활이 어때요?"},{"s":"W","t":"좋아요. 학교가 가까워서 아침에 늦게 일어나도 돼요."},{"s":"M","t":"룸메이트도 있어요?"},{"s":"W","t":"네, 일본 친구하고 같이 방을 써요."}],"qs":[{"n":20,"stem":null,"choices":["여자는 혼자 삽니다.","여자는 일본 친구와 방을 같이 씁니다.","기숙사는 학교에서 멉니다.","여자는 아침에 일찍 일어나야 합니다."],"ans":2,"exp":"Người phụ nữ nói \"일본 친구하고 같이 방을 써요\" (ở chung phòng với bạn người Nhật). Ký túc xá gần trường nên có thể dậy muộn. Đáp án là ②.","vocab":[{"k":"기숙사","v":"ký túc xá"},{"k":"룸메이트","v":"bạn cùng phòng"}]}]},{"sec":"L","nums":[21],"audio":[{"s":"W","t":"이 식당은 베트남 음식을 팔아요. 쌀국수가 아주 맛있어요."},{"s":"M","t":"저는 베트남 음식을 한 번도 안 먹어 봤어요."},{"s":"W","t":"그래요? 그럼 오늘 먹어 보세요. 제가 살게요."},{"s":"M","t":"고마워요. 다음에는 제가 한국 음식을 살게요."}],"qs":[{"n":21,"stem":null,"choices":["남자는 쌀국수를 자주 먹습니다.","두 사람은 한국 식당에 왔습니다.","여자가 오늘 음식값을 냅니다.","남자는 다음에 한국 음식을 만들 겁니다."],"ans":3,"exp":"Người phụ nữ nói \"제가 살게요\" (tôi sẽ mời/trả tiền), nên hôm nay người phụ nữ trả tiền ăn. Người đàn ông chưa từng ăn món Việt. Đáp án là ③.","vocab":[{"k":"쌀국수","v":"phở"},{"k":"사다","v":"mua; mời (trả tiền)"}]}]},{"sec":"L","nums":[22],"audio":[{"s":"M","t":"겨울에는 너무 추워서 밖에 나가기 싫어요."},{"s":"W","t":"그래도 가끔 밖에서 운동을 하면 건강에 좋아요."},{"s":"M","t":"추운데 감기에 걸리지 않을까요?"},{"s":"W","t":"옷을 따뜻하게 입으면 괜찮아요. 저는 겨울에도 매일 공원에서 걸어요."}],"qs":[{"n":22,"stem":null,"choices":["겨울에도 밖에서 운동하는 것이 좋습니다.","겨울에는 집에 있는 것이 좋습니다.","감기에 걸리면 병원에 가야 합니다.","공원은 여름에 가는 것이 좋습니다."],"ans":1,"exp":"Người phụ nữ nói \"밖에서 운동을 하면 건강에 좋아요\" (tập thể dục ngoài trời tốt cho sức khỏe) và mùa đông cô ấy vẫn đi bộ mỗi ngày. Đáp án là ①.","vocab":[{"k":"건강","v":"sức khỏe"},{"k":"감기에 걸리다","v":"bị cảm"}]}]},{"sec":"L","nums":[23],"audio":[{"s":"M","t":"여행을 가면 사진을 많이 찍어요?"},{"s":"W","t":"아니요, 저는 사진을 조금만 찍어요."},{"s":"M","t":"왜요? 나중에 보면 좋잖아요."},{"s":"W","t":"사진을 찍으면 경치를 잘 못 봐요. 눈으로 직접 많이 보는 것이 더 좋아요."}],"qs":[{"n":23,"stem":null,"choices":["여행 사진을 많이 찍어야 합니다.","좋은 카메라가 필요합니다.","여행은 친구와 같이 가는 것이 좋습니다.","경치를 눈으로 직접 보는 것이 좋습니다."],"ans":4,"exp":"Người phụ nữ nói \"눈으로 직접 많이 보는 것이 더 좋아요\" (tự mắt ngắm nhìn thì tốt hơn). Đáp án là ④.","vocab":[{"k":"경치","v":"phong cảnh"},{"k":"직접","v":"trực tiếp"}]}]},{"sec":"L","nums":[24],"audio":[{"s":"M","t":"저는 친구하고 약속을 할 때 보통 문자를 보내요."},{"s":"W","t":"저는 전화를 하는 것이 더 좋아요."},{"s":"M","t":"왜요? 문자가 더 편하지 않아요?"},{"s":"W","t":"문자는 잘못 읽을 수 있어요. 전화로 이야기하면 약속 시간을 정확하게 알 수 있어요."}],"qs":[{"n":24,"stem":null,"choices":["문자를 보내는 것이 편합니다.","약속은 전화로 하는 것이 좋습니다.","약속 시간을 잘 지켜야 합니다.","친구를 자주 만나는 것이 좋습니다."],"ans":2,"exp":"Người phụ nữ nói \"전화를 하는 것이 더 좋아요\" và gọi điện thì biết chính xác giờ hẹn. Suy nghĩ chính: hẹn bằng điện thoại thì tốt hơn, đáp án ②.","vocab":[{"k":"약속","v":"cuộc hẹn"},{"k":"문자","v":"tin nhắn"},{"k":"정확하다","v":"chính xác"}]}]},{"sec":"L","nums":[25,26],"audio":[{"s":"W","t":"안내 말씀 드리겠습니다. 오늘 한국박물관을 찾아 주셔서 감사합니다. 저희 박물관은 오후 여섯 시에 문을 닫습니다. 지금부터 삼십 분 후에 이 층에서 '옛날 옷 입어 보기' 행사가 있습니다. 행사에 참여하고 싶은 분은 이 층 안내 데스크로 오십시오. 행사 장소에서는 사진을 찍을 수 있지만 전시실 안에서는 사진을 찍으시면 안 됩니다."}],"qs":[{"n":25,"stem":"여자가 왜 이 이야기를 하고 있는지 고르십시오.","choices":["박물관 위치를 설명하려고","옛날 옷을 팔려고","박물관 행사를 안내하려고","박물관 문 닫는 시간을 바꾸려고"],"ans":3,"exp":"Người phụ nữ thông báo sự kiện \"옛날 옷 입어 보기\" (mặc thử trang phục xưa) sau 30 phút và cách tham gia. Mục đích là hướng dẫn về sự kiện, đáp án ③.","vocab":[{"k":"안내","v":"hướng dẫn, thông báo"},{"k":"행사","v":"sự kiện"},{"k":"참여하다","v":"tham gia"}]},{"n":26,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["행사는 일 층에서 합니다.","박물관은 오후 다섯 시에 문을 닫습니다.","전시실 안에서 사진을 찍을 수 있습니다.","행사는 삼십 분 후에 시작합니다."],"ans":4,"exp":"\"지금부터 삼십 분 후에 ... 행사가 있습니다\" (30 phút nữa có sự kiện). Sự kiện ở tầng 2, bảo tàng đóng cửa lúc 6 giờ, trong phòng trưng bày không được chụp ảnh. Đáp án là ④.","vocab":[{"k":"전시실","v":"phòng trưng bày"},{"k":"시작하다","v":"bắt đầu"}]}]},{"sec":"L","nums":[27,28],"audio":[{"s":"M","t":"수진 씨, 휴대폰을 바꿨어요?"},{"s":"W","t":"네, 지난주에 새로 샀어요. 전에 쓰던 휴대폰은 배터리가 너무 빨리 없어졌어요."},{"s":"M","t":"새 휴대폰은 사진이 잘 나와요?"},{"s":"W","t":"네, 카메라가 좋아서 밤에 찍어도 사진이 밝게 나와요."},{"s":"M","t":"저도 바꾸고 싶은데 값이 비싸지요?"},{"s":"W","t":"조금 비싸요. 그런데 학생은 학교 앞 가게에서 십 퍼센트 싸게 살 수 있어요."},{"s":"M","t":"그래요? 이번 주말에 한번 가 봐야겠어요."}],"qs":[{"n":27,"stem":"두 사람이 무엇에 대해 이야기를 하고 있는지 고르십시오.","choices":["사진 찍는 방법","새로 산 휴대폰","휴대폰 가게 위치","주말 계획"],"ans":2,"exp":"Cả cuộc hội thoại nói về chiếc điện thoại người phụ nữ \"지난주에 새로 샀어요\" (mới mua tuần trước): pin, camera, giá. Đáp án là ②.","vocab":[{"k":"바꾸다","v":"đổi, thay"},{"k":"배터리","v":"pin"}]},{"n":28,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["새 휴대폰은 밤에도 사진이 밝게 나옵니다.","여자는 어제 휴대폰을 샀습니다.","남자는 지난주에 휴대폰을 바꿨습니다.","학생은 휴대폰을 반값에 살 수 있습니다."],"ans":1,"exp":"Người phụ nữ nói \"밤에 찍어도 사진이 밝게 나와요\" (chụp ban đêm ảnh vẫn sáng). Cô ấy mua tuần trước, học sinh chỉ được giảm 10%. Đáp án là ①.","vocab":[{"k":"밝다","v":"sáng"},{"k":"퍼센트","v":"phần trăm"}]}]},{"sec":"L","nums":[29,30],"audio":[{"s":"W","t":"사장님, 이 빵집은 언제 여셨어요?"},{"s":"M","t":"오 년 전에 열었어요. 처음에는 손님이 별로 없었어요."},{"s":"W","t":"지금은 아침마다 손님들이 줄을 서는데요. 왜 이렇게 인기가 많아요?"},{"s":"M","t":"매일 새벽 네 시에 일어나서 그날 팔 빵을 만들어요. 어제 만든 빵은 팔지 않아요."},{"s":"W","t":"그런데 왜 빵집을 하게 되셨어요?"},{"s":"M","t":"어렸을 때 어머니가 만들어 주신 빵이 정말 맛있었어요. 그 맛을 많은 사람에게 알려 주고 싶어서 빵집을 시작했어요."}],"qs":[{"n":29,"stem":"남자가 왜 빵집을 시작했는지 고르십시오.","choices":["빵을 싸게 팔고 싶어서","새벽에 일하는 것을 좋아해서","어머니가 빵집을 하셔서","어머니가 만든 빵 맛을 알리고 싶어서"],"ans":4,"exp":"Người đàn ông nói \"그 맛을 많은 사람에게 알려 주고 싶어서 빵집을 시작했어요\" (muốn giới thiệu hương vị bánh mẹ làm cho nhiều người). Đáp án là ④.","vocab":[{"k":"사장님","v":"ông/bà chủ"},{"k":"알리다","v":"cho biết, giới thiệu"},{"k":"시작하다","v":"bắt đầu"}]},{"n":30,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["남자는 십 년 전에 빵집을 열었습니다.","이 빵집은 처음부터 손님이 많았습니다.","남자는 어제 만든 빵을 팔지 않습니다.","남자는 저녁에 빵을 만듭니다."],"ans":3,"exp":"Người đàn ông nói \"어제 만든 빵은 팔지 않아요\" (không bán bánh làm từ hôm qua). Tiệm mở 5 năm trước, lúc đầu ít khách, làm bánh lúc 4 giờ sáng. Đáp án là ③.","vocab":[{"k":"새벽","v":"rạng sáng"},{"k":"손님","v":"khách hàng"},{"k":"줄을 서다","v":"xếp hàng"}]}]},{"sec":"R","nums":[31],"passage":{"kind":"text","body":["저는 스키를 탑니다. 동생은 스케이트를 탑니다."]},"qs":[{"n":31,"stem":null,"choices":["운동","여행","날씨","주말"],"ans":1,"exp":"\"스키\" (trượt tuyết) và \"스케이트\" (trượt băng) đều là môn thể thao, nên đáp án là ① 운동.","vocab":[{"k":"타다","v":"chơi (trượt), đi (xe)"},{"k":"운동","v":"thể thao, vận động"}]}]},{"sec":"R","nums":[32],"passage":{"kind":"text","body":["빵을 삽니다. 우유도 삽니다."]},"qs":[{"n":32,"stem":null,"choices":["요일","가족","쇼핑","공부"],"ans":3,"exp":"\"삽니다\" (mua) bánh mì và sữa là việc mua sắm, nên đáp án là ③ 쇼핑.","vocab":[{"k":"우유","v":"sữa"},{"k":"쇼핑","v":"mua sắm"}]}]},{"sec":"R","nums":[33],"passage":{"kind":"text","body":["저는 하노이에서 왔습니다. 하노이는 베트남에 있습니다."]},"qs":[{"n":33,"stem":null,"choices":["고향","나이","직업","얼굴"],"ans":1,"exp":"\"하노이에서 왔습니다\" (tôi đến từ Hà Nội) nói về nơi mình sinh ra, nên đáp án là ① 고향.","vocab":[{"k":"오다","v":"đến"},{"k":"고향","v":"quê hương"}]}]},{"sec":"R","nums":[34],"passage":{"kind":"text","body":["미용실에 갑니다. 머리(    ) 자릅니다."]},"qs":[{"n":34,"stem":null,"choices":["가","를","에","의"],"ans":2,"exp":"\"자르다\" (cắt) là ngoại động từ, cần tân ngữ với trợ từ \"를\": \"머리를 자릅니다\" (cắt tóc). Đáp án là ②.","vocab":[{"k":"머리","v":"tóc, đầu"},{"k":"자르다","v":"cắt"}]}]},{"sec":"R","nums":[35],"passage":{"kind":"text","body":["눈이 옵니다. 날씨가 (    ) 춥습니다."]},"qs":[{"n":35,"stem":null,"choices":["같이","먼저","아까","아주"],"ans":4,"exp":"Phó từ chỉ mức độ đứng trước tính từ \"춥습니다\" là \"아주\" (rất): \"아주 춥습니다\" (rất lạnh). Đáp án là ④.","vocab":[{"k":"날씨","v":"thời tiết"},{"k":"아주","v":"rất"},{"k":"춥다","v":"lạnh"}]}]},{"sec":"R","nums":[36],"passage":{"kind":"text","body":["사진을 찍고 싶습니다. (    )가 필요합니다."]},"qs":[{"n":36,"stem":null,"choices":["카메라","우산","시계","의자"],"ans":1,"exp":"Muốn chụp ảnh (\"사진을 찍고 싶습니다\") thì cần \"카메라\" (máy ảnh). Đáp án là ①.","vocab":[{"k":"필요하다","v":"cần"},{"k":"카메라","v":"máy ảnh"}]}]},{"sec":"R","nums":[37],"passage":{"kind":"text","body":["빵을 사고 싶습니다. (    )에 갑니다."]},"qs":[{"n":37,"stem":null,"choices":["서점","약국","빵집","은행"],"ans":3,"exp":"Muốn mua bánh mì (\"빵을 사고 싶습니다\") thì đến \"빵집\" (tiệm bánh mì). Đáp án là ③.","vocab":[{"k":"빵집","v":"tiệm bánh mì"}]}]},{"sec":"R","nums":[38],"passage":{"kind":"text","body":["스키장에 갔습니다. 스키를 (    )."]},"qs":[{"n":38,"stem":null,"choices":["썼습니다","탔습니다","입었습니다","만났습니다"],"ans":2,"exp":"Trong tiếng Hàn nói \"스키를 타다\" (trượt tuyết). Ở khu trượt tuyết thì \"스키를 탔습니다\", đáp án ②.","vocab":[{"k":"스키장","v":"khu trượt tuyết"},{"k":"타다","v":"trượt, cưỡi, đi"}]}]},{"sec":"R","nums":[39],"passage":{"kind":"text","body":["휴대폰이 너무 (    ). 그래서 안 샀습니다."]},"qs":[{"n":39,"stem":null,"choices":["비쌉니다","좋습니다","예쁩니다","가볍습니다"],"ans":1,"exp":"\"그래서 안 샀습니다\" (vì vậy tôi đã không mua) nên lý do phải là điều không tốt: \"너무 비쌉니다\" (quá đắt). Đáp án là ①.","vocab":[{"k":"비싸다","v":"đắt"},{"k":"그래서","v":"vì vậy"}]}]},{"sec":"R","nums":[40],"passage":{"kind":"notice","title":"겨울 스키 캠프","body":["날짜: 1월 10일(토) ~ 1월 11일(일)","장소: 하늘 스키장","요금: 1인 80,000원 (버스·점심 포함)","신청: 1월 5일까지 학생회관 2층","※ 스키를 못 타도 괜찮습니다. 선생님이 가르쳐 드립니다."]},"qs":[{"n":40,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["스키장에 버스를 타고 갑니다.","이틀 동안 스키장에 있습니다.","스키를 못 타는 사람도 갈 수 있습니다.","1월 10일까지 신청해야 합니다."],"ans":4,"exp":"Hạn đăng ký là \"1월 5일까지\" (đến ngày 5 tháng 1), không phải ngày 10. Vậy câu sai là ④.","vocab":[{"k":"신청","v":"đăng ký"},{"k":"포함","v":"bao gồm"},{"k":"요금","v":"chi phí"}]}]},{"sec":"R","nums":[41],"passage":{"kind":"notice","title":"행복 빵집","body":["영업시간: 오전 7시 ~ 오후 9시","매주 월요일은 쉽니다.","오후 8시부터 모든 빵 30% 할인","케이크 주문: 02-123-4567"]},"qs":[{"n":41,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["월요일에는 문을 열지 않습니다.","아침 여섯 시에 문을 엽니다.","저녁 여덟 시부터 빵이 쌉니다.","전화로 케이크를 주문할 수 있습니다."],"ans":2,"exp":"Giờ mở cửa là \"오전 7시\" (7 giờ sáng), không phải 6 giờ. Vậy câu sai là ②.","vocab":[{"k":"영업시간","v":"giờ mở cửa"},{"k":"할인","v":"giảm giá"},{"k":"주문","v":"đặt hàng"}]}]},{"sec":"R","nums":[42],"passage":{"kind":"notice","title":"한국민속박물관 입장권","body":["날짜: 2026년 12월 20일","입장료: 어른 5,000원 / 어린이 무료","관람 시간: 오전 9시 ~ 오후 6시","※ 사진은 1층에서만 찍을 수 있습니다."]},"qs":[{"n":42,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["어린이는 삼천 원을 냅니다.","오후 여섯 시까지 볼 수 있습니다.","일 층에서 사진을 찍을 수 있습니다.","이 표는 십이월 이십일에 쓸 수 있습니다."],"ans":1,"exp":"Vé cho trẻ em là \"무료\" (miễn phí), không phải 3.000 won. Vậy câu sai là ①.","vocab":[{"k":"입장료","v":"phí vào cửa"},{"k":"무료","v":"miễn phí"},{"k":"관람","v":"tham quan"}]}]},{"sec":"R","nums":[43],"passage":{"kind":"text","body":["저는 기숙사에 삽니다. 제 방은 삼 층에 있습니다. 룸메이트는 중국 사람입니다."]},"qs":[{"n":43,"stem":null,"choices":["저는 혼자 삽니다.","제 방은 이 층에 있습니다.","저는 중국 사람과 같이 삽니다.","룸메이트는 한국 사람입니다."],"ans":3,"exp":"\"룸메이트는 중국 사람입니다\" (bạn cùng phòng là người Trung Quốc), nên tôi sống cùng người Trung Quốc. Đáp án là ③.","vocab":[{"k":"기숙사","v":"ký túc xá"},{"k":"층","v":"tầng"}]}]},{"sec":"R","nums":[44],"passage":{"kind":"text","body":["어제 미용실에 갔습니다. 머리를 짧게 잘랐습니다. 친구들이 머리가 예쁘다고 했습니다."]},"qs":[{"n":44,"stem":null,"choices":["저는 오늘 미용실에 갑니다.","저는 머리를 길게 했습니다.","친구와 같이 미용실에 갔습니다.","저는 어제 머리를 잘랐습니다."],"ans":4,"exp":"\"어제 미용실에 갔습니다. 머리를 짧게 잘랐습니다\" (hôm qua tôi đi tiệm tóc và cắt tóc ngắn). Đáp án là ④.","vocab":[{"k":"짧게","v":"một cách ngắn"},{"k":"예쁘다","v":"đẹp"}]}]},{"sec":"R","nums":[45],"passage":{"kind":"text","body":["저는 베트남 음식을 좋아합니다. 주말마다 친구들에게 쌀국수를 만들어 줍니다. 친구들은 제 쌀국수가 맛있다고 합니다."]},"qs":[{"n":45,"stem":null,"choices":["저는 주말에 요리를 합니다.","친구가 쌀국수를 만들어 줍니다.","저는 한국 음식을 자주 만듭니다.","친구들은 쌀국수를 좋아하지 않습니다."],"ans":1,"exp":"\"주말마다 친구들에게 쌀국수를 만들어 줍니다\" (cuối tuần nào tôi cũng nấu phở cho bạn), nên tôi nấu ăn vào cuối tuần. Đáp án là ①.","vocab":[{"k":"주말마다","v":"mỗi cuối tuần"},{"k":"요리","v":"nấu ăn"}]}]},{"sec":"R","nums":[46],"passage":{"kind":"text","body":["저는 사진 찍는 것을 좋아합니다. 사진을 보면 그때 일이 생각납니다. 그래서 좋은 일이 있을 때마다 사진을 찍어 두고 싶습니다."]},"qs":[{"n":46,"stem":null,"choices":["사진을 잘 찍고 싶습니다.","좋은 일을 사진으로 남기고 싶습니다.","친구에게 사진을 보내고 싶습니다.","새 카메라를 사고 싶습니다."],"ans":2,"exp":"\"좋은 일이 있을 때마다 사진을 찍어 두고 싶습니다\" (mỗi khi có chuyện vui tôi muốn chụp ảnh lưu lại). Ý chính là muốn lưu giữ kỷ niệm đẹp bằng ảnh, đáp án ②.","vocab":[{"k":"생각나다","v":"nhớ ra"},{"k":"남기다","v":"để lại, lưu lại"}]}]},{"sec":"R","nums":[47],"passage":{"kind":"text","body":["겨울에는 친구들과 스키를 타러 갑니다. 그런데 저는 아직 스키를 잘 못 탑니다. 이번 겨울에는 스키를 열심히 배우고 싶습니다."]},"qs":[{"n":47,"stem":null,"choices":["겨울을 좋아합니다.","스키장에 가고 싶지 않습니다.","스키를 잘 타고 싶습니다.","친구에게 스키를 가르치고 싶습니다."],"ans":3,"exp":"Tôi \"아직 스키를 잘 못 탑니다\" (vẫn chưa trượt giỏi) và \"열심히 배우고 싶습니다\" (muốn học chăm chỉ), nên ý chính là muốn trượt tuyết giỏi. Đáp án là ③.","vocab":[{"k":"아직","v":"vẫn còn, chưa"},{"k":"열심히","v":"chăm chỉ"}]}]},{"sec":"R","nums":[48],"passage":{"kind":"text","body":["우리 기숙사는 밤 열두 시에 문을 닫습니다. 저는 가끔 늦게 와서 문 앞에서 오래 기다립니다. 앞으로는 일찍 들어가야겠습니다."]},"qs":[{"n":48,"stem":null,"choices":["앞으로 기숙사에 일찍 들어가려고 합니다.","기숙사 문을 늦게 닫으면 좋겠습니다.","기숙사에서 나가서 살고 싶습니다.","밤에 친구를 만나고 싶습니다."],"ans":1,"exp":"\"앞으로는 일찍 들어가야겠습니다\" (từ nay tôi phải về sớm) là suy nghĩ chính. Đáp án là ①.","vocab":[{"k":"가끔","v":"thỉnh thoảng"},{"k":"앞으로","v":"từ nay về sau"}]}]},{"sec":"R","nums":[49,50],"passage":{"kind":"text","body":["저는 지난 토요일에 친구와 같이 영화를 보기로 했습니다. 그런데 그날 아침에 갑자기 열이 나고 머리가 아팠습니다. 그래서 친구에게 전화해서 ( ㉠ ). 친구는 괜찮다고 하고 약을 사 가지고 우리 집에 왔습니다. 저는 친구가 정말 고마웠습니다."]},"qs":[{"n":49,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["영화표를 샀습니다","같이 병원에 갔습니다","영화관에서 만났습니다","영화를 볼 수 없다고 했습니다"],"ans":4,"exp":"Tôi bị sốt và đau đầu, rồi bạn nói \"괜찮다고\" (không sao). Vậy tôi đã gọi điện nói \"영화를 볼 수 없다고 했습니다\" (không thể đi xem phim được). Đáp án là ④.","vocab":[{"k":"-기로 하다","v":"quyết định/hẹn làm gì"},{"k":"갑자기","v":"đột nhiên"},{"k":"열이 나다","v":"bị sốt"}]},{"n":50,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 친구와 영화를 봤습니다.","친구가 약을 가지고 우리 집에 왔습니다.","저는 토요일 저녁에 아팠습니다.","친구가 저에게 화를 냈습니다."],"ans":2,"exp":"\"약을 사 가지고 우리 집에 왔습니다\" (bạn mua thuốc mang đến nhà tôi). Tôi ốm từ buổi sáng và không xem phim. Đáp án là ②.","vocab":[{"k":"약","v":"thuốc"},{"k":"고맙다","v":"biết ơn"}]}]},{"sec":"R","nums":[51,52],"passage":{"kind":"text","body":["눈이 많이 온 날에는 길이 미끄럽습니다. 그래서 걸을 때 조심해야 합니다. 이런 날에는 굽이 높은 구두보다 바닥이 미끄럽지 않은 신발을 신는 것이 좋습니다. 그리고 주머니에 손을 ( ㉠ ) 걷지 마십시오. 넘어질 때 크게 다칠 수 있습니다."]},"qs":[{"n":51,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["넣고","빼고","넣으면","넣지만"],"ans":1,"exp":"\"주머니에 손을 넣고 걷지 마십시오\" (đừng cho tay vào túi khi đi bộ) vì khi ngã có thể bị thương nặng. \"-고\" nối hai hành động đồng thời. Đáp án là ①.","vocab":[{"k":"주머니","v":"túi áo/quần"},{"k":"넣다","v":"cho vào"},{"k":"넘어지다","v":"ngã"}]},{"n":52,"stem":"무엇에 대한 이야기인지 맞는 것을 고르십시오.","choices":["겨울옷을 사는 방법","눈이 오는 이유","눈 온 날 안전하게 걷는 방법","신발을 파는 곳"],"ans":3,"exp":"Cả bài nói về việc \"걸을 때 조심해야 합니다\" (phải cẩn thận khi đi bộ) trên đường trơn sau khi tuyết rơi: chọn giày, không cho tay vào túi. Đáp án là ③.","vocab":[{"k":"미끄럽다","v":"trơn"},{"k":"조심하다","v":"cẩn thận"},{"k":"다치다","v":"bị thương"}]}]},{"sec":"R","nums":[53,54],"passage":{"kind":"text","body":["저는 한국에 온 지 일 년이 되었습니다. 처음에는 한국 음식이 매워서 잘 못 먹었습니다. 그래서 고향 음식이 먹고 싶을 때는 직접 만들어 먹었습니다. 그런데 한국 친구들이 맵지 않은 음식과 맛있는 식당을 많이 알려 줘서 지금은 한국 음식을 ( ㉠ ). 요즘은 김치찌개를 제일 좋아합니다."]},"qs":[{"n":53,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["먹지 않습니다","만들지 못합니다","싫어하게 되었습니다","잘 먹게 되었습니다"],"ans":4,"exp":"Nhờ bạn Hàn giới thiệu nhiều món và quán ngon, và bây giờ tôi thích nhất canh kimchi, nên \"잘 먹게 되었습니다\" (đã trở nên ăn được/ăn ngon). \"-게 되다\" = trở nên. Đáp án là ④.","vocab":[{"k":"맵다","v":"cay"},{"k":"-게 되다","v":"trở nên, được"},{"k":"김치찌개","v":"canh kimchi"}]},{"n":54,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 고향 음식을 만들 수 있습니다.","저는 한국에 온 지 삼 년이 되었습니다.","저는 처음부터 매운 음식을 잘 먹었습니다.","저는 김치찌개를 싫어합니다."],"ans":1,"exp":"\"고향 음식이 먹고 싶을 때는 직접 만들어 먹었습니다\" (khi thèm món quê, tôi tự nấu ăn), nên tôi biết nấu món quê. Đáp án là ①.","vocab":[{"k":"직접","v":"tự mình"},{"k":"고향 음식","v":"món ăn quê hương"}]}]},{"sec":"R","nums":[55,56],"passage":{"kind":"text","body":["요즘은 미용실에 예약을 하고 가는 사람이 많습니다. 예약을 하면 기다리지 않아도 됩니다. ( ㉠ ) 예약을 하지 않고 가면 한두 시간을 기다려야 할 때도 있습니다. 예약은 전화로 할 수 있고 휴대폰 앱으로도 할 수 있습니다. 앱으로 예약하면 가격을 조금 할인해 주는 미용실도 있습니다."]},"qs":[{"n":55,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["그래서","하지만","그리고","그러면"],"ans":2,"exp":"Câu trước nói đặt lịch thì không phải chờ, câu sau nói không đặt lịch thì phải chờ 1-2 tiếng. Hai ý trái ngược nên dùng \"하지만\" (nhưng). Đáp án là ②.","vocab":[{"k":"하지만","v":"nhưng"},{"k":"기다리다","v":"chờ đợi"}]},{"n":56,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["미용실 예약은 전화로만 할 수 있습니다.","예약을 하면 오래 기다려야 합니다.","앱으로 예약하면 더 싸게 할 수 있는 곳도 있습니다.","요즘은 예약하는 사람이 적습니다."],"ans":3,"exp":"\"앱으로 예약하면 가격을 조금 할인해 주는 미용실도 있습니다\" (có tiệm giảm giá khi đặt qua ứng dụng). Đáp án là ③.","vocab":[{"k":"앱","v":"ứng dụng"},{"k":"할인하다","v":"giảm giá"}]}]},{"sec":"R","nums":[57],"passage":{"kind":"text","body":["(가) 그래서 오늘 휴대폰 가게에 갔습니다.","(나) 제 휴대폰은 오 년 전에 산 것입니다.","(다) 너무 오래되어서 자주 꺼집니다.","(라) 가게에서 새 휴대폰을 싸게 샀습니다."]},"qs":[{"n":57,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(다)-(가)-(라)","(나)-(가)-(다)-(라)","(다)-(나)-(가)-(라)","(다)-(가)-(나)-(라)"],"ans":1,"exp":"(나) điện thoại mua 5 năm trước → (다) quá cũ nên hay tắt → (가) \"그래서\" hôm nay đến cửa hàng → (라) mua điện thoại mới giá rẻ. Đáp án là ①.","vocab":[{"k":"오래되다","v":"cũ, lâu năm"},{"k":"꺼지다","v":"bị tắt"}]}]},{"sec":"R","nums":[58],"passage":{"kind":"text","body":["(가) 그 후에 한복을 돌려주고 박물관 안을 구경했습니다.","(나) 지난 주말에 친구와 박물관에 갔습니다.","(다) 박물관 입구에서 한복을 빌려 입을 수 있었습니다.","(라) 우리는 한복을 입고 사진을 많이 찍었습니다."]},"qs":[{"n":58,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(가)-(다)-(라)","(라)-(다)-(나)-(가)","(라)-(나)-(다)-(가)","(나)-(다)-(라)-(가)"],"ans":4,"exp":"(나) cuối tuần đi bảo tàng → (다) ở lối vào có thể mượn hanbok → (라) mặc hanbok chụp nhiều ảnh → (가) \"그 후에\" trả hanbok và tham quan. Đáp án là ④.","vocab":[{"k":"빌리다","v":"mượn, thuê"},{"k":"돌려주다","v":"trả lại"},{"k":"구경하다","v":"tham quan"}]}]},{"sec":"R","nums":[59,60],"passage":{"kind":"text","body":["저는 지난겨울에 처음으로 스키장에 갔습니다. ( ㉠ ) 스키를 한 번도 타 본 적이 없어서 조금 무서웠습니다. ( ㉡ ) 선생님은 넘어지는 방법부터 가르쳐 주셨습니다. ( ㉢ ) 오후에는 천천히 내려올 수 있게 되었습니다. ( ㉣ ) 올겨울에도 다시 가고 싶습니다."]},"qs":[{"n":59,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.","choices":["㉠","㉡","㉢","㉣"],"box":"그래서 스키장에서 두 시간 동안 스키 수업을 들었습니다.","ans":2,"exp":"Vì chưa từng trượt nên sợ, \"그래서\" (vì vậy) tôi đã học lớp trượt tuyết; sau đó mới nói về \"선생님\" (thầy giáo). Câu này đặt ở ㉡, đáp án ②.","vocab":[{"k":"수업을 듣다","v":"học, nghe giảng"},{"k":"무섭다","v":"sợ"}]},{"n":60,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["선생님은 넘어지는 방법을 먼저 가르쳐 주셨습니다.","저는 전에 스키를 자주 탔습니다.","저는 오후에도 스키를 전혀 못 탔습니다.","저는 올겨울에는 스키장에 가지 않을 겁니다."],"ans":1,"exp":"\"선생님은 넘어지는 방법부터 가르쳐 주셨습니다\" (thầy dạy cách ngã trước tiên). Đáp án là ①.","vocab":[{"k":"-부터","v":"từ, trước tiên"},{"k":"천천히","v":"chậm rãi"}]}]},{"sec":"R","nums":[61,62],"passage":{"kind":"text","body":["저는 대학교 기숙사에서 삽니다. 기숙사에는 여러 나라에서 온 학생들이 있습니다. 매달 마지막 금요일에는 기숙사 식당에서 '세계 음식의 날' 행사가 있습니다. 이날은 학생들이 자기 나라 음식을 ( ㉠ ) 친구들과 같이 먹습니다. 지난달에 저는 베트남 친구들과 함께 스프링롤을 만들었습니다. 친구들이 맛있다고 해서 정말 기뻤습니다."]},"qs":[{"n":61,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["주문하려고","먹고 싶어서","만들어서","만들지만"],"ans":3,"exp":"Học sinh \"자기 나라 음식을 만들어서\" (nấu món ăn nước mình rồi) cùng ăn với bạn bè; câu sau cũng nói tôi đã làm chả giò. \"-아서/어서\" chỉ trình tự hành động. Đáp án là ③.","vocab":[{"k":"매달","v":"mỗi tháng"},{"k":"마지막","v":"cuối cùng"},{"k":"자기 나라","v":"nước của mình"}]},{"n":62,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["행사는 매주 금요일에 있습니다.","기숙사에는 한국 학생만 삽니다.","저는 지난달에 한국 음식을 만들었습니다.","친구들은 제가 만든 음식을 좋아했습니다."],"ans":4,"exp":"\"친구들이 맛있다고 해서 정말 기뻤습니다\" (bạn bè khen ngon nên tôi rất vui). Sự kiện vào thứ Sáu cuối mỗi tháng, tôi làm chả giò (món Việt). Đáp án là ④.","vocab":[{"k":"행사","v":"sự kiện"},{"k":"기쁘다","v":"vui"}]}]},{"sec":"R","nums":[63,64],"passage":{"kind":"email","title":"사진 동아리 12월 모임 안내","body":["받는 사람: 사진 동아리 회원","보내는 사람: 김지훈","회원 여러분, 안녕하세요.","이번 달 모임은 12월 13일 토요일에 합니다. 이번에는 교실에서 모이지 않고 남산에 가서 겨울 사진을 찍으려고 합니다. 오전 10시까지 학교 정문 앞으로 오십시오. 거기에서 같이 지하철을 타고 가겠습니다.","카메라가 없는 사람은 휴대폰을 가지고 와도 됩니다. 날씨가 추우니까 따뜻한 옷을 꼭 입고 오십시오."]},"qs":[{"n":63,"stem":"왜 윗글을 썼는지 맞는 것을 고르십시오.","choices":["동아리 모임 장소와 시간을 알려 주려고","사진 찍는 방법을 알려 주려고","카메라를 빌려 달라고 하려고","새 동아리 회원을 모으려고"],"ans":1,"exp":"Thư thông báo buổi họp \"12월 13일 토요일\", tập trung \"오전 10시까지 학교 정문 앞\" rồi đi Namsan. Mục đích là báo thời gian và địa điểm họp câu lạc bộ, đáp án ①.","vocab":[{"k":"동아리","v":"câu lạc bộ"},{"k":"모임","v":"buổi họp mặt"},{"k":"회원","v":"thành viên"}]},{"n":64,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["이번 모임은 교실에서 합니다.","회원들은 같이 지하철을 탈 겁니다.","카메라가 꼭 있어야 합니다.","오전 열 시까지 남산으로 가야 합니다."],"ans":2,"exp":"\"거기에서 같이 지하철을 타고 가겠습니다\" (từ đó cùng đi tàu điện ngầm). Không họp ở lớp, không có máy ảnh thì mang điện thoại, 10 giờ tập trung ở cổng trường. Đáp án là ②.","vocab":[{"k":"정문","v":"cổng chính"},{"k":"지하철","v":"tàu điện ngầm"}]}]},{"sec":"R","nums":[65,66],"passage":{"kind":"text","body":["한국 사람들은 보통 밥을 많이 먹습니다. 그런데 요즘은 아침에 밥 대신 빵을 먹는 사람이 많아졌습니다. 빵은 밥보다 ( ㉠ ) 바쁜 아침에 먹기 편하기 때문입니다. 그래서 동네마다 작은 빵집이 많이 생겼습니다. 이런 빵집들은 보통 아침 일곱 시쯤 문을 엽니다. 출근하는 사람들은 빵집에 들러서 빵과 커피를 사 갑니다."]},"qs":[{"n":65,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["비싸지만","맛이 없어서","빨리 먹을 수 있어서","만들기 어려워서"],"ans":3,"exp":"Lý do bánh mì \"바쁜 아침에 먹기 편하기 때문입니다\" (tiện ăn vào buổi sáng bận rộn) là vì \"빨리 먹을 수 있어서\" (có thể ăn nhanh). Đáp án là ③.","vocab":[{"k":"대신","v":"thay vì"},{"k":"-기 때문이다","v":"là vì"},{"k":"편하다","v":"tiện lợi"}]},{"n":66,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["요즘 아침에 빵을 먹는 사람이 늘었습니다.","동네 빵집은 보통 열 시에 문을 엽니다.","한국 사람들은 밥을 잘 먹지 않습니다.","빵집에서는 커피를 팔지 않습니다."],"ans":1,"exp":"\"요즘은 아침에 밥 대신 빵을 먹는 사람이 많아졌습니다\" (dạo này người ăn bánh mì buổi sáng nhiều lên). Tiệm mở khoảng 7 giờ và có bán cà phê. Đáp án là ①.","vocab":[{"k":"늘다","v":"tăng lên"},{"k":"출근하다","v":"đi làm"},{"k":"들르다","v":"ghé qua"}]}]},{"sec":"R","nums":[67,68],"passage":{"kind":"text","body":["박물관에 가면 옛날 사람들이 어떻게 살았는지 알 수 있습니다. 요즘 박물관에는 보기만 하는 곳이 아니라 직접 해 볼 수 있는 곳도 많습니다. 예를 들면 옛날 옷을 입어 보거나 옛날 놀이를 해 볼 수 있습니다. 이렇게 ( ㉠ ) 배운 것은 오래 기억에 남습니다. 그래서 주말에 아이와 함께 박물관을 찾는 가족이 많습니다. 대부분의 박물관은 월요일에 쉬니까 가기 전에 확인하는 것이 좋습니다."]},"qs":[{"n":67,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["책으로 읽으면서","사진만 보면서","선생님에게 들으면서","직접 해 보면서"],"ans":4,"exp":"\"이렇게\" (như thế này) chỉ việc được mặc thử quần áo, chơi thử trò chơi xưa ở câu trước, tức là \"직접 해 보면서\" (vừa tự mình làm thử). Đáp án là ④.","vocab":[{"k":"직접","v":"trực tiếp, tự mình"},{"k":"기억에 남다","v":"đọng lại trong trí nhớ"}]},{"n":68,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["박물관에서는 보기만 할 수 있습니다.","박물관에서 옛날 놀이를 해 볼 수 있습니다.","박물관은 보통 일요일에 쉽니다.","주말에는 박물관에 가는 가족이 적습니다."],"ans":2,"exp":"\"옛날 놀이를 해 볼 수 있습니다\" (có thể chơi thử trò chơi xưa). Đa số bảo tàng nghỉ thứ Hai, cuối tuần nhiều gia đình đến. Đáp án là ②.","vocab":[{"k":"놀이","v":"trò chơi"},{"k":"확인하다","v":"kiểm tra, xác nhận"}]}]},{"sec":"R","nums":[69,70],"passage":{"kind":"text","body":["제 고향은 베트남 호찌민입니다. 호찌민은 일 년 내내 더워서 눈이 오지 않습니다. 그래서 저는 한국에 오기 전까지 눈을 한 번도 본 적이 없었습니다. 작년 12월 어느 날 아침에 창문을 열었는데 밖에 눈이 하얗게 쌓여 있었습니다. 저는 너무 신나서 ( ㉠ ) 밖으로 뛰어나갔습니다. 기숙사 친구들과 같이 눈사람도 만들고 사진도 많이 찍었습니다. 그날 찍은 사진을 고향에 계신 부모님께 보내 드렸더니 부모님도 무척 신기해하셨습니다."]},"qs":[{"n":69,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["바로 옷을 입고","창문을 닫고 다시 자고","부모님께 먼저 전화하고","친구를 기다리고 나서"],"ans":1,"exp":"Tôi \"너무 신나서\" (quá phấn khích) nên ngay lập tức mặc áo rồi chạy ra ngoài: \"바로 옷을 입고\". Các lựa chọn khác không hợp với tâm trạng háo hức. Đáp án là ①.","vocab":[{"k":"신나다","v":"phấn khích, hào hứng"},{"k":"뛰어나가다","v":"chạy ra ngoài"},{"k":"쌓이다","v":"chất đống, phủ dày"}]},{"n":70,"stem":"이 글의 내용으로 알 수 있는 것을 고르십시오.","choices":["저는 고향에서 눈을 자주 봤습니다.","저는 혼자 눈사람을 만들었습니다.","부모님께서는 제가 보낸 사진을 보셨습니다.","호찌민은 겨울에 아주 춥습니다."],"ans":3,"exp":"\"사진을 ... 부모님께 보내 드렸더니 부모님도 무척 신기해하셨습니다\" (gửi ảnh cho bố mẹ, bố mẹ thấy rất lạ lẫm), nên bố mẹ đã xem ảnh. Tôi chưa từng thấy tuyết ở quê, làm người tuyết cùng bạn. Đáp án là ③.","vocab":[{"k":"일 년 내내","v":"suốt cả năm"},{"k":"눈사람","v":"người tuyết"},{"k":"신기하다","v":"lạ lẫm, thú vị"}]}]}]},{"test":5,"groups":[{"sec":"L","nums":[1],"audio":[{"s":"W","t":"비행기표가 있어요?"}],"qs":[{"n":1,"stem":null,"choices":["네, 비행기가 커요.","네, 비행기표가 있어요.","아니요, 비행기표예요.","아니요, 공항에 가요."],"ans":2,"exp":"Câu hỏi \"비행기표가 있어요?\" (Bạn có vé máy bay không?) nên trả lời \"네, 비행기표가 있어요\" (Vâng, tôi có vé máy bay). Đáp án đúng là ②.","vocab":[{"k":"비행기표","v":"vé máy bay"},{"k":"있다","v":"có"}]}]},{"sec":"L","nums":[2],"audio":[{"s":"M","t":"호텔이 비싸요?"}],"qs":[{"n":2,"stem":null,"choices":["네, 호텔이 없어요.","네, 호텔에 가요.","아니요, 안 비싸요.","아니요, 호텔이에요."],"ans":3,"exp":"Câu hỏi \"호텔이 비싸요?\" (Khách sạn có đắt không?). Câu trả lời phù hợp là \"아니요, 안 비싸요\" (Không, không đắt). Đáp án đúng là ③.","vocab":[{"k":"호텔","v":"khách sạn"},{"k":"비싸다","v":"đắt"}]}]},{"sec":"L","nums":[3],"audio":[{"s":"W","t":"누구에게 선물을 줘요?"}],"qs":[{"n":3,"stem":null,"choices":["친구에게 줘요.","꽃을 줘요.","내일 줘요.","백화점에서 샀어요."],"ans":1,"exp":"\"누구에게\" hỏi \"cho ai\". Chỉ có \"친구에게 줘요\" (Tặng cho bạn) trả lời về người. Đáp án đúng là ①.","vocab":[{"k":"누구","v":"ai"},{"k":"선물","v":"quà"}]}]},{"sec":"L","nums":[4],"audio":[{"s":"M","t":"제주도에 언제 가요?"}],"qs":[{"n":4,"stem":null,"choices":["친구하고 가요.","비행기로 가요.","제주도에 가요.","다음 주에 가요."],"ans":4,"exp":"\"언제\" hỏi \"khi nào\". Câu trả lời về thời gian là \"다음 주에 가요\" (Tuần sau tôi đi). Đáp án đúng là ④.","vocab":[{"k":"언제","v":"khi nào"},{"k":"다음 주","v":"tuần sau"}]}]},{"sec":"L","nums":[5],"audio":[{"s":"W","t":"결혼 축하해요."}],"qs":[{"n":5,"stem":null,"choices":["괜찮아요.","실례합니다.","고맙습니다.","어서 오세요."],"ans":3,"exp":"Khi được chúc mừng \"결혼 축하해요\" (Chúc mừng đám cưới), ta đáp lại \"고맙습니다\" (Cảm ơn). Đáp án đúng là ③.","vocab":[{"k":"결혼","v":"kết hôn"},{"k":"축하하다","v":"chúc mừng"}]}]},{"sec":"L","nums":[6],"audio":[{"s":"M","t":"늦어서 미안해요."}],"qs":[{"n":6,"stem":null,"choices":["괜찮아요.","잘 먹겠습니다.","축하합니다.","처음 뵙겠습니다."],"ans":1,"exp":"Khi người khác xin lỗi \"늦어서 미안해요\" (Xin lỗi vì đến muộn), ta đáp \"괜찮아요\" (Không sao đâu). Đáp án đúng là ①.","vocab":[{"k":"늦다","v":"muộn, trễ"},{"k":"미안하다","v":"xin lỗi"}]}]},{"sec":"L","nums":[7],"audio":[{"s":"M","t":"여권하고 비행기표를 보여 주세요."},{"s":"W","t":"여기 있어요. 창문 쪽 자리로 주세요."}],"qs":[{"n":7,"stem":null,"choices":["호텔","공항","식당","학교"],"ans":2,"exp":"\"여권\" (hộ chiếu), \"비행기표\" (vé máy bay), \"창문 쪽 자리\" (ghế cạnh cửa sổ) là những từ dùng ở sân bay. Đáp án đúng là ②.","vocab":[{"k":"여권","v":"hộ chiếu"},{"k":"자리","v":"chỗ ngồi"},{"k":"공항","v":"sân bay"}]}]},{"sec":"L","nums":[8],"audio":[{"s":"W","t":"오늘 방 있어요?"},{"s":"M","t":"네, 두 사람 방이 있어요. 하루에 십만 원이에요."}],"qs":[{"n":8,"stem":null,"choices":["우체국","병원","서점","호텔"],"ans":4,"exp":"Người phụ nữ hỏi \"오늘 방 있어요?\" (Hôm nay còn phòng không?), người đàn ông nói giá \"하루에 십만 원\" (100.000 won một ngày). Đây là khách sạn. Đáp án đúng là ④.","vocab":[{"k":"방","v":"phòng"},{"k":"하루","v":"một ngày"}]}]},{"sec":"L","nums":[9],"audio":[{"s":"M","t":"무슨 노래를 부를 거예요?"},{"s":"W","t":"저는 이 노래를 부를게요. 번호가 몇 번이에요?"}],"qs":[{"n":9,"stem":null,"choices":["노래방","도서관","은행","약국"],"ans":1,"exp":"Hai người chọn bài hát để hát \"노래를 부르다\" (hát) và hỏi số bài hát \"번호\". Đây là phòng karaoke. Đáp án đúng là ①.","vocab":[{"k":"노래를 부르다","v":"hát"},{"k":"번호","v":"số"},{"k":"노래방","v":"phòng karaoke"}]}]},{"sec":"L","nums":[10],"audio":[{"s":"W","t":"장미 열 송이 주세요."},{"s":"M","t":"네, 선물하실 거예요? 예쁘게 포장해 드릴게요."}],"qs":[{"n":10,"stem":null,"choices":["빵집","옷 가게","꽃집","문구점"],"ans":3,"exp":"Người phụ nữ mua \"장미 열 송이\" (mười bông hồng) nên đây là cửa hàng hoa. Đáp án đúng là ③.","vocab":[{"k":"장미","v":"hoa hồng"},{"k":"포장하다","v":"gói (quà)"},{"k":"꽃집","v":"cửa hàng hoa"}]}]},{"sec":"L","nums":[11],"audio":[{"s":"M","t":"주말에 뭐 할 거예요?"},{"s":"W","t":"토요일에는 친구를 만나고 일요일에는 집에서 쉴 거예요."}],"qs":[{"n":11,"stem":null,"choices":["날씨","가족","취미","계획"],"ans":4,"exp":"Hai người nói về việc sẽ làm vào cuối tuần \"주말에 뭐 할 거예요?\" (Cuối tuần bạn sẽ làm gì?). Đây là kế hoạch. Đáp án đúng là ④.","vocab":[{"k":"주말","v":"cuối tuần"},{"k":"쉬다","v":"nghỉ ngơi"},{"k":"계획","v":"kế hoạch"}]}]},{"sec":"L","nums":[12],"audio":[{"s":"W","t":"무슨 음식을 좋아해요?"},{"s":"M","t":"저는 불고기를 좋아해요. 비빔밥도 좋아해요."}],"qs":[{"n":12,"stem":null,"choices":["운동","음식","장소","시간"],"ans":2,"exp":"Người phụ nữ hỏi \"무슨 음식을 좋아해요?\" (Bạn thích món ăn gì?), người đàn ông trả lời \"불고기\", \"비빔밥\". Chủ đề là món ăn. Đáp án đúng là ②.","vocab":[{"k":"음식","v":"món ăn"},{"k":"불고기","v":"thịt bò nướng bulgogi"}]}]},{"sec":"L","nums":[13],"audio":[{"s":"M","t":"제주도는 어땠어요?"},{"s":"W","t":"바다가 정말 아름다웠어요. 한라산도 좋았어요."}],"qs":[{"n":13,"stem":null,"choices":["직업","값","여행","약속"],"ans":3,"exp":"Hai người nói về chuyến đi đảo Jeju: \"바다가 정말 아름다웠어요\" (Biển thật đẹp). Chủ đề là du lịch. Đáp án đúng là ③.","vocab":[{"k":"바다","v":"biển"},{"k":"아름답다","v":"đẹp"},{"k":"여행","v":"du lịch"}]}]},{"sec":"L","nums":[14],"audio":[{"s":"W","t":"노래 좋아해요?"},{"s":"M","t":"네, 저는 한국 노래를 자주 들어요."}],"qs":[{"n":14,"stem":null,"choices":["음악","공부","쇼핑","주말"],"ans":1,"exp":"Hai người nói về việc thích bài hát \"노래\" và thường nghe \"자주 들어요\". Chủ đề là âm nhạc. Đáp án đúng là ①.","vocab":[{"k":"노래","v":"bài hát"},{"k":"듣다","v":"nghe"},{"k":"음악","v":"âm nhạc"}]}]},{"sec":"L","nums":[15],"audio":[{"s":"W","t":"가방이 너무 무거워요."},{"s":"M","t":"제가 들어 드릴게요. 공항 안으로 같이 들어가요."}],"qs":[{"n":15,"stem":null,"pics":[{"e":"👩🧳✈️","c":"여자가 혼자 가방을 들고 공항에 있습니다."},{"e":"👨🧳👩✈️","c":"남자가 여자의 가방을 들어 줍니다."},{"e":"👨🎫👩✈️","c":"남자가 여자에게 비행기표를 줍니다."},{"e":"👩🧳👨🚕","c":"여자가 남자의 가방을 들고 택시를 탑니다."}],"ans":2,"exp":"Người đàn ông nói \"제가 들어 드릴게요\" (Để tôi xách giúp), tức là anh ấy xách túi của người phụ nữ ở sân bay. Đáp án đúng là ②.","vocab":[{"k":"무겁다","v":"nặng"},{"k":"들다","v":"xách, cầm"}]}]},{"sec":"L","nums":[16],"audio":[{"s":"W","t":"불고기를 만들 때 먼저 고기를 자르세요."},{"s":"M","t":"네, 선생님. 이렇게 자르면 돼요?"}],"qs":[{"n":16,"stem":null,"pics":[{"e":"👩🍖😋","c":"여자가 고기를 먹습니다."},{"e":"👨🥬💧","c":"남자가 채소를 씻습니다."},{"e":"👩🥩🔥","c":"여자가 고기를 굽습니다."},{"e":"👨🥩🔪","c":"남자가 고기를 자릅니다."}],"ans":4,"exp":"Cô giáo bảo \"먼저 고기를 자르세요\" (Trước tiên hãy cắt thịt), người đàn ông hỏi \"이렇게 자르면 돼요?\" (Cắt thế này được không?) — tức là anh ấy đang cắt thịt. Đáp án đúng là ④.","vocab":[{"k":"자르다","v":"cắt"},{"k":"고기","v":"thịt"},{"k":"먼저","v":"trước tiên"}]}]},{"sec":"L","nums":[17],"audio":[{"s":"M","t":"민지 씨, 이번 주말에 뭐 해요?"},{"s":"W","t":"친구 결혼식이 있어서 부산에 가요."},{"s":"M","t":"그래요? 기차로 가요?"},{"s":"W","t":"아니요, 버스로 가요. 기차표가 없었어요."}],"qs":[{"n":17,"stem":null,"choices":["남자는 결혼식에 갑니다.","여자는 기차를 탈 겁니다.","여자는 주말에 부산에 갑니다.","남자는 부산에 삽니다."],"ans":3,"exp":"Người phụ nữ nói \"친구 결혼식이 있어서 부산에 가요\" (Vì có đám cưới của bạn nên tôi đi Busan) vào cuối tuần. Cô ấy đi xe buýt, không đi tàu. Đáp án đúng là ③.","vocab":[{"k":"결혼식","v":"lễ cưới"},{"k":"기차표","v":"vé tàu"}]}]},{"sec":"L","nums":[18],"audio":[{"s":"W","t":"이 가방 얼마예요?"},{"s":"M","t":"오만 원이에요. 선물하실 거예요?"},{"s":"W","t":"네, 어머니 생신 선물이에요. 포장해 주세요."},{"s":"M","t":"네, 잠깐만 기다리세요."}],"qs":[{"n":18,"stem":null,"choices":["여자는 어머니 선물을 삽니다.","남자는 가방을 샀습니다.","여자는 포장을 안 합니다.","가방은 오천 원입니다."],"ans":1,"exp":"Người phụ nữ nói \"어머니 생신 선물이에요\" (Đây là quà sinh nhật mẹ). Túi giá 50.000 won (오만 원) và cô ấy nhờ gói quà. Đáp án đúng là ①.","vocab":[{"k":"생신","v":"sinh nhật (kính ngữ)"},{"k":"포장하다","v":"gói"}]}]},{"sec":"L","nums":[19],"audio":[{"s":"M","t":"여보세요, 호텔이지요? 다음 주 금요일에 방을 예약하고 싶어요."},{"s":
