,"날짜: 12월 20일 ~ 12월 22일 (2박)","방에서 바다가 보입니다.","아침 식사: 7시~9시 (1층 식당)"]},"qs":[{"n":42,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["란 씨는 혼자 호텔에 갑니다.","호텔에서 이틀 동안 잡니다.","아침 식사는 1층에서 합니다.","방에서 바다를 볼 수 있습니다."],"ans":1,"exp":"Phòng ghi \"2인실 (2명)\" (phòng 2 người, 2 người ở), nên chị Lan không đi một mình. Câu ① sai nên là đáp án.","vocab":[{"k":"예약 확인","v":"xác nhận đặt phòng"},{"k":"2박","v":"2 đêm"}]}]},{"sec":"R","nums":[43],"passage":{"kind":"text","body":["저는 주말에 친구하고 자전거를 탑니다. 한강 공원에서 두 시간쯤 탑니다. 자전거를 탄 후에 같이 라면을 먹습니다."]},"qs":[{"n":43,"stem":null,"choices":["저는 혼자 자전거를 탑니다.","저는 평일에 자전거를 탑니다.","저는 자전거를 타기 전에 라면을 먹습니다.","저는 공원에서 자전거를 탑니다."],"ans":4,"exp":"Bài viết: \"한강 공원에서 두 시간쯤 탑니다\" (Đạp xe khoảng 2 tiếng ở công viên sông Hàn). Tôi đi với bạn vào cuối tuần, ăn mì sau khi đạp xe. Đáp án đúng là ④.","vocab":[{"k":"공원","v":"công viên"},{"k":"-(으)ㄴ 후에","v":"sau khi"}]}]},{"sec":"R","nums":[44],"passage":{"kind":"text","body":["어제 언니의 생일 선물을 샀습니다. 언니가 음악을 좋아해서 이어폰을 샀습니다. 언니가 선물을 받고 아주 좋아했습니다."]},"qs":[{"n":44,"stem":null,"choices":["언니는 음악을 싫어합니다.","저는 언니에게 이어폰을 선물했습니다.","언니는 선물을 안 좋아했습니다.","언니가 저에게 선물을 줬습니다."],"ans":2,"exp":"\"언니가 음악을 좋아해서 이어폰을 샀습니다\" (Vì chị thích âm nhạc nên tôi đã mua tai nghe) và chị đã nhận quà. Đáp án đúng là ②.","vocab":[{"k":"이어폰","v":"tai nghe"},{"k":"받다","v":"nhận"}]}]},{"sec":"R","nums":[45],"passage":{"kind":"text","body":["저는 지난달에 제주도에 여행을 갔습니다. 제주도에서 말을 탔습니다. 다음에는 가족과 같이 또 가고 싶습니다."]},"qs":[{"n":45,"stem":null,"choices":["저는 제주도에 또 가고 싶습니다.","저는 가족과 제주도에 갔습니다.","저는 다음 달에 제주도에 갑니다.","저는 제주도에서 자전거를 탔습니다."],"ans":1,"exp":"\"다음에는 가족과 같이 또 가고 싶습니다\" (Lần sau tôi muốn đi lại cùng gia đình). Đáp án đúng là ①.","vocab":[{"k":"지난달","v":"tháng trước"},{"k":"말","v":"con ngựa"},{"k":"또","v":"lại, nữa"}]}]},{"sec":"R","nums":[46],"passage":{"kind":"text","body":["저는 노래를 잘 못 부릅니다. 그래서 노래방에 가는 것을 싫어했습니다. 그런데 친구들과 같이 노래하니까 아주 즐거웠습니다."]},"qs":[{"n":46,"stem":null,"choices":["저는 노래를 잘 부르고 싶습니다.","저는 노래방에 가는 것이 싫습니다.","저는 친구들과 노래하는 것이 즐겁습니다.","저는 노래를 배우고 싶습니다."],"ans":3,"exp":"Câu cuối \"친구들과 같이 노래하니까 아주 즐거웠습니다\" (Hát cùng bạn bè thì rất vui) là ý chính. Đáp án đúng là ③.","vocab":[{"k":"즐겁다","v":"vui vẻ"},{"k":"싫어하다","v":"ghét"}]}]},{"sec":"R","nums":[47],"passage":{"kind":"text","body":["저는 요리를 잘 못합니다. 그래서 요즘 요리 교실에 다닙니다. 빨리 배워서 가족에게 맛있는 음식을 만들어 주고 싶습니다."]},"qs":[{"n":47,"stem":null,"choices":["저는 요리를 잘합니다.","저는 가족에게 음식을 만들어 주고 싶습니다.","저는 요리 교실에서 가르칩니다.","저는 가족과 같이 요리를 배웁니다."],"ans":2,"exp":"Ý chính: \"가족에게 맛있는 음식을 만들어 주고 싶습니다\" (Tôi muốn nấu món ngon cho gia đình). Đáp án đúng là ②.","vocab":[{"k":"다니다","v":"đi học (đều đặn)"},{"k":"-아/어 주다","v":"làm cho ai đó"}]}]},{"sec":"R","nums":[48],"passage":{"kind":"text","body":["여행을 가기 전에 호텔을 예약해야 합니다. 여름에는 여행하는 사람이 많습니다. 그래서 늦게 예약하면 방이 없을 수 있습니다."]},"qs":[{"n":48,"stem":null,"choices":["여름에 여행을 가고 싶습니다.","호텔 방이 비쌉니다.","여름에는 여행을 가면 안 됩니다.","호텔을 일찍 예약하는 것이 좋습니다."],"ans":4,"exp":"Bài viết nói đặt muộn thì \"방이 없을 수 있습니다\" (có thể hết phòng), nên ý chính là nên đặt khách sạn sớm. Đáp án đúng là ④.","vocab":[{"k":"예약하다","v":"đặt trước"},{"k":"늦게","v":"muộn"}]}]},{"sec":"R","nums":[49,50],"passage":{"kind":"text","body":["저는 한국 음식 중에서 불고기를 제일 좋아합니다. 지난주에 친구에게 불고기 만드는 방법을 배웠습니다. 불고기를 만들 때는 고기에 간장과 설탕을 넣고 30분쯤 ( ㉠ ). 그다음에 고기를 구우면 됩니다. 이번 주말에는 제가 만든 불고기를 가족에게 주고 싶습니다."]},"qs":[{"n":49,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["기다리지 않습니다","먹어야 합니다","기다려야 합니다","씻어야 합니다"],"ans":3,"exp":"Cho xì dầu và đường vào thịt rồi \"30분쯤 기다려야 합니다\" (phải đợi khoảng 30 phút), sau đó mới nướng. Đáp án đúng là ③.","vocab":[{"k":"간장","v":"xì dầu"},{"k":"설탕","v":"đường"},{"k":"굽다","v":"nướng"}]},{"n":50,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 친구에게 불고기 만드는 방법을 배웠습니다.","불고기는 고기를 먼저 굽습니다.","저는 불고기를 싫어합니다.","저는 지난 주말에 가족에게 불고기를 만들어 줬습니다."],"ans":1,"exp":"\"지난주에 친구에게 불고기 만드는 방법을 배웠습니다\" (Tuần trước tôi đã học cách làm bulgogi từ bạn). Đáp án đúng là ①.","vocab":[{"k":"방법","v":"cách"},{"k":"배우다","v":"học"}]}]},{"sec":"R","nums":[51,52],"passage":{"kind":"text","body":["제주도는 한국에서 가장 큰 섬입니다. 제주도에는 한라산이 있고 아름다운 바다도 있습니다. 그래서 매년 많은 사람들이 제주도로 여행을 갑니다. 서울에서 제주도까지 비행기로 한 시간쯤 걸립니다. 그리고 부산에서 배를 타고 제주도에 ( ㉠ )."]},"qs":[{"n":51,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["갈 수 없습니다","가지 마십시오","가고 싶지 않습니다","갈 수도 있습니다"],"ans":4,"exp":"Câu trước nói đi máy bay, câu này bổ sung một cách khác: \"배를 타고 제주도에 갈 수도 있습니다\" (cũng có thể đi tàu thủy đến Jeju). Đáp án đúng là ④.","vocab":[{"k":"섬","v":"đảo"},{"k":"배","v":"tàu thủy"},{"k":"-(으)ㄹ 수도 있다","v":"cũng có thể"}]},{"n":52,"stem":"무엇에 대한 이야기인지 맞는 것을 고르십시오.","choices":["제주도의 음식","제주도 소개","한라산에 가는 방법","비행기 타는 방법"],"ans":2,"exp":"Bài viết giới thiệu đảo Jeju: \"가장 큰 섬\" (hòn đảo lớn nhất), có núi Halla, biển đẹp và cách đi đến đó. Đáp án đúng là ②.","vocab":[{"k":"소개","v":"giới thiệu"},{"k":"매년","v":"hằng năm"}]}]},{"sec":"R","nums":[53,54],"passage":{"kind":"text","body":["지난 토요일에 제 친한 친구가 결혼했습니다. 저는 결혼식에서 친구를 위해 노래를 불렀습니다. 노래를 부르기 전에 너무 떨려서 ( ㉠ ). 그런데 친구가 웃으면서 저를 보니까 마음이 편해졌습니다. 노래가 끝나고 사람들이 박수를 많이 쳐 주었습니다."]},"qs":[{"n":53,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["손에 땀이 났습니다","배가 불렀습니다","잠을 잤습니다","노래를 안 불렀습니다"],"ans":1,"exp":"\"너무 떨려서\" (vì quá run, hồi hộp) nên \"손에 땀이 났습니다\" (tay đổ mồ hôi). Đáp án đúng là ①.","vocab":[{"k":"떨리다","v":"run, hồi hộp"},{"k":"땀이 나다","v":"đổ mồ hôi"}]},{"n":54,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["친구는 지난 일요일에 결혼했습니다.","저는 결혼식에서 사진을 찍었습니다.","친구를 보고 마음이 편해졌습니다.","사람들이 노래를 같이 불렀습니다."],"ans":3,"exp":"\"친구가 웃으면서 저를 보니까 마음이 편해졌습니다\" (Khi bạn cười nhìn tôi, lòng tôi thấy nhẹ nhõm). Bạn cưới vào thứ Bảy. Đáp án đúng là ③.","vocab":[{"k":"편하다","v":"thoải mái"},{"k":"박수를 치다","v":"vỗ tay"}]}]},{"sec":"R","nums":[55,56],"passage":{"kind":"text","body":["요즘 자전거를 타고 출근하는 사람들이 많아졌습니다. 자전거를 타면 건강에 좋고 돈도 아낄 수 있습니다. ( ㉠ ) 자전거를 탈 때는 조심해야 할 것이 있습니다. 꼭 헬멧을 써야 하고, 밤에는 자전거에 불을 켜야 합니다. 또 비가 오는 날에는 자전거를 타지 않는 것이 좋습니다."]},"qs":[{"n":55,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["그래서","그런데","그리고","그러면"],"ans":2,"exp":"Câu trước nói điểm tốt của xe đạp, câu sau chuyển sang điều phải cẩn thận, nên dùng \"그런데\" (nhưng mà, tuy nhiên). Đáp án đúng là ②.","vocab":[{"k":"출근하다","v":"đi làm"},{"k":"아끼다","v":"tiết kiệm"},{"k":"조심하다","v":"cẩn thận"}]},{"n":56,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["자전거를 타면 돈이 많이 듭니다.","밤에는 자전거를 타면 안 됩니다.","비가 오는 날에 자전거를 타는 것이 좋습니다.","자전거를 탈 때 헬멧을 써야 합니다."],"ans":4,"exp":"\"꼭 헬멧을 써야 하고\" (nhất định phải đội mũ bảo hiểm). Ban đêm chỉ cần bật đèn, không phải cấm đi. Đáp án đúng là ④.","vocab":[{"k":"헬멧","v":"mũ bảo hiểm"},{"k":"불을 켜다","v":"bật đèn"}]}]},{"sec":"R","nums":[57],"passage":{"kind":"text","body":["(가) 그래서 인터넷으로 호텔을 찾아봤습니다.","(나) 다음 달에 가족과 부산에 여행을 갑니다.","(다) 바다가 보이는 방이 있어서 바로 예약했습니다.","(라) 그런데 아직 호텔을 예약하지 못했습니다."]},"qs":[{"n":57,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(라)-(가)-(다)","(나)-(가)-(라)-(다)","(가)-(나)-(다)-(라)","(가)-(다)-(나)-(라)"],"ans":1,"exp":"Bắt đầu bằng (나) giới thiệu chuyến đi Busan → (라) \"그런데\" chưa đặt khách sạn → (가) \"그래서\" tìm trên mạng → (다) có phòng nhìn ra biển nên đặt ngay. Đáp án đúng là ①.","vocab":[{"k":"찾아보다","v":"tìm thử"},{"k":"바로","v":"ngay lập tức"}]}]},{"sec":"R","nums":[58],"passage":{"kind":"text","body":["(가) 공항에 도착해서 먼저 짐을 보냈습니다.","(나) 그리고 비행기를 타기 전에 가족에게 줄 선물을 샀습니다.","(다) 짐을 보낸 후에 비행기표를 받았습니다.","(라) 저는 오늘 베트남으로 가는 비행기를 탑니다."]},"qs":[{"n":58,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(가)-(다)-(라)-(나)","(가)-(라)-(나)-(다)","(라)-(가)-(다)-(나)","(라)-(다)-(가)-(나)"],"ans":3,"exp":"(라) giới thiệu hôm nay bay về Việt Nam → (가) đến sân bay gửi hành lý trước \"먼저\" → (다) \"짐을 보낸 후에\" nhận vé → (나) \"그리고\" mua quà trước khi lên máy bay. Đáp án đúng là ③.","vocab":[{"k":"짐","v":"hành lý"},{"k":"도착하다","v":"đến nơi"}]}]},{"sec":"R","nums":[59,60],"passage":{"kind":"text","body":["저는 한국에 온 지 1년이 되었습니다. ( ㉠ ) 처음에는 한국어를 잘 못해서 친구를 사귀기 어려웠습니다. ( ㉡ ) 그래서 대학교 음악 동아리에 들어갔습니다. ( ㉢ ) 동아리에서 친구들과 같이 기타를 치고 노래를 불렀습니다. ( ㉣ ) 지금은 한국 친구가 많이 생겨서 한국 생활이 즐겁습니다."]},"qs":[{"n":59,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.","choices":["㉠","㉡","㉢","㉣"],"box":"노래를 부르면서 한국어 실력도 많이 좋아졌습니다.","ans":4,"exp":"Câu cho sẵn \"노래를 부르면서 한국어 실력도 많이 좋아졌습니다\" (Vừa hát tôi vừa giỏi tiếng Hàn hơn) phải đứng sau câu kể việc hát trong câu lạc bộ, tức là vị trí ㉣. Đáp án đúng là ④.","vocab":[{"k":"실력","v":"năng lực, trình độ"},{"k":"-(으)면서","v":"vừa... vừa"}]},{"n":60,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 한국에 온 지 2년이 되었습니다.","저는 동아리에서 노래를 불렀습니다.","저는 처음부터 친구가 많았습니다.","저는 지금 한국 생활이 힘듭니다."],"ans":2,"exp":"\"동아리에서 친구들과 같이 기타를 치고 노래를 불렀습니다\" (Tôi chơi guitar và hát cùng bạn bè ở câu lạc bộ). Đáp án đúng là ②.","vocab":[{"k":"동아리","v":"câu lạc bộ"},{"k":"사귀다","v":"kết bạn"}]}]},{"sec":"R","nums":[61,62],"passage":{"kind":"text","body":["저는 지난 주말에 처음으로 요리 교실에 갔습니다. 그날은 한국 사람들이 명절에 먹는 잡채를 만들었습니다. 선생님이 먼저 만드는 방법을 보여 주셨습니다. 저는 선생님을 따라 했지만 생각보다 어려웠습니다. 그래도 옆 사람이 도와줘서 ( ㉠ ). 다음 주에는 떡볶이를 만들기로 했습니다."]},"qs":[{"n":61,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["잡채를 먹지 못했습니다","요리 교실에 가지 않았습니다","잡채를 다 만들 수 있었습니다","요리를 가르쳤습니다"],"ans":3,"exp":"\"그래도 옆 사람이 도와줘서\" (Dù vậy nhờ người bên cạnh giúp) nên kết quả tốt: \"잡채를 다 만들 수 있었습니다\" (đã có thể làm xong japchae). Đáp án đúng là ③.","vocab":[{"k":"명절","v":"ngày lễ tết"},{"k":"따라 하다","v":"làm theo"}]},{"n":62,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["다음 주에는 떡볶이를 만들 겁니다.","저는 요리 교실에 자주 갔습니다.","잡채는 만들기 쉬웠습니다.","저는 선생님을 도와줬습니다."],"ans":1,"exp":"\"다음 주에는 떡볶이를 만들기로 했습니다\" (Tuần sau sẽ làm tteokbokki). Đây là lần đầu đi lớp nấu ăn và japchae khó hơn nghĩ. Đáp án đúng là ①.","vocab":[{"k":"-기로 하다","v":"quyết định (làm gì)"},{"k":"처음으로","v":"lần đầu tiên"}]}]},{"sec":"R","nums":[63,64],"passage":{"kind":"email","title":"자전거 여행 날짜 변경 안내","body":["받는 사람: 한국대학교 자전거 동아리 회원","보내는 사람: 김준호 (동아리 회장)","회원 여러분, 안녕하세요.","이번 달 동아리 자전거 여행 날짜가 바뀌었습니다. 원래 10월 18일(토)에 가기로 했지만 그날 비가 많이 온다고 합니다. 그래서 다음 주 토요일인 10월 25일에 가기로 했습니다.","모이는 시간과 장소는 같습니다. 오전 9시까지 학교 정문 앞으로 오십시오. 자전거가 없는 분은 동아리 방에서 빌릴 수 있습니다.","감사합니다."]},"qs":[{"n":63,"stem":"왜 윗글을 썼는지 맞는 것을 고르십시오.","choices":["자전거를 사는 방법을 알려 주려고","여행 날짜가 바뀐 것을 알려 주려고","동아리 회원을 모으려고","모이는 장소를 바꾸려고"],"ans":2,"exp":"Email viết \"자전거 여행 날짜가 바뀌었습니다\" (Ngày đi du lịch bằng xe đạp đã thay đổi). Mục đích là thông báo ngày thay đổi. Đáp án đúng là ②.","vocab":[{"k":"변경","v":"thay đổi"},{"k":"회원","v":"thành viên"}]},{"n":64,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["자전거 여행은 10월 18일에 갑니다.","모이는 장소가 바뀌었습니다.","자전거가 없으면 여행에 갈 수 없습니다.","오전 9시까지 학교 정문 앞에 가야 합니다."],"ans":4,"exp":"\"오전 9시까지 학교 정문 앞으로 오십시오\" (Hãy đến trước cổng chính trường trước 9 giờ sáng). Ngày mới là 25/10, địa điểm không đổi, có thể mượn xe. Đáp án đúng là ④.","vocab":[{"k":"정문","v":"cổng chính"},{"k":"모이다","v":"tập trung"},{"k":"빌리다","v":"mượn"}]}]},{"sec":"R","nums":[65,66],"passage":{"kind":"text","body":["노래방은 한국 사람들이 즐겨 찾는 곳입니다. 노래방에는 작은 방이 많이 있어서 친구나 가족끼리 편하게 노래를 부를 수 있습니다. 한국 사람들은 회식을 한 후에 노래방에 자주 갑니다. 노래를 부르면서 스트레스를 풀 수 있기 때문입니다. 요즘은 혼자 노래방에 가는 사람도 많아졌습니다. 그래서 ( ㉠ ) 아주 작은 노래방도 생겼습니다."]},"qs":[{"n":65,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["혼자 들어갈 수 있는","사람이 많이 들어가는","노래를 배울 수 있는","음식을 파는"],"ans":1,"exp":"Câu trước nói \"혼자 노래방에 가는 사람도 많아졌습니다\" (Người đi karaoke một mình tăng lên), nên có phòng karaoke rất nhỏ \"혼자 들어갈 수 있는\" (có thể vào một mình). Đáp án đúng là ①.","vocab":[{"k":"혼자","v":"một mình"},{"k":"생기다","v":"xuất hiện, có"}]},{"n":66,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["노래방에는 큰 방 하나만 있습니다.","한국 사람들은 회식 전에 노래방에 갑니다.","노래를 부르면 스트레스를 풀 수 있습니다.","요즘은 혼자 노래방에 가는 사람이 없습니다."],"ans":3,"exp":"\"노래를 부르면서 스트레스를 풀 수 있기 때문입니다\" (Vì có thể giải tỏa căng thẳng khi hát). Họ đi sau buổi liên hoan \"회식을 한 후에\". Đáp án đúng là ③.","vocab":[{"k":"회식","v":"liên hoan công ty"},{"k":"스트레스를 풀다","v":"giải tỏa căng thẳng"}]}]},{"sec":"R","nums":[67,68],"passage":{"kind":"text","body":["비행기를 탈 때는 보통 출발 두 시간 전까지 공항에 도착해야 합니다. 공항에서 짐을 보내고 비행기표를 받는 데 시간이 걸리기 때문입니다. 그리고 비행기 안에 가지고 들어갈 수 없는 물건도 있습니다. 예를 들면 큰 병에 든 물이나 음료수는 ( ㉠ ). 그래서 비행기를 타기 전에 다 마시거나 버려야 합니다. 여행을 떠나기 전에 이런 것들을 미리 알아 두면 좋습니다."]},"qs":[{"n":67,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["비행기 안에서 살 수 있습니다","마시면 안 됩니다","가방에 많이 넣어야 합니다","가지고 탈 수 없습니다"],"ans":4,"exp":"Đây là ví dụ cho \"가지고 들어갈 수 없는 물건\" (đồ không được mang lên), nên nước trong chai lớn \"가지고 탈 수 없습니다\" (không thể mang lên máy bay). Đáp án đúng là ④.","vocab":[{"k":"물건","v":"đồ vật"},{"k":"음료수","v":"nước uống"},{"k":"버리다","v":"vứt bỏ"}]},{"n":68,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["비행기 출발 30분 전에 공항에 가면 됩니다.","공항에서 짐을 보내는 데 시간이 걸립니다.","물은 비행기 안에 가지고 탈 수 있습니다.","여행을 다녀온 후에 알아보는 것이 좋습니다."],"ans":2,"exp":"\"짐을 보내고 비행기표를 받는 데 시간이 걸리기 때문입니다\" (Vì gửi hành lý và nhận vé mất thời gian). Phải đến trước 2 tiếng. Đáp án đúng là ②.","vocab":[{"k":"미리","v":"trước"},{"k":"-는 데 시간이 걸리다","v":"mất thời gian để..."}]}]},{"sec":"R","nums":[69,70],"passage":{"kind":"text","body":["저는 매년 어머니 생신에 선물을 삽니다. 작년에는 비싼 가방을 사 드렸는데 어머니는 그 가방을 한 번도 들지 않으셨습니다. 그래서 올해는 무엇을 살지 고민이 많았습니다. 그때 동생이 선물보다 같이 시간을 보내는 것이 좋겠다고 말했습니다. 그래서 이번 생신에는 어머니와 함께 제주도에 가기로 했습니다. 어머니께 이 이야기를 하니까 ( ㉠ ). 저도 어머니와 함께 가는 첫 여행이 정말 기대됩니다."]},"qs":[{"n":69,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["어머니께서 화를 내셨습니다","어머니께서 가방을 사셨습니다","어머니께서 아주 기뻐하셨습니다","어머니께서 여행을 싫어하셨습니다"],"ans":3,"exp":"Câu sau \"저도... 기대됩니다\" (Tôi cũng rất mong chờ) cho thấy mẹ phản ứng tích cực: \"아주 기뻐하셨습니다\" (mẹ rất vui). Đáp án đúng là ③.","vocab":[{"k":"기뻐하다","v":"vui mừng"},{"k":"기대되다","v":"mong chờ"}]},{"n":70,"stem":"이 글의 내용으로 알 수 있는 것을 고르십시오.","choices":["저는 어머니와 여행을 한 적이 없습니다.","어머니는 작년에 받은 가방을 자주 들었습니다.","동생이 어머니께 가방을 사 드렸습니다.","저는 올해 어머니께 비싼 선물을 샀습니다."],"ans":1,"exp":"\"어머니와 함께 가는 첫 여행\" (chuyến du lịch đầu tiên cùng mẹ) cho thấy tôi chưa từng đi du lịch với mẹ. Mẹ chưa từng xách chiếc túi năm ngoái. Đáp án đúng là ①.","vocab":[{"k":"고민","v":"băn khoăn, trăn trở"},{"k":"-(으)ㄴ 적이 없다","v":"chưa từng"}]}]}]},{"test":6,"groups":[{"sec":"L","nums":[1],"audio":[{"s":"W","t":"우산이 있어요?"}],"qs":[{"n":1,"stem":null,"choices":["네, 우산이 비싸요.","네, 우산이 있어요.","아니요, 우산이 커요.","아니요, 우산을 사요."],"ans":2,"exp":"Câu hỏi \"우산이 있어요?\" (Bạn có ô không?). Câu trả lời phù hợp là \"네, 우산이 있어요\" (Vâng, tôi có ô), nên đáp án đúng là ②.","vocab":[{"k":"우산","v":"cái ô"},{"k":"있다","v":"có"}]}]},{"sec":"L","nums":[2],"audio":[{"s":"M","t":"태권도 exp":"Người đàn ông nói \"토요일에 운동화를 사러 갈 거예요\" (thứ Bảy tôi sẽ đi mua giày thể thao). Giảm giá đến Chủ nhật, người phụ nữ muốn mua túi và sẽ đi cùng. Đáp án đúng là ①.","vocab":[{"k":"세일","v":"giảm giá"},{"k":"운동화","v":"giày thể thao"}]}]},{"sec":"L","nums":[18],"audio":[{"s":"W","t":"여보세요, 어제 지하철에 휴대폰을 두고 내렸어요."},{"s":"M","t":"무슨 색 휴대폰이에요?"},{"s":"W","t":"검은색이에요. 뒤에 고양이 스티커가 있어요."},{"s":"M","t":"아, 여기 있네요. 오늘 오후에 찾으러 오세요."}],"qs":[{"n":18,"stem":null,"choices":["여자는 휴대폰을 새로 샀습니다.","남자는 여자의 휴대폰을 가지고 있습니다.","여자의 휴대폰은 하얀색입니다.","여자는 버스에서 휴대폰을 잃어버렸습니다."],"ans":2,"exp":"Người đàn ông nói \"아, 여기 있네요\" (À, nó ở đây rồi), tức là anh ấy đang giữ điện thoại của người phụ nữ. Điện thoại màu đen và bị để quên trên tàu điện ngầm. Đáp án đúng là ②.","vocab":[{"k":"두고 내리다","v":"để quên khi xuống xe"},{"k":"검은색","v":"màu đen"}]}]},{"sec":"L","nums":[19],"audio":[{"s":"M","t":"요즘 왜 이렇게 바빠요?"},{"s":"W","t":"다음 주에 시험이 있어서 매일 도서관에서 공부해요."},{"s":"M","t":"저도 시험이 있는데 같이 공부할까요?"},{"s":"W","t":"좋아요. 내일 아침 아홉 시에 도서관 앞에서 만나요."}],"qs":[{"n":19,"stem":null,"choices":["남자는 시험이 없습니다.","여자는 집에서 공부합니다.","두 사람은 오늘 만날 겁니다.","두 사람은 내일 도서관 앞에서 만날 겁니다."],"ans":4,"exp":"Người phụ nữ nói \"내일 아침 아홉 시에 도서관 앞에서 만나요\" (9 giờ sáng mai gặp nhau trước thư viện). Đáp án đúng là ④.","vocab":[{"k":"시험","v":"kỳ thi"},{"k":"도서관","v":"thư viện"}]}]},{"sec":"L","nums":[20],"audio":[{"s":"W","t":"민호 씨, 점심에 뭐 먹을까요?"},{"s":"M","t":"날씨가 더우니까 냉면을 먹어요. 회사 앞에 맛있는 집이 있어요."},{"s":"W","t":"저는 냉면을 한 번도 안 먹어 봤어요."},{"s":"M","t":"그럼 오늘 꼭 먹어 보세요."}],"qs":[{"n":20,"stem":null,"choices":["여자는 냉면을 자주 먹습니다.","두 사람은 저녁을 먹을 겁니다.","여자는 냉면을 먹어 본 적이 없습니다.","냉면 집은 회사에서 멉니다."],"ans":3,"exp":"Người phụ nữ nói \"냉면을 한 번도 안 먹어 봤어요\" (tôi chưa ăn mì lạnh lần nào), nên đáp án đúng là ③. Quán ở ngay trước công ty và họ ăn trưa.","vocab":[{"k":"냉면","v":"mì lạnh"},{"k":"-아/어 보다","v":"thử làm gì"}]}]},{"sec":"L","nums":[21],"audio":[{"s":"M","t":"저는 요즘 태권도를 배우고 있어요."},{"s":"W","t":"그래요? 어디에서 배워요?"},{"s":"M","t":"집 근처 체육관에서요. 일주일에 세 번 가요."},{"s":"W","t":"재미있겠네요. 저도 배우고 싶어요."}],"qs":[{"n":21,"stem":null,"choices":["남자는 일주일에 세 번 태권도를 배웁니다.","여자는 태권도를 가르칩니다.","체육관은 남자의 집에서 멉니다.","여자는 태권도에 관심이 없습니다."],"ans":1,"exp":"Người đàn ông nói \"일주일에 세 번 가요\" (một tuần đi ba lần) đến phòng tập gần nhà. Đáp án đúng là ①.","vocab":[{"k":"체육관","v":"nhà thể thao, phòng tập"},{"k":"근처","v":"gần, lân cận"}]}]},{"sec":"L","nums":[22],"audio":[{"s":"M","t":"게임을 하다가 어제 새벽 세 시에 잤어요."},{"s":"W","t":"그래서 피곤해 보이는군요. 컴퓨터를 너무 오래 하면 눈도 아프고 건강에 안 좋아요."},{"s":"M","t":"알아요. 그런데 그만하기가 어려워요."},{"s":"W","t":"하루에 한 시간만 하는 게 어때요? 시간을 정해서 하는 게 좋아요."}],"qs":[{"n":22,"stem":null,"choices":["게임을 같이 하고 싶습니다.","새 컴퓨터를 사야 합니다.","눈이 아프면 병원에 가야 합니다.","컴퓨터는 시간을 정해서 하는 것이 좋습니다."],"ans":4,"exp":"Người phụ nữ nói \"시간을 정해서 하는 게 좋아요\" (nên đặt ra thời gian để dùng). Đó là suy nghĩ chính của cô ấy, nên đáp án đúng là ④.","vocab":[{"k":"정하다","v":"quyết định, đặt ra"},{"k":"건강","v":"sức khỏe"}]}]},{"sec":"L","nums":[23],"audio":[{"s":"W","t":"위층이 너무 시끄러워서 어젯밤에 잠을 못 잤어요."},{"s":"M","t":"그럼 경비실에 말해 보세요."},{"s":"W","t":"아니에요. 먼저 위층에 가서 이야기해 볼 거예요. 이웃끼리 직접 대화하는 게 더 좋아요."},{"s":"M","t":"그래요. 잘 이야기해 보세요."}],"qs":[{"n":23,"stem":null,"choices":["위층으로 이사하고 싶습니다.","이웃과 직접 이야기하는 것이 좋습니다.","경비실에 말하는 것이 좋습니다.","시끄러우면 음악을 들어야 합니다."],"ans":2,"exp":"Người phụ nữ nói \"이웃끼리 직접 대화하는 게 더 좋아요\" (giữa hàng xóm với nhau nói chuyện trực tiếp thì tốt hơn). Đáp án đúng là ②. Ý \"경비실에 말하다\" là của người đàn ông.","vocab":[{"k":"위층","v":"tầng trên"},{"k":"시끄럽다","v":"ồn ào"},{"k":"직접","v":"trực tiếp"}]}]},{"sec":"L","nums":[24],"audio":[{"s":"M","t":"비가 와서 오늘 약속을 취소할까 해요."},{"s":"W","t":"왜요? 비 오는 날에도 할 수 있는 게 많아요."},{"s":"M","t":"그래도 밖에서 비를 맞기 싫어요."},{"s":"W","t":"박물관이나 미술관처럼 실내에서 구경하는 곳에 가면 돼요. 비 오는 날에도 재미있게 보낼 수 있어요."}],"qs":[{"n":24,"stem":null,"choices":["비가 오면 집에 있어야 합니다.","약속 시간을 바꾸는 것이 좋습니다.","비 오는 날에도 실내에서 재미있게 보낼 수 있습니다.","박물관은 사람이 많아서 불편합니다."],"ans":3,"exp":"Người phụ nữ nói \"실내에서 구경하는 곳에 가면 돼요... 비 오는 날에도 재미있게 보낼 수 있어요\" (đi những nơi tham quan trong nhà thì ngày mưa cũng vui). Đáp án đúng là ③.","vocab":[{"k":"취소하다","v":"hủy"},{"k":"실내","v":"trong nhà"}]}]},{"sec":"L","nums":[25,26],"audio":[{"s":"W","t":"행복 놀이공원을 찾아 주신 여러분, 안내 말씀 드리겠습니다. 오늘 오후 세 시부터 비가 많이 올 예정입니다. 그래서 세 시부터는 밖에 있는 놀이 기구를 타실 수 없습니다. 하지만 실내 놀이 기구와 공연장은 그대로 이용하실 수 있습니다. 우산이 필요하신 분은 정문 안내 센터에서 빌려 가십시오. 감사합니다."}],"qs":[{"n":25,"stem":"여자가 왜 이 이야기를 하고 있는지 고르십시오.","choices":["놀이 기구 이용을 안내하려고","새 놀이 기구를 소개하려고","공연 시간을 바꾸려고","우산을 팔려고"],"ans":1,"exp":"Người phụ nữ thông báo từ 3 giờ \"밖에 있는 놀이 기구를 타실 수 없습니다\" (không thể chơi các trò ngoài trời) nhưng trò trong nhà vẫn dùng được. Mục đích là hướng dẫn việc sử dụng trò chơi, đáp án ①.","vocab":[{"k":"안내","v":"hướng dẫn, thông báo"},{"k":"예정","v":"dự kiến"}]},{"n":26,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["오늘은 비가 오지 않습니다.","실내 공연장은 문을 닫습니다.","우산은 매표소에서 삽니다.","세 시부터 밖에 있는 놀이 기구는 탈 수 없습니다."],"ans":4,"exp":"Bài nói có câu \"세 시부터는 밖에 있는 놀이 기구를 타실 수 없습니다\" (từ 3 giờ không thể chơi trò ngoài trời). Ô được mượn (빌리다) ở trung tâm hướng dẫn, không phải mua. Đáp án đúng là ④.","vocab":[{"k":"공연장","v":"nhà biểu diễn"},{"k":"빌리다","v":"mượn"},{"k":"정문","v":"cổng chính"}]}]},{"sec":"L","nums":[27,28],"audio":[{"s":"M","t":"저기요, 어머니 생신 선물로 꽃을 사고 싶은데요."},{"s":"W","t":"어떤 꽃을 찾으세요?"},{"s":"M","t":"어머니가 노란색을 좋아하세요. 어떤 꽃이 좋을까요?"},{"s":"W","t":"노란 장미는 어떠세요? 요즘 제일 인기가 많아요."},{"s":"M","t":"좋네요. 스무 송이 주세요. 그리고 내일 어머니 댁으로 배달해 줄 수 있어요?"},{"s":"W","t":"네, 가능합니다. 여기에 주소를 써 주세요. 배달비는 오천 원입니다."}],"qs":[{"n":27,"stem":"두 사람이 무엇에 대해 이야기를 하고 있는지 고르십시오.","choices":["좋아하는 색깔","생일 파티 장소","어머니께 드릴 꽃","꽃집에 가는 방법"],"ans":3,"exp":"Người đàn ông nói \"어머니 생신 선물로 꽃을 사고 싶은데요\" (muốn mua hoa làm quà sinh nhật mẹ) và hai người bàn chọn hoa. Chủ đề là hoa tặng mẹ, đáp án ③.","vocab":[{"k":"생신","v":"sinh nhật (kính ngữ)"},{"k":"선물","v":"quà"}]},{"n":28,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["남자는 빨간 장미를 샀습니다.","꽃은 내일 어머니 댁으로 배달됩니다.","배달비는 내지 않아도 됩니다.","여자는 노란 장미를 좋아하지 않습니다."],"ans":2,"exp":"Người đàn ông hỏi \"내일 어머니 댁으로 배달해 줄 수 있어요?\" (có thể giao đến nhà mẹ vào ngày mai không?) và người phụ nữ nói \"가능합니다\" (được). Phí giao hàng là 5.000 won. Đáp án đúng là ②.","vocab":[{"k":"배달하다","v":"giao hàng"},{"k":"댁","v":"nhà (kính ngữ)"},{"k":"배달비","v":"phí giao hàng"}]}]},{"sec":"L","nums":[29,30],"audio":[{"s":"M","t":"선생님, 할머니, 할아버지들께 컴퓨터를 가르치고 계시지요?"},{"s":"W","t":"네, 3년 전부터 동네 복지관에서 가르치고 있어요."},{"s":"M","t":"왜 이 일을 시작하셨어요?"},{"s":"W","t":"제 할머니께서 인터넷을 못 하셔서 기차표를 못 사신 적이 있어요. 그때 어르신들께 컴퓨터를 가르쳐 드리고 싶었어요."},{"s":"M","t":"수업은 어떻게 하세요?"},{"s":"W","t":"일주일에 두 번 이메일 보내기나 인터넷 쇼핑 같은 것을 가르쳐요. 어르신들이 정말 열심히 배우세요."}],"qs":[{"n":29,"stem":"여자가 왜 컴퓨터를 가르치기 시작했는지 고르십시오.","choices":["컴퓨터 회사에 다녀서","복지관에서 부탁을 해서","할머니께 인터넷 쇼핑을 배워서","할머니가 인터넷을 못 해서 불편하셨던 것을 봐서"],"ans":4,"exp":"Người phụ nữ nói \"할머니께서 인터넷을 못 하셔서 기차표를 못 사신 적이 있어요\" (bà tôi không dùng được internet nên đã không mua được vé tàu). Vì vậy cô muốn dạy máy tính cho người già. Đáp án đúng là ④.","vocab":[{"k":"어르신","v":"người cao tuổi"},{"k":"복지관","v":"trung tâm phúc lợi"}]},{"n":30,"stem":"들은 내용과 같은 것을 고르십시오.","choices":["여자는 3년 전부터 복지관에서 가르치고 있습니다.","수업은 일주일에 한 번 있습니다.","여자의 할머니는 인터넷으로 기차표를 샀습니다.","어르신들은 수업에 잘 오지 않습니다."],"ans":1,"exp":"Người phụ nữ nói \"3년 전부터 동네 복지관에서 가르치고 있어요\" (từ 3 năm trước tôi dạy ở trung tâm phúc lợi của khu phố). Lớp học tuần hai lần. Đáp án đúng là ①.","vocab":[{"k":"가르치다","v":"dạy"},{"k":"동네","v":"khu phố"}]}]},{"sec":"R","nums":[31],"passage":{"kind":"text","body":["저는 태권도를 좋아합니다. 주말마다 태권도를 합니다."]},"qs":[{"n":31,"stem":null,"choices":["공부","요일","운동","가족"],"ans":3,"exp":"\"태권도를 좋아합니다\" (thích taekwondo), \"태권도를 합니다\" (tập taekwondo) nói về \"운동\" (thể thao). Đáp án đúng là ③.","vocab":[{"k":"주말마다","v":"mỗi cuối tuần"},{"k":"운동","v":"thể thao"}]}]},{"sec":"R","nums":[32],"passage":{"kind":"text","body":["이 옷은 삼만 원입니다. 저 옷은 오만 원입니다."]},"qs":[{"n":32,"stem":null,"choices":["값","색깔","크기","주소"],"ans":1,"exp":"\"삼만 원\" (30.000 won), \"오만 원\" (50.000 won) nói về \"값\" (giá cả). Đáp án đúng là ①.","vocab":[{"k":"값","v":"giá"},{"k":"옷","v":"quần áo"}]}]},{"sec":"R","nums":[33],"pass ,"ans":2,"exp":"Hôm nay là sinh nhật bạn nên tặng hoa cho bạn: \"친구에게 꽃을 줍니다\" (tặng hoa cho bạn). Đáp án đúng là ②.","vocab":[{"k":"주다","v":"cho, tặng"},{"k":"꽃","v":"hoa"}]}]},{"sec":"R","nums":[40],"passage":{"kind":"notice","title":"한국백화점 여름 세일","body":["기간: 7월 1일(금) ~ 7월 10일(일)","시간: 오전 10시 30분 ~ 오후 8시","옷, 신발: 30~50% 할인","5만 원 이상 사시면 선물을 드립니다.","※ 식품은 할인하지 않습니다."]},"qs":[{"n":40,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["세일은 열흘 동안 합니다.","오전 열 시 반에 문을 엽니다.","신발을 싸게 살 수 있습니다.","식품도 30% 할인합니다."],"ans":4,"exp":"Thông báo ghi \"식품은 할인하지 않습니다\" (thực phẩm không giảm giá), nên câu ④ sai. Đáp án là ④.","vocab":[{"k":"할인","v":"giảm giá"},{"k":"식품","v":"thực phẩm"},{"k":"열흘","v":"mười ngày"}]}]},{"sec":"R","nums":[41],"passage":{"kind":"notice","title":"분실물 센터 안내","body":["위치: 지하철 시청역 2층","이용 시간: 월요일~금요일 오전 9시~오후 6시","※ 주말에는 쉽니다.","※ 물건을 찾으러 오실 때 신분증을 꼭 가지고 오십시오.","전화: 02-123-4567"]},"qs":[{"n":41,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["토요일에도 이용할 수 있습니다.","시청역 2층에 있습니다.","물건을 찾을 때 신분증이 필요합니다.","전화로 물어볼 수 있습니다."],"ans":1,"exp":"Thông báo ghi \"주말에는 쉽니다\" (cuối tuần nghỉ), nên thứ Bảy không sử dụng được. Câu ① sai, đáp án là ①.","vocab":[{"k":"신분증","v":"giấy tờ tùy thân"},{"k":"주말","v":"cuối tuần"}]}]},{"sec":"R","nums":[42],"passage":{"kind":"notice","title":"어린이 태권도 교실","body":["대상: 초등학생 (8~13세)","요일: 매주 화요일, 목요일","시간: 오후 4시 ~ 5시","장소: 우리동네 체육관","수업료: 한 달 5만 원 (도복은 무료로 드립니다.)"]},"qs":[{"n":42,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["일주일에 두 번 수업이 있습니다.","초등학생이 배울 수 있습니다.","도복은 돈을 내고 사야 합니다.","수업은 한 시간 동안 합니다."],"ans":3,"exp":"Thông báo ghi \"도복은 무료로 드립니다\" (võ phục được tặng miễn phí), nên câu ③ sai. Đáp án là ③.","vocab":[{"k":"도복","v":"võ phục"},{"k":"무료","v":"miễn phí"},{"k":"수업료","v":"học phí"}]}]},{"sec":"R","nums":[43],"passage":{"kind":"text","body":["저는 어제 친구하고 놀이공원에 갔습니다. 사람이 많아서 놀이 기구를 세 개만 탔습니다. 그래도 아주 즐거웠습니다."]},"qs":[{"n":43,"stem":null,"choices":["저는 혼자 놀이공원에 갔습니다.","놀이공원에 사람이 적었습니다.","저는 놀이 기구를 많이 탔습니다.","저는 어제 즐겁게 놀았습니다."],"ans":4,"exp":"Bài viết có câu \"그래도 아주 즐거웠습니다\" (dù vậy vẫn rất vui). Người viết đi cùng bạn, người đông nên chỉ chơi 3 trò. Đáp án đúng là ④.","vocab":[{"k":"즐겁다","v":"vui vẻ"},{"k":"놀이공원","v":"công viên giải trí"}]}]},{"sec":"R","nums":[44],"passage":{"kind":"text","body":["우리 옆집에는 아이가 두 명 있습니다. 그 아이들은 저를 보면 항상 인사를 합니다. 옆집 아이들은 참 귀엽습니다."]},"qs":[{"n":44,"stem":null,"choices":["저는 아이가 두 명 있습니다.","옆집 아이들은 인사를 잘합니다.","저는 옆집 아이들을 모릅니다.","옆집에는 아이가 없습니다."],"ans":2,"exp":"\"저를 보면 항상 인사를 합니다\" (thấy tôi là luôn chào) nghĩa là bọn trẻ nhà bên chào hỏi rất ngoan. Đáp án đúng là ②.","vocab":[{"k":"인사","v":"chào hỏi"},{"k":"항상","v":"luôn luôn"},{"k":"귀엽다","v":"dễ thương"}]}]},{"sec":"R","nums":[45],"passage":{"kind":"text","body":["장마가 시작되었습니다. 다음 주까지 매일 비가 올 겁니다. 밖에 나갈 때 우산을 꼭 가지고 가세요."]},"qs":[{"n":45,"stem":null,"choices":["다음 주까지 비가 옵니다.","장마가 끝났습니다.","우산이 필요 없습니다.","오늘은 날씨가 맑습니다."],"ans":1,"exp":"Bài viết có câu \"다음 주까지 매일 비가 올 겁니다\" (sẽ mưa mỗi ngày đến tuần sau). Đáp án đúng là ①.","vocab":[{"k":"시작되다","v":"bắt đầu"},{"k":"꼭","v":"nhất định"}]}]},{"sec":"R","nums":[46],"passage":{"kind":"text","body":["저는 매일 인터넷으로 뉴스를 봅니다. 그런데 요즘 눈이 자주 아픕니다. 이제 컴퓨터를 조금만 보고 싶습니다."]},"qs":[{"n":46,"stem":null,"choices":["컴퓨터를 적게 보고 싶습니다.","뉴스를 매일 보고 싶습니다.","새 컴퓨터를 사고 싶습니다.","병원에 가고 싶습니다."],"ans":1,"exp":"Câu cuối \"이제 컴퓨터를 조금만 보고 싶습니다\" (giờ tôi chỉ muốn xem máy tính một chút thôi) là ý chính. Đáp án đúng là ①.","vocab":[{"k":"눈","v":"mắt"},{"k":"조금만","v":"chỉ một chút"}]}]},{"sec":"R","nums":[47],"passage":{"kind":"text","body":["저는 다음 달에 중요한 시험이 있습니다. 그런데 공부할 것이 너무 많습니다. 그래서 오늘부터 매일 도서관에 가서 공부하려고 합니다."]},"qs":[{"n":47,"stem":null,"choices":["시험이 쉬우면 좋겠습니다.","도서관에서 책을 빌리고 싶습니다.","매일 열심히 공부할 겁니다.","다음 달에 여행을 가고 싶습니다."],"ans":3,"exp":"Người viết nói \"오늘부터 매일 도서관에 가서 공부하려고 합니다\" (từ hôm nay định mỗi ngày đến thư viện học). Ý chính là sẽ học chăm chỉ mỗi ngày, đáp án ③.","vocab":[{"k":"중요하다","v":"quan trọng"},{"k":"-(으)려고 하다","v":"định làm gì"}]}]},{"sec":"R","nums":[48],"passage":{"kind":"text","body":["우리 동네에 작은 꽃집이 새로 생겼습니다. 꽃집 사장님이 아주 친절하고 꽃도 예쁩니다. 저는 앞으로 그 꽃집에 자주 가려고 합니다."]},"qs":[{"n":48,"stem":null,"choices":["꽃집에서 일하고 싶습니다.","꽃을 싸게 사고 싶습니다.","사장님과 친구가 되고 싶습니다.","그 꽃집에 자주 가고 싶습니다."],"ans":4,"exp":"Câu cuối \"앞으로 그 꽃집에 자주 가려고 합니다\" (từ nay tôi định thường xuyên đến tiệm hoa đó) là suy nghĩ chính. Đáp án đúng là ④.","vocab":[{"k":"생기다","v":"mới mở, xuất hiện"},{"k":"사장님","v":"ông/bà chủ"}]}]},{"sec":"R","nums":[49,50],"passage":{"kind":"text","body":["저는 지난주에 지하철에서 가방을 잃어버렸습니다. 가방 안에 지갑과 책이 있어서 걱정을 많이 했습니다. 그래서 역에 있는 분실물 센터에 ( ㉠ ). 다행히 누가 제 가방을 거기에 맡겨 놓았습니다. 저는 그분에게 정말 감사했습니다."]},"qs":[{"n":49,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["가방을 샀습니다","전화를 했습니다","물건을 팔았습니다","일을 했습니다"],"ans":2,"exp":"Mất túi nên liên lạc với trung tâm đồ thất lạc: \"분실물 센터에 전화를 했습니다\" (đã gọi điện đến trung tâm đồ thất lạc). Đáp án đúng là ②.","vocab":[{"k":"걱정","v":"lo lắng"},{"k":"다행히","v":"may mắn thay"}]},{"n":50,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 버스에서 가방을 잃어버렸습니다.","가방 안에는 휴대폰이 있었습니다.","저는 가방을 다시 찾았습니다.","분실물 센터에 가방이 없었습니다."],"ans":3,"exp":"\"누가 제 가방을 거기에 맡겨 놓았습니다\" (có người đã gửi túi của tôi ở đó), nên người viết đã tìm lại được túi. Túi bị mất trên tàu điện ngầm, bên trong có ví và sách. Đáp án đúng là ③.","vocab":[{"k":"맡기다","v":"gửi, giao cho giữ"},{"k":"다시","v":"lại"}]}]},{"sec":"R","nums":[51,52],"passage":{"kind":"text","body":["냉면은 차가운 국수입니다. 한국 사람들은 날씨가 더운 여름에 냉면을 많이 먹습니다. 냉면에는 물냉면과 비빔냉면이 있습니다. 물냉면은 시원한 국물과 같이 먹고, 비빔냉면은 매운 양념에 ( ㉠ ) 먹습니다. 냉면을 먹을 때 식초와 겨자를 조금 넣으면 더 맛있습니다."]},"qs":[{"n":51,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["만들어서","씻어서","끓여서","비벼서"],"ans":4,"exp":"\"비빔냉면\" là mì lạnh trộn, nên ăn bằng cách trộn với sốt cay: \"매운 양념에 비벼서 먹습니다\". Đáp án đúng là ④.","vocab":[{"k":"비비다","v":"trộn"},{"k":"양념","v":"gia vị, sốt"}]},{"n":52,"stem":"무엇에 대한 이야기인지 맞는 것을 고르십시오.","choices":["냉면의 종류와 먹는 방법","냉면 가게의 위치","여름 날씨","국수를 만드는 사람"],"ans":1,"exp":"Bài giới thiệu hai loại \"물냉면과 비빔냉면\" (mì lạnh nước và mì lạnh trộn) và cách ăn. Đáp án đúng là ①.","vocab":[{"k":"종류","v":"loại"},{"k":"방법","v":"cách, phương pháp"}]}]},{"sec":"R","nums":[53,54],"passage":{"kind":"text","body":["저는 한 달 전에 새 아파트로 이사를 왔습니다. 처음에는 이웃을 아무도 몰라서 조금 외로웠습니다. 그래서 떡을 사서 옆집에 ( ㉠ ). 옆집 아주머니께서 아주 좋아하셨습니다. 지금은 아주머니와 자주 차를 마시면서 이야기합니다."]},"qs":[{"n":53,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["가지고 싶었습니다","가지고 갔습니다","만들지 않았습니다","팔러 갔습니다"],"ans":2,"exp":"Mua bánh gạo rồi mang sang nhà hàng xóm: \"떡을 사서 옆집에 가지고 갔습니다\" (đã mang sang nhà bên). Câu sau \"아주머니께서 좋아하셨습니다\" xác nhận điều đó. Đáp án đúng là ②.","vocab":[{"k":"이사","v":"chuyển nhà"},{"k":"외롭다","v":"cô đơn"},{"k":"떡","v":"bánh gạo"}]},{"n":54,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 일 년 전에 이사를 왔습니다.","저는 지금 옆집 아주머니와 친합니다.","아주머니는 떡을 싫어하셨습니다.","저는 처음부터 이웃을 잘 알았습니다."],"ans":2,"exp":"\"지금은 아주머니와 자주 차를 마시면서 이야기합니다\" (bây giờ tôi thường vừa uống trà vừa trò chuyện với cô ấy), nghĩa là họ đã thân nhau. Đáp án đúng là ②.","vocab":[{"k":"친하다","v":"thân thiết"},{"k":"-(으)면서","v":"vừa... vừa"}]}]},{"sec":"R","nums":[55,56],"passage":{"kind":"text","body":["한국에서는 보통 6월 말부터 7월까지 장마가 있습니다. 장마 때는 비가 많이 오고 날씨가 덥고 습합니다. ( ㉠ ) 음식이 쉽게 상하고 빨래도 잘 마르지 않습니다. 이때는 음식을 냉장고에 넣어 두고, 에어컨을 켜서 방을 건조하게 하면 좋습니다."]},"qs":[{"n":55,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["그런데","그러나","그래서","또는"],"ans":3,"exp":"Vì trời nóng và ẩm (nguyên nhân) nên thức ăn dễ hỏng, đồ giặt khó khô (kết quả). Liên từ chỉ nguyên nhân – kết quả là \"그래서\" (vì vậy). Đáp án đúng là ③.","vocab":[{"k":"습하다","v":"ẩm ướt"},{"k":"상하다","v":"bị hỏng, ôi thiu"},{"k":"마르다","v":"khô"}]},{"n":56,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["장마는 봄에 있습니다.","장마 때는 날씨가 시원합니다.","장마 때는 빨래가 빨리 마릅니다.","장마 때는 음식을 냉장고에 넣는 것이 좋습니다."],"ans":4,"exp":"Bài viết có câu \"음식을 냉장고에 넣어 두고... 하면 좋습니다\" (nên cho thức ăn vào tủ lạnh). Mùa mưa từ cuối tháng 6 đến tháng 7, trời nóng ẩm. Đáp án đúng là ④.","vocab":[{"k":"냉장고","v":"tủ lạnh"},{"k":"빨래","v":"đồ giặt"}]}]},{"sec":"R","nums":[57],"passage":{"kind":"text","body":["(가) 처음에는 발차기가 어려워서 힘들었습니다.","(나) 저는 작년부터 태권도를 배우고 있습니다.","(다) 다음 달에는 검은 띠 시험을 볼 겁니다.","(라) 하지만 지금은 발차기를 잘할 수 있게 되었습니다."]},"qs":[{"n":57,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(가)-(라)-(다)","(나)-(라)-(가)-(다)","(가)-(나)-(다)-(라)","(가)-(라)-(나)-(다)"],"ans":1,"exp":"Mở đầu bằng (나) \"작년부터 태권도를 배우고 있습니다\" (học taekwondo từ năm ngoái), rồi (가) \"처음에는\" (lúc đầu khó), (라) \"하지만 지금은\" (nhưng bây giờ đá giỏi rồi), cuối cùng (다) kế hoạch tháng sau. Đáp án đúng là ①.","vocab":[{"k":"발차기","v":"cú đá"},{"k":"띠","v":"đai"},{"k":"-게 되다","v":"trở nên, được"}]}]},{"sec":"R","nums":[58],"passage":{"kind":"text","body":["(가) 그래서 어제 인터넷으로 운동화를 주문했습니다.","(나) 요즘 저는 바빠서 가게에 갈 시간이 없습니다.","(다) 그런데 오늘 아침에 벌써 운동화가 도착했습니다.","(라) 인터넷 쇼핑은 빠르고 편리해서 참 좋습니다."]},"qs":[{"n":58,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(다)-(가)-(라)","(라)-(가)-(다)-(나)","(나)-(가)-(다)-(라)","(라)-(나)-(다)-(가)"],"ans":3,"exp":"(나) bận nên không có thời gian đi cửa hàng → (가) \"그래서\" hôm qua đặt giày qua mạng → (다) sáng nay giày đã đến → (라) mua sắm online nhanh và tiện. Đáp án đúng là ③.","vocab":[{"k":"주문하다","v":"đặt hàng"},{"k":"도착하다","v":"đến nơi"},{"k":"편리하다","v":"tiện lợi"}]}]},{"sec":"R","nums":[59,60],"passage":{"kind":"text","body":["저는 다음 주에 한국어 시험을 봅니다. ( ㉠ ) 그래서 요즘 친구들과 같이 공부하고 있습니다. ( ㉡ ) 친구들과 같이 공부하면 모르는 것을 서로 물어볼 수 있어서 좋습니다. ( ㉢ ) 그리고 공부가 끝나면 같이 저녁을 먹습니다. ( ㉣ ) 시험이 끝나면 친구들과 같이 놀이공원에 가기로 했습니다."]},"qs":[{"n":59,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.","box":"어제는 학교 앞 식당에서 냉면을 먹었습니다.","choices":["㉠","㉡","㉢","㉣"],"ans":4,"exp":"Câu cần chèn \"어제는 학교 앞 식당에서 냉면을 먹었습니다\" (hôm qua đã ăn mì lạnh ở quán trước trường) là ví dụ cho bữa tối cùng nhau, nên phải đứng ngay sau câu \"같이 저녁을 먹습니다\". Vị trí đó là ㉣, đáp án ④.","vocab":[{"k":"서로","v":"lẫn nhau"},{"k":"물어보다","v":"hỏi"}]},{"n":60,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 지난주에 시험을 봤습니다.","저는 친구들과 같이 공부합니다.","저는 혼자 저녁을 먹습니다.","저는 시험 전에 놀이공원에 갈 겁니다."],"ans":2,"exp":"Bài viết có câu \"요즘 친구들과 같이 공부하고 있습니다\" (dạo này tôi học cùng các bạn). Kỳ thi là tuần sau, đi công viên sau khi thi. Đáp án đúng là ②.","vocab":[{"k":"-기로 하다","v":"quyết định, hẹn làm gì"},{"k":"시험을 보다","v":"thi"}]}]},{"sec":"R","nums":[61,62],"passage":{"kind":"text","body":["저는 어제 백화점에 갔습니다. 백화점에서 세일을 해서 사람이 아주 많았습니다. 저는 어머니께 드릴 스카프를 사려고 했습니다. 그런데 마음에 드는 스카프는 너무 비싸서 ( ㉠ ). 그래서 스카프 대신 예쁜 장갑을 샀습니다. 어머니께서 장갑을 좋아하시면 좋겠습니다."]},"qs":[{"n":61,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["살 수 없었습니다","사고 싶었습니다","살 수 있었습니다","사러 갔습니다"],"ans":1,"exp":"Khăn quá đắt nên không mua được, vì vậy mua găng tay thay thế (\"스카프 대신 장갑을 샀습니다\"). Đáp án đúng là ① \"살 수 없었습니다\" (đã không thể mua).","vocab":[{"k":"마음에 들다","v":"vừa ý"},{"k":"대신","v":"thay vì"}]},{"n":62,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["백화점에 사람이 없었습니다.","저는 스카프를 샀습니다.","저는 어머니께 장갑을 드릴 겁니다.","어머니께서 장갑을 사 주셨습니다."],"ans":3,"exp":"Người viết mua găng tay để tặng mẹ và mong \"어머니께서 장갑을 좋아하시면 좋겠습니다\" (mong mẹ thích găng tay). Đáp án đúng là ③.","vocab":[{"k":"장갑","v":"găng tay"},{"k":"드리다","v":"biếu, tặng (kính ngữ)"}]}]},{"sec":"R","nums":[63,64],"passage":{"kind":"email","title":"도서관 컴퓨터실 이용 안내","body":["받는 사람: 한국대학교 학생 여러분","보내는 사람: 한국대학교 도서관","안녕하세요. 한국대학교 도서관입니다.","도서관 3층 컴퓨터실의 컴퓨터를 새 컴퓨터로 바꿉니다. 그래서 10월 5일(월)부터 10월 9일(금)까지 컴퓨터실을 이용할 수 없습니다.","이 기간에는 2층 안내 데스크에서 노트북을 무료로 빌릴 수 있습니다. 노트북을 빌릴 때는 학생증을 꼭 가지고 오십시오.","10월 12일(월)부터는 새 컴퓨터를 이용하실 수 있습니다. 감사합니다."]},"qs":[{"n":63,"stem":"왜 윗글을 썼는지 맞는 것을 고르십시오.","choices":["노트북을 파는 곳을 알려 주려고","컴퓨터실을 이용할 수 없는 기간을 알려 주려고","학생증을 만드는 방법을 알려 주려고","새 도서관의 위치를 알려 주려고"],"ans":2,"exp":"Email thông báo \"10월 5일부터 10월 9일까지 컴퓨터실을 이용할 수 없습니다\" (từ 5/10 đến 9/10 không thể dùng phòng máy tính). Mục đích là báo thời gian không sử dụng được, đáp án ②.","vocab":[{"k":"기간","v":"khoảng thời gian"},{"k":"이용하다","v":"sử dụng"}]},{"n":64,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["컴퓨터실은 2층에 있습니다.","10월 9일에 새 컴퓨터를 쓸 수 있습니다.","노트북을 빌릴 때 돈을 내야 합니다.","노트북을 빌리려면 학생증이 필요합니다."],"ans":4,"exp":"Email ghi \"노트북을 빌릴 때는 학생증을 꼭 가지고 오십시오\" (khi mượn laptop nhất định mang thẻ sinh viên). Phòng máy ở tầng 3, mượn miễn phí, máy mới dùng từ 12/10. Đáp án đúng là ④.","vocab":[{"k":"학생증","v":"thẻ sinh viên"},{"k":"노트북","v":"máy tính xách tay"}]}]},{"sec":"R","nums":[65,66],"passage":{"kind":"text","body":["꽃은 종류마다 뜻이 있습니다. 그래서 사람들은 꽃을 선물할 때 꽃의 뜻을 생각해서 꽃을 고릅니다. 예를 들면, 빨간 장미는 '사랑'이라는 뜻이 있어서 연인에게 많이 선물합니다. 카네이션은 '감사'라는 뜻이 있습니다. 그래서 한국에서는 어버이날에 부모님께 카네이션을 ( ㉠ ). 꽃을 선물할 때 꽃의 뜻도 같이 알려 주면 받는 사람이 더 기뻐할 겁니다."]},"qs":[{"n":65,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["드립니다","받습니다","심습니다","버립니다"],"ans":1,"exp":"Cẩm chướng mang nghĩa \"감사\" (biết ơn), nên vào Ngày Cha Mẹ người Hàn \"부모님께 카네이션을 드립니다\" (tặng cha mẹ hoa cẩm chướng). Đáp án đúng là ①.","vocab":[{"k":"뜻","v":"ý nghĩa"},{"k":"어버이날","v":"Ngày Cha Mẹ"},{"k":"드리다","v":"biếu, tặng"}]},{"n":66,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["빨간 장미는 '감사'라는 뜻이 있습니다.","카네이션은 연인에게 많이 선물합니다.","꽃은 모두 같은 뜻이 있습니다.","사람들은 꽃의 뜻을 생각해서 꽃을 고릅니다."],"ans":4,"exp":"Bài viết có câu \"사람들은 꽃을 선물할 때 꽃의 뜻을 생각해서 꽃을 고릅니다\" (khi tặng hoa người ta chọn hoa theo ý nghĩa của nó). Hoa hồng đỏ là \"tình yêu\", mỗi loại có nghĩa riêng. Đáp án đúng là ④.","vocab":[{"k":"고르다","v":"chọn"},{"k":"연인","v":"người yêu"}]}]},{"sec":"R","nums":[67,68],"passage":{"kind":"text","body":["놀이공원에 가면 인기 있는 놀이 기구를 타려고 오래 기다려야 합니다. 특히 주말에는 한 시간 넘게 기다릴 때도 있습니다. 그래서 요즘은 휴대폰 앱으로 미리 예약을 할 수 있는 놀이공원이 많아졌습니다. 앱으로 예약하면 줄을 서지 않고 정해진 시간에 가서 바로 탈 수 있습니다. 이렇게 하면 ( ㉠ ) 그 시간에 다른 곳을 구경하거나 식사를 할 수 있습니다."]},"qs":[{"n":67,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["줄을 서서 기다리고","집에 일찍 가서","기다리는 시간을 낭비하지 않고","돈을 내지 않고"],"ans":3,"exp":"Đặt trước bằng app thì không phải xếp hàng, nên có thể dùng thời gian đó để tham quan, ăn uống mà \"기다리는 시간을 낭비하지 않고\" (không lãng phí thời gian chờ). Đáp án đúng là ③.","vocab":[{"k":"낭비하다","v":"lãng phí"},{"k":"예약","v":"đặt trước"},{"k":"줄을 서다","v":"xếp hàng"}]},{"n":68,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["주말에는 놀이공원에 사람이 적습니다.","앱으로 놀이 기구를 예약할 수 있습니다.","예약을 하면 더 오래 기다립니다.","놀이공원에서는 식사를 할 수 없습니다."],"ans":2,"exp":"Bài viết có câu \"휴대폰 앱으로 미리 예약을 할 수 있는 놀이공원이 많아졌습니다\" (ngày càng nhiều công viên cho đặt trước bằng app điện thoại). Đáp án đúng là ②.","vocab":[{"k":"미리","v":"trước"},{"k":"특히","v":"đặc biệt"}]}]},{"sec":"R","nums":[69,70],"passage":{"kind":"text","body":["지난주에 갑자기 비가 많이 왔습니다. 저는 우산이 없어서 버스 정류장에서 비가 그치기를 기다리고 있었습니다. 그때 모르는 할머니 한 분이 저에게 우산을 같이 쓰자고 하셨습니다. 할머니께서는 저를 집 앞까지 데려다주셨습니다. 알고 보니 할머니께서는 우리 아파트 옆 동에 사시는 분이었습니다. 저는 감사한 마음을 전하려고 다음 날 과일을 사서 할머니 댁에 ( ㉠ ). 그 후로 할머니와 저는 만나면 반갑게 인사하는 이웃이 되었습니다."]},"qs":[{"n":69,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["찾아갔습니다","전화했습니다","이사했습니다","초대했습니다"],"ans":1,"exp":"Người viết mua trái cây để cảm ơn rồi mang đến nhà bà: \"과일을 사서 할머니 댁에 찾아갔습니다\" (mua trái cây rồi đến thăm nhà bà). Đáp án đúng là ①.","vocab":[{"k":"찾아가다","v":"tìm đến thăm"},{"k":"전하다","v":"truyền đạt, gửi"}]},{"n":70,"stem":"이 글의 내용으로 알 수 있는 것을 고르십시오.","choices":["저는 그날 우산을 가지고 있었습니다.","할머니는 저와 같은 동에 사십니다.","할머니 덕분에 비를 맞지 않고 집에 왔습니다.","저는 할머니를 전부터 잘 알았습니다."],"ans":3,"exp":"Bà đã cho người viết che chung ô và \"집 앞까지 데려다주셨습니다\" (đưa về tận trước nhà), nên nhờ bà mà không bị ướt mưa. Bà sống ở tòa bên cạnh và trước đó là người lạ. Đáp án đúng là ③.","vocab":[{"k":"그치다","v":"tạnh"},{"k":"데려다주다","v":"đưa (ai) đến"},{"k":"덕분에","v":"nhờ vào"}]}]}]},{"test":7,"groups":[{"sec":"L","nums":[1],"audio":[{"s":"W","t":"강아지가 있어요?"}],"qs":[{"n":1,"stem":null,"choices":["네, 강아지가 아니에요.","네, 강아지가 있어요.","아니요, 강아지예요.","아니요, 강아지가 많아요."],"ans":2,"exp":"Câu hỏi \"강아지가 있어요?\" (Bạn có chó con không?). Trả lời khẳng định phải là \"네, 강아지가 있어요\" (Vâng, tôi có chó con), nên đáp án là ②.","vocab":[{"k":"강아지","v":"chó con"},{"k":"있다","v":"có"}]}]},{"sec":"L","nums":[2],"audio":[{"s":"M","t":"한복이 예뻐요?"}],"qs":[{"n":2,"stem":null,"choices":["네, 한복이 예뻐요.","네, 한복이 없어요.","아니요, 한복을 입어요.","아니요, 한복이 커요."],"ans":1,"exp":"Câu hỏi \"한복이 예뻐요?\" (Hanbok có đẹp không?). Câu trả lời phù hợp là \"네, 한복이 예뻐요\" (Vâng, hanbok đẹp), nên đáp án là ①.","vocab":[{"k":"한복","v":"hanbok (trang phục truyền thống Hàn Quốc)"},{"k":"예쁘다","v":"đẹp"}]}]},{"sec":"L","nums":[3],"audio":[{"s":"W","t":"기차표를 언제 샀어요?"}],"qs":[{"n":3,"stem":null,"choices":["부산에서 샀어요.","친구하고 샀어요.","어제 샀어요.","두 장 샀어요."],"ans":3,"exp":"Từ để hỏi \"언제\" (khi nào) hỏi về thời gian, nên câu trả lời phải là \"어제 샀어요\" (Tôi đã mua hôm qua). Đáp án là ③.","vocab":[{"k":"기차표","v":"vé tàu hỏa"},{"k":"언제","v":"khi nào"},{"k":"어제","v":"hôm qua"}]}]},{"sec":"L","nums":[4],"audio":[{"s":"M","t":"설날에 누구를 만나요?"}],"qs":[{"n":4,"stem":null,"choices":["집에서 만나요.","아침에 만나요.","떡국을 먹어요.","할머니를 만나요."],"ans":4,"exp":"Từ để hỏi \"누구\" (ai) hỏi về người, nên câu trả lời là \"할머니를 만나요\" (Tôi gặp bà). Đáp án là ④.","vocab":[{"k":"설날","v":"Tết Nguyên đán"},{"k":"누구","v":"ai"},{"k":"할머니","v":"bà"}]}]},{"sec":"L","nums":[5],"audio":[{"s":"M","t":"새해 복 많이 받으세요."}],"qs":[{"n":5,"stem":null,"choices":["안녕히 가세요.","새해 복 많이 받으세요.","잘 먹겠습니다.","죄송합니다."],"ans":2,"exp":"\"새해 복 많이 받으세요\" là lời chúc năm mới (Chúc năm mới nhiều phúc). Người nghe thường chúc lại bằng chính câu đó, nên đáp án là ②.","vocab":[{"k":"새해","v":"năm mới"},{"k":"복","v":"phúc, may mắn"}]}]},{"sec":"L","nums":[6],"audio":[{"s":"W","t":"늦어서 죄송합니다."}],"qs":[{"n":6,"stem":null,"choices":["축하합니다.","잘 부탁합니다.","괜찮습니다.","처음 뵙겠습니다."],"ans":3,"exp":"Người phụ nữ xin lỗi \"늦어서 죄송합니다\" (Xin lỗi vì đến muộn). Câu đáp lại phù hợp là \"괜찮습니다\" (Không sao đâu), nên đáp án là ③.","vocab":[{"k":"늦다","v":"muộn, trễ"},{"k":"죄송하다","v":"xin lỗi"}]}]},{"sec":"L","nums":[7],"audio":[{"s":"M","t":"이 코트 좀 깨끗하게 해 주세요."},{"s":"W","t":"네, 내일 저녁에 찾으러 오세요."}],"qs":[{"n":7,"stem":null,"choices":["세탁소","미용실","옷 가게","우체국"],"ans":1,"exp":"Người đàn ông nhờ \"코트 좀 깨끗하게 해 주세요\" (làm sạch giúp cái áo khoác) và người phụ nữ bảo \"찾으러 오세요\" (hãy đến lấy). Đây là tiệm giặt là, đáp án ①.","vocab":[{"k":"세탁소","v":"tiệm giặt là"},{"k":"깨끗하다","v":"sạch sẽ"},{"k":"찾다","v":"lấy lại, tìm"}]}]},{"sec":"L","nums":[8],"audio":[{"s":"W","t":"부산 가는 기차는 몇 번 타는 곳에서 타요?"},{"s":"M","t":"3번 타는 곳으로 가세요."}],"qs":[{"n":8,"stem":null,"choices":["공항","버스 정류장","공원","기차역"],"ans":4,"exp":"Người phụ nữ hỏi \"부산 가는 기차는 몇 번 타는 곳에서 타요?\" (Tàu đi Busan lên ở sân ga số mấy?). Đây )","※ 밤 10시 이후에는 조용히 해 주세요.","※ 강아지와 함께 올 수 있습니다.","예약: 010-1234-5678"]},"qs":[{"n":40,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["오후 두 시부터 들어갈 수 있습니다.","텐트를 따로 빌리지 않아도 됩니다.","강아지는 데려갈 수 없습니다.","전화로 예약할 수 있습니다."],"ans":3,"exp":"Thông báo ghi \"강아지와 함께 올 수 있습니다\" (có thể mang chó con đến), nên câu \"강아지는 데려갈 수 없습니다\" là sai. Đáp án là ③.","vocab":[{"k":"요금","v":"phí, giá tiền"},{"k":"포함","v":"bao gồm"},{"k":"예약","v":"đặt trước"}]}]},{"sec":"R","nums":[41],"passage":{"kind":"notice","title":"깨끗한 세탁소","body":["셔츠 3,000원 / 바지 5,000원 / 코트 12,000원","영업시간: 월~토 오전 9시 ~ 오후 8시","※ 일요일은 쉽니다.","※ 옷을 맡기고 이틀 후에 찾을 수 있습니다."]},"qs":[{"n":41,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["일요일에도 문을 엽니다.","바지는 오천 원입니다.","옷을 맡기고 이틀 후에 찾습니다.","오후 여덟 시에 문을 닫습니다."],"ans":1,"exp":"Thông báo ghi \"일요일은 쉽니다\" (Chủ nhật nghỉ), nên câu \"일요일에도 문을 엽니다\" (Chủ nhật cũng mở cửa) là sai. Đáp án là ①.","vocab":[{"k":"영업시간","v":"giờ mở cửa"},{"k":"이틀","v":"hai ngày"},{"k":"문을 열다","v":"mở cửa"}]}]},{"sec":"R","nums":[42],"passage":{"kind":"notice","title":"봉사 활동을 함께 해요!","body":["날짜: 10월 11일(토) 오전 10시 ~ 오후 1시","장소: 한국공원","하는 일: 공원 청소","모이는 곳: 공원 정문 앞","※ 점심을 드립니다."]},"qs":[{"n":42,"stem":"다음을 읽고 맞지 않는 것을 고르십시오.","choices":["토요일에 봉사 활동을 합니다.","오후에 봉사 활동을 시작합니다.","공원 정문 앞에서 만납니다.","점심을 먹을 수 있습니다."],"ans":2,"exp":"Hoạt động bắt đầu lúc \"오전 10시\" (10 giờ sáng), không phải buổi chiều. Vì vậy câu ② là sai, đáp án ②.","vocab":[{"k":"청소","v":"dọn dẹp"},{"k":"정문","v":"cổng chính"},{"k":"모이다","v":"tập trung"}]}]},{"sec":"R","nums":[43],"passage":{"kind":"text","body":["저는 지난 주말에 부산에 갔습니다. 기차를 타고 가서 두 시간 반쯤 걸렸습니다. 바다를 보면서 회를 먹었습니다."]},"qs":[{"n":43,"stem":null,"choices":["저는 버스를 타고 갔습니다.","부산까지 한 시간 걸렸습니다.","저는 산에 갔습니다.","저는 부산에서 회를 먹었습니다."],"ans":4,"exp":"Bài viết có câu \"바다를 보면서 회를 먹었습니다\" (vừa ngắm biển vừa ăn gỏi cá) ở Busan, nên đáp án là ④.","vocab":[{"k":"걸리다","v":"mất (thời gian)"},{"k":"바다","v":"biển"},{"k":"회","v":"gỏi cá sống"}]}]},{"sec":"R","nums":[44],"passage":{"kind":"text","body":["우리 집 강아지 이름은 콩이입니다. 콩이는 세 살입니다. 저는 매일 저녁 콩이와 산책을 합니다."]},"qs":[{"n":44,"stem":null,"choices":["콩이는 고양이입니다.","콩이는 다섯 살입니다.","저는 저녁마다 콩이와 걷습니다.","저는 아침에 산책을 합니다."],"ans":3,"exp":"\"매일 저녁 콩이와 산책을 합니다\" (mỗi tối đi dạo với Kong-i) có nghĩa giống \"저녁마다 콩이와 걷습니다\". Đáp án là ③.","vocab":[{"k":"산책","v":"đi dạo"},{"k":"-마다","v":"mỗi"}]}]},{"sec":"R","nums":[45],"passage":{"kind":"text","body":["저는 아침마다 신문을 읽습니다. 요즘은 한국어 신문도 읽습니다. 모르는 단어는 사전에서 찾습니다."]},"qs":[{"n":45,"stem":null,"choices":["저는 한국어 신문을 읽습니다.","저는 저녁에 신문을 읽습니다.","저는 모르는 단어를 친구에게 묻습니다.","저는 신문을 읽지 않습니다."],"ans":1,"exp":"Bài viết có câu \"요즘은 한국어 신문도 읽습니다\" (dạo này tôi cũng đọc báo tiếng Hàn), nên đáp án là ①.","vocab":[{"k":"단어","v":"từ vựng"},{"k":"사전","v":"từ điển"},{"k":"찾다","v":"tra, tìm"}]}]},{"sec":"R","nums":[46],"passage":{"kind":"text","body":["저는 요즘 살이 쪄서 다이어트를 하고 있습니다. 그런데 밥을 안 먹으니까 힘이 없습니다. 밥을 조금씩 먹으면서 운동을 하고 싶습니다."]},"qs":[{"n":46,"stem":null,"choices":["밥을 먹지 않고 싶습니다.","적게 먹으면서 운동을 하고 싶습니다.","살을 빨리 빼고 싶습니다.","운동을 그만두고 싶습니다."],"ans":2,"exp":"Câu cuối \"밥을 조금씩 먹으면서 운동을 하고 싶습니다\" (tôi muốn vừa ăn một ít vừa tập thể dục) là ý chính. Đáp án là ②.","vocab":[{"k":"살이 찌다","v":"tăng cân"},{"k":"힘이 없다","v":"không có sức"}]}]},{"sec":"R","nums":[47],"passage":{"kind":"text","body":["저는 한복을 좋아합니다. 한복은 색깔이 아주 예쁩니다. 다음 설날에는 한복을 꼭 입어 보고 싶습니다."]},"qs":[{"n":47,"stem":null,"choices":["한복을 만들고 싶습니다.","한복은 비쌉니다.","설날에 한복을 입고 싶습니다.","한복을 친구에게 선물하고 싶습니다."],"ans":3,"exp":"Câu \"다음 설날에는 한복을 꼭 입어 보고 싶습니다\" (Tết tới tôi nhất định muốn mặc thử hanbok) là ý chính. Đáp án là ③.","vocab":[{"k":"색깔","v":"màu sắc"},{"k":"꼭","v":"nhất định"},{"k":"입어 보다","v":"mặc thử"}]}]},{"sec":"R","nums":[48],"passage":{"kind":"text","body":["저는 주말마다 가족과 캠핑을 갑니다. 캠핑장에서는 휴대폰을 보지 않고 가족과 이야기를 많이 합니다. 그래서 저는 캠핑이 정말 좋습니다."]},"qs":[{"n":48,"stem":null,"choices":["휴대폰을 새로 사고 싶습니다.","캠핑장이 가까우면 좋겠습니다.","주말에 집에서 쉬고 싶습니다.","가족과 캠핑하는 것이 좋습니다."],"ans":4,"exp":"Người viết nói ở khu cắm trại được trò chuyện nhiều với gia đình \"그래서 저는 캠핑이 정말 좋습니다\" (vì vậy tôi rất thích cắm trại). Đáp án là ④.","vocab":[{"k":"캠핑장","v":"khu cắm trại"},{"k":"휴대폰","v":"điện thoại di động"}]}]},{"sec":"R","nums":[49,50],"passage":{"kind":"text","body":["저는 지난달부터 세탁소에서 아르바이트를 하고 있습니다. 손님들이 옷을 맡기면 저는 옷에 이름표를 붙입니다. 처음에는 일을 잘 몰라서 실수를 많이 했습니다. 그런데 지금은 일이 익숙해져서 ( ㉠ ). 사장님도 제가 일을 잘한다고 칭찬해 주십니다."]},"qs":[{"n":49,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["실수를 더 많이 합니다","실수를 거의 하지 않습니다","아르바이트를 그만두었습니다","일을 잘 모릅니다"],"ans":2,"exp":"\"그런데 지금은 일이 익숙해져서\" (nhưng bây giờ đã quen việc) trái ngược với lúc đầu hay mắc lỗi, nên phải là \"실수를 거의 하지 않습니다\" (hầu như không mắc lỗi). Đáp án là ②.","vocab":[{"k":"익숙해지다","v":"trở nên quen"},{"k":"실수","v":"lỗi, sai sót"}]},{"n":50,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 세탁소에서 일합니다.","저는 작년부터 아르바이트를 했습니다.","사장님은 저를 칭찬하지 않습니다.","손님이 옷에 이름표를 붙입니다."],"ans":1,"exp":"\"세탁소에서 아르바이트를 하고 있습니다\" (tôi đang làm thêm ở tiệm giặt là), nên đáp án là ①. Tôi bắt đầu từ tháng trước và chính tôi gắn thẻ tên.","vocab":[{"k":"아르바이트","v":"việc làm thêm"},{"k":"칭찬하다","v":"khen ngợi"},{"k":"이름표","v":"thẻ tên"}]}]},{"sec":"R","nums":[51,52],"passage":{"kind":"text","body":["삼계탕은 닭 안에 쌀, 인삼, 마늘 등을 넣고 오래 끓인 음식입니다. 한국 사람들은 여름에 삼계탕을 많이 먹습니다. 날씨가 더우면 몸이 약해지기 쉽기 때문입니다. 특히 여름에 아주 더운 날인 '복날'에는 삼계탕 가게 앞에 사람들이 ( ㉠ ). 사람들은 뜨거운 삼계탕을 먹으면 힘이 난다고 생각합니다."]},"qs":[{"n":51,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["조금 있습니다","거의 없습니다","문을 닫습니다","길게 줄을 섭니다"],"ans":4,"exp":"Vào ngày \"복날\" rất nhiều người ăn gà hầm sâm, nên trước quán người ta \"길게 줄을 섭니다\" (xếp hàng dài). Đáp án là ④.","vocab":[{"k":"끓이다","v":"nấu sôi, hầm"},{"k":"줄을 서다","v":"xếp hàng"},{"k":"복날","v":"ngày nóng nhất mùa hè (Boknal)"}]},{"n":52,"stem":"무엇에 대한 이야기인지 맞는 것을 고르십시오.","choices":["삼계탕을 만드는 방법","삼계탕의 가격","한국 사람들이 여름에 삼계탕을 먹는 이유","삼계탕 가게를 찾는 방법"],"ans":3,"exp":"Bài viết giải thích \"몸이 약해지기 쉽기 때문입니다\" (vì cơ thể dễ bị yếu đi) – tức là lý do người Hàn ăn gà hầm sâm vào mùa hè. Đáp án là ③.","vocab":[{"k":"약해지다","v":"trở nên yếu"},{"k":"이유","v":"lý do"}]}]},{"sec":"R","nums":[53,54],"passage":{"kind":"text","body":["저는 지난 방학에 혼자 기차를 타고 부산에 갔습니다. 비행기보다 시간은 더 걸렸지만 창밖을 보는 것이 즐거웠습니다. 옆자리에 앉은 할머니께서 귤을 주셔서 같이 이야기를 하면서 먹었습니다. 할머니 덕분에 부산에서 ( ㉠ ) 맛있는 식당도 알게 되었습니다. 다음에도 기차 여행을 하고 싶습니다."]},"qs":[{"n":53,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["사람들이 많이 가는","제가 자주 가던","문을 닫은","맛이 없는"],"ans":1,"exp":"Nhờ bà cụ mà tôi \"알게 되었습니다\" (đã biết thêm) một quán ăn ngon, nên phù hợp nhất là \"사람들이 많이 가는\" (nhiều người hay đến). ② sai vì tôi mới biết quán đó. Đáp án là ①.","vocab":[{"k":"덕분에","v":"nhờ vào"},{"k":"알게 되다","v":"biết được"}]},{"n":54,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 친구와 부산에 갔습니다.","저는 기차에서 할머니와 이야기했습니다.","기차가 비행기보다 빨랐습니다.","저는 할머니께 귤을 드렸습니다."],"ans":2,"exp":"\"옆자리에 앉은 할머니께서 귤을 주셔서 같이 이야기를 하면서 먹었습니다\" (bà cụ ngồi cạnh cho quýt nên hai người vừa ăn vừa nói chuyện). Đáp án là ②.","vocab":[{"k":"창밖","v":"ngoài cửa sổ"},{"k":"옆자리","v":"ghế bên cạnh"},{"k":"귤","v":"quả quýt"}]}]},{"sec":"R","nums":[55,56],"passage":{"kind":"text","body":["설날은 한국의 큰 명절입니다. 설날 아침에는 가족들이 모여서 떡국을 먹습니다. 떡국을 먹으면 한 살을 더 먹는다고 합니다. ( ㉠ ) 아이들은 어른들께 세배를 합니다. 세배를 하면 어른들이 좋은 말씀과 함께 세뱃돈을 주십니다."]},"qs":[{"n":55,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["그래서","그런데","그리고","그러면"],"ans":3,"exp":"Câu trước nói về việc ăn canh bánh gạo, câu sau thêm một phong tục khác là lạy chào người lớn (세배). Hai việc được liệt kê nên dùng \"그리고\" (và). Đáp án là ③.","vocab":[{"k":"명절","v":"ngày lễ tết truyền thống"},{"k":"세배","v":"lạy chào năm mới"}]},{"n":56,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["설날 저녁에 떡국을 먹습니다.","어른들이 아이들에게 세배를 합니다.","떡국은 추석에 먹는 음식입니다.","세배를 하면 세뱃돈을 받을 수 있습니다."],"ans":4,"exp":"\"세배를 하면 어른들이 ... 세뱃돈을 주십니다\" (lạy chào thì người lớn cho tiền mừng tuổi), nên đáp án là ④. Canh bánh gạo ăn vào buổi sáng ngày Tết.","vocab":[{"k":"떡국","v":"canh bánh gạo"},{"k":"세뱃돈","v":"tiền mừng tuổi"},{"k":"어른","v":"người lớn"}]}]},{"sec":"R","nums":[57],"passage":{"kind":"text","body":["(가) 그래서 매일 아침 강아지와 함께 공원을 걷습니다.","(나) 저는 작년에 강아지 한 마리를 키우기 시작했습니다.","(다) 강아지는 밖에 나가서 걷는 것을 아주 좋아합니다.","(라) 그 덕분에 저도 건강해졌습니다."]},"qs":[{"n":57,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(다)-(가)-(라)","(나)-(가)-(라)-(다)","(다)-(나)-(가)-(라)","(다)-(가)-(나)-(라)"],"ans":1,"exp":"Bắt đầu bằng (나) \"작년에 강아지를 키우기 시작했습니다\" (năm ngoái bắt đầu nuôi chó), rồi (다) chó thích ra ngoài đi dạo, (가) \"그래서\" mỗi sáng đi dạo, (라) \"그 덕분에\" tôi cũng khỏe lên. Đáp án là ①.","vocab":[{"k":"키우기 시작하다","v":"bắt đầu nuôi"},{"k":"건강해지다","v":"trở nên khỏe mạnh"}]}]},{"sec":"R","nums":[58],"passage":{"kind":"text","body":["(가) 처음에는 무엇을 해야 할지 몰라서 어려웠습니다.","(나) 저는 한 달 전부터 도서관에서 봉사 활동을 하고 있습니다.","(다) 하지만 지금은 책 정리도 잘하고 아이들에게 책도 읽어 줍니다.","(라) 다음 달에는 친구와 함께 갈 생각입니다."]},"qs":[{"n":58,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(가)-(나)-(다)-(라)","(나)-(가)-(다)-(라)","(가)-(다)-(나)-(라)","(나)-(다)-(가)-(라)"],"ans":2,"exp":"Bắt đầu bằng (나) giới thiệu hoạt động tình nguyện ở thư viện, rồi (가) \"처음에는\" (lúc đầu) khó khăn, (다) \"하지만 지금은\" (nhưng bây giờ) đã làm tốt, cuối cùng (라) kế hoạch tháng sau. Đáp án là ②.","vocab":[{"k":"정리","v":"sắp xếp"},{"k":"읽어 주다","v":"đọc cho nghe"}]}]},{"sec":"R","nums":[59,60],"passage":{"kind":"text","body":["우리 할아버지는 매일 아침 신문을 읽으십니다. ( ㉠ ) 할아버지는 신문에서 재미있는 기사를 찾으면 가위로 잘라서 공책에 붙이십니다. ( ㉡ ) 그 공책이 벌써 스무 권이 넘었습니다. ( ㉢ ) 저는 휴대폰으로만 뉴스를 봐서 신문을 거의 읽지 않았습니다. ( ㉣ ) 요즘은 저도 할아버지와 함께 신문을 읽고 있습니다."]},"qs":[{"n":59,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.","choices":["㉠","㉡","㉢","㉣"],"ans":4,"box":"하지만 할아버지의 공책을 본 후에 신문에 관심이 생겼습니다.","exp":"Câu cần chèn có nghĩa \"Nhưng sau khi xem cuốn vở của ông, tôi bắt đầu quan tâm đến báo\". Câu này phải đứng sau \"신문을 거의 읽지 않았습니다\" (hầu như không đọc báo) và trước \"요즘은 저도 ... 신문을 읽고 있습니다\". Đáp án là ④ ㉣.","vocab":[{"k":"관심이 생기다","v":"bắt đầu quan tâm"},{"k":"기사","v":"bài báo"}]},{"n":60,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["할아버지는 저녁에 신문을 읽으십니다.","할아버지의 공책은 열 권입니다.","저는 요즘 할아버지와 신문을 읽습니다.","저는 원래 신문을 자주 읽었습니다."],"ans":3,"exp":"\"요즘은 저도 할아버지와 함께 신문을 읽고 있습니다\" (dạo này tôi cũng đọc báo cùng ông), nên đáp án là ③. Ông đọc báo buổi sáng và cuốn vở đã hơn 20 quyển.","vocab":[{"k":"가위","v":"cái kéo"},{"k":"공책","v":"vở"},{"k":"권","v":"quyển"}]}]},{"sec":"R","nums":[61,62],"passage":{"kind":"text","body":["저는 한국에 온 지 1년이 되었습니다. 지난 추석에 한국 친구 집에 초대를 받았습니다. 친구 어머니께서 저에게 한복을 빌려 주셨습니다. 한복을 입고 친구 가족과 함께 송편을 만들었습니다. 처음 만들어 봐서 모양이 예쁘지 않았지만 ( ㉠ ). 다음 추석에는 제가 베트남 음식을 만들어서 친구 가족에게 대접하고 싶습니다."]},"qs":[{"n":61,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["맛이 없었습니다","모두 맛있게 먹었습니다","한복이 작았습니다","다시 만들지 않았습니다"],"ans":2,"exp":"\"-지만\" (nhưng) nối hai ý trái ngược: hình dáng không đẹp nhưng \"모두 맛있게 먹었습니다\" (mọi người đều ăn ngon lành). Đáp án là ②.","vocab":[{"k":"모양","v":"hình dáng"},{"k":"-지만","v":"nhưng"}]},{"n":62,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 추석에 친구 집에서 한복을 입었습니다.","저는 한국에 온 지 2년이 되었습니다.","친구 어머니께서 한복을 사 주셨습니다.","저는 송편을 많이 만들어 봤습니다."],"ans":1,"exp":"Người viết được mời đến nhà bạn dịp Trung thu và \"한복을 입고 ... 송편을 만들었습니다\" (mặc hanbok và làm bánh songpyeon). Đáp án là ①. Mẹ bạn cho mượn (빌려 주셨습니다) chứ không mua.","vocab":[{"k":"초대를 받다","v":"được mời"},{"k":"대접하다","v":"đãi, tiếp đãi"}]}]},{"sec":"R","nums":[63,64],"passage":{"kind":"email","title":"봉사 동아리 11월 활동 안내","body":["받는 사람: 봉사 동아리 회원","보내는 사람: 김지훈(동아리 회장)","회원 여러분, 안녕하세요.","11월 활동 장소가 바뀌어서 알려 드립니다.","이번 달에는 한국공원이 아니라 '행복 동물 보호소'에서 강아지 산책과 청소를 도울 예정입니다.","날짜는 11월 15일 토요일이고, 오전 9시에 학교 정문 앞에서 버스를 타고 같이 출발합니다.","더러워져도 괜찮은 옷을 입고 오세요.","참가하실 분은 11월 10일까지 저에게 문자를 보내 주세요."]},"qs":[{"n":63,"stem":"왜 윗글을 썼는지 맞는 것을 고르십시오.","choices":["새 회원 모집을 알려 주려고","보호소 전화번호를 알려 주려고","바뀐 활동 장소를 알려 주려고","버스 요금을 알려 주려고"],"ans":3,"exp":"Email viết \"11월 활동 장소가 바뀌어서 알려 드립니다\" (xin thông báo vì địa điểm hoạt động tháng 11 đã thay đổi). Đáp án là ③.","vocab":[{"k":"바뀌다","v":"được thay đổi"},{"k":"회원","v":"thành viên"},{"k":"동아리","v":"câu lạc bộ"}]},{"n":64,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["이번 활동은 한국공원에서 합니다.","보호소에는 각자 따로 갑니다.","참가하려면 11월 15일까지 연락해야 합니다.","학교 앞에서 버스를 타고 출발합니다."],"ans":4,"exp":"\"학교 정문 앞에서 버스를 타고 같이 출발합니다\" (cùng lên xe buýt xuất phát trước cổng trường), nên đáp án là ④. Hạn đăng ký là ngày 10/11.","vocab":[{"k":"참가하다","v":"tham gia"},{"k":"더러워지다","v":"bị bẩn"},{"k":"각자","v":"mỗi người"}]}]},{"sec":"R","nums":[65,66],"passage":{"kind":"text","body":["요즘 캠핑을 하는 사람들이 많아졌습니다. 그런데 캠핑 장비를 모두 사려면 돈이 많이 듭니다. 그래서 최근에는 텐트나 의자 같은 장비를 준비하지 않아도 되는 캠핑장이 인기가 있습니다. 이런 캠핑장에는 장비가 이미 준비되어 있기 때문에 ( ㉠ ) 캠핑을 즐길 수 있습니다. 처음 캠핑을 하는 사람들도 쉽게 이용할 수 있어서 좋습니다."]},"qs":[{"n":65,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["장비를 많이 사서","몸만 가서","텐트를 직접 만들어서","친구에게 빌려서"],"ans":2,"exp":"Vì dụng cụ \"이미 준비되어 있기 때문에\" (đã được chuẩn bị sẵn), người ta chỉ cần \"몸만 가서\" (đi tay không) là có thể cắm trại. Đáp án là ②.","vocab":[{"k":"장비","v":"trang thiết bị, dụng cụ"},{"k":"이미","v":"đã, sẵn"},{"k":"즐기다","v":"tận hưởng"}]},{"n":66,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["캠핑 장비는 값이 쌉니다.","요즘 캠핑을 하는 사람들이 줄었습니다.","이런 캠핑장에서는 텐트를 가지고 가야 합니다.","처음 캠핑하는 사람도 이런 캠핑장을 쉽게 이용할 수 있습니다."],"ans":4,"exp":"Câu cuối \"처음 캠핑을 하는 사람들도 쉽게 이용할 수 있어서 좋습니다\" (người mới cắm trại lần đầu cũng dễ sử dụng), nên đáp án là ④.","vocab":[{"k":"인기가 있다","v":"được ưa chuộng"},{"k":"줄다","v":"giảm"}]}]},{"sec":"R","nums":[67,68],"passage":{"kind":"text","body":["건강을 위해 운동을 하고 싶지만 시간이 없는 사람이 많습니다. 이런 사람들에게는 생활 속에서 운동하는 방법이 좋습니다. 예를 들면 엘리베이터 대신 계단을 이용하거나, 가까운 곳은 버스를 타지 않고 걸어가는 것입니다. 또 텔레비전을 보는 동안 스트레칭을 할 수도 있습니다. 이렇게 ( ㉠ ) 건강을 지킬 수 있습니다. 운동은 꼭 헬스장에서만 하는 것이 아닙니다."]},"qs":[{"n":67,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["매일 조금씩 몸을 움직이면","비싼 운동 기구를 사면","병원에 자주 가면","음식을 적게 먹으면"],"ans":1,"exp":"Các ví dụ (đi cầu thang, đi bộ, giãn cơ khi xem TV) đều là \"매일 조금씩 몸을 움직이면\" (nếu mỗi ngày vận động cơ thể một chút). Đáp án là ①.","vocab":[{"k":"움직이다","v":"cử động, vận động"},{"k":"지키다","v":"giữ gìn, bảo vệ"}]},{"n":68,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["운동은 헬스장에서만 해야 합니다.","텔레비전을 보면 건강에 좋습니다.","계단을 이용하는 것도 운동이 됩니다.","시간이 없으면 운동을 할 수 없습니다."],"ans":3,"exp":"Bài viết đưa ví dụ \"엘리베이터 대신 계단을 이용하거나\" (dùng cầu thang thay cho thang máy) là cách tập thể dục trong cuộc sống. Đáp án là ③.","vocab":[{"k":"대신","v":"thay cho"},{"k":"계단","v":"cầu thang bộ"},{"k":"헬스장","v":"phòng gym"}]}]},{"sec":"R","nums":[69,70],"passage":{"kind":"text","body":["저는 어렸을 때부터 강아지를 키우고 싶었습니다. 하지만 부모님께서는 강아지를 키우는 것은 쉬운 일이 아니라고 하시면서 반대하셨습니다. 대학생이 된 후 저는 동물 보호소에서 봉사 활동을 하게 되었습니다. 거기에서 강아지에게 밥을 주고 산책을 시키면서 강아지를 키우는 일이 생각보다 힘들다는 것을 알게 되었습니다. 그리고 부모님께서 왜 반대하셨는지 ( ㉠ ). 그래서 매일 강아지를 돌볼 수 있는 준비가 될 때까지 기다리기로 했습니다. 그때까지는 보호소에서 봉사 활동을 계속할 생각입니다."]},"qs":[{"n":69,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["이해할 수 있었습니다","아직도 모릅니다","부모님께 물어보았습니다","화가 났습니다"],"ans":1,"exp":"Sau khi biết nuôi chó \"생각보다 힘들다\" (vất vả hơn mình nghĩ), người viết đã \"이해할 수 있었습니다\" (có thể hiểu) vì sao bố mẹ phản đối. Đáp án là ①.","vocab":[{"k":"반대하다","v":"phản đối"},{"k":"이해하다","v":"hiểu"}]},{"n":70,"stem":"이 글의 내용으로 알 수 있는 것을 고르십시오.","choices":["저는 지금 강아지를 키우고 있습니다.","저는 보호소에서 강아지를 산책시킨 적이 있습니다.","부모님께서는 강아지 키우는 것을 좋아하셨습니다.","저는 이제 봉사 활동을 그만둘 것입니다."],"ans":2,"exp":"Ở trại cứu hộ, người viết \"강아지에게 밥을 주고 산책을 시키면서\" (cho chó ăn và dắt đi dạo), nên đáp án là ②. Hiện tại người viết chưa nuôi chó và sẽ tiếp tục làm tình nguyện.","vocab":[{"k":"돌보다","v":"chăm sóc"},{"k":"산책을 시키다","v":"dắt đi dạo"},{"k":"-기로 하다","v":"quyết định làm gì"}]}]}]},{"test":8,"groups":[{"sec":"L","nums":[1],"audio":[{"s":"W","t":"동생이 있어요?"}],"qs":[{"n":1,"stem":null,"choices":["네, 동생이 아니에요.","네, 동생이 있어요.","아니요, 동생이 많아요.","아니요, 동생이 좋아요."],"ans":2,"exp":"Câu hỏi \"동생이 있어요?\" (Bạn có em không?). Trả lời \"네, 동생이 있어요\" (Vâng, tôi có em) là phù hợp, nên đáp án là ②.","vocab":[{"k":"동생","v":"em (em trai/em gái)"},{"k":"있다","v":"có"}]}]},{"sec":"L","nums":[2],"audio":[{"s":"M","t":"커피가 뜨거워요?"}],"qs":[{"n":2,"stem":null,"choices":["네, 커피가 없어요.","네, 커피를 마셔요.","아니요, 안 뜨거워요.","아니요, 커피가 아니에요."],"ans":3,"exp":"Câu hỏi \"커피가 뜨거워요?\" (Cà phê có nóng không?). Câu trả lời phù hợp là \"아니요, 안 뜨거워요\" (Không, không nóng), nên đáp án là ③.","vocab":[{"k":"뜨겁다","v":"nóng"},{"k":"커피","v":"cà phê"}]}]},{"sec":"L","nums":[3],"audio":[{"s":"W","t":"어디에서 책을 샀어요?"}],"qs":[{"n":3,"stem":null,"choices":["서점에서 샀어요.","어제 샀어 "M","t":"지난달에 산 꽃이 벌써 죽었어요. 물을 매일 줬는데요."},{"s":"W","t":"물을 너무 많이 줘서 그래요. 그 꽃은 일주일에 한 번만 주면 돼요."},{"s":"M","t":"그래요? 몰랐어요."},{"s":"W","t":"식물마다 키우는 방법이 달라요. 먼저 잘 알아보고 키우는 게 좋아요."}],"qs":[{"n":22,"stem":null,"choices":["식물은 매일 물을 줘야 합니다.","식물은 창문 옆에 두면 안 됩니다.","식물을 키우는 방법을 알고 키우는 것이 좋습니다.","식물을 많이 사는 것이 좋습니다."],"ans":3,"exp":"Người phụ nữ nói \"먼저 잘 알아보고 키우는 게 좋아요\" (Nên tìm hiểu kỹ trước rồi hãy trồng). Suy nghĩ chính là nên biết cách chăm cây, nên đáp án là ③.","vocab":[{"k":"죽다","v":"chết"},{"k":"알아보다","v":"tìm hiểu"},{"k":"방법","v":"cách, phương pháp"}]}]},{"sec":"L","nums":[23],"audio":[{"s":"M","t":"이삿짐이 너무 많아요. 혼자 옮길 수 있을까요?"},{"s":"W","t":"이삿짐 센터에 전화해 보세요."},{"s":"M","t":"돈이 많이 들 것 같아서요."},{"s":"W","t":"그래도 혼자 하면 힘들고 위험해요. 돈이 조금 들어도 이삿짐 센터에 맡기는 게 좋아요."}],"qs":[{"n":23,"stem":null,"choices":["이삿짐은 혼자 옮기는 것이 좋습니다.","이사할 때는 돈을 아껴야 합니다.","이삿짐을 줄이는 것이 좋습니다.","이삿짐 센터에 맡기는 것이 좋습니다."],"ans":4,"exp":"Người phụ nữ nói \"돈이 조금 들어도 이삿짐 센터에 맡기는 게 좋아요\" (Dù tốn chút tiền cũng nên giao cho công ty chuyển nhà). Đáp án là ④.","vocab":[{"k":"이삿짐","v":"đồ đạc chuyển nhà"},{"k":"옮기다","v":"di chuyển, khuân"},{"k":"맡기다","v":"giao phó, gửi"}]}]},{"sec":"L","nums":[24],"audio":[{"s":"M","t":"요즘 바빠서 책을 읽을 시간이 없어요."},{"s":"W","t":"저는 지하철에서 책을 읽어요."},{"s":"M","t":"지하철은 사람이 많아서 불편하지 않아요?"},{"s":"W","t":"짧게라도 매일 읽으면 한 달에 두세 권은 읽을 수 있어요. 시간을 조금씩 만드는 게 중요해요."}],"qs":[{"n":24,"stem":null,"choices":["지하철에서는 책을 읽으면 안 됩니다.","조금씩 시간을 만들어서 책을 읽어야 합니다.","한 달에 책을 많이 사는 것이 좋습니다.","책은 집에서 읽는 것이 좋습니다."],"ans":2,"exp":"Người phụ nữ nói \"시간을 조금씩 만드는 게 중요해요\" (Quan trọng là tạo ra thời gian từng chút một) để đọc sách. Đáp án là ②.","vocab":[{"k":"지하철","v":"tàu điện ngầm"},{"k":"불편하다","v":"bất tiện"},{"k":"조금씩","v":"từng chút một"}]}]},{"sec":"L","nums":[25,26],"audio":[{"s":"W","t":"관람객 여러분께 안내 말씀 드립니다. 오늘 우리 미술관은 오후 여섯 시에 문을 닫습니다. 2층 특별 전시실은 다섯 시 삼십 분까지만 들어가실 수 있습니다. 특별 전시실 안에서는 사진을 찍으실 수 없습니다. 그리고 1층 기념품 가게는 오늘 쉽니다. 감사합니다."}],"qs":[{"n":25,"stem":"여자가 왜 이 이야기를 하고 있는지 고르십시오.","choices":["새 전시를 소개하려고","기 에 갑니다.","한강 공원에는 사람이 없습니다.","저는 한강 공원에서 자전거를 탑니다.","저는 한강 공원에서 라면을 팝니다."],"ans":3,"exp":"\"거기에서 자전거를 타고\" (Ở đó tôi đi xe đạp). Tôi đi vào cuối tuần và ăn mì chứ không bán mì. Đáp án là ③.","vocab":[{"k":"평일","v":"ngày thường"},{"k":"라면","v":"mì ăn liền"}]}]},{"sec":"R","nums":[45],"passage":{"kind":"text","body":["저는 회사원입니다. 다음 주에 일본으로 출장을 갑니다. 일본어를 잘 못해서 요즘 일본어를 공부하고 있습니다."]},"qs":[{"n":45,"stem":null,"choices":["저는 일본어를 잘합니다.","저는 일본어를 배우고 있습니다.","저는 지난주에 일본에 갔습니다.","저는 일본 회사에 다닙니다."],"ans":2,"exp":"\"요즘 일본어를 공부하고 있습니다\" (Dạo này tôi đang học tiếng Nhật). Đáp án là ②.","vocab":[{"k":"회사원","v":"nhân viên công ty"},{"k":"출장","v":"công tác"}]}]},{"sec":"R","nums":[46],"passage":{"kind":"text","body":["저는 집에서 식물을 키웁니다. 식물을 보면 마음이 편해집니다. 그래서 친구들에게도 식물을 키워 보라고 이야기합니다."]},"qs":[{"n":46,"stem":null,"choices":["식물은 값이 비쌉니다.","식물을 사고 싶습니다.","친구와 식물을 키우고 싶습니다.","식물을 키우면 좋습니다."],"ans":4,"exp":"Người viết nói nhìn cây thì \"마음이 편해집니다\" (tâm trạng thoải mái) và khuyên bạn bè trồng cây. Ý chính: trồng cây thì tốt. Đáp án là ④.","vocab":[{"k":"마음이 편하다","v":"thoải mái trong lòng"},{"k":"키우다","v":"trồng, nuôi"}]}]},{"sec":"R","nums":[47],"passage":{"kind":"text","body":["저는 책을 좋아합니다. 그런데 요즘은 책을 사지 않고 도서관에서 빌립니다. 돈도 아낄 수 있고 여러 가지 책을 읽을 수 있어서 좋습니다."]},"qs":[{"n":47,"stem":null,"choices":["도서관에서 책을 빌리는 것이 좋습니다.","책을 많이 사고 싶습니다.","도서관에서 일하고 싶습니다.","돈을 모으고 싶습니다."],"ans":1,"exp":"Người viết mượn sách ở thư viện vì \"돈도 아낄 수 있고 여러 가지 책을 읽을 수 있어서 좋습니다\" (tiết kiệm tiền và đọc được nhiều loại sách). Đáp án là ①.","vocab":[{"k":"빌리다","v":"mượn"},{"k":"아끼다","v":"tiết kiệm"}]}]},{"sec":"R","nums":[48],"passage":{"kind":"text","body":["저는 된장찌개를 좋아합니다. 식당에서 자주 먹었는데 이제 집에서 직접 만들어 보고 싶습니다. 그래서 요리 수업을 들으려고 합니다."]},"qs":[{"n":48,"stem":null,"choices":["식당에서 된장찌개를 먹고 싶습니다.","된장찌개를 좋아하지 않습니다.","된장찌개를 직접 만들고 싶습니다.","요리 수업을 가르치고 싶습니다."],"ans":3,"exp":"\"집에서 직접 만들어 보고 싶습니다\" (Tôi muốn tự nấu ở nhà). Đáp án là ③.","vocab":[{"k":"직접","v":"tự mình"},{"k":"수업을 듣다","v":"nghe giảng, học lớp"}]}]},{"sec":"R","nums":[49,50],"passage":{"kind":"text","body":["저는 한국에 온 지 삼 개월이 되었습니다. 지난달에 외국인 등록증을 만들려고 출입국 사무소에 갔습니다. 그런데 사람이 너무 많아서 세 시간이나 기다렸습니다. 나중에 알았는데 인터넷으로 미리 ( ㉠ ) 오래 기다리지 않아도 됩니다. 다음에는 꼭 예약을 하고 갈 겁니다."]},"qs":[{"n":49,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["예약하지만","예약하거나","예약하는데","예약하면"],"ans":4,"exp":"Cần biểu hiện điều kiện \"-(으)면\" (nếu): \"미리 예약하면 오래 기다리지 않아도 됩니다\" (Nếu đặt trước thì không phải chờ lâu). Đáp án là ④.","vocab":[{"k":"미리","v":"trước"},{"k":"-(으)면","v":"nếu"}]},{"n":50,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 한국에 온 지 일 년이 되었습니다.","저는 출입국 사무소에서 오래 기다렸습니다.","저는 인터넷으로 예약을 하고 갔습니다.","출입국 사무소에는 사람이 적었습니다."],"ans":2,"exp":"\"세 시간이나 기다렸습니다\" (đã chờ tới 3 tiếng). Người viết mới ở Hàn 3 tháng và không đặt lịch trước. Đáp án là ②.","vocab":[{"k":"기다리다","v":"chờ đợi"},{"k":"-(이)나","v":"tới (nhấn mạnh số lượng nhiều)"}]}]},{"sec":"R","nums":[51,52],"passage":{"kind":"text","body":["집에서 식물을 키우는 사람이 많아지고 있습니다. 식물은 공기를 깨끗하게 해 주고 방을 예쁘게 만들어 줍니다. 식물을 잘 키우려면 물을 너무 자주 주지 않는 것이 좋습니다. 흙을 손으로 만져 보고 ( ㉠ ) 물을 주십시오. 그리고 햇빛이 잘 드는 곳에 두는 것도 중요합니다."]},"qs":[{"n":51,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["흙이 마르면","흙이 젖으면","흙을 사면","흙이 많으면"],"ans":1,"exp":"Không nên tưới quá thường xuyên, nên sờ đất và \"흙이 마르면\" (khi đất khô) thì mới tưới. Đáp án là ①.","vocab":[{"k":"흙","v":"đất"},{"k":"마르다","v":"khô"},{"k":"젖다","v":"ướt"}]},{"n":52,"stem":"무엇에 대한 이야기인지 맞는 것을 고르십시오.","choices":["식물을 사는 곳","식물의 이름","방을 청소하는 방법","식물을 잘 키우는 방법"],"ans":4,"exp":"Bài viết giải thích \"식물을 잘 키우려면\" (để trồng cây tốt) cần tưới nước đúng cách và để nơi có nắng. Đáp án là ④.","vocab":[{"k":"공기","v":"không khí"},{"k":"햇빛","v":"ánh nắng"}]}]},{"sec":"R","nums":[53,54],"passage":{"kind":"text","body":["저는 주말에 서점에 자주 갑니다. 서점에는 새 책이 많아서 구경하는 것이 즐겁습니다. 지난주에는 서점에서 한국 요리책을 한 권 ( ㉠ ). 그 책을 보고 처음으로 불고기를 만들어 봤습니다. 맛이 좋아서 가족들이 아주 좋아했습니다."]},"qs":[{"n":53,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["살 겁니다","사고 싶습니다","샀습니다","사려고 합니다"],"ans":3,"exp":"\"지난주에는\" (tuần trước) là quá khứ, và sau đó đã xem sách để nấu, nên dùng thì quá khứ \"샀습니다\" (đã mua). Đáp án là ③.","vocab":[{"k":"지난주","v":"tuần trước"},{"k":"권","v":"cuốn (đơn vị sách)"}]},{"n":54,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 서점에 가끔 갑니다.","저는 요리책을 보고 불고기를 만들었습니다.","가족들은 불고기를 좋아하지 않았습니다.","서점에는 새 책이 별로 없습니다."],"ans":2,"exp":"\"그 책을 보고 처음으로 불고기를 만들어 봤습니다\" (Xem cuốn sách đó, lần đầu tôi thử làm bulgogi). Đáp án là ②.","vocab":[{"k":"구경하다","v":"ngắm, xem"},{"k":"처음으로","v":"lần đầu tiên"}]}]},{"sec":"R","nums":[55,56],"passage":{"kind":"text","body":["한강 공원은 서울에 있는 큰 공원입니다. 공원에서 자전거를 빌려서 탈 수 있고 운동도 할 수 있습니다. 여름 저녁에는 시원한 바람이 불어서 사람이 아주 많습니다. ( ㉠ ) 가족이나 친구와 함께 음식을 먹으면서 이야기하는 사람들도 많습니다. 밤에는 다리에 불이 켜져서 아주 아름답습니다."]},"qs":[{"n":55,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["그리고","그러면","그런데","하지만"],"ans":1,"exp":"Câu sau bổ sung thêm thông tin cùng chiều (cũng có nhiều người vừa ăn vừa trò chuyện), nên dùng \"그리고\" (và, ngoài ra). Đáp án là ①.","vocab":[{"k":"그리고","v":"và, ngoài ra"},{"k":"-(으)면서","v":"vừa... vừa..."}]},{"n":56,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["한강 공원에서는 자전거를 탈 수 없습니다.","여름 저녁에는 한강 공원에 사람이 적습니다.","한강 공원에서 자전거를 빌릴 수 있습니다.","밤에는 한강 공원이 어둡습니다."],"ans":3,"exp":"\"공원에서 자전거를 빌려서 탈 수 있고\" (Có thể thuê xe đạp để đi trong công viên). Đáp án là ③.","vocab":[{"k":"빌리다","v":"thuê, mượn"},{"k":"다리","v":"cây cầu"},{"k":"불이 켜지다","v":"đèn được bật sáng"}]}]},{"sec":"R","nums":[57],"passage":{"kind":"text","body":["(가) 그래서 오늘은 따뜻한 커피를 주문했습니다.","(나) 저는 커피숍에서 보통 아이스 커피를 마십니다.","(다) 따뜻한 커피를 마시니까 몸이 따뜻해졌습니다.","(라) 그런데 오늘은 날씨가 아주 추웠습니다."]},"qs":[{"n":57,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(나)-(가)-(라)-(다)","(나)-(라)-(가)-(다)","(라)-(나)-(다)-(가)","(라)-(가)-(나)-(다)"],"ans":2,"exp":"(나) thói quen uống cà phê đá → (라) \"그런데\" hôm nay trời lạnh → (가) \"그래서\" gọi cà phê nóng → (다) uống xong thấy ấm người. Đáp án là ②.","vocab":[{"k":"보통","v":"thường thường"},{"k":"그런데","v":"nhưng mà"}]}]},{"sec":"R","nums":[58],"passage":{"kind":"text","body":["(가) 저는 다음 달에 회사 근처로 이사를 합니다.","(나) 이사하는 날에는 친구가 청소를 도와주기로 했습니다.","(다) 그런데 짐이 많아서 혼자 옮길 수 없습니다.","(라) 그래서 이삿짐 센터에 전화해서 날짜를 예약했습니다."]},"qs":[{"n":58,"stem":"다음을 순서대로 맞게 배열한 것을 고르십시오.","choices":["(가)-(나)-(다)-(라)","(다)-(가)-(라)-(나)","(다)-(라)-(가)-(나)","(가)-(다)-(라)-(나)"],"ans":4,"exp":"(가) tháng sau chuyển nhà → (다) \"그런데\" đồ nhiều không tự chuyển được → (라) \"그래서\" gọi công ty chuyển nhà → (나) ngày chuyển nhà bạn sẽ giúp dọn dẹp. Đáp án là ④.","vocab":[{"k":"근처","v":"gần, lân cận"},{"k":"-기로 하다","v":"quyết định (làm gì)"}]}]},{"sec":"R","nums":[59,60],"passage":{"kind":"text","body":["저는 어릴 때부터 축구를 좋아했습니다. ( ㉠ ) 그래서 대학교에 들어와서 축구 동아리에 가입했습니다. ( ㉡ ) 우리 동아리는 매주 토요일 아침에 운동장에서 연습을 합니다. ( ㉢ ) 그래서 요즘은 연습을 더 열심히 하고 있습니다. 다음 경기에서는 꼭 이기고 싶습니다. ( ㉣ )"]},"qs":[{"n":59,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.","box":"지난달에는 처음으로 다른 학교와 경기를 했는데 우리가 졌습니다.","choices":["㉠","㉡","㉢","㉣"],"ans":3,"exp":"Câu cần chèn nói \"우리가 졌습니다\" (chúng tôi đã thua). Vì thua nên \"그래서 요즘은 연습을 더 열심히 하고 있습니다\" (vì vậy dạo này luyện tập chăm hơn). Vị trí ㉢ là hợp lý, đáp án là ③.","vocab":[{"k":"동아리","v":"câu lạc bộ"},{"k":"가입하다","v":"gia nhập"},{"k":"지다","v":"thua"}]},{"n":60,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 대학교에서 축구 동아리에 들어갔습니다.","우리 동아리는 일요일마다 연습을 합니다.","우리 동아리는 지난달 경기에서 이겼습니다.","저는 대학교에 와서 축구를 처음 배웠습니다."],"ans":1,"exp":"\"대학교에 들어와서 축구 동아리에 가입했습니다\" (Vào đại học tôi đã gia nhập CLB bóng đá). CLB tập vào thứ Bảy, và tôi thích bóng đá từ nhỏ. Đáp án là ①.","vocab":[{"k":"어릴 때","v":"lúc nhỏ"},{"k":"연습","v":"luyện tập"}]}]},{"sec":"R","nums":[61,62],"passage":{"kind":"text","body":["저는 무역 회사에서 일합니다. 다음 주 월요일에 베트남 하노이로 출장을 갑니다. 하노이에서 베트남 회사 사람들과 회의를 할 겁니다. 그런데 저는 베트남어를 할 수 없어서 걱정이 됩니다. 다행히 베트남에서 온 회사 동료가 같이 가서 ( ㉠ ). 이번 출장이 끝나면 저도 베트남어를 배워 보려고 합니다."]},"qs":[{"n":61,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["베트남어를 배우기로 했습니다","통역을 해 주기로 했습니다","회의에 가지 않기로 했습니다","출장을 취소하기로 했습니다"],"ans":2,"exp":"Người viết lo vì không biết tiếng Việt, \"다행히\" (may mắn là) đồng nghiệp người Việt đi cùng và \"통역을 해 주기로 했습니다\" (sẽ phiên dịch giúp). Đáp án là ②.","vocab":[{"k":"다행히","v":"may mắn thay"},{"k":"통역","v":"phiên dịch"},{"k":"동료","v":"đồng nghiệp"}]},{"n":62,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["저는 베트남어를 잘합니다.","저는 지난주에 하노이에 갔습니다.","동료는 이번 출장에 같이 가지 않습니다.","저는 하노이에서 회의를 할 겁니다."],"ans":4,"exp":"\"하노이에서 베트남 회사 사람들과 회의를 할 겁니다\" (Tôi sẽ họp với người của công ty Việt Nam ở Hà Nội). Đáp án là ④.","vocab":[{"k":"무역 회사","v":"công ty thương mại"},{"k":"걱정이 되다","v":"lo lắng"}]}]},{"sec":"R","nums":[63,64],"passage":{"kind":"email","title":"미술관 견학 장소가 바뀌었습니다","body":["받는 사람: 한국어반 학생들","보내는 사람: 김수진 선생님","여러분, 안녕하세요.","이번 주 금요일에 같이 가기로 한 국립 미술관이 공사 때문에 문을 닫게 되었습니다.","그래서 금요일에는 시립 미술관에 가려고 합니다. 시립 미술관은 학교 앞에서 버스를 타면 20분쯤 걸립니다.","만나는 시간은 오전 10시로 똑같고, 만나는 장소는 학교 정문입니다.","입장료는 학교에서 냅니다. 점심은 각자 준비해 오십시오."]},"qs":[{"n":63,"stem":"왜 윗글을 썼는지 맞는 것을 고르십시오.","choices":["견학 장소가 바뀐 것을 알려 주려고","견학 날짜를 물어보려고","미술관 공사를 소개하려고","점심 메뉴를 정하려고"],"ans":1,"exp":"Tiêu đề \"미술관 견학 장소가 바뀌었습니다\" (Địa điểm tham quan bảo tàng đã thay đổi). Cô giáo viết để thông báo địa điểm mới. Đáp án là ①.","vocab":[{"k":"견학","v":"tham quan học tập"},{"k":"바뀌다","v":"bị thay đổi"}]},{"n":64,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["학생들은 국립 미술관에 갑니다.","만나는 시간이 오전 11시로 바뀌었습니다.","학생들은 입장료를 내지 않아도 됩니다.","학교에서 점심을 준비합니다."],"ans":3,"exp":"\"입장료는 학교에서 냅니다\" (Nhà trường trả phí vào cửa), nên học sinh không phải trả. Giờ hẹn vẫn là 10 giờ, học sinh tự chuẩn bị cơm trưa. Đáp án là ③.","vocab":[{"k":"공사","v":"thi công, sửa chữa"},{"k":"정문","v":"cổng chính"},{"k":"각자","v":"mỗi người, tự"}]}]},{"sec":"R","nums":[65,66],"passage":{"kind":"text","body":["된장찌개는 한국 사람들이 자주 먹는 음식입니다. 된장은 콩으로 만드는데 몸에 좋아서 많은 사람들이 좋아합니다. 된장찌개에는 두부나 호박, 감자 등을 넣습니다. 된장찌개는 만드는 방법이 어렵지 않아서 ( ㉠ ). 그래서 요리를 처음 배우는 외국인들도 많이 만들어 봅니다. 된장찌개는 보통 밥과 함께 먹습니다."]},"qs":[{"n":65,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["식당에서만 먹을 수 있습니다","시간이 오래 걸립니다","만들기가 힘듭니다","집에서도 쉽게 만들 수 있습니다"],"ans":4,"exp":"\"만드는 방법이 어렵지 않아서\" (vì cách làm không khó) nên \"집에서도 쉽게 만들 수 있습니다\" (ở nhà cũng làm dễ dàng). Đáp án là ④.","vocab":[{"k":"콩","v":"đậu nành"},{"k":"쉽게","v":"một cách dễ dàng"}]},{"n":66,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["된장은 쌀로 만듭니다.","된장찌개는 보통 밥과 같이 먹습니다.","된장찌개에는 고기만 넣습니다.","외국인들은 된장찌개를 만들지 않습니다."],"ans":2,"exp":"\"된장찌개는 보통 밥과 함께 먹습니다\" (Canh tương thường ăn cùng cơm). Tương làm từ đậu nành, không phải gạo. Đáp án là ②.","vocab":[{"k":"두부","v":"đậu phụ"},{"k":"호박","v":"bí"},{"k":"함께","v":"cùng nhau"}]}]},{"sec":"R","nums":[67,68],"passage":{"kind":"text","body":["요즘 동네에 작은 서점이 많이 생기고 있습니다. 이런 서점은 큰 서점보다 책이 적습니다. 하지만 주인이 직접 고른 좋은 책을 손님에게 소개해 줍니다. 그리고 책을 읽는 모임이나 작가를 만나는 행사도 자주 엽니다. 그래서 사람들은 작은 서점에서 책을 사는 것뿐만 아니라 ( ㉠ ). 작은 서점은 동네 사람들이 모이는 장소가 되고 있습니다."]},"qs":[{"n":67,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["다른 사람들과 책 이야기를 나눌 수도 있습니다","책을 더 싸게 살 수도 있습니다","책을 많이 고를 수도 있습니다","책을 빌릴 수는 없습니다"],"ans":1,"exp":"Hiệu sách nhỏ tổ chức \"책을 읽는 모임\" (buổi gặp đọc sách) và sự kiện gặp tác giả, nên người ta còn có thể trò chuyện về sách với người khác. Đáp án là ①.","vocab":[{"k":"모임","v":"buổi gặp mặt, nhóm"},{"k":"행사","v":"sự kiện"},{"k":"-뿐만 아니라","v":"không chỉ... mà còn"}]},{"n":68,"stem":"이 글의 내용과 같은 것을 고르십시오.","choices":["작은 서점은 큰 서점보다 책이 많습니다.","작은 서점은 행사를 하지 않습니다.","작은 서점의 주인은 직접 책을 골라서 소개합니다.","요즘 작은 서점이 줄어들고 있습니다."],"ans":3,"exp":"\"주인이 직접 고른 좋은 책을 손님에게 소개해 줍니다\" (Chủ tiệm giới thiệu cho khách những cuốn sách hay do chính mình chọn). Đáp án là ③.","vocab":[{"k":"동네","v":"khu phố"},{"k":"주인","v":"chủ"},{"k":"고르다","v":"chọn"}]}]},{"sec":"R","nums":[69,70],"passage":{"kind":"text","body":["저는 원래 그림에 관심이 없었습니다. 그런데 작년에 친구를 따라 미술관에 갔다가 한 그림 앞에서 오랫동안 서 있었습니다. 바다를 그린 그림이었는데 제 고향 바다와 아주 비슷했습니다. 그 그림을 보면서 고향에 계신 부모님 생각이 많이 났습니다. 그날 이후로 저는 한 달에 한 번씩 미술관에 ( ㉠ ). 그림을 볼 때마다 마음이 편해지고 기분이 좋아집니다. 이제는 저도 그림을 한번 배워 보고 싶습니다."]},"qs":[{"n":69,"stem":"㉠에 들어갈 알맞은 것을 고르십시오.","choices":["가 본 적이 없습니다","가게 되었습니다","가지 않기로 했습니다","갈 수 없었습니다"],"ans":2,"exp":"Từ ngày đó, người viết thích tranh và \"그림을 볼 때마다\" (mỗi lần xem tranh) thấy dễ chịu, nên dùng \"가게 되었습니다\" (đã trở nên thường đi) mỗi tháng một lần. Đáp án là ②.","vocab":[{"k":"-게 되다","v":"trở nên, được (thay đổi tình huống)"},{"k":"이후로","v":"từ sau đó"}]},{"n":70,"stem":"이 글의 내용으로 알 수 있는 것을 고르십시오.","choices":["저는 어릴 때부터 그림을 좋아했습니다.","저는 처음에 혼자 미술관에 갔습니다.","저는 지금 그림을 배우고 있습니다.","그 그림은 제 고향 바다와 비슷했습니다."],"ans":4,"exp":"\"제 고향 바다와 아주 비슷했습니다\" (rất giống biển quê tôi). Người viết vốn không quan tâm tranh, đi cùng bạn, và mới chỉ muốn học vẽ. Đáp án là ④.","vocab":[{"k":"관심","v":"sự quan tâm"},{"k":"고향","v":"quê hương"},{"k":"따라","v":"đi theo"}]}]}]},{"test":9,"groups":[{"sec":"L","nums":[1],"audio":[{"s":"W","t":"안경이에요?"}],"qs":[{"n":1,"stem":null,"choices":["네, 안경이 없어요.","네, 안경이에요.","아니요, 안경이 커요.","아니요, 안경을 써요."],"ans":2,"exp":"Câu hỏi \"안경이에요?\" (Là kính phải không?). Trả lời khẳng định đúng là \"네, 안경이에요\" (Vâng, là kính), nên đáp án là ②.","vocab":[{"k":"안경","v":"kính mắt"}]}]},{"sec":"L","nums":[2],"audio":[{"s":"M","t":"동생이 있어요?"}],"qs":[{"n":2,"stem":null,"choices":["네, 동생이에요.","네, 동생이 아니에요.","아니요, 동생이 없어요.","아니요, 동생이 많아요."],"ans":3,"exp":"Câu hỏi \"동생이 있어요?\" (Bạn có em không?). Câu trả lời phù hợp là \"아니요, 동생이 없어요\" (Không, tôi không có em), nên đáp án là ③.","vocab":[{"k":"동생","v":"em"},{"k":"있다/없다","v":"có/không có"}]}]},{"sec":"L","nums":[3],"audio":[{"s":"W","t":"피아노 학원에 언제 가요?"}],"qs":[{"n":3,"stem":null,"choices":["화요일에 가요.","친구하고 가요.","학원이 가까워요.","버스로 가요."],"ans":1,"exp":"Câu hỏi dùng \"언제\" (khi nào) nên phải trả lời về thời gian: \"화요일에 가요\" (Tôi đi vào thứ Ba). Đáp án là ①.","vocab":[{"k":"학원","v":"trung tâm, lớp học thêm"},{"k":"언제","v":"khi nào"}]}]},{"sec":"L","nums":[4],"audio":[{"s":"M","t":"치과에 누구하고 갔어요?"}],"qs":[{"n":4,"stem":null,"choices":["어제 갔어요.","병원에 갔어요.","이가 아팠어요.","어머니하고 갔어요."],"ans":4,"exp":"Câu hỏi \"누구하고\" (đi với ai) nên câu trả lời phải là người: \"어머니하고 갔어요\" (Tôi đi với mẹ). Đáp án là ④.","vocab":[{"k":"치과","v":"nha khoa"},{"k":"누구하고","v":"với ai"}]}]},{"sec":"L","nums":[5],"audio":[{"s":"W","t":"즐거운 크리스마스 보내세요."}],"qs":[{"n":5,"stem":null,"choices":["아니에요, 괜찮아요.","네, 즐거운 크리스마스 보내세요.","네, 여기 있습니다.","잘 먹겠습니
